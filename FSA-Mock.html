stry with new companies and three years of data","body":"<p>Companies in the Solar Technology & Project Developers industry manufacture solar energy equipment. Manufacturing uses hazardous substances, which are costly to handle and dispose of, alongside reusable materials with high economic value. Handling and disposal of hazardous waste increases operating costs, and spills create cleanup costs. Product take-back and recycling require upfront investment but can increase revenues and lower long-term costs by reusing recovered materials.</p>\n<p>Company J and Company K manufacture solar equipment only; neither develops projects. Both operate where hazardous waste disposal is highly regulated. Company K operates in a region that requires manufacturers to take back and recycle end-of-life panels. Company J's region has no such requirement.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company J</th><th colspan=\"3\">Company K</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Total weight of products sold (metric tons)</td><td>20,000</td><td>22,000</td><td>24,000</td><td>15,000</td><td>15,500</td><td>16,000</td></tr>\n<tr><td>Weight of end-of-life material recovered (metric tons)</td><td>800</td><td>1,300</td><td>2,000</td><td>1,500</td><td>1,500</td><td>1,550</td></tr>\n<tr><td>Percentage of recovered material recycled</td><td>30%</td><td>55%</td><td>70%</td><td>80%</td><td>80%</td><td>82%</td></tr>\n<tr><td>Hazardous waste generated (metric tons)</td><td>900</td><td>950</td><td>1,000</td><td>500</td><td>520</td><td>540</td></tr>\n<tr><td>Revenue ($ millions)</td><td>800</td><td>880</td><td>950</td><td>700</td><td>720</td><td>750</td></tr>\n</tbody></table>","questions":[{"id":"T5E1","lo":5,"type":"single","text":"Normalized by total weight of products sold, which statement about end-of-life material recovered is accurate?","options":{"a":"K's recovery share fell in each year while J's recovery share rose in each year across the three-year period","b":"J's recovery share overtook K's in Year 3, so J is now the higher of the two companies","c":"K recovers a higher share in every year, though J's share more than doubled over the three years","d":"J's recovery share rose each year but remained below 5 percent of products sold in Year 3"},"answer":["c"],"expl":{"a":"Incorrect. K's share fell from 10.0 to 9.7 percent in Year 2 and was flat in Year 3, not down each year.","b":"Incorrect. J's 8.3 percent in Year 3 is still below K's 9.7 percent.","c":"CORRECT. J: 800 ÷ 20,000 = 4.0 percent, 5.9 percent, then 2,000 ÷ 24,000 = 8.3 percent. K: 10.0 percent, 9.7 percent, 9.7 percent. K stays ahead, and J's share more than doubled (Sections 4.2 and 4.3.1).","d":"Incorrect. J's Year 3 share is 8.3 percent."},"trap":{"a":"Flat year read as a decline","b":"Narrowed gap read as overtaking","c":"","d":"Used Year 1 level"}},{"id":"T5E2","lo":2,"type":"single","text":"Which component of external operating context best explains why K's recovery share is higher and flatter than J's?","options":{"a":"Business climate: K competes with manufacturers that recover and recycle far more material than J","b":"Regulatory climate: K's region requires manufacturers to take back and recycle end-of-life panels","c":"Operating location: K's plants sit closer to recycling facilities than J's plants do","d":"Economic climate: recycled solar materials sell for higher prices in the markets where K operates"},"answer":["b"],"expl":{"a":"Incorrect. The case describes no competitive pressure to recover material (Section 1.2.2.1).","b":"CORRECT. The presence of a take-back and recycling requirement defines the regulatory climate (Section 1.2.2.3), and the case states that K's region has one and J's does not.","c":"Incorrect. The case does not describe the location of recycling facilities.","d":"Incorrect. The case gives no information about the pricing of recycled materials (Section 1.2.2.2)."},"trap":{"a":"Not supported by the case","b":"","c":"Not supported by the case","d":"Not supported by the case"}},{"id":"T5E3","lo":9,"type":"multi","text":"Over the long term, which two channels of financial impact does J's expansion of take-back and recycling most directly benefit? (Choose two.)","options":{"a":"Tangible assets","b":"Cost of capital","c":"Revenues","d":"Liabilities","e":"Expenses"},"answer":["c","e"],"expl":{"a":"Incorrect. The upfront investment is a near-term outflow; the stem asks about long-term benefits.","b":"Incorrect. No change in perceived risk is described.","c":"CORRECT. The case says take-back and recycling can increase revenues (Section 8.2.1.1).","d":"Incorrect. No obligation is described that take-back would reduce.","e":"CORRECT. The case says recovered materials can be reused, lowering long-term costs (Section 8.2.1.2)."},"trap":{"a":"Upfront investment mistaken for long-term benefit","b":"Not evidenced","c":"","d":"No obligation described","e":""}},{"id":"T5E4","lo":10,"type":"single","text":"Which DCF adjustment is best supported for J if its Year 3 recovery and recycling rates continue to improve?","options":{"a":"Lower revenue projections in later years because recycled material displaces new panel sales","b":"No adjustment to cash flows, because recycling affects only the hazardous waste metric","c":"Near-term cash outflows for investment, then higher revenue and lower expense projections later","d":"Higher near-term cash flows from recovered material, with a higher discount rate in later years as risk grows"},"answer":["c"],"expl":{"a":"Incorrect. The case describes recycling as raising revenues, not displacing sales.","b":"Incorrect. Recovery and recycling are tied to revenues and costs, not only to the hazardous waste metric.","c":"CORRECT. The case says take-back needs upfront investment but can increase revenues and lower long-term costs (Sections 8.2.1.1 to 8.2.1.3).","d":"Incorrect. The investment comes first, so near-term cash flows are not higher, and nothing in the case raises perceived risk."},"trap":{"a":"Opposite revenue effect","b":"Metric scope misread","c":"","d":"Timing reversed and risk direction wrong"}}]},{"id":"T5F","title":"Case 6: Household & Personal Products Industry","built":"Revisits Practice Cases 6's industry with a new data set and a ROIC focus","body":"<p>The Household & Personal Products industry manufactures cosmetics, cleaning supplies, sanitary paper products, batteries, and similar goods, sold globally through mass merchants, grocery and drug stores, distributors, and e-commerce. Water is a vital input, both as a coolant and as a main product ingredient (shampoo is generally 70 to 80 percent water), so water expenses are a significant part of the cost structure. Water supplies are threatened in some regions by more frequent droughts; without careful planning companies can face increased costs or lose access to water. Companies that anticipate the changing regulatory landscape and adopt green chemistry may improve profitability by capturing changing demand.</p>\n<p>Companies W, X, Y, and Z are competitors. Assume each pays the same average price per cubic meter of water. The table shows Year 2 data.</p>\n<table><thead><tr><th></th><th>Company W</th><th>Company X</th><th>Company Y</th><th>Company Z</th></tr></thead><tbody>\n<tr><td>Total weight of products sold (metric tons)</td><td>12,000,000</td><td>6,000,000</td><td>20,000,000</td><td>4,500,000</td></tr>\n<tr><td>Total water consumed (cubic meters)</td><td>30,000,000</td><td>12,600,000</td><td>56,000,000</td><td>9,900,000</td></tr>\n<tr><td>Percent of water consumed in regions with High or Extremely High Baseline Water Stress</td><td>62%</td><td>28%</td><td>55%</td><td>41%</td></tr>\n<tr><td>Operating margin (NOPAT ÷ sales)</td><td>14%</td><td>11%</td><td>19%</td><td>9%</td></tr>\n<tr><td>Percent of revenue from products designed with green chemistry principles</td><td>12%</td><td>31%</td><td>18%</td><td>8%</td></tr>\n</tbody></table>","questions":[{"id":"T5F1","lo":10,"type":"multi","text":"A user concludes that Company X has a production advantage. What two pieces of evidence support this conclusion? (Choose two.)","options":{"a":"Company X consumes less total water than both Company W and Company Y in the same year","b":"Company X consumes the least water per metric ton of product sold among the four companies","c":"Company X reports the highest operating margin of the four companies in the table for the year","d":"Company X takes the lowest percent of its water from regions with high or extremely high baseline water stress","e":"Company X earns the highest percent of its revenue from products designed with green chemistry principles"},"answer":["b","d"],"expl":{"a":"Incorrect. This is true, but total consumption reflects scale; Z consumes less in total, and X's smaller size does not show lower cost per ton.","b":"CORRECT. At 12,600,000 ÷ 6,000,000 = 2.10 cubic meters per ton, X is lowest (W 2.50, Y 2.80, Z 2.20). A production advantage exists where a company spends less to deliver its goods, and equal water prices make volume per ton a proxy for cost (Section 9.1.1).","c":"Incorrect. Y has the highest operating margin (19 percent); X's is 11 percent, and margin would point to a consumer advantage in any case.","d":"CORRECT. At 28 percent, X has the lowest stressed-region share, which the guide's key treats as advantageous access to inputs, since water stress is associated with higher costs (Section 9.1.1).","e":"Incorrect. This is true (31 percent), but it relates to product demand, not to the cost of delivering goods or access to inputs."},"trap":{"a":"True but reflects scale","b":"","c":"False; and margin signals the other advantage","d":"","e":"True but demand-side, not production-side"}},{"id":"T5F2","lo":10,"type":"single","text":"Company Y's sales of green-chemistry products raise its ROIC through a higher operating margin (NOPAT ÷ sales). What should a user consider?","options":{"a":"A signal of a production advantage, because ROIC improves through the turnover ratio","b":"A signal of a consumer advantage, because ROIC improves through its operating margin","c":"A signal of a production advantage, because ROIC improves through operating margin","d":"A signal of a consumer advantage, because ROIC improves through the turnover ratio"},"answer":["b"],"expl":{"a":"Incorrect. Production advantage is signaled through turnover (sales ÷ invested capital), but Y's improvement is through margin.","b":"CORRECT. The guide states that where sustainability information improves ROIC through operating margin, a user may consider it a signal that the company is managing performance to gain a consumer advantage (Section 9.1.1).","c":"Incorrect. Production advantage is signaled through the turnover ratio, not operating margin.","d":"Incorrect. The advantage type is right, but the mechanism is margin, not turnover."},"trap":{"a":"Right ROIC term for the other advantage","b":"","c":"Advantage types swapped","d":"Right advantage, wrong ROIC term"}},{"id":"T5F3","lo":5,"type":"single","text":"Assuming each company pays the same average price per cubic meter, which company spends the least on water per metric ton of product sold?","options":{"a":"Company X","b":"Company W","c":"Company Y","d":"Company Z"},"answer":["a"],"expl":{"a":"CORRECT. At 2.10 cubic meters per ton, X is the lowest, so its water cost per ton is lowest (Section 4.2).","b":"Incorrect. W uses 2.50 cubic meters per ton and has the highest stressed-region share; it is not the lowest.","c":"Incorrect. Y has the highest operating margin but uses 2.80 cubic meters per ton, the most of the four.","d":"Incorrect. Z consumes the least water in total, but at 2.20 per ton its intensity is above X's; total volume reflects scale (Section 4.1)."},"trap":{"a":"","b":"Highest stressed-region share is not lowest cost","c":"Margin confused with water cost","d":"Lowest total confused with lowest per ton"}},{"id":"T5F4","lo":7,"type":"single","text":"Which conclusion about water-related risk is best supported by the table?","options":{"a":"W and Y face equal exposure to water scarcity, since both draw more than half of their water from stressed regions","b":"X is more exposed to water scarcity than Z, since X consumes more total water than Z does in the year","c":"Y faces the lowest exposure to water scarcity of the four companies, since it reports the highest operating margin","d":"W is more exposed to water scarcity than X, since it uses more water per ton and takes more from stressed regions"},"answer":["d"],"expl":{"a":"Incorrect. Both exceed 50 percent, but W's intensity and stressed share are both higher, so the exposure is not equal.","b":"Incorrect. X's higher total reflects larger scale; per ton X is more efficient than Z and has a lower stressed share.","c":"Incorrect. Operating margin measures profitability, not water exposure; Y draws 55 percent of its water from stressed regions and has the highest intensity.","d":"CORRECT. W uses 2.50 versus 2.10 cubic meters per ton and takes 62 versus 28 percent of its water from stressed regions, so both volume and location point to higher exposure (Sections 6.1.4 and 4.2)."},"trap":{"a":"Threshold reading ignores intensity","b":"Total volume used instead of normalized data","c":"Profitability read as exposure","d":""}}]},{"id":"T5G","title":"Case 7: Real Estate Industry","built":"New case built on the guide's property-portfolio and flood-zone passages (Sections 2.1.4 and 8.2.1)","body":"<p>Companies in the Real Estate industry own, lease, and operate property portfolios. As in other industries that derive value from building stock, the extent to which properties are exposed to climate-related risks such as flooding and fires, which affect property value, building integrity, or livability, directly shapes future value. Properties in 100-year flood zones are exposed to higher insurance premiums and lower revenue.</p>\n<p>Company R's properties are concentrated in two coastal cities. Company S's properties are spread across six inland cities.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company R</th><th colspan=\"2\">Company S</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Number of properties</td><td>120</td><td>125</td><td>90</td><td>95</td></tr>\n<tr><td>Percentage of portfolio value in 100-year flood zones</td><td>26%</td><td>28%</td><td>7%</td><td>6%</td></tr>\n<tr><td>Insurance premiums ($ millions)</td><td>38</td><td>52</td><td>20</td><td>21</td></tr>\n<tr><td>Revenue ($ millions)</td><td>900</td><td>920</td><td>700</td><td>760</td></tr>\n<tr><td>Percentage of properties with flood-resilience retrofits</td><td>5%</td><td>6%</td><td>45%</td><td>60%</td></tr>\n</tbody></table>\n<p>Ten peers report Year 2 percentage of portfolio value in 100-year flood zones: mean 14%, median 11%, standard deviation 7.</p>","questions":[{"id":"T5G1","lo":6,"type":"single","text":"Assuming normal distribution, Company R's Year 2 share of portfolio value in flood zones is higher than approximately what percentage of the ten peers?","options":{"a":"95%","b":"84%","c":"97.5%","d":"99.85%"},"answer":["c"],"expl":{"a":"Incorrect. 95 percent is the share within two standard deviations on both sides of the mean, not the share below a single point.","b":"Incorrect. 84 percent applies at one standard deviation above the mean (21 percent).","c":"CORRECT. (28 − 14) ÷ 7 = 2.0 standard deviations above the mean; 2.1 + 13.6 + 34.1 + 34.1 + 13.6 = 97.5 percent of values lie below that point (Section 5.2).","d":"Incorrect. 99.85 percent applies at three standard deviations above the mean (35 percent)."},"trap":{"a":"Two-sided 95 percent rule misapplied","b":"One standard deviation, not two","c":"","d":"Three standard deviations, not two"}},{"id":"T5G2","lo":8,"type":"single","text":"How should the financial impact associated with Company R's flood-zone exposure be characterized?","options":{"a":"Potential, acute, and high magnitude if a flood damages a large share of the portfolio value","b":"Actual, progressive, and low magnitude, because higher premiums have already been incurred","c":"Potential, progressive, and low magnitude, because insurance premiums rise gradually each year","d":"Actual, acute, and high magnitude, because flood losses have already been incurred in Year 2"},"answer":["a"],"expl":{"a":"CORRECT. The metric measures exposure, so its impact is potential; a flood event would be a discrete, high-magnitude loss to property value (Sections 7.2.1.1, 7.2.1.3, and 7.2.2).","b":"Incorrect. This describes premiums already incurred, which are real but are not what the exposure metric measures.","c":"Incorrect. This describes the premium effect, not the exposure metric; premiums are a separate, already-incurred cost.","d":"Incorrect. The case reports no flood loss; exposure is not a realized loss."},"trap":{"a":"","b":"Premium effect mistaken for the exposure impact","c":"Premium effect mistaken for the exposure impact","d":"Exposure mistaken for realized loss"}},{"id":"T5G3","lo":9,"type":"multi","text":"Based on the guide's treatment of flood exposure, through which three channels does R's exposure most directly affect its financial performance? (Choose three.)","options":{"a":"Cost of capital","b":"Revenues","c":"Liabilities","d":"Tangible assets","e":"Expenses"},"answer":["b","d","e"],"expl":{"a":"Incorrect. No change in investors' perception of R's risk is described.","b":"CORRECT. The guide notes that flood-zone properties face lower revenue (Section 8.2.1.1).","c":"Incorrect. No litigation or future obligation is described.","d":"CORRECT. Exposure to flooding affects property value and building integrity, which are asset values (Section 8.2.1.3).","e":"CORRECT. R's premiums rose from $38 million to $52 million, a direct operating cost (Section 8.2.1.2)."},"trap":{"a":"Not evidenced","b":"","c":"No obligation described","d":"","e":""}},{"id":"T5G4","lo":2,"type":"single","text":"Which statement about the external operating context best explains the difference in the two companies' exposure?","options":{"a":"Business climate: R competes for coastal tenants with higher-priced rivals, raising its exposure to losses","b":"Operating location: R's properties are concentrated in coastal cities, where flood losses are more frequent","c":"Regulatory climate: R's jurisdictions require flood-zone construction in coastal cities","d":"Economic climate: coastal property prices are more volatile than inland prices, raising R's exposure"},"answer":["b"],"expl":{"a":"Incorrect. The case describes no competition for tenants.","b":"CORRECT. Operating location captures the physical conditions where a company's operations sit (Sections 1.2.2.4 and 6.1.4), and the case states R's properties are in two coastal cities and S's in six inland cities.","c":"Incorrect. The case describes no flood-zone construction requirement.","d":"Incorrect. The case gives no information about property price volatility."},"trap":{"a":"Not supported by the case","b":"","c":"Not supported by the case","d":"Not supported by the case"}}]},{"id":"T5H","title":"Case 8: Marine Transportation Industry","built":"New case built on the guide's oil spill example for acute events (Section 4.1)","body":"<p>Marine transportation companies move cargo, including oil, by vessel. Oil spills tend to be acute, low-frequency events that are not directly related to everyday operations. Regardless of company size or output, fewer spills indicate better performance, although a user may still choose to normalize the data to better understand financial impacts. Spills create cleanup costs and can lead to fines.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company M</th><th colspan=\"3\">Company N</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Number of voyages</td><td>14,000</td><td>14,500</td><td>15,000</td><td>4,000</td><td>4,200</td><td>4,400</td></tr>\n<tr><td>Number of oil spills</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>\n<tr><td>Aggregate volume spilled (barrels)</td><td>40</td><td>0</td><td>3,800</td><td>0</td><td>10</td><td>12</td></tr>\n<tr><td>Cleanup costs and fines ($ millions)</td><td>0.2</td><td>0</td><td>18</td><td>0</td><td>0.1</td><td>0.1</td></tr>\n<tr><td>Provisions for spill-related litigation ($ millions)</td><td>0</td><td>0</td><td>25</td><td>0</td><td>0</td><td>0</td></tr>\n<tr><td>Revenue ($ millions)</td><td>1,600</td><td>1,650</td><td>1,700</td><td>500</td><td>520</td><td>540</td></tr>\n</tbody></table>","questions":[{"id":"T5H1","lo":5,"type":"single","text":"Which statement about normalizing the spill data is consistent with the guide?","options":{"a":"Spill counts show better performance as they fall regardless of size, though a user may still normalize them","b":"Spill counts are shown as percentages of voyages and are therefore already normalized for size","c":"Spill counts are not suited to normalization, because acute events have no relationship with company activity","d":"Spill counts should be divided by revenue before any comparison between the companies can be made"},"answer":["a"],"expl":{"a":"CORRECT. The guide states that for acute, low-frequency events fewer is better regardless of size or output, and that a user may still normalize to understand financial impact (Section 4.1).","b":"Incorrect. The counts are absolute numbers, not percentages (Section 4.1).","c":"Incorrect. The guide says a user may still normalize; it does not prohibit it.","d":"Incorrect. Normalization is optional for such metrics, and revenue is not required for validity."},"trap":{"a":"","b":"Count mistaken for ratio","c":"Optional step made impossible","d":"Optional step made mandatory"}},{"id":"T5H2","lo":8,"type":"multi","text":"Which two statements accurately characterize the financial impact of Company M's Year 3 spill? (Choose two.)","options":{"a":"It is a high-magnitude impact, since Year 3 costs of $18 million far exceed those of earlier years","b":"It is a low-magnitude impact, since the volume spilled was under 4,000 barrels in total","c":"It is an acute impact with a direct and immediate effect on M's financial statements","d":"It is a high-likelihood impact, since M reported a spill in two of the three years","e":"It is a progressive impact, since cleanup costs are incurred gradually as a cost of operating"},"answer":["a","c"],"expl":{"a":"CORRECT. Costs rose from $0.2 million and zero to $18 million in a single year, high magnitude against M's history (Section 7.2.1.3).","b":"Incorrect. Magnitude is read from the financial consequence, not from the barrel count alone.","c":"CORRECT. A one-time event with direct, immediate effects on the financial statements is acute (Section 7.2.2).","d":"Incorrect. Two spills in three years of 15,000 voyages is a low-frequency pattern, and the guide describes spills as low-frequency events.","e":"Incorrect. Progressive impacts accumulate through everyday operations; a spill is a discrete event not directly related to them."},"trap":{"a":"","b":"Physical volume mistaken for financial magnitude","c":"","d":"Count mistaken for likelihood","e":"Event mistaken for operating cost"}},{"id":"T5H3","lo":9,"type":"multi","text":"Which two channels of financial impact are most directly affected by Company M's Year 3 spill? (Choose two.)","options":{"a":"Tangible assets","b":"Cost of capital","c":"Liabilities","d":"Expenses","e":"Revenues"},"answer":["c","d"],"expl":{"a":"Incorrect. No impairment of M's vessels is described.","b":"Incorrect. Any effect on the cost of capital would be indirect and is not described.","c":"CORRECT. The $25 million provision for spill-related litigation is a future obligation and legal risk; the guide notes spills can lead to sizable litigation liabilities (Sections 8.2.1.4).","d":"CORRECT. Cleanup costs and fines of $18 million are incurred costs (Section 8.2.1.2).","e":"Incorrect. The case reports no lost sales or revenue effect from the spill."},"trap":{"a":"No asset effect described","b":"Indirect effect","c":"","d":"","e":"No revenue effect described"}},{"id":"T5H4","lo":3,"type":"single","text":"The metric \"number of oil spills\" captures performance on which general issue category?","options":{"a":"Waste & Hazardous Materials Management","b":"Critical Incident Risk Management","c":"Water & Wastewater Management","d":"Ecological Impacts"},"answer":["d"],"expl":{"a":"Incorrect. This category addresses waste generated in operations, not releases to the environment from transport.","b":"Incorrect. Critical Incident Risk Management concerns operational safety and workforce risk in dangerous operations (Section 2.1.5); the metric measures environmental release.","c":"Incorrect. Water & Wastewater Management concerns water withdrawal, consumption, and discharge from a company's operations, rather than a spill of a transported product.","d":"CORRECT. Oil released from a vessel is a release into the environment, which the guide treats as an ecological impact (Sections 2.1.1 and 8.2.1.4); the category sits in the Environment dimension."},"trap":{"a":"Adjacent category: waste, not release","b":"Adjacent category: operational safety","c":"Adjacent category: water use and discharge","d":""}}]},{"id":"T5I","title":"Case 9: Insurance Industry","built":"New case built on the guide's probable maximum loss metric (Section 8.2.1)","body":"<p>Insurers underwrite property risks, including losses from weather-related natural catastrophes, and hold equity capital to pay claims; claims paid to policyholders are an insurer's principal operating expense. The probable maximum loss (PML) of insured products from weather-related natural catastrophes captures the forward-looking risk of losses related to the physical impacts of climate change.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Insurer V</th><th colspan=\"2\">Insurer W</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Probable maximum loss from weather-related catastrophes ($ millions)</td><td>900</td><td>1,300</td><td>600</td><td>580</td></tr>\n<tr><td>Total equity capital ($ millions)</td><td>4,000</td><td>4,100</td><td>3,000</td><td>3,100</td></tr>\n<tr><td>Premiums written ($ millions)</td><td>2,500</td><td>2,600</td><td>1,800</td><td>1,850</td></tr>\n<tr><td>Percentage of insured value in coastal regions</td><td>30%</td><td>38%</td><td>12%</td><td>11%</td></tr>\n</tbody></table>","questions":[{"id":"T5I1","lo":5,"type":"single","text":"Normalized by total equity capital, how did each insurer's probable maximum loss change from Year 1 to Year 2?","options":{"a":"V's fell from about 32 to 23 percent of capital, and W's rose from about 19 to 20 percent over the period","b":"V's and W's both fell, because W's absolute loss fell while capital rose for both","c":"V's rose from about 23 to 32 percent of capital, and W's also rose over the same period","d":"V's rose from about 23 to 32 percent of capital, and W's fell from 20 to about 19 percent"},"answer":["d"],"expl":{"a":"Incorrect. This reverses both companies' directions.","b":"Incorrect. V's PML rose by more than 40 percent while its capital rose by less than 3 percent, so its ratio rose.","c":"Incorrect. W's absolute PML fell while its capital rose, so its ratio fell.","d":"CORRECT. V: 900 ÷ 4,000 = 22.5 percent rose to 1,300 ÷ 4,100 = 31.7 percent. W: 600 ÷ 3,000 = 20.0 percent fell to 580 ÷ 3,100 = 18.7 percent (Sections 4.2 and 4.3.1)."},"trap":{"a":"Both directions reversed","b":"Generalized from W to V","c":"W's direction misread","d":""}},{"id":"T5I2","lo":8,"type":"single","text":"What does the PML metric most directly indicate about the financial impacts facing an insurer?","options":{"a":"An opportunity, because a higher PML signals that the insurer has written more premium this year","b":"Progressive impacts, because PML builds gradually as premium income accumulates","c":"Actual impacts, because PML records claims the insurer has already paid in the year","d":"Potential impacts, with their likelihood informed by the exposure the insurer has underwritten"},"answer":["d"],"expl":{"a":"Incorrect. Higher PML threatens performance (Section 7.1); it does not measure an opportunity.","b":"Incorrect. Catastrophe losses are acute events, not gradual accumulations.","c":"Incorrect. PML is a forward-looking estimate, not a record of paid claims.","d":"CORRECT. The guide describes PML as capturing forward-looking risk of losses from physical climate impacts; exposure indicates likelihood of potential impacts (Sections 7.2.1.1 and 8.2.1)."},"trap":{"a":"Risk mistaken for opportunity","b":"Acute events mistaken for progressive","c":"Forward-looking metric mistaken for a record","d":""}},{"id":"T5I3","lo":10,"type":"multi","text":"Which two DCF adjustments are best supported for Insurer V? (Choose two.)","options":{"a":"Lower expense projections because premiums written are rising","b":"A lower discount rate because V's premium income keeps growing","c":"Higher expense projections for expected weather-related claims","d":"A higher discount rate reflecting greater perceived risk","e":"A higher long-term growth rate from expanded coastal premiums"},"answer":["c","d"],"expl":{"a":"Incorrect. Premium growth is revenue; it does not lower expected claims.","b":"Incorrect. Growing premium income does not reduce perceived risk; V's risk indicators worsened.","c":"CORRECT. A rising PML relative to capital implies higher expected claims, an operating expense (Section 8.2.1.2).","d":"CORRECT. Greater exposure raises the risk investors perceive and the return they require (Section 8.2.2).","e":"Incorrect. Growth reflects position in an expanding market; added coastal exposure is a risk, not evidence of a better market position (Section 8.2.3)."},"trap":{"a":"Revenue mistaken for lower costs","b":"Revenue mistaken for lower risk","c":"","d":"","e":"Risk mistaken for growth"}},{"id":"T5I4","lo":10,"type":"single","text":"A regulator requires V to cut its PML to 20 percent of capital by Year 5, and a user models the actions V could take to reach that target. Which type of scenario is this?","options":{"a":"An exploratory scenario, because it assumes a fixed end state","b":"A normative scenario, because it works backward from a defined target","c":"An exploratory scenario, because it tests possible actions under uncertainty","d":"A normative scenario, because it forecasts the most likely future state"},"answer":["b"],"expl":{"a":"Incorrect. Exploratory scenarios do not assume a fixed end state.","b":"CORRECT. Normative scenarios define a desired end state and ask what actions reach it (Section 9.2.2); here the end state is a PML of 20 percent of capital by Year 5.","c":"Incorrect. Exploratory scenarios describe possible futures and test options within them rather than starting from a target.","d":"Incorrect. The type is right, but a normative scenario does not forecast the most likely future; it works toward a target."},"trap":{"a":"Wrong type, wrong definition","b":"","c":"Types swapped","d":"Right type, wrong definition"}}]},{"id":"T5J","title":"Case 10: Advertising & Marketing Industry","built":"New case built on the guide's customer privacy example (Section 2.1.2)","body":"<p>In Advertising & Marketing, customer data such as location, shopping habits, search history, and web content viewed is collected to enable targeted advertising, and mobile devices allow marketers to target ads by location and time. Users can evaluate companies' policies and practices related to behavioral advertising and customer privacy, the percentage of online advertising impressions targeted to custom audiences, and any related monetary losses from legal proceedings. Companies in the industry may be exposed to risks related to evolving regulation of the issue and to customer backlash from unsatisfactory practices.</p>\n<p>Agency A's main market enacted a privacy law that restricts behavioral targeting without user opt-in, effective Year 4. Agency B operates in markets with no such law.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Agency A</th><th colspan=\"2\">Agency B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Impressions delivered (billions)</td><td>400</td><td>450</td><td>120</td><td>125</td></tr>\n<tr><td>Percentage of impressions targeted to custom audiences</td><td>60%</td><td>72%</td><td>25%</td><td>27%</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with customer privacy ($ millions)</td><td>1</td><td>14</td><td>0</td><td>0</td></tr>\n<tr><td>Revenue ($ millions)</td><td>8,500</td><td>9,200</td><td>2,100</td><td>2,150</td></tr>\n<tr><td>Behavioral advertising policy</td><td colspan=\"2\">Opt-out available; no limits on sensitive categories</td><td colspan=\"2\">Opt-in required; sensitive categories excluded</td></tr>\n</tbody></table>","questions":[{"id":"T5J1","lo":3,"type":"single","text":"The percentage of impressions targeted to custom audiences and the related legal losses capture performance on which general issue category?","options":{"a":"Data Security","b":"Business Ethics","c":"Customer Privacy","d":"Selling Practices & Product Labeling"},"answer":["c"],"expl":{"a":"Incorrect. Data Security concerns protecting data from breach, unlike customer privacy, which concerns how data is collected, shared, and used.","b":"Incorrect. Business Ethics concerns bribery, corruption, and fraud (Section 2.1.5).","c":"CORRECT. The guide's industry-level discussion places behavioral advertising and targeting practices under Customer Privacy (Social Capital), which focuses on how customer data is collected, shared, and used (Section 2.1.2).","d":"Incorrect. This category concerns the accuracy and transparency of marketing and labeling of products, not the use of customer data."},"trap":{"a":"Adjacent category: security versus use of data","b":"Different dimension","c":"","d":"Adjacent category: marketing claims"}},{"id":"T5J2","lo":8,"type":"single","text":"How should the metric \"percentage of impressions targeted to custom audiences\" be characterized for Agency A?","options":{"a":"A risk; it captures impacts already realized in full in Agency A's financial statements","b":"A risk; a rising share increases the likelihood of regulatory and customer-backlash impacts","c":"An activity metric; it measures the scale of advertising delivered to audiences during the year","d":"An opportunity; targeting raises advertising revenue, so higher values improve economic performance"},"answer":["b"],"expl":{"a":"Incorrect. Exposure indicates potential impacts; the realized loss is the separate legal-losses metric.","b":"CORRECT. For this industry the guide frames the metric as an indicator of exposure to evolving regulation and customer backlash, so higher values signal greater likelihood of impacts (Sections 7.1 and 7.2.1.1).","c":"Incorrect. Impressions delivered is the activity metric; the targeted share is a performance metric.","d":"Incorrect. Targeting may support revenue, but the guide uses this metric to assess privacy risk; context decides the classification (Section 7.1)."},"trap":{"a":"Potential impact mistaken for realized impact","b":"","c":"Performance metric mistaken for activity metric","d":"Revenue effect mistaken for the metric's purpose"}},{"id":"T5J3","lo":4,"type":"multi","text":"Which two of the five factors are most clearly evidenced for the issue of customer privacy in this case? (Choose two.)","options":{"a":"Direct financial impacts and risk","b":"Opportunities for innovation","c":"Legal, regulatory, and policy drivers","d":"Industry norms, best practices, and competitive drivers","e":"Stakeholder concerns and social trends"},"answer":["c","e"],"expl":{"a":"Incorrect. A's losses of $14 million are about 0.15 percent of its revenue, too small to make this factor the clearest evidence.","b":"Incorrect. The case describes no competitive advantage gained from innovation.","c":"CORRECT. The case describes an enacted law restricting behavioral targeting (Section 3.1).","d":"Incorrect. The case does not describe peer practices driving performance; the two agencies' policies differ without reference to norms.","e":"CORRECT. The case cites the risk of customer backlash from unsatisfactory practices (Section 3.1)."},"trap":{"a":"Immaterial cost treated as evidence","b":"No innovation evidence","c":"","d":"No peer evidence","e":""}},{"id":"T5J4","lo":2,"type":"single","text":"How should Agency A's 72 percent targeted share be interpreted in the context of its regulatory climate?","options":{"a":"Agency B's 27 percent share is the riskier position, because it operates where no law restricts behavioral targeting","b":"Both shares carry equal risk, because privacy regulation applies to the industry as a whole rather than to companies","c":"Its rising share is lower risk because its opt-out policy already satisfies the opt-in requirement of the new law","d":"It faces a higher near-term revenue risk than Agency B's 27 percent, because the new law takes effect in Year 4"},"answer":["d"],"expl":{"a":"Incorrect. Absence of a restriction lowers, not raises, near-term regulatory exposure.","b":"Incorrect. Regulation applies by jurisdiction, so exposure differs between companies in different markets (Section 6.1.3).","c":"Incorrect. The law requires opt-in; A's policy provides opt-out, so it does not comply.","d":"CORRECT. Regulatory climate includes announced regulation and its effect on a company's practices (Section 1.2.2.3). The law restricts exactly the targeting A uses most, and B is not subject to it."},"trap":{"a":"Absence of regulation read as risk","b":"Jurisdictional differences ignored","c":"Opt-out confused with opt-in","d":""}}]},{"id":"T5K","title":"Case 11: Media & Entertainment Industry","built":"New case built on the guide's selling practices example (Section 2.1.2)","body":"<p>For Media & Entertainment companies that provide public information services, the issue of selling practices and product labeling is characterized by journalistic integrity and sponsorship identification. Truthful portrayal and ethical sourcing of news, fair and transparent sponsorship, and conflict-of-interest disclosure help companies minimize regulatory oversight and lower reputational risk. Failure to manage this issue can result in severe reputational harm, among other financial impacts.</p>\n<p>Publisher A earns about 70 percent of its revenue from news and 30 percent from sponsored content. Publisher B produces scripted entertainment and earns all of its revenue from subscriptions and licensing; it publishes no news.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Publisher A</th><th colspan=\"2\">Publisher B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Revenue ($ millions)</td><td>1,000</td><td>980</td><td>1,500</td><td>1,560</td></tr>\n<tr><td>Regulatory inquiries into sponsorship disclosure</td><td>1</td><td>3</td><td>0</td><td>0</td></tr>\n<tr><td>Published corrections for sourcing errors</td><td>20</td><td>45</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Percentage of sponsored content clearly identified</td><td>82%</td><td>74%</td><td>n.a.</td><td>n.a.</td></tr>\n</tbody></table>","questions":[{"id":"T5K1","lo":1,"type":"single","text":"Why is the selling practices topic more relevant to Publisher A than to Publisher B?","options":{"a":"A has more regulatory inquiries, and inquiries determine which sustainability topics are relevant to a company","b":"B's entertainment content is produced for adult audiences, so the accuracy of its labeling is not relevant to it","c":"A reports sponsorship data and B does not, and a company's disclosure alone makes a topic relevant to it","d":"A's revenue comes mainly from news, a public information service where integrity drives its reputation and revenue"},"answer":["d"],"expl":{"a":"Incorrect. Performance results do not determine relevance; the company's revenue and activities do.","b":"Incorrect. The case gives no basis for this claim about B's audiences or labeling.","c":"Incorrect. Disclosure does not make a topic relevant; relevance is not determined by a company's decision to disclose.","d":"CORRECT. Major revenue streams are an internal factor (Section 1.2.1.1), and the guide ties this topic's materiality to companies that provide public information services (Section 2.1.2)."},"trap":{"a":"Performance mistaken for relevance","b":"Unsupported invention","c":"Disclosure mistaken for relevance","d":""}},{"id":"T5K2","lo":3,"type":"single","text":"Journalistic integrity and sponsorship identification fall under which general issue category?","options":{"a":"Customer Privacy","b":"Selling Practices & Product Labeling","c":"Management of the Legal & Regulatory Environment","d":"Business Ethics"},"answer":["b"],"expl":{"a":"Incorrect. Customer Privacy concerns how customer data is collected, shared, and used.","b":"CORRECT. The guide's industry-level discussion places journalistic integrity and sponsorship identification for Media & Entertainment under Selling Practices & Product Labeling (Section 2.1.2), in the Social Capital dimension.","c":"Incorrect. This category concerns companies that rely on favorable regulation for competitiveness (Section 2.1.5), not disclosure practices.","d":"Incorrect. Business Ethics concerns bribery, corruption, fraud, and money laundering (Section 2.1.5); integrity in news and sponsorship disclosure sits in the social category."},"trap":{"a":"Different issue","b":"","c":"Regulation-related name, different issue","d":"Adjacent category: ethics"}},{"id":"T5K3","lo":8,"type":"multi","text":"Which two statements correctly characterize \"regulatory inquiries into sponsorship disclosure\" for Publisher A? (Choose two.)","options":{"a":"It is an activity metric used to normalize the number of corrections published","b":"It captures an opportunity, since inquiries show that regulators view A as an industry leader","c":"It captures a risk, since higher values indicate threats to economic performance","d":"It indicates a rising likelihood of regulatory oversight and reputational impacts","e":"It indicates impacts that have been realized in full, since each inquiry produced a fine"},"answer":["c","d"],"expl":{"a":"Incorrect. It is a performance metric; corrections and inquiries are both sustainability metrics, and revenue is the usual denominator.","b":"Incorrect. Nothing in the guide treats regulatory scrutiny as a leadership signal.","c":"CORRECT. Higher values threaten performance, the guide's test for a risk metric (Section 7.1).","d":"CORRECT. Inquiries rose from 1 to 3 alongside lower disclosure, and time-series data indicate likelihood (Section 7.2.1.1).","e":"Incorrect. The case reports no fines; the inquiries are not stated to have produced realized losses."},"trap":{"a":"Performance metric mistaken for activity metric","b":"Risk mistaken for opportunity","c":"","d":"","e":"Unsupported claim of fines"}},{"id":"T5K4","lo":9,"type":"single","text":"According to the guide, through which channel of financial impact does the severe reputational harm from failing to manage sponsorship identification most directly affect a publisher?","options":{"a":"Liabilities","b":"Tangible assets","c":"Cost of capital","d":"Revenues"},"answer":["d"],"expl":{"a":"Incorrect. No litigation or future obligation is described in the case.","b":"Incorrect. No impairment of physical assets is described.","c":"Incorrect. The guide does not link this issue to the cost of capital.","d":"CORRECT. The guide cites severe reputational harm, which affects audiences, advertisers, and therefore revenue (Section 8.2.1.1)."},"trap":{"a":"No obligation described","b":"Not evidenced","c":"Not evidenced","d":""}}]},{"id":"T5L","title":"Case 12: Asset Management & Custody Activities Industry","built":"New case built on the guide's diversity and inclusion example (Section 2.1.3)","body":"<p>Asset Management & Custody Activities is a high-competition industry for skilled employees. Performance on employee diversity and inclusion is often viewed through the level of gender and racial or ethnic representation among employee groups, including executive and non-executive management. In a saturated investment sector with many products, the ability to innovate by generating novel investment ideas can drive success. The ability to deliver superior risk-adjusted returns ensures inflows of assets under management (AUM) and generates higher management and incentive fees. Enhanced employee diversity could contribute to these goals and correlate positively with efficiency metrics such as ROIC and ROE. Diversity also influences reputation and the ability to attract employees, and operating costs related to recruiting, developing, and retaining them.</p>\n<p>Ten asset managers report Year 2 women's share of executive management: mean 24%, median 20%, standard deviation 8. Firm A also owns a commercial bank that contributes about 25 percent of its revenue.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Firm A</th><th colspan=\"2\">Firm B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Women's share of executive management</td><td>38%</td><td>40%</td><td>8%</td><td>12%</td></tr>\n<tr><td>Women's share of non-executive management</td><td>42%</td><td>43%</td><td>25%</td><td>28%</td></tr>\n<tr><td>Voluntary turnover of investment staff</td><td>8%</td><td>7%</td><td>16%</td><td>14%</td></tr>\n<tr><td>Assets under management ($ billions)</td><td>600</td><td>640</td><td>120</td><td>118</td></tr>\n</tbody></table>","questions":[{"id":"T5L1","lo":6,"type":"single","text":"Assuming normal distribution, which statement about Year 2 women's share of executive management is accurate?","options":{"a":"A is 2 standard deviations above the mean, higher than about 97.5 percent of peers, and B is 1.5 standard deviations below the mean","b":"A is 2 standard deviations above the mean, higher than about 95 percent of peers, and B is within 1 standard deviation of the mean","c":"A is 2 standard deviations above the mean, higher than about 97.5 percent of peers, and B is within 1 standard deviation of the mean","d":"A is 2 standard deviations above the mean, higher than about 95 percent of peers, and B is 1.5 standard deviations below the mean"},"answer":["a"],"expl":{"a":"CORRECT. A: (40 − 24) ÷ 8 = +2.0, above roughly 97.5 percent of values; B: (12 − 24) ÷ 8 = −1.5, between one and two standard deviations below the mean (Section 5.2).","b":"Incorrect. Both parts are wrong: the two-sided 95 percent rule is misapplied and B's distance is understated.","c":"Incorrect. A's position is right, but B's value lies 1.5 standard deviations below the mean, not within one.","d":"Incorrect. B's position is right, but 95 percent is the two-sided share within two standard deviations, not the share below a single point."},"trap":{"a":"","b":"Both errors","c":"Understated B's distance","d":"Two-sided 95 percent rule misapplied"}},{"id":"T5L2","lo":3,"type":"single","text":"Women's share of executive and non-executive management captures performance on which general issue category?","options":{"a":"Labor Practices","b":"Employee Engagement, Diversity & Inclusion","c":"Employee Health & Safety","d":"Human Rights & Community Relations"},"answer":["b"],"expl":{"a":"Incorrect. Labor Practices concerns wages, compensation, and labor relations rather than representation.","b":"CORRECT. The guide's industry-level discussion for Asset Management & Custody Activities uses representation across employee groups to evaluate diversity and inclusion within the Human Capital dimension (Section 2.1.3).","c":"Incorrect. Employee Health & Safety concerns work-related injury and illness.","d":"Incorrect. Human Rights & Community Relations concerns external communities and sits in Social Capital (Section 2.1.2)."},"trap":{"a":"Adjacent category in the same dimension","b":"","c":"Adjacent category in the same dimension","d":"Wrong dimension"}},{"id":"T5L3","lo":9,"type":"multi","text":"According to the guide, through which three channels does stronger employee diversity and inclusion most directly affect an asset manager? (Choose three.)","options":{"a":"Cost of capital","b":"Liabilities","c":"Revenues","d":"Expenses","e":"Intangible assets"},"answer":["c","d","e"],"expl":{"a":"Incorrect. The guide describes correlation with ROIC and ROE, not a change in cost of capital.","b":"Incorrect. No obligation or legal risk is described.","c":"CORRECT. The guide links innovation and superior returns to AUM inflows and higher management and incentive fees (Section 8.2.1.1).","d":"CORRECT. The guide cites operating costs related to recruiting, developing, and retaining employees (Section 8.2.1.2).","e":"CORRECT. The guide says diversity influences reputation and the ability to attract employees, which supports brand value, an intangible asset (Section 8.2.1.3)."},"trap":{"a":"ROIC correlation mistaken for cost of capital","b":"No obligation described","c":"","d":"","e":""}},{"id":"T5L4","lo":1,"type":"single","text":"How should Firm A's commercial bank influence the sustainability topics a user evaluates for Firm A?","options":{"a":"Add Investment Banking & Brokerage Standard topics, because the bank's lending resembles brokerage activity","b":"Replace the Asset Management Standard with the Commercial Banks Standard, because banking carries more systemic risk","c":"Leave the Asset Management Standard unchanged, because asset management and commercial banking are both financial services","d":"Add Commercial Banks Standard topics, because a significant revenue stream falls outside the asset management profile"},"answer":["d"],"expl":{"a":"Incorrect. Lending and deposit-taking are commercial banking activities; brokerage is a different industry with its own Standard (Section 1.2.1.1).","b":"Incorrect. Asset management remains about 75 percent of revenue, so its Standard is supplemented, not replaced.","c":"Incorrect. Separate Standards exist for different financial industries; a shared sector does not make profiles identical.","d":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1); a bank at 25 percent of revenue is a significant stream with its own issues, such as systemic risk management (Section 2.1.5)."},"trap":{"a":"Adjacent Standard in the same sector","b":"Supplemented topics mistaken for replaced topics","c":"Sector mistaken for industry","d":""}}]},{"id":"T5M","title":"Case 13: Non-Alcoholic Beverages Industry","built":"Revisits Practice Case 5's industry with new companies and a replenishment dataset","body":"<p>Companies in the Non-Alcoholic Beverages industry produce juices, soft drinks, coffee and tea products, energy drinks, and other beverages. The industry is not considered highly regulated, but trends related to consumer health and environmental responsibility have become increasingly important. The industry is a leading global consumer of fresh water, which is the primary ingredient in substantially all products. Because water stress is increasing in many regions, companies may face supply disruptions that significantly impact operations, add to costs, and in extreme cases threaten the business as a going concern. Local governments in water-stressed regions have instituted regulations requiring manufacturing efficiency thresholds and capping total water withdrawal.</p>\n<p>Company K and Company L produce beverages in multiple regions. Company L also owns a chain of cafés that contributes about 30 percent of its revenue. Ten companies in the industry report Year 2 percentage of water replenished: mean 55%, median 60%, standard deviation 15.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company K</th><th colspan=\"2\">Company L</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Revenue ($ billions)</td><td>9.0</td><td>9.4</td><td>6.0</td><td>6.2</td></tr>\n<tr><td>Total water consumed (billion liters)</td><td>180</td><td>185</td><td>120</td><td>135</td></tr>\n<tr><td>Percent of water consumed in regions with High Baseline Water Stress</td><td>12%</td><td>12%</td><td>35%</td><td>48%</td></tr>\n<tr><td>Percent of water replenished</td><td>85%</td><td>90%</td><td>40%</td><td>38%</td></tr>\n</tbody></table>","questions":[{"id":"T5M1","lo":6,"type":"single","text":"Which statement about Company K's Year 2 replenishment and the peer distribution is accurate?","options":{"a":"K is between 1 and 2 standard deviations above the mean, and the distribution is positively skewed because the mean is below the median","b":"K is more than 2 standard deviations above the mean, and the distribution is negatively skewed because the mean is below the median","c":"K is more than 2 standard deviations above the mean, and the distribution is positively skewed because the mean is below the median","d":"K is between 1 and 2 standard deviations above the mean, and the distribution is negatively skewed because the mean is below the median"},"answer":["b"],"expl":{"a":"Incorrect. Both parts are wrong: the distance is understated and the skew label is reversed.","b":"CORRECT. (90 − 55) ÷ 15 = +2.3 standard deviations. A mean (55) below the median (60) indicates negative skew (Section 5.3.2).","c":"Incorrect. The distance is right, but a mean below the median indicates negative, not positive, skew.","d":"Incorrect. The skew label is right, but K's value is 2.3 standard deviations above the mean, not between one and two."},"trap":{"a":"Both errors","b":"","c":"Skew label reversed","d":"Understated the distance"}},{"id":"T5M2","lo":1,"type":"single","text":"How should Company L's café chain influence the sustainability topics a user evaluates for L?","options":{"a":"Add Restaurants Standard topics, because a significant revenue stream falls outside the beverages profile","b":"Leave the Non-Alcoholic Beverages Standard unchanged, because the cafés sell the beverages that Company L produces","c":"Replace the Non-Alcoholic Beverages Standard with the Restaurants Standard, because cafés are consumer-facing businesses","d":"Add Alcoholic Beverages Standard topics, because the cafés also sell beverages that are consumed on the premises"},"answer":["a"],"expl":{"a":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1); cafés at about 30 percent of revenue bring issues such as food safety, labor practices, and energy use into scope.","b":"Incorrect. Selling the company's own products does not remove the distinct profile of a food-service operation.","c":"Incorrect. Beverages remain about 70 percent of revenue, so the Non-Alcoholic Beverages Standard is supplemented, not replaced.","d":"Incorrect. Alcoholic Beverages is a different industry with its own Standard; the case describes no alcohol sales in the cafés."},"trap":{"a":"","b":"Shared product mistaken for shared profile","c":"Supplemented topics mistaken for replaced topics","d":"Adjacent Standard for a different industry"}},{"id":"T5M3","lo":7,"type":"single","text":"Which conclusion about Company L is best supported by the table and the case?","options":{"a":"L's exposure fell in Year 2, because its total water consumption of 135 billion liters is below Company K's","b":"L's exposure rose only if regulators announce caps, because the stressed-region share alone shows no risk","c":"L's exposure to supply and regulatory risk rose, as more water came from stressed regions while replenishment fell","d":"L's exposure is unchanged, because its revenue growth is similar to the growth in its total water consumption"},"answer":["c"],"expl":{"a":"Incorrect. Absolute consumption reflects scale, not exposure (Section 4.1).","b":"Incorrect. The case states that water stress adds to costs and can disrupt operations even without caps; the share is informative on its own.","c":"CORRECT. L's stressed-region share rose from 35 to 48 percent and replenishment fell from 40 to 38 percent, both signaling greater exposure to supply disruption and withdrawal caps (Sections 6.1.3 and 6.1.4).","d":"Incorrect. L's water use rose 12.5 percent against revenue growth of 3.3 percent, so the growth rates are not similar."},"trap":{"a":"Scale mistaken for exposure","b":"Dismisses an informative metric","c":"","d":"Growth rates misread"}},{"id":"T5M4","lo":10,"type":"single","text":"Which pair of DCF adjustments is best supported for Company L?","options":{"a":"Higher expense projections for water costs; a higher discount rate for water supply risk","b":"Lower expense projections from efficiency gains; a higher discount rate for supply risk","c":"Lower expense projections from efficiency; a lower discount rate for supply security","d":"Higher expense projections for water costs; a lower discount rate for replenishment"},"answer":["a"],"expl":{"a":"CORRECT. L's water use rose faster than revenue and more of it comes from stressed regions, raising cost (Section 8.2.1.2), while lower replenishment and greater stress raise perceived risk (Section 8.2.2).","b":"Incorrect. L's water use per dollar of revenue worsened, so efficiency does not lower expenses.","c":"Incorrect. Both halves are wrong: efficiency worsened and supply risk increased.","d":"Incorrect. The expense half is right, but L's replenishment fell, so perceived risk does not fall."},"trap":{"a":"","b":"Right risk effect, wrong expense effect","c":"Both wrong","d":"Right expense effect, wrong risk effect"}}]}];

const CASES6=[{"id":"T6A","title":"Case 1: Chemicals Industry","built":"Augments Part I Practice Case 1 (Chemicals): same question types, new companies and facts","body":"<p>Companies in the Chemicals industry transform organic and inorganic chemicals into diverse products with industrial, pharmaceutical, agricultural, and consumer uses. The industry is heavily and unevenly regulated: rules govern the release of substances during manufacturing, the toxicity of end products, and impacts on human and environmental health. Companies compete on efficiencies, economies of scale, and the development of innovative products. Regulation can significantly influence the cost of production and demand.</p>\n<p>Company C and Company D are specialty chemicals producers that sell surfactants to industrial customers in the same jurisdiction, where the regulator has announced restrictions on several hazardous substances used in industrial surfactants, effective Year 4. Both companies compete on innovation and both draw process water and discharge treated wastewater. Company C's formulations are water-intensive, and both of its plants are in a river basin classified as having High Baseline Water Stress. Company D has developed bio-based surfactants made through a low-water fermentation process, and its plants are in regions with low baseline water stress. The case does not describe either company's air emissions, energy use, or conduct in its markets.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company C</th><th colspan=\"2\">Company D</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total revenue ($ millions)</td><td>1,800</td><td>1,850</td><td>1,100</td><td>1,300</td></tr>\n<tr><td>Products sold (thousand metric tons)</td><td>600</td><td>605</td><td>250</td><td>290</td></tr>\n<tr><td>Total water withdrawn (million cubic meters)</td><td>42</td><td>43</td><td>6</td><td>7</td></tr>\n<tr><td>Percent of water withdrawn in regions with High Baseline Water Stress</td><td>100%</td><td>100%</td><td>5%</td><td>5%</td></tr>\n<tr><td>Revenue from reduced-hazard products ($ millions)</td><td>150</td><td>180</td><td>600</td><td>780</td></tr>\n<tr><td>R&amp;D spending ($ millions)</td><td>40</td><td>42</td><td>55</td><td>70</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with environmental regulation ($ millions)</td><td>1.5</td><td>3.0</td><td>0</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T6A1","lo":2,"type":"single","text":"Which external factor related to the operating environment presents a risk to Company C but not to Company D?","options":{"a":"Operating location(s)","b":"Regulatory climate","c":"Business climate","d":"Economic climate"},"answer":["a"],"expl":{"a":"CORRECT. Operating location captures the physical environment of operations and its exposure to resource constraints (Section 1.2.2.4). Both of Company C's plants are in a basin with High Baseline Water Stress and its process is water-intensive; Company D's plants are in low-stress regions.","b":"Incorrect. The case states that both companies sell into the same jurisdiction under the same announced restrictions, so the regulatory climate (Section 1.2.2.3) does not differentiate them.","c":"Incorrect. Business climate concerns competitive forces and peer behavior (Section 1.2.2.1); both companies compete on innovation, so it does not differ.","d":"Incorrect. Economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2); the case describes no difference."},"trap":{"a":"","b":"Announced rule applies to both companies","c":"Both compete on innovation","d":"No economic difference described"}},{"id":"T6A2","lo":3,"type":"multi","text":"Based on the case, which two sustainability issues are likely relevant to both Company C and Company D? (Choose two.)","options":{"a":"Product Design & Lifecycle Management","b":"Business Ethics","c":"Water & Wastewater Management","d":"Air Quality","e":"Energy Management"},"answer":["a","c"],"expl":{"a":"CORRECT. Product Design & Lifecycle Management relates to opportunities from demand for more sustainable products and to meeting evolving regulation (Section 2.1.4). Both companies have reduced-hazard products and face announced restrictions on hazardous substances.","b":"Incorrect. Business Ethics concerns fraud, bribery, and corruption (Section 2.1.5). The case does not describe either company's conduct.","c":"CORRECT. Water & Wastewater Management addresses a company's water withdrawal and discharge (Section 2.1.1). The case states both companies draw process water and discharge treated wastewater.","d":"Incorrect. Air Quality concerns airborne pollutants (Section 2.1.1). The case says it does not describe either company's air emissions.","e":"Incorrect. Energy Management concerns energy consumption as an input (Section 2.1.1). The case does not describe either company's energy use."},"trap":{"a":"","b":"No conduct information in the case","c":"","d":"Plausible for chemicals but no evidence in the case","e":"Plausible for chemicals but no evidence in the case"}},{"id":"T6A3","lo":4,"type":"multi","text":"An investor is preparing a dialogue with management about each company's strategy on hazardous substances in its products. Which two of the five factors would most inform it? (Choose two.)","options":{"a":"Legal, regulatory, and policy drivers","b":"Direct financial impacts and risk","c":"Stakeholder concerns and social trends","d":"Industry norms, best practices, and competitive drivers","e":"Opportunities for innovation"},"answer":["a","e"],"expl":{"a":"CORRECT. This factor covers existing and emerging regulation that creates risks or opportunities (Section 3.1). The regulator has announced restrictions on several hazardous substances, effective Year 4.","b":"Incorrect. Company C's legal losses of $3.0 million are about 0.16 percent of its revenue and Company D reports none; the impact is not material as a direct cost (Section 3.1).","c":"Incorrect. This factor concerns the interests of employees, NGOs, communities, and the public (Section 3.1). The case describes no such pressure.","d":"Incorrect. This factor concerns how peers manage or disclose an issue (Section 3.1). The case gives no information on peer practices or disclosure.","e":"CORRECT. This factor covers competitive advantage from new technology and products (Section 3.1). Company D's bio-based surfactants and the companies' R&amp;D spending reflect it, and the case says both compete on innovation."},"trap":{"a":"","b":"Small legal losses treated as material","c":"No stakeholder evidence","d":"No peer evidence","e":""}},{"id":"T6A4","lo":5,"type":"single","text":"An analyst wants to compare the water efficiency of Company C and Company D. Which metric should be used to normalize \"total water withdrawn\"?","options":{"a":"Total revenue","b":"Revenue from reduced-hazard products","c":"Products sold","d":"R&D spending"},"answer":["c"],"expl":{"a":"Incorrect. Revenue is a financial metric with a less direct relationship to water use than production volume (Section 4.2).","b":"Incorrect. This covers only part of each company's output and would distort the comparison.","c":"CORRECT. Products sold measures production output, so water per metric ton of product directly reflects how efficiently each company uses water (Section 4.2). On this basis C used about 71 cubic meters per metric ton in Year 2 (43,000,000 ÷ 605,000) and D about 24 (7,000,000 ÷ 290,000).","d":"Incorrect. R&amp;D spending is a management response and has no direct relationship with water withdrawn."},"trap":{"a":"Financial metric less direct than output","b":"Partial measure of output","c":"","d":"Management input, not activity"}},{"id":"T6A5","lo":8,"type":"single","text":"Which of the following metrics captures performance related to an opportunity?","options":{"a":"Revenue from reduced-hazard products","b":"Monetary losses from legal proceedings","c":"Total water withdrawn","d":"Percent of water withdrawn in High Baseline Water Stress regions"},"answer":["a"],"expl":{"a":"CORRECT. Higher values indicate improved economic performance through demand for reduced-hazard products, the guide's test for an opportunity (Section 7.1).","b":"Incorrect. Higher losses indicate a threat to economic performance, so the metric measures a risk (Section 7.1).","c":"Incorrect. Higher water withdrawn indicates greater exposure and cost, so it measures a risk (Section 7.1).","d":"Incorrect. A higher share of water from stressed regions threatens supply and cost, so it measures a risk (Section 7.1)."},"trap":{"a":"","b":"Higher value means a threat, a risk","c":"Higher value means more exposure, a risk","d":"Higher value means more exposure, a risk"}}]},{"id":"T6B","title":"Case 2: Agricultural Products Industry","built":"Augments Part II Practice Case 2 (Agricultural Products): same question types, new companies and pesticide data","body":"<p>The Agricultural Products industry grows, processes, trades, and distributes vegetables and fruits and produces and mills agricultural commodities such as grains, sugar, consumable oils, maize, soybeans, and animal feed. To meet the challenges of scale, modern agriculture developed monoculture cultivation, which decreases production costs but makes plants more susceptible to insects, diseases, and variations in growing conditions. To manage these risks, companies depend on agrochemicals such as fertilizers and pesticides, whose runoff can contaminate water sources. Consumer preference for organically grown crops is driving growth in the industry worldwide. Financial impacts related to land use and ecological impacts can occur through contingent liabilities, operating expenses, asset impairment, market share, and access to new markets.</p>\n<p>Company E and Company F grow the same principal crop using monoculture practices, own their land, and directly control their farmer suppliers. In Year 2, Company E adopted an integrated pest management program that reduces the number of pesticide applications. Year 2 was also unusually dry in the region where Company E grows its crop, which reduced pest outbreaks. Company F made no operational changes. In Year 2 a regulator opened proceedings alleging that runoff from Company E's fields contaminated a municipal water source; the outcome and cost of the proceedings are not yet known.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company E</th><th colspan=\"2\">Company F</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Revenue ($ millions)</td><td>18,000</td><td>19,500</td><td>30,000</td><td>31,000</td></tr>\n<tr><td>Production of principal crop (metric tons)</td><td>230,000</td><td>240,000</td><td>390,000</td><td>400,000</td></tr>\n<tr><td>Total land area under active production (hectares)</td><td>40,000</td><td>40,000</td><td>50,000</td><td>50,000</td></tr>\n<tr><td>Number of processing facilities</td><td>150</td><td>155</td><td>260</td><td>260</td></tr>\n<tr><td>Total pesticide consumption (metric tons)</td><td>8,200</td><td>7,200</td><td>9,400</td><td>9,500</td></tr>\n</tbody></table>\n<p>Eight other companies growing the same crop report Year 2 pesticide consumption per hectare of land under active production: mean 0.200 metric tons, median 0.195, standard deviation 0.020.</p>","questions":[{"id":"T6B1","lo":5,"type":"single","text":"Which activity metric is the least useful for normalizing \"total pesticide consumption\" to compare the two companies?","options":{"a":"Number of processing facilities","b":"Total revenue","c":"Production of principal crop","d":"Total land area under active production"},"answer":["a"],"expl":{"a":"CORRECT. The number of processing facilities has no direct relationship with pesticide use, because pesticide is applied in the field, not in processing (Section 4.2).","b":"Incorrect. Revenue has a less direct relationship with pesticide use than production or land area, but it still reflects economic efficiency (Section 4.2).","c":"Incorrect. Production reflects output, so pesticide per metric ton of crop shows how efficiently pesticide is converted into product (Section 4.2).","d":"Incorrect. Land area reflects operating scale, so pesticide per hectare is a meaningful comparison (Section 4.2)."},"trap":{"a":"","b":"Less direct but still usable","c":"Valid output measure","d":"Valid scale measure"}},{"id":"T6B2","lo":5,"type":"single","text":"Which statement accurately describes the companies' Year 2 pesticide use when normalized?","options":{"a":"E used more per hectare than F, and more per metric ton of crop","b":"E used more per hectare than F, but less per metric ton of crop","c":"E used less per hectare than F, and less per metric ton of crop","d":"E used less per hectare than F, but more per metric ton of crop"},"answer":["d"],"expl":{"a":"Incorrect. E's per-hectare figure (0.180) is below F's (0.190).","b":"Incorrect. The directions are reversed on both measures.","c":"Incorrect. E's per-hectare figure is lower, but its per-ton figure (0.0300) is higher than F's (0.0238).","d":"CORRECT. Per hectare, E used 7,200 ÷ 40,000 = 0.180 against F's 9,500 ÷ 50,000 = 0.190. Per metric ton of crop, E used 7,200 ÷ 240,000 = 0.0300 against F's 9,500 ÷ 400,000 = 0.0238. Different normalization measures give different insights (Section 4.2)."},"trap":{"a":"Right on output, wrong on land","b":"Both directions reversed","c":"Assumes both measures agree","d":"Right on land, wrong on output"}},{"id":"T6B3","lo":7,"type":"multi","text":"Normalized by land area, Company E reduced its total pesticide use by about 12 percent from Year 1 to Year 2, and an analyst infers it is improving durably. Which two pieces of context should the analyst consider before concluding this? (Choose two.)","options":{"a":"Whether E's larger revenue base gives it economies of scale over smaller peers","b":"Whether the reduction reflects E's management decision to adopt integrated pest management","c":"Whether unusually dry weather in E's growing region reduced pest pressure in Year 2","d":"Whether consumer preference for organically grown crops will continue in E's markets"},"answer":["b","c"],"expl":{"a":"Incorrect. Operating scale is not a primary focal point in this analysis and does not show whether the improvement will be sustained.","b":"CORRECT. Management decisions explain whether a change reflects durable operational improvement (Section 6.2).","c":"CORRECT. Physical conditions in the growing region (operating location) can change pest pressure independently of management, so the improvement may not persist (Sections 1.2.2.4 and 6.1.4).","d":"Incorrect. Consumer preference is part of the business climate, but the case gives no evidence that it explains E's pesticide reduction."},"trap":{"a":"Scale does not bear on durability","b":"","c":"","d":"Industry trend with no evidence in this case"}},{"id":"T6B4","lo":9,"type":"single","text":"Through which channel of financial impact does the pending regulatory proceeding over runoff from E's fields most directly affect Company E?","options":{"a":"Tangible assets","b":"Expenses","c":"Liabilities","d":"Revenues"},"answer":["c"],"expl":{"a":"Incorrect. The case does not describe impairment of E's land or equipment (Section 8.2.1.3).","b":"Incorrect. Expenses are costs already incurred (Section 8.2.1.2); the case says the cost is not yet known.","c":"CORRECT. The case lists contingent liabilities among the channels for land-use and ecological impacts. A pending proceeding with an unknown outcome and cost is a contingent liability, a legal risk and potential future obligation (Section 8.2.1.4).","d":"Incorrect. The case does not describe an effect of the proceeding on sales."},"trap":{"a":"No asset effect described","b":"Cost not yet incurred","c":"","d":"No sales effect described"}},{"id":"T6B5","lo":6,"type":"single","text":"Assuming normal distribution, Company E's Year 2 pesticide use per hectare is higher than approximately what percentage of the eight peers?","options":{"a":"34%","b":"68%","c":"16%","d":"84%"},"answer":["c"],"expl":{"a":"Incorrect. 34 percent is the share between the mean and one standard deviation, not the share below E's position.","b":"Incorrect. 68 percent is the share within one standard deviation on either side of the mean.","c":"CORRECT. E's value is 7,200 ÷ 40,000 = 0.180 metric tons per hectare, and (0.180 − 0.200) ÷ 0.020 = −1.0 standard deviations. About 16 percent of values lie below one standard deviation under the mean (2.1% + 13.6%), so E uses more than about 16 percent of peers (Section 5.2).","d":"Incorrect. 84 percent would apply if E were one standard deviation above the mean (0.220)."},"trap":{"a":"Single-band share mistaken for tail share","b":"Two-sided one-SD share","c":"","d":"Direction reversed"}}]},{"id":"T6C","title":"Case 3: Restaurants Industry","built":"Augments Part III Practice Case 3 (Restaurants): same question types on supply chain management and food sourcing","body":"<p>Companies in the Restaurants industry prepare meals, snacks, and beverages for immediate on- and off-premises consumption. The industry is mature with low barriers to entry, and as a consumer-facing industry companies face significant reputational risk related to food safety, healthy options, labor practices, and sustainable sourcing. Supply chain management is crucial to protect reputation and brand value. Sourcing to consistently high standards across locations is operationally challenging because of global suppliers, a limited number of suppliers that meet high standards, and higher costs. Reputational damage from food safety issues tends to have a long-term impact and affects a company across most of its locations.</p>\n<p>Company G is the first mover in its industry in publishing supplier food-safety audit results; effective management of the topic involves a steep learning curve, and Company G has steadily raised the share of food it buys from audited suppliers. Company H sources conventionally from suppliers it does not audit. In Year 3, one of Company H's ingredient suppliers failed, causing a short-term supply disruption, and a foodborne-illness incident led Company H to close 30 restaurants temporarily.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company G</th><th colspan=\"3\">Company H</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Number of restaurants</td><td>600</td><td>650</td><td>700</td><td>3,000</td><td>3,100</td><td>3,150</td></tr>\n<tr><td>Revenue ($ billions)</td><td>1.2</td><td>1.4</td><td>1.6</td><td>4.0</td><td>4.1</td><td>4.15</td></tr>\n<tr><td>Cost of goods sold, as % of revenue</td><td>31.0%</td><td>32.5%</td><td>34.0%</td><td>29.0%</td><td>29.1%</td><td>29.2%</td></tr>\n<tr><td>Percentage of food purchased from audited suppliers</td><td>40%</td><td>60%</td><td>80%</td><td>0%</td><td>0%</td><td>0%</td></tr>\n<tr><td>Restaurants closed temporarily after food-safety incidents</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>30</td></tr>\n</tbody></table>","questions":[{"id":"T6C1","lo":8,"type":"multi","text":"Which two of the following represent acute financial impacts? (Choose two.)","options":{"a":"A gradual rise in ingredient costs as sourcing standards tighten","b":"Higher per-store sales over a three-year period","c":"A short-term supply disruption when a key supplier fails","d":"The temporary closure of restaurants after a foodborne-illness incident","e":"A steady increase in market share as brand image improves"},"answer":["c","d"],"expl":{"a":"Incorrect. A gradual rise in ingredient costs accrues through everyday operations and is a progressive operating cost (Section 7.2.2).","b":"Incorrect. Higher per-store sales over several years reflect gradual change and are progressive (Section 7.2.2).","c":"CORRECT. A sudden supply disruption from a supplier failure is a one-time event of this kind, with immediate effects on operations and sales (Section 7.2.2).","d":"CORRECT. Acute impacts are one-time events with direct and immediate effects on the financial statements, such as closures after an outbreak (Section 7.2.2).","e":"Incorrect. Market share gains build gradually over time and are progressive (Section 7.2.2)."},"trap":{"a":"Gradual cost increase is progressive","b":"Gradual gain is progressive","c":"","d":"","e":"Gradual gain is progressive"}},{"id":"T6C2","lo":3,"type":"multi","text":"Which two sustainability issues have interrelated impacts for Company G and Company H? (Choose two.)","options":{"a":"Labor Practices","b":"Selling Practices & Product Labeling","c":"Employee Engagement, Diversity & Inclusion","d":"Customer Welfare","e":"Supply Chain Management"},"answer":["d","e"],"expl":{"a":"Incorrect. Labor Practices concerns wages, turnover, and labor relations (Section 2.1.3); the case does not link them to the incidents.","b":"Incorrect. Selling Practices & Product Labeling concerns the accuracy of marketing and labeling; the case describes contamination, not mislabeling.","c":"Incorrect. Employee Engagement, Diversity & Inclusion concerns workforce culture and representation (Section 2.1.3); the case does not describe it.","d":"CORRECT. Customer Welfare concerns the benefits and risks customers experience from products, and the guide's example is food safety risk from restaurants. Supplier controls drive that risk, so the two issues are interrelated (Sections 2.1.2 and 2.2).","e":"CORRECT. Supply Chain Management concerns management of environmental and social risks among suppliers (Section 2.1.4); supplier audits and failures determine food-safety outcomes."},"trap":{"a":"Human capital issue not in the case","b":"Adjacent social issue, wrong mechanism","c":"Human capital issue not in the case","d":"","e":""}},{"id":"T6C3","lo":10,"type":"single","text":"All
