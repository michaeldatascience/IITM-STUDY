 else equal, how should Company H's performance on supply chain management and food sourcing be reflected in a DCF analysis, relative to Company G?","options":{"a":"Higher discount rate","b":"Lower discount rate","c":"Higher growth projections","d":"Lower expense projections"},"answer":["a"],"expl":{"a":"CORRECT. Cost of capital reflects the risk investors and lenders perceive (Section 8.2.2). H has no audit program, a failed supplier, and a food-safety closure, which raise its risk profile relative to the first mover.","b":"Incorrect. A lower discount rate fits a company perceived as less risky than peers, such as the first mover G, not H.","c":"Incorrect. Nothing in the case positions H to capture an expanding market (Section 8.2.3); the incident points the other way.","d":"Incorrect. H's closures and supply disruption raise, not lower, its expected costs."},"trap":{"a":"","b":"Applies G's logic to H","c":"No growth evidence","d":"Opposite expense effect"}},{"id":"T6C4","lo":7,"type":"single","text":"Company G's cost of goods sold rose from 31.0 to 34.0 percent of revenue while its audited share of purchases doubled; Company H's stayed near 29 percent. Which conclusion is best supported?","options":{"a":"H has outperformed G, because a flat cost ratio shows lower risk on food sourcing and food safety","b":"G is less efficient than H, because a higher cost ratio indicates weaker management of operations","c":"G's higher cost is a progressive result of its sourcing decisions, set against stronger revenue growth","d":"G's cost increase is an acute event, because it coincided with a deliberate change in its sourcing"},"answer":["c"],"expl":{"a":"Incorrect. H's flat ratio reflects no audit program, and H later suffered a supplier failure and closures, so a flat ratio does not indicate lower risk.","b":"Incorrect. The cost ratio alone does not show weaker management; the case ties it to a deliberate sourcing decision.","c":"CORRECT. Rising ingredient costs from higher sourcing standards accrue gradually through everyday operations, which is progressive (Section 7.2.2). Management decisions are context for interpreting the data (Section 6.2); G's revenue grew 33 percent over the period, and its audited share rose from 40 to 80 percent.","d":"Incorrect. The increase was gradual over three years, not a one-time event."},"trap":{"a":"Flat cost mistaken for low risk","b":"Cost ratio read without context","c":"","d":"Gradual change mistaken for acute"}}]},{"id":"T6D","title":"Case 4: Electric Utilities & Power Generators Industry","built":"Augments Practice Case 4 (Electric Utilities): same question types with a decoupled company and new data","body":"<p>Companies in the Electric Utilities & Power Generators industry generate electricity, operate transmission and distribution networks, and sell electricity to households, businesses, and industrial plants. Electricity generation is the largest source of GHG emissions in the world. Regulated utilities accept oversight of pricing and allowed return on equity in exchange for a license to operate as a monopoly. The cost of supplying electricity is highest during periods of high demand. Utilities can encourage efficient use of energy through education and demand-response programs that reduce electricity use at peak times.</p>\n<p>Company G and Company H are regulated utilities serving residential and commercial customers. Company G's revenue is decoupled from the amount of electricity its customers consume. Company H's revenue is a direct product of the electricity it sells. Company G operates in a region with aggressive GHG reduction requirements, including a minimum renewable share of 40 percent and a cap on emissions. Company H operates in a region where emissions-limiting regulation currently covers only part of its emissions, and where it expects the regulation to be extended.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company G</th><th colspan=\"2\">Company H</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Number of residential customers served</td><td>600,000</td><td>640,000</td><td>900,000</td><td>900,000</td></tr>\n<tr><td>Total electricity generated (MWh per year)</td><td>9,000,000</td><td>9,200,000</td><td>14,000,000</td><td>15,500,000</td></tr>\n<tr><td>Percentage of electricity generated from renewable sources</td><td>32%</td><td>38%</td><td>22%</td><td>20%</td></tr>\n<tr><td>Gross global Scope 1 emissions (metric tons per year)</td><td>6,300,000</td><td>6,000,000</td><td>11,200,000</td><td>13,000,000</td></tr>\n<tr><td>Percent of emissions covered under emissions-limiting regulation</td><td>100%</td><td>100%</td><td>25%</td><td>60%</td></tr>\n<tr><td>Percent of electric load served by smart grid technology</td><td>30%</td><td>45%</td><td>15%</td><td>15%</td></tr>\n</tbody></table>","questions":[{"id":"T6D1","lo":5,"type":"multi","text":"Which three of the metrics in the table are already normalized and do not need further normalization before comparison? (Choose three.)","options":{"a":"Percentage of electricity generated from renewable sources","b":"Percent of electric load served by smart grid technology","c":"Total electricity generated, reported in megawatt-hours per year","d":"Percent of emissions covered under emissions-limiting regulation","e":"Gross global Scope 1 emissions, reported in metric tons per year"},"answer":["a","b","d"],"expl":{"a":"CORRECT. A percentage is already normalized (Section 4.1).","b":"CORRECT. A percentage is already normalized (Section 4.1).","c":"Incorrect. This is an absolute value reflecting scale; here it serves as an activity metric for normalizing emissions (Section 4.2).","d":"CORRECT. A percentage is already normalized (Section 4.1).","e":"Incorrect. This is an absolute value reflecting scale and may need normalization, for example by total electricity generated (Sections 4.1 and 4.2)."},"trap":{"a":"","b":"","c":"Absolute activity metric","d":"","e":"Absolute value reflecting scale"}},{"id":"T6D2","lo":7,"type":"single","text":"In the context of each company's regulatory climate, which normalized metric indicates that Company H faces greater near-term risk than Company G?","options":{"a":"Gross global Scope 1 emissions per total electricity generated","b":"Total electricity generated per residential customer served","c":"Percent of emissions covered under emissions-limiting regulation","d":"Percentage of electricity generated from renewable sources"},"answer":["a"],"expl":{"a":"CORRECT. H emits 13,000,000 ÷ 15,500,000 = 0.84 metric tons per MWh against G's 0.65, and H's regulated share is rising, so more of its higher intensity will be subject to limits (Sections 1.2.2.3 and 4.2).","b":"Incorrect. This ratio describes output per customer and has no direct relationship with regulatory risk.","c":"Incorrect. G's regulated share (100 percent) is higher than H's (60 percent), so this metric alone points to greater near-term regulatory exposure for G.","d":"Incorrect. This ratio compares compliance with the renewable requirement, which applies to G's region; the case describes no such requirement for H."},"trap":{"a":"","b":"Unrelated to regulation","c":"Points to G, not H","d":"Requirement applies to G's region"}},{"id":"T6D3","lo":7,"type":"single","text":"A user concludes that Company H faces greater risk than Company G related to electricity generation. What evidence supports this conclusion?","options":{"a":"G's percentage renewable is rising more slowly than H's, so G's position is the weaker of the two","b":"G faces more uncertainty than H about future emissions-limiting regulation of its generation fleet","c":"H generates more total electricity than G, which indicates greater economic efficiency for H overall","d":"H's percentage renewable is falling while the share of its emissions under regulation is rising"},"answer":["d"],"expl":{"a":"Incorrect. G's renewable share rose from 32 to 38 percent, faster than H's change (a decline).","b":"Incorrect. G operates under existing, fully applicable regulation, so its regulatory outlook is less uncertain; it is H that expects extension.","c":"Incorrect. Higher total output reflects scale; it does not show greater economic efficiency or lower risk (Section 4.1).","d":"CORRECT. H's renewable share fell from 22 to 20 percent while its regulated share rose from 25 to 60 percent, so a growing share of a worsening position is subject to limits (Sections 1.2.2.3 and 6.1.3)."},"trap":{"a":"Factually reversed","b":"Uncertainty attributed to the wrong company","c":"Scale mistaken for efficiency","d":""}},{"id":"T6D4","lo":10,"type":"single","text":"Company G launches a demand-response program that reduces its customers' electricity use at peak times. Given G's rate structure, how should this be reflected in a DCF analysis of G?","options":{"a":"Neutral revenue projections and lower expense projections","b":"Lower revenue projections and lower expense projections","c":"Higher revenue projections and neutral expense projections","d":"Lower revenue projections and higher expense projections"},"answer":["a"],"expl":{"a":"CORRECT. G's revenue is decoupled from consumption, so revenue is not directly reduced, and the cost of supplying electricity is highest at peak demand, so reducing peak use lowers expenses (Sections 8.2.1.1 and 8.2.1.2).","b":"Incorrect. The expense effect is right, but a decoupled company's revenue is not tied to the quantity of electricity sold; the lower-revenue effect applies to a non-decoupled company such as H.","c":"Incorrect. Lower consumption cannot raise revenue, and the expense effect is not neutral.","d":"Incorrect. The revenue effect applies to H, and expenses fall rather than rise."},"trap":{"a":"","b":"Applies the non-decoupled revenue effect","c":"Revenue direction impossible","d":"Both effects wrong"}},{"id":"T6D5","lo":8,"type":"single","text":"Which statement best characterizes the financial impacts associated with the metric \"percent of emissions covered under emissions-limiting regulation\" for each company?","options":{"a":"G faces actual, progressive impacts; H faces only potential impacts, with a high likelihood of occurring","b":"G faces actual, progressive impacts; H faces actual impacts on its covered share, only potential on the rest","c":"G faces actual, acute impacts; H faces only potential impacts, with a low likelihood of occurring soon","d":"G faces potential, progressive impacts; H faces actual, acute impacts on its covered share of emissions"},"answer":["b"],"expl":{"a":"Incorrect. H has existing regulation on 60 percent of its emissions, so its impacts are not only potential.","b":"CORRECT. Existing regulation is an actual impact (Section 7.2.1.1), and compliance with it is an ongoing operating cost, which is progressive (Section 7.2.2). H's covered 60 percent is actual, and the expected extension to the rest is a potential impact.","c":"Incorrect. G's impacts are ongoing costs, not acute, and H already faces actual impacts on the 60 percent now covered.","d":"Incorrect. G's regulation already exists, so its impacts are actual, and compliance with existing regulation accrues gradually rather than as an acute event."},"trap":{"a":"Ignores H's current coverage","b":"","c":"Compliance cost mistaken for acute event","d":"Existing rule mistaken for potential"}}]},{"id":"T6E","title":"Case 5: Non-Alcoholic Beverages Industry","built":"Augments Practice Case 5 (Non-Alcoholic Beverages): same question types, new companies and data","body":"<p>Companies in the Non-Alcoholic Beverages industry produce juices, soft drinks, coffee and tea products, energy drinks, and other beverages. The industry is not considered highly regulated, but trends related to consumer health and environmental responsibility have become increasingly important. Widely publicized research links high-sugar beverages to health problems, and some consumers pay more for healthier, low-calorie products. The industry is a leading global consumer of fresh water, the primary ingredient in substantially all products, and water is a significant cost. Local governments in water-stressed regions have capped total water withdrawal, and in several of those regions local communities and NGOs have publicly opposed new withdrawals.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company P</th><th colspan=\"2\">Company Q</th><th colspan=\"2\">Company R</th><th colspan=\"2\">Company S</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total revenue ($ billions)</td><td>12.0</td><td>12.4</td><td>9.0</td><td>9.1</td><td>7.5</td><td>8.3</td><td>14.0</td><td>13.8</td></tr>\n<tr><td>Beverage volume produced (billion liters)</td><td>30</td><td>31</td><td>22</td><td>22</td><td>15</td><td>17</td><td>40</td><td>39</td></tr>\n<tr><td>Total water consumed (billion liters)</td><td>60</td><td>60</td><td>52</td><td>54</td><td>31</td><td>33</td><td>88</td><td>90</td></tr>\n<tr><td>Percent of water consumed in regions with High Baseline Water Stress</td><td>8%</td><td>8%</td><td>35%</td><td>38%</td><td>20%</td><td>18%</td><td>45%</td><td>46%</td></tr>\n<tr><td>Percent of water replenished</td><td>95%</td><td>96%</td><td>60%</td><td>58%</td><td>80%</td><td>85%</td><td>40%</td><td>40%</td></tr>\n<tr><td>Revenue from low-calorie drinks ($ billions)</td><td>2.4</td><td>2.7</td><td>1.0</td><td>1.0</td><td>1.5</td><td>2.2</td><td>4.2</td><td>3.8</td></tr>\n</tbody></table>","questions":[{"id":"T6E1","lo":7,"type":"single","text":"Which company faces the lowest level of risk related to water management?","options":{"a":"Company Q","b":"Company P","c":"Company R","d":"Company S"},"answer":["b"],"expl":{"a":"Incorrect. Company Q takes 38 percent of its water from stressed regions and its replenishment fell to 58 percent.","b":"CORRECT. Company P draws only 8 percent of its water from High Baseline Water Stress regions and replenishes 96 percent, the best combination of supply exposure and mitigation (Sections 6.1.4 and 7.2.1.1).","c":"Incorrect. Company R consumes the least water in total, but total volume reflects scale; its exposure (18 percent) and replenishment (85 percent) are both weaker than P's (Section 4.1).","d":"Incorrect. Company S has the highest stressed-region share (46 percent) and replenishes only 40 percent."},"trap":{"a":"Weakest exposure and replenishment profile","b":"","c":"Lowest total mistaken for lowest risk","d":"Highest exposure of the four"}},{"id":"T6E2","lo":10,"type":"single","text":"All else equal, how should Company S's declining share of revenue from low-calorie drinks (30.0 to 27.5 percent) be factored into a DCF analysis, when consumers increasingly pay more for healthier drinks?","options":{"a":"Decrease the discount rate","b":"Increase the book value of intangible assets","c":"Increase growth projections","d":"Decrease growth projections"},"answer":["d"],"expl":{"a":"Incorrect. The case describes no change in S's risk profile related to this trend (Section 8.2.2).","b":"Incorrect. A falling share of healthier-product revenue does not raise brand or intangible value (Section 8.2.1.3).","c":"Incorrect. Increased growth would fit a company gaining share in the healthier-drink segment, such as R.","d":"CORRECT. Growth projections reflect a company's position to capture new and expanding markets (Section 8.2.3). S is losing share in the segment consumers are moving toward while peers such as R gain."},"trap":{"a":"No risk-profile change described","b":"Opposite asset effect","c":"Applies R's logic to S","d":""}},{"id":"T6E3","lo":4,"type":"multi","text":"A user is applying the five factors to understand how water management affects the financial performance of companies in this industry. Which three of the five factors lend insight into the nature of the financial impact? (Choose three.)","options":{"a":"Stakeholder concerns and social trends","b":"Opportunities for innovation","c":"Direct financial impacts and risk","d":"Legal, regulatory, and policy drivers","e":"Industry norms, best practices, and competitive drivers"},"answer":["a","c","d"],"expl":{"a":"CORRECT. The case describes community and NGO opposition to new withdrawals, which affects license to operate (Section 3.1).","b":"Incorrect. The case describes no emerging technology or product advantage related to water (Section 3.1).","c":"CORRECT. Water is the primary ingredient and a significant cost, so impacts appear in existing expense line items (Section 3.1).","d":"CORRECT. Local governments in water-stressed regions have capped withdrawals and required efficiency, which are existing regulations (Section 3.1).","e":"Incorrect. The case does not describe how peers manage or disclose water performance (Section 3.1)."},"trap":{"a":"","b":"No innovation evidence","c":"","d":"","e":"No peer evidence"}},{"id":"T6E4","lo":7,"type":"single","text":"Assuming each company operates in regions where consumers show an increasingly high willingness to pay for low-calorie products, which company is best positioned to capture market share?","options":{"a":"Company Q","b":"Company R","c":"Company P","d":"Company S"},"answer":["b"],"expl":{"a":"Incorrect. Q's share is about 11 percent and flat.","b":"CORRECT. R's low-calorie share of revenue rose from 20.0 to 26.5 percent, with revenue growing 47 percent in that segment (1.5 to 2.2 billion), the strongest momentum (Section 8.2.3).","c":"Incorrect. P's share rose modestly from 20.0 to 21.8 percent, less than R's gain.","d":"Incorrect. S has the largest absolute low-calorie revenue, but its share fell from 30.0 to 27.5 percent and its segment revenue declined."},"trap":{"a":"Low and flat share","b":"","c":"Gain smaller than R's","d":"Highest absolute revenue but falling"}},{"id":"T6E5","lo":5,"type":"single","text":"An analyst is comparing the operating efficiency of the four companies' water use. Which metric is the most appropriate for normalizing \"total water consumed\"?","options":{"a":"Total revenue","b":"Percent of water replenished","c":"Revenue from low-calorie drinks","d":"Beverage volume produced"},"answer":["d"],"expl":{"a":"Incorrect. Revenue is a financial metric with a less direct relationship to water use than output (Section 4.2).","b":"Incorrect. Percent replenished is itself a ratio describing mitigation, not a measure of activity (Section 4.1).","c":"Incorrect. This metric covers only one product line and does not describe total output.","d":"CORRECT. Production volume reflects output, so water per liter of beverage shows how efficiently each company uses water (Section 4.2). In Year 2, P used 1.94, Q 2.45, R 1.94, and S 2.31 liters of water per liter produced."},"trap":{"a":"Financial metric, less direct","b":"Already-normalized mitigation ratio","c":"Partial measure of output","d":""}}]},{"id":"T6F","title":"Case 6: Household & Personal Products Industry","built":"Augments Practice Case 6 (Household & Personal Products): same question types, new companies and data","body":"<p>The Household & Personal Products industry manufactures cosmetics, cleaning supplies, sanitary paper products, batteries, and similar goods, sold globally through mass merchants, grocery and drug stores, distributors, and e-commerce. Water is a vital input, both as a coolant and as a main product ingredient, so water expenses are a significant part of the cost structure. Water supplies are threatened in some regions by more frequent droughts. Growing pressure from consumers and regulators over chemicals linked to health and environmental harm means that companies that anticipate the changing regulatory landscape and adopt green chemistry may improve profitability by capturing changing demand.</p>\n<p>Companies W, X, Y, and Z are competitors. Assume that each pays the same average price per cubic meter of water. The table shows Year 2 data. Ten companies in the industry report the percent of water consumed in regions with High or Extremely High Baseline Water Stress: mean 28%, standard deviation 8.</p>\n<table><thead><tr><th></th><th>Company W</th><th>Company X</th><th>Company Y</th><th>Company Z</th></tr></thead><tbody>\n<tr><td>Total weight of products sold (thousand metric tons)</td><td>12,000</td><td>6,000</td><td>20,000</td><td>4,500</td></tr>\n<tr><td>Total water consumed (million cubic meters)</td><td>26.4</td><td>15.6</td><td>46.0</td><td>12.6</td></tr>\n<tr><td>Percent of water consumed in regions with High or Extremely High Baseline Water Stress</td><td>34%</td><td>20%</td><td>48%</td><td>60%</td></tr>\n<tr><td>Operating margin (NOPAT ÷ sales): Year 1</td><td>12%</td><td>18%</td><td>17%</td><td>8%</td></tr>\n<tr><td>Operating margin (NOPAT ÷ sales): Year 2</td><td>12%</td><td>22%</td><td>17%</td><td>8%</td></tr>\n<tr><td>Total revenue ($ millions)</td><td>9,000</td><td>6,600</td><td>14,000</td><td>3,000</td></tr>\n<tr><td>Revenue from products designed with green chemistry principles ($ millions)</td><td>900</td><td>1,850</td><td>2,520</td><td>1,050</td></tr>\n<tr><td>Number of product recalls</td><td>0</td><td>1</td><td>3</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T6F1","lo":8,"type":"single","text":"Which metric lends insight into an acute risk for companies in this industry?","options":{"a":"Revenue from products designed with green chemistry principles","b":"Total water consumed per metric ton of product sold","c":"Number of product recalls","d":"Operating margin"},"answer":["c"],"expl":{"a":"Incorrect. This metric captures an opportunity, because higher values indicate improved economic performance (Section 7.1).","b":"Incorrect. Water efficiency affects operating costs gradually through everyday operations, which is progressive (Section 7.2.2).","c":"CORRECT. Recalls are one-time events that are typically high magnitude and low likelihood, with direct and immediate effects on the financial statements, and the guide notes that recalls tend to be acute, low-frequency events (Sections 4.1 and 7.2.2).","d":"Incorrect. Operating margin is a financial performance measure used in ROIC analysis, not a sustainability risk metric (Section 9.1.1)."},"trap":{"a":"Opportunity, not risk","b":"Operating-efficiency metric, progressive","c":"","d":"Financial measure, not an ESG risk metric"}},{"id":"T6F2","lo":5,"type":"single","text":"Assuming each company pays the same average price per cubic meter of water, which company spends the least on water per metric ton of product sold?","options":{"a":"Company Z","b":"Company Y","c":"Company X","d":"Company W"},"answer":["d"],"expl":{"a":"Incorrect. Z consumes the least water in total, but at 0.0028 its water use per ton is the highest (Section 4.1).","b":"Incorrect. Y consumes the most water in total, but at 0.0023 per ton it is close to W; it is not the lowest.","c":"Incorrect. X has the highest operating margin and the lowest stressed-region share, but at 0.0026 its water use per ton exceeds W's.","d":"CORRECT. Water per thousand metric tons is W 26.4 ÷ 12,000 = 0.0022, X 0.0026, Y 0.0023, and Z 0.0028 million cubic meters, so W's water cost per ton is lowest (Section 4.2)."},"trap":{"a":"Smallest total mistaken for most efficient","b":"Largest total mistaken for most efficient","c":"Margin and exposure mistaken for water cost","d":""}},{"id":"T6F3","lo":10,"type":"multi","text":"A user comparing the companies concludes that Company X has a consumer advantage. What two pieces of evidence support this conclusion? (Choose two.)","options":{"a":"Company X consumes the lowest percent of its water in stressed regions","b":"Company X's operating margin rose while the other companies' margins did not","c":"Company X consumes the least total water of the four companies","d":"Company X earns the highest percent of revenue from green chemistry products","e":"Company X has the highest operating margin (NOPAT ÷ sales)"},"answer":["b","e"],"expl":{"a":"Incorrect. This is true (20 percent), but advantageous access to inputs is evidence of a production advantage, not a consumer advantage (Section 9.1.1).","b":"CORRECT. X's margin rose from 18 to 22 percent while the others' margins were flat, which is improvement through operating margin (Section 9.1.1).","c":"Incorrect. This is false: Z consumes the least total water, and total volume reflects scale in any case.","d":"Incorrect. This is false: Z has the highest share (35 percent) against X's 28 percent.","e":"CORRECT. Where sustainability information improves ROIC through operating margin, it is a signal of a consumer advantage (Section 9.1.1). X's 22 percent margin is the highest."},"trap":{"a":"True but supports the other advantage","b":"","c":"False statement","d":"False statement","e":""}},{"id":"T6F4","lo":8,"type":"single","text":"Which company faces the greatest level of opportunity related to green chemistry, when each company's revenue from green chemistry products is compared on a normalized basis?","options":{"a":"Company X","b":"Company W","c":"Company Y","d":"Company Z"},"answer":["d"],"expl":{"a":"Incorrect. X earns 28.0 percent of its revenue from green chemistry products, below Z's 35.0 percent.","b":"Incorrect. W earns 10.0 percent, the lowest share.","c":"Incorrect. Y has the largest absolute green chemistry revenue ($2,520 million), but only 18.0 percent of its revenue; absolute values reflect scale (Section 4.1).","d":"CORRECT. Normalized by total revenue, Z earns 35.0 percent from green chemistry products, the highest share (Sections 4.2 and 7.1)."},"trap":{"a":"Second-highest share","b":"Lowest share","c":"Largest absolute figure","d":""}},{"id":"T6F5","lo":6,"type":"single","text":"Assuming normal distribution, Company X's percent of water consumed in stressed regions (20 percent) is lower than approximately what percentage of the ten peers?","options":{"a":"16%","b":"50%","c":"84%","d":"68%"},"answer":["c"],"expl":{"a":"Incorrect. About 16 percent of peers have a lower share than X; X is higher than that share, not lower, so 16 percent answers the opposite question.","b":"Incorrect. 50 percent would apply if X were at the mean (28 percent).","c":"CORRECT. (20 − 28) ÷ 8 = −1.0 standard deviations. About 84 percent of values lie above one standard deviation below the mean, so X is lower than about 84 percent of peers (Section 5.2).","d":"Incorrect. 68 percent is the share within one standard deviation on either side of the mean."},"trap":{"a":"Share of peers below X, not above X","b":"At the mean","c":"","d":"Two-sided one-SD share"}}]},{"id":"T6G","title":"Case 7: Restaurants Industry","built":"Augments Practice Case 7 (Restaurants): same question types on food safety oversight and data distribution","body":"<p>Companies in the Restaurants industry prepare meals for immediate consumption using models from fast food to full service. Food safety is of utmost importance because of its long-term impact on brand value. Complex global supply chains and franchising, where owners do not manage daily operations, make it difficult to ensure food safety. Reputational damage from food safety issues tends to have a long-term impact and affects a company across most of its locations. Regulators in the region inspect restaurants (not ingredient sourcing), publish the inspection results, and can close restaurants; customers increasingly choose where to eat using the posted results, and closures and litigation costs appear in the companies' financial statements.</p>\n<p>Six companies report the following. The companies operate in the same region and source ingredients from the same limited pool of suppliers that meet food-safety standards.</p>\n<table><thead><tr><th>Company</th><th>Percentage of restaurants inspected by a food safety oversight body</th><th>Percentage of inspected restaurants receiving critical violations</th><th>Restaurants temporarily closed after food-safety incidents</th><th>Number of company-owned restaurants</th><th>Number of franchised restaurants</th></tr></thead><tbody>\n<tr><td>Company P</td><td>95%</td><td>3.5%</td><td>4</td><td>800</td><td>4,200</td></tr>\n<tr><td>Company Q</td><td>60%</td><td>5.5%</td><td>31</td><td>1,500</td><td>0</td></tr>\n<tr><td>Company R</td><td>100%</td><td>2.0%</td><td>0</td><td>300</td><td>5,700</td></tr>\n<tr><td>Company S</td><td>70%</td><td>6.0%</td><td>12</td><td>2,200</td><td>900</td></tr>\n<tr><td>Company T</td><td>85%</td><td>3.0%</td><td>0</td><td>400</td><td>100</td></tr>\n<tr><td>Company U</td><td>90%</td><td>4.0%</td><td>1</td><td>150</td><td>0</td></tr>\n<tr><td>Mean</td><td>83%</td><td>4.0%</td><td>8.0</td><td>892</td><td>1,817</td></tr>\n<tr><td>Median</td><td>88%</td><td>3.8%</td><td>2.5</td><td>600</td><td>500</td></tr>\n<tr><td>Standard deviation</td><td>15.4</td><td>1.5</td><td>12.1</td><td>804</td><td>2,496</td></tr>\n</tbody></table>","questions":[{"id":"T6G1","lo":9,"type":"single","text":"For the issue of food safety, which of the following accurately links the ESG metric to the channel of financial impact it affects?","options":{"a":"Percentage of restaurants inspected by a food safety oversight body: tangible assets","b":"Restaurants temporarily closed after food-safety incidents: revenues","c":"Number of franchised restaurants: contingent liabilities","d":"Percentage of inspected restaurants receiving critical violations: turnover ratio"},"answer":["b"],"expl":{"a":"Incorrect. The inspection percentage describes oversight coverage; the case describes no link to the value of physical assets (Section 8.2.1.3).","b":"CORRECT. Closed restaurants earn no sales, and food safety harms demand and revenue (Section 8.2.1.1).","c":"Incorrect. The number of franchised restaurants is an activity metric describing structure, not a performance metric tied to liabilities (Section 4.2).","d":"Incorrect. Turnover ratio is a component of ROIC used to assess competitive advantage (Section 9.1.1), not a channel of financial impact (Section 8.2)."},"trap":{"a":"Oversight coverage is not an asset measure","b":"","c":"Activity metric treated as a liability driver","d":"ROIC component mistaken for a channel"}},{"id":"T6G2","lo":2,"type":"multi","text":"Based on the case, performance on sourcing ingredients to food-safety standards is largely influenced by which two components of a company's operating environment? (Choose two.)","options":{"a":"Business climate","b":"Operating location(s)","c":"Monetary climate","d":"Regulatory climate","e":"Economic climate"},"answer":["a","b"],"expl":{"a":"CORRECT. Business climate includes competitive forces and the expectations of non-investor stakeholders such as customers (Section 1.2.2.1); the case says customers increasingly choose where to eat using posted inspection results, so companies compete on their standing.","b":"CORRECT. Operating location captures the physical and resource conditions where a company operates (Section 1.2.2.4); the case says all six draw on the same limited regional pool of suppliers that meet food-safety standards.","c":"Incorrect. Monetary climate is not one of the four components of the operating environment (Section 1.2.2).","d":"Incorrect. The case describes inspections of restaurants and closures, but not any regulation of how ingredients are sourced; sourcing is shaped by customer expectations and supplier availability.","e":"Incorrect. Economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2); the case describes none."},"trap":{"a":"","b":"","c":"Not a component of the framework","d":"Inspection regime does not govern sourcing","e":"No economic factor described"}},{"id":"T6G3","lo":6,"type":"single","text":"Assuming normal distribution, Company Q has a greater percentage of inspected restaurants receiving critical violations than approximately what percent of its peers?","options":{"a":"68.2%","b":"84.1%","c":"50.0%","d":"97.5%"},"answer":["b"],"expl":{"a":"Incorrect. 68.2 percent is the share within one standard deviation on either side of the mean, not the share below Q's position.","b":"CORRECT. (5.5 − 4.0) ÷ 1.5 = 1.0 standard deviation above the mean. About 84.1 percent of values lie below one standard deviation above the mean (2.1% + 13.6% + 34.1% + 34.1%), so Q's violation rate exceeds that of about 84 percent of its peers (Section 5.2). Higher is worse for this metric.","c":"Incorrect. 50 percent would apply at the mean (4.0 percent).","d":"Incorrect. 97.5 percent would apply at two standard deviations above the mean (about 7.0 percent)."},"trap":{"a":"Two-sided one-SD share","b":"","c":"At the mean","d":"Two SD, not one"}},{"id":"T6G4","lo":6,"type":"single","text":"How should the distribution of \"Restaurants temporarily closed after food-safety incidents\" be described?","options":{"a":"Symmetrical","b":"Negatively skewed","c":"Normal","d":"Positively skewed"},"answer":["d"],"expl":{"a":"Incorrect. A symmetrical distribution has the attributes of a normal distribution, including equal mean and median (Section 5.3.2).","b":"Incorrect. A negatively skewed distribution has a mean below the median (Section 5.3.2).","c":"Incorrect. A normal distribution has equal mean and median; here they differ widely.","d":"CORRECT. A mean (8) above the median (2.5) indicates a positively skewed distribution, in which a few high values pull the mean up (Section 5.3.2)."},"trap":{"a":"Mean and median differ","b":"Skew label reversed","c":"Mean and median differ","d":""}},{"id":"T6G5","lo":4,"type":"multi","text":"Which three of the five factors lend the most insight into the way food safety affects the financial performance of these companies? (Choose three.)","options":{"a":"Industry norms, best practices, and competitive drivers","b":"Legal, regulatory, and policy drivers","c":"Stakeholder concerns and social trends","d":"Direct financial impacts and risk","e":"Opportunities for innovation"},"answer":["b","c","d"],"expl":{"a":"Incorrect. This factor concerns how peers manage or disclose an issue (Section 3.1); the case describes no peer practice in managing or disclosing food safety.","b":"CORRECT. Regulators publish inspection results and can close restaurants (Section 3.1).","c":"CORRECT. Customers increasingly choose where to eat using posted inspection results, a social trend that shifts demand (Section 3.1).","d":"CORRECT. Closures and litigation costs appear in the financial statements (Section 3.1).","e":"Incorrect. The case describes no new technology or product advantage (Section 3.1)."},"trap":{"a":"Common practice does not differentiate","b":"","c":"","d":"","e":"No innovation evidence"}}]},{"id":"T6H","title":"Case 8: Solar Technology & Project Developers Industry","built":"Augments Practice Case 8 (Solar Technology & Project Developers): same question types, new companies and data","body":"<p>Companies in the Solar Technology & Project Developers industry manufacture solar energy equipment and may also develop, build, and manage solar projects. Manufacturing uses hazardous substances, which are costly to handle and dispose of, alongside reusable materials with high economic value. Handling and disposal of hazardous waste increases operating costs, and spills create cleanup costs. Product take-back and recycling require upfront investment but can increase revenues and lower long-term costs by reusing recovered materials. Project development depends on securing environmental permits, and difficult permitting can slow development and cause lost revenues or higher costs.</p>\n<p>Company J and Company K manufacture solar equipment. Company L develops utility-scale solar projects and buys its panels from third-party manufacturers; it does not manufacture. All three operate where hazardous waste disposal is highly regulated.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company J</th><th colspan=\"2\">Company K</th><th colspan=\"2\">Company L</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Hazardous waste generated (metric tons)</td><td>6,000</td><td>6,200</td><td>3,000</td><td>3,300</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Percent of hazardous waste recycled</td><td>50%</td><td>70%</td><td>80%</td><td>80%</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Reportable spills: number; aggregate quantity (metric tons); quantity recovered (metric tons)</td><td>0; 0; 0</td><td>1; 900; 300</td><td>3; 60; 50</td><td>4; 75; 66</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>End-of-life material recovered (metric tons)</td><td>2,000</td><td>2,800</td><td>2,400</td><td>2,500</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Cost of take-back program ($ millions)</td><td>14</td><td>18</td><td>12</td><td>12.5</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Revenue from recovered materials ($ millions)</td><td>6</td><td>11</td><td>9</td><td>9.5</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Number and duration of project delays related to ecological impacts</td><td>n.a.</td><td>n.a.</td><td>n.a.</td><td>n.a.</td><td>2; 40 days</td><td>1; 15 days</td></tr>\n<tr><td>Revenue ($ millions)</td><td>2,100</td><td>2,300</td><td>1,500</td><td>1,550</td><td>1,900</td><td>2,000</td></tr>\n</tbody></table>","questions":[{"id":"T6H1","lo":1,"type":"single","text":"Why is the issue of waste and hazardous materials management relevant to Company J and not to Company L?","options":{"a":"Company L earns a significant share of its revenue from the project delays it reports","b":"Company J earns its revenue from manufacturing, an activity that generates hazardous waste","c":"Company J operates in a jurisdiction where hazardous waste disposal is highly regulated","d":"Company L did not report any hazardous waste generated in either of the two years"},"answer":["b"],"expl":{"a":"Incorrect. Project delays are a cost to L, not a revenue source.","b":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1). Manufacturing generates hazardous waste; Company L develops projects and buys its panels, so the topic is not material to it.","c":"Incorrect. The case states that all three companies operate where disposal is highly regulated, so this does not distinguish J from L.","d":"Incorrect. The relevance of an issue is not determined by whether a company discloses it."},"trap":{"a":"Cost mistaken for revenue","b":"","c":"True of all three companies","d":"Disclosure mistaken for relevance"}},{"id":"T6H2","lo":8,"type":"multi","text":"Which two statements accurately characterize the financial impacts associated with reportable spills for Companies J and K? (Choose two.)","options":{"a":"J's single spill indicates a high likelihood of similar events","b":"J's Year 2 spill is an acute event with a potentially high-magnitude impact","c":"K's spills are a recurring, progressive operating cost","d":"K's spills carry low likelihood because each is small","e":"Both companies face progressive impacts because both reported spills"},"answer":["b","c"],"expl":{"a":"Incorrect. A single spill after a year with none indicates an infrequent event, not a high likelihood.","b":"CORRECT. A single large spill is a one-time event typically with high magnitude and low likelihood, which is acute (Section 7.2.2).","c":"CORRECT. Spills every year point to high-likelihood, lower-magnitude impacts that accrue as a cost of doing business, which is progressive (Sections 7.2.1.1 and 7.2.2).","d":"Incorrect. Time-series data indicate likelihood; four spills in a year indicates high likelihood, not low.","e":"Incorrect. J's single large spill is acute, not progressive."},"trap":{"a":"One event mistaken for a pattern","b":"","c":"","d":"Size mistaken for likelihood","e":"Both companies grouped together"}},{"id":"T6H3","lo":7,"type":"single","text":"A user concludes that Company K is better positioned than Company J related to product take-back practices. What evidence supports this conclusion?","options":{"a":"J's cost of take-back rose in Year 2, demonstrating that J has lower capital expenditures","b":"J's weight of end-of-life material recovered is increasing at a greater rate, representing higher waste management costs","c":"K spends less per metric ton of end-of-life material recovered, demonstrating a greater ability to lower costs","d":"K's revenue from recovered materials is higher than J's in Year 2, demonstrating lower regulatory compliance costs"},"answer":["c"],"expl":{"a":"Incorrect. A rising cost of take-back indicates higher, not lower, spending.","b":"Incorrect. Faster growth in recovered material does not by itself represent higher costs; recovered material also earns revenue.","c":"CORRECT. K spent $12.5 million for 2,500 metric tons, about $5,000 per ton, against J's $18 million for 2,800 tons, about $6,429 per ton. Normalized cost per ton shows K's greater ability to lower costs (Sections 4.2 and 8.2.1.2).","d":"Incorrect. K's recovered-materials revenue ($9.5 million) is lower than J's ($11 million) in Year 2, and revenue does not show regulatory compliance costs."},"trap":{"a":"Higher cost mistaken for lower capital expenditure","b":"Growth in volume mistaken for higher cost","c":"","d":"Factually wrong and wrong inference"}},{"id":"T6H4","lo":9,"type":"multi","text":"Which two channels of financial impact are most directly affected by Company J's Year 2 spill? (Choose two.)","options":{"a":"Expenses","b":"Liabilities","c":"Tangible assets","d":"Cost of capital","e":"Revenues"},"answer":["a","b"],"expl":{"a":"CORRECT. Spills create cleanup costs, an operating cost (Section 8.2.1.2).","b":"CORRECT. A spill creates legal and regulatory risk and potential future obligations, such as fines and claims (Section 8.2.1.4).","c":"Incorrect. The case describes no impairment of J's facilities.","d":"Incorrect. A single spill is not described as changing investors' perception of J's risk (Section 8.2.2).","e":"Incorrect. The case describes no effect of the spill on sales."},"trap":{"a":"","b":"","c":"No asset effect described","d":"Not evidenced","e":"No sales effect described"}},{"id":"T6H5","lo":8,"type":"single","text":"Of the following metrics disclosed, which one captures performance related to an opportunity?","options":{"a":"Number and duration of project delays","b":"Aggregate quantity of reportable spills","c":"Amount of hazardous waste generated","d":"Revenue from recovered materials"},"answer":["d"],"expl":{"a":"Incorrect. More and longer delays threaten revenue and cost, so the metric measures a risk (Section 7.1).","b":"Incorrect. Higher spill quantities indicate greater threat to economic performance, so the metric measures a risk (Section 7.1).","c":"Incorrect. Higher hazardous waste indicates higher disposal cost, so it measures a risk (Section 7.1).","d":"CORRECT. Higher revenue from recovered materials indicates improved economic performance, the guide's test for an opportunity (Section 7.1)."},"trap":{"a":"Higher value means more delay","b":"Higher value means more risk","c":"Higher value means higher cost","d":""}}]},{"id":"T6I","title":"Case 9: Appliance Manufacturing Industry","built":"Augments Practice Case 9 (Appliance Manufacturing): same question types on distribution, factors, and channels","body":"<p>Companies in the Appliance Manufacturing industry design and manufacture household appliances and hand tools sold mainly through retail stores. Because appliances account for a large share of home energy and water use, consumers often buy with product efficiency and cost of ownership in mind and rely on third-party certifications such as Energy Star® and standards from the Association of Home Appliance Manufacturers (AHAM), which most peers adopt and report against; certification to these programs is voluntary. Product safety is critical: a malfunction can cause injury or property damage, exposing companies to litigation, and failure to report a known hazard can result in civil penalties. Companies that dedicate resources to quality control and testing can minimize malfunctions and recalls.</p>\n<p>Eight appliance manufacturers report the following Year 2 metrics. Company L and Company M are two of the eight. In Year 1, Company L's certified share was 70% and Company M's was 30%. Company M also has product-safety claims pending against it.</p>\n<table><thead><tr><th></th><th>Percentage of eligible products by revenue certified to Energy Star®</th><th>Monetary losses from legal proceedings associated with product safety (€ millions)</th></tr></thead><tbody>\n<tr><td>Company L</td><td>78%</td><td>1.4</td></tr>\n<tr><td>Company M</td><td>25%</td><td>3.6</td></tr>\n<tr><td>Mean (eight companies)</td><td>36%</td><td>1.4</td></tr>\n<tr><td>Median (eight companies)</td><td>30%</td><td>1.1</td></tr>\n<tr><td>Standard deviation (eight companies)</td><td>20</td><td>1.1</td></tr>\n</tbody></table>","questions":[{"id":"T6I1","lo":6,"type":"single","text":"An analyst comparing peer performance focuses on Company L to determine whether it is an outlier. How should the analyst describe Company L's performance, assuming normal distribution?","options":{"a":"L performs worse than about 97.5% of peers on Energy Star® certification, and about 50% of peers on legal losses","b":"L performs better than about 84% of peers on Energy Star® certification, and about 50% of peers on legal losses","c":"L performs better than about 97.5% of peers on Energy Star® certification, and about 50% of peers on legal losses","d":"L performs better than about 97.5% of peers on Energy Star® certification, and about 84% of peers on legal losses"},"answer":["c"],"expl":{"a":"Incorrect. Higher Energy Star® certification is better, so L performs better, not worse, than most peers.","b":"Incorrect. 84 percent applies at one standard deviation above the mean; L is above two.","c":"CORRECT. On certification, (78 − 36) ÷ 20 = +2.1 standard deviations, and higher is better, so L is better than about 97.5 percent of peers. On legal losses, 1.4 equals the mean, so L is at about the 50th percentile (Section 5.2).","d":"Incorrect. L's legal losses equal the mean (z = 0), so about 50 percent, not 84 percent, of peers have lower losses."},"trap":{"a":"Direction reversed","b":"One SD, not two","c":"","d":"Mean position misread"}},{"id":"T6I2","lo":4,"type":"multi","text":"A user is applying the five factors to understand how energy-efficiency certification affects the financial performance of Company L. Which two of the five factors lend the most insight? (Choose two.)","options":{"a":"Opportunities for innovation","b":"Stakeholder concerns and social trends","c":"Direct financial impacts and risk","d":"Industry norms, best practices, and competitive drivers","e":"Legal, regulatory, and policy drivers"},"answer":["b","d"],"expl":{"a":"Incorrect. The case describes no new technology or product development related to certification (Section 3.1).","b":"CORRECT. The case says consumers buy with efficiency and cost of ownership in mind and rely on third-party certifications, so customer interests shift demand (Section 3.1).","c":"Incorrect. The case describes no cost of certification captured in an existing line item; L's legal losses concern product safety, not certification (Section 3.1).","d":"CORRECT. The case says most peers adopt and report against AHAM standards, a peer practice that shapes relative performance (Section 3.1).","e":"Incorrect. The case states that certification to these programs is voluntary, so no regulation or policy drives it (Section 3.1)."},"trap":{"a":"No innovation evidence","b":"","c":"No certification cost described","d":"","e":"Certification is voluntary"}},{"id":"T6I3","lo":9,"type":"multi","text":"Which two channels of financial impact are most directly affected by Company M's monetary losses from product-safety proceedings of €3.6 million, together with its pending claims? (Choose two.)","options":{"a":"Tangible assets","b":"Cost of capital","c":"Expenses","d":"Liabilities","e":"Revenues"},"answer":["c","d"],"expl":{"a":"Incorrect. The case describes no impairment of equipment.","b":"Incorrect. Losses of this size are not described as changing investors' perception of M's risk.","c":"CORRECT. Losses already incurred from legal proceedings are fines and settlements, a direct cost (Sections 3.1 and 8.2.1.2).","d":"CORRECT. Pending claims are a legal risk and potential future obligation (Section 8.2.1.4).","e":"Incorrect. The case describes no effect of the proceedings on sales."},"trap":{"a":"No asset effect described","b":"Not evidenced","c":"","d":"","e":"No sales effect described"}},{"id":"T6I4","lo":7,"type":"single","text":"Company L's Energy Star® share rose from 70 to 78 percent while Company M's fell from 30 to 25 percent, as the share of consumers who rely on certifications grows. Which conclusion is best supported?","options":{"a":"L's advantage is acute, because it arose from a single change in certification","b":"L is better positioned than M to capture demand from efficiency-minded consumers","c":"L and M are equally positioned, because both operate in the same industry","d":"M is better positioned than L, because a lower share means less exposure to certification costs"},"answer":["b"],"expl":{"a":"Incorrect. A rising share over time reflects a gradual trend, not a single event.","b":"CORRECT. Consumers rely on certifications, and L has a high and rising certified share while M's is low and falling, so L is better placed to capture that demand (Sections 6.1 and 8.2.3).","c":"Incorrect. Operating in the same industry does not make performance equal; the data differ sharply.","d":"Incorrect. The case describes no certification cost that would favor a low share; the share reflects consumer demand."},"trap":{"a":"Gradual trend mistaken for acute event","b":"","c":"Industry profile applied without performance","d":"Low share mistaken for low cost exposure"}}]},{"id":"T6J","title":"Case 10: Electric Utilities & Power Generators Industry (revenue streams and inputs)","built":"Built on the guide's revenue-stream and main-input passages and their Questions for Analysis (Sections 1.2.1.1, 1.2.1.2, 1.2.2.4)","body":"<p>Companies in the Electric Utilities & Power Generators industry generate electricity, build, own, and operate transmission and distribution lines, and sell electricity to end users. A company may provide only transmission services, in which case disclosure topics aimed at capturing the sustainability performance of electricity generation activities likely will not apply.</p>\n<p>Company M transmits electricity on behalf of generators and distributors and operates no generation. Company N generates electricity, sells it to end users, and also operates a small transmission network. Company N outsources all line maintenance and vegetation management to contractors, whereas most peers employ their own crews. A large share of Company M's transmission lines crosses a region that experiences frequent wildfires.</p>\n<table><thead><tr><th></th><th>Company M</th><th>Company N</th></tr></thead><tbody>\n<tr><td>Revenue from electricity sales (€ billions)</td><td>0</td><td>18</td></tr>\n<tr><td>Revenue from transmission services (€ billions)</td><td>15</td><td>3</td></tr>\n<tr><td>Total revenue (€ billions)</td><td>15</td><td>21</td></tr>\n<tr><td>Percent of line maintenance outsourced to contractors</td><td>10%</td><td>100%</td></tr>\n<tr><td>Percent of transmission lines in wildfire-prone regions</td><td>55%</td><td>8%</td></tr>\n</tbody></table>","questions":[{"id":"T6J1","lo":1,"type":"single","text":"Which statement about the sustainability topics relevant to Company M is best supported by its revenue streams?","options":{"a":"Topics aimed at electricity generation, such as the fuel mix, likely do not apply to Company M at all","b":"Company M should likely omit every topic in the Electric Utilities & Power Generators Standard","c":"All topics in the industry Standard apply equally to Company M and Company N, as both are utilities","d":"Company M should likely add topics from the Oil & Gas – Midstream Standard to its evaluation"},"answer":["a"],"expl":{"a":"CORRECT. Major revenue streams show whether all topics in an industry Standard are relevant to a company (Section 1.2.1.1). M earns all of its revenue from transmission services, so topics that capture generation activities likely do not apply.","b":"Incorrect. Transmission and distribution topics in the Standard still apply to M; only generation-specific topics are likely omitted.","c":"Incorrect. Relevance depends on a company's revenue streams and inputs, not only on its industry classification (Sections 1.2.1.1 and 1.2.1.2).","d":"Incorrect. The guide's additional-Standard logic applies to significant revenue streams outside the industry; M's revenue is entirely within its own industry's transmission activity."},"trap":{"a":"","b":"Over-correction: omits applicable topics","c":"Industry classification applied without revenue streams","d":"Additional Standard without outside revenue"}},{"id":"T6J2","lo":1,"type":"single","text":"How does Company N's decision to outsource all line maintenance change the sustainability topics a user evaluates for N relative to peers that employ their own crews?","options":{"a":"The topics are unchanged, because relevance depends only on the industry Standard that N falls under","b":"Employee health and safety becomes more relevant, because outsourced line work is more hazardous to N","c":"Labor practices become more relevant, because the contractors' crews are counted as N's own employees","d":"Supply chain management becomes more relevant, while workforce safety metrics apply less to N's employees"},"answer":["d"],"expl":{"a":"Incorrect. The guide states that a company's inputs can make topics more or less relevant than the Standard assumes (Section 1.2.1.2).","b":"Incorrect. The workforce is not N's own, so direct safety metrics apply less; the hazard of the work does not change who bears the reporting responsibility.","c":"Incorrect. Contractors are not N's employees; their labor conditions are a supplier matter.","d":"CORRECT. Main inputs for value creation are an internal factor (Section 1.2.1.2). A company that relies on atypical inputs may find that some topics are less relevant and others more; as in the guide's example of outsourced manufacturing, N does not control its contractors' workplaces, so supplier management becomes more relevant than direct workforce metrics."},"trap":{"a":"Standard applied without internal factors","b":"Hazard confused with control","c":"Contractors treated as employees","d":""}},{"id":"T6J3","lo":2,"type":"single","text":"Which component of external operating context, and which sustainability issue, are most relevant to the exposure of Company M's transmission lines?","options":{"a":"Operating location(s); Physical Impacts of Climate Change","b":"Business climate; Competitive Behavior","c":"Economic climate; Business Model Resilience","d":"Regulatory climate; Management of the Legal & Regulatory Environment"},"answer":["a"],"expl":{"a":"CORRECT. Operating location captures the physical environment of operations and the company's differentiated exposure to the physical risks of climate change (Section 1.2.2.4). Physical Impacts of Climate Change addresses the direct exposure of owned assets to extreme weather (Section 2.1.4); 55 percent of M's lines are in wildfire-prone regions.","b":"Incorrect. The case describes no competitive dynamics; Competitive Behavior concerns anti-competitive practices (Section 2.1.5).","c":"Incorrect. The case describes no economic condition; Business Model Resilience concerns adaptation to transitions such as decarbonization (Section 2.1.4).","d":"Incorrect. The case describes no regulatory difference; the exposure is physical."},"trap":{"a":"","b":"Wrong climate component and issue","c":"Wrong climate component and issue","d":"Exposure is physical, not regulatory"}}]},{"id":"T6K","title":"Case 11: Hotels & Lodging Industry (issue categories)","built":"Built on the guide's Chapter 2 Check Your Understanding distinctions (Labor Practices vs. Employee Health & Safety; Customer Privacy vs. Data Security; Ecological Impacts)","body":"<p>Company Q operates beach resorts and an online booking platform that stores guest data. Hotels & Lodging companies rely heavily on human capital, and a large share of staff are part-time or seasonal. Company Q reports the following metrics under several disclosure topics. In Year 2, Company Q expanded a resort onto coastal wetland; regulators required restoration of part of the wetland, and the expansion's environmental permits were delayed for eleven months.</p>\n<table><thead><tr><th>Metric reported by Company Q</th><th>Year 1</th><th>Year 2</th></tr></thead><tbody>\n<tr><td>Voluntary turnover rate</td><td>38%</td><td>45%</td></tr>\n<tr><td>Average hourly wage (€)</td><td>11.20</td><td>11.40</td></tr>\n<tr><td>Total recordable incident rate (per 100 employees)</td><td>3.1</td><td>3.4</td></tr>\n<tr><td>Fatality rate</td><td>0</td><td>0</td></tr>\n<tr><td>Hours of safety training per employee</td><td>6</td><td>5</td></tr>\n<tr><td>Number of data breaches</td><td>0</td><td>1</td></tr>\n<tr><td>Number of guests whose information is used for secondary purposes (thousands)</td><td>210</td><td>340</td></tr>\n<tr><td>Description of approach to identifying and addressing data security vulnerabilities</td><td colspan=\"2\">Annual penetration testing; incident response plan</td></tr>\n</tbody></table>","questions":[{"id":"T6K1","lo":3,"type":"multi","text":"Which two of Company Q's metrics capture performance on Labor Practices rather than Employee Health & Safety? (Choose two.)","options":{"a":"Average hourly wage","b":"Voluntary turnover rate","c":"Fatality rate","d":"Total recordable incident rate","e":"Hours of safety training per employee"},"answer":["a","b"],"expl":{"a":"CORRECT. Wages and compensation are Labor Practices metrics (Section 2.1.3).","b":"CORRECT. Labor Practices metrics capture wages and compensation, collective bargaining, strikes and lockouts, turnover, and more (Section 2.1.3).","c":"Incorrect. Fatality rate is an Employee Health & Safety metric (Section 2.1.3).","d":"Incorrect. Employee Health & Safety metrics capture injury and fatality rates and processes to mitigate physical risks (Section 2.1.3).","e":"Incorrect. Safety training is a process to mitigate physical risk, an Employee Health & Safety measure (Section 2.1.3)."},"trap":{"a":"","b":"","c":"Same dimension, adjacent issue","d":"Same dimension, adjacent issue","e":"Same dimension, adjacent issue"}},{"id":"T6K2","lo":3,"type":"multi","text":"Which two of the following capture performance on Data Security rather than Customer Privacy? (Choose two.)","options":{"a":"Percentage of marketing messages targeted using guests' behavioral data","b":"Description of approach to identifying and addressing data security vulnerabilities","c":"Number of guests whose information is used for secondary purposes","d":"Monetary losses from legal proceedings associated with customer privacy","e":"Number of data breaches"},"answer":["b","e"],"expl":{"a":"Incorrect. Targeting using behavioral data concerns how customer data is used, which is Customer Privacy (Section 2.1.2).","b":"CORRECT. A description of how the company identifies and addresses security vulnerabilities addresses protection from external threats (Section 2.1.2).","c":"Incorrect. Use of information for secondary purposes concerns how data collected from customers is used, which is Customer Privacy (Section 2.1.2).","d":"Incorrect. Losses associated with customer privacy relate to Customer Privacy by definition (Section 2.1.2).","e":"CORRECT. Data Security concerns how companies protect data from external threats such as malware and hacking (Section 2.1.2); breaches are its core measure."},"trap":{"a":"Use of data, not protection","b":"","c":"Use of data, not protection","d":"Privacy by definition","e":""}},{"id":"T6K3","lo":3,"type":"single","text":"Company Q's required wetland restoration and eleven-month permit delay reflect exposure to which general issue category?","options":{"a":"Ecological Impacts","b":"Waste & Hazardous Materials Management","c":"Water & Wastewater Management","d":"Physical Impacts of Climate Change"},"answer":["a"],"expl":{"a":"CORRECT. Ecological Impacts encapsulates the productivity of the natural environment: companies that modify natural resources such as water or soil, as an input or by-product of operations, can experience operational risks and costs that harm long-term performance (Section 2.1.1). Conversion of wetland and the resulting restoration and permitting delay fit this definition.","b":"Incorrect. Waste & Hazardous Materials Management concerns waste generated in operations, which the case does not describe.","c":"Incorrect. Water & Wastewater Management concerns water withdrawal, consumption, and discharge, which the case does not describe.","d":"Incorrect. Physical Impacts of Climate Change concerns exposure of assets to extreme weather and changing climate conditions (Section 2.1.4); the case describes a company's own impact on land."},"trap":{"a":"","b":"Not described","c":"Water mentioned but not withdrawal or discharge","d":"Own impact mistaken for exposure to climate"}}]},{"id":"T6L","title":"Case 12: Iron & Steel Producers Industry (cost of capital)","built":"Built on the guide's cost of capital passages and Questions for Analysis (Sections 8.2.2, 8.2.2.1, 8.2.2.2)","body":"<p>Companies in the Iron & Steel Producers industry use large amounts of natural capital inputs, including water, in production. Operations in areas with High Baseline Water Stress are more susceptible to supply disruptions and price instability, and the percentage of water recycled indicates how efficiently a company uses water in the face of such risks. Lenders increasingly integrate a borrower's sustainability performance into credit ratings, eligibility screens, and deal terms.</p>\n<p>Company S has a sustainability-linked loan: its interest margin rises by 25 basis points if its Scope 1 emissions intensity target for Year 3 is missed. Company T issued a green bond whose proceeds are allocated entirely to a specific solar project at one of its plants. Company S has no operations in water-stressed regions and recycles most of its water.</p>\n<table><thead><tr><th></th><th>Company S</th><th>Company T</th></tr></thead><tbody>\n<tr><td>Scope 1 emissions intensity, Year 1 (metric tons CO₂e per metric ton of steel)</td><td>1.95</td><td>2.05</td></tr>\n<tr><td>Scope 1 emissions intensity, Year 2</td><td>1.88</td><td>2.04</td></tr>\n<tr><td>Year 3 target in loan agreement</td><td>1.80</td><td>n.a.</td></tr>\n<tr><td>Percent of fresh water withdrawn that is recycled</td><td>92%</td><td>41%</td></tr>\n<tr><td>Percent of water withdrawn in regions with High Baseline Water Stress</td><td>0%</td><td>35%</td></tr>\n</tbody></table>","questions":[{"id":"T6L1","lo":9,"type":"single","text":"Which statement correctly distinguishes Company S's loan from Company T's green bond?","options":{"a":"Both instruments tie the borrower's own financially material performance to its cost of debt through KPIs","b":"S's loan ties the borrower's own material performance to its cost of debt, while T's bond funds one project","c":"Both instruments fund specific projects, so neither ties the borrower's own performance to its cost of debt","d":"Neither instrument can affect cost of capital, because debt terms are independent of sustainability performance"},"answer":["b"],"expl":{"a":"Incorrect. A green bond funds projects; it does not tie the borrower's overall performance to its interest rate.","b":"CORRECT. Sustainability-linked debt incentivizes the borrower's own sustainability performance through KPIs relevant to business performance, while a thematic green bond typically funds specific projects with sustainability outcomes (Section 8.2.2.2).","c":"Incorrect. A sustainability-linked loan such as S's does tie the borrower's own performance to its cost of debt through a financially material KPI (Section 8.2.2.2).","d":"Incorrect. The guide describes sustainability-linked debt as explicitly tying cost of debt to ESG performance, and notes lenders integrate sustainability into terms generally."},"trap":{"a":"Green bond conflated with linked debt","b":"","c":"Ignores the performance link in S's loan","d":"Contradicts the guide"}},{"id":"T6L2","lo":9,"type":"multi","text":"Which two statements about the water disclosures of Company S are consistent with the guide? (Choose two.)","options":{"a":"An analyst may consider S's operations stable and adjust its asset beta down, lowering cost of equity","b":"T's 35 percent stressed-region withdrawal could lower T's cost of equity by showing active water use","c":"Lenders may reward S's stable risk profile in setting terms, since it discloses performance linked to risk","d":"Water performance cannot affect cost of capital, because water is only an operating issue for steel","e":"S's higher recycling percentage can raise its revenue projections directly, since less water is wasted"},"answer":["a","c"],"expl":{"a":"CORRECT. The guide's own example states that a company recycling a high percentage of water with no operations in stressed regions may be considered stable, supporting a lower asset beta and cost of equity (Section 8.2.2.1).","b":"Incorrect. Exposure to stressed regions raises supply and price risk, which would raise, not lower, T's cost of equity.","c":"CORRECT. The guide states that lenders reward companies that disclose performance on ESG measures directly linked to risk profile (Section 8.2.2.2).","d":"Incorrect. The guide's example shows water performance informing beta and cost of equity (Section 8.2.2.1).","e":"Incorrect. The channel is risk and cost of capital, not a direct revenue effect (Section 8.2.2)."},"trap":{"a":"","b":"Direction reversed","c":"","d":"Contradicts the guide's example","e":"Wrong channel"}},{"id":"T6L3","lo":10,"type":"single","text":"If Company S misses its Year 3 emissions-intensity target, which valuation input does the 25 basis point step-up most directly inform?","options":{"a":"Long-term growth rate","b":"Revenue projections","c":"Discount rate","d":"Operating expense projections"},"answer":["c"],"expl":{"a":"Incorrect. Growth rate reflects position in expanding markets (Section 8.2.3), not the price of debt.","b":"Incorrect. The step-up does not change sales.","c":"CORRECT. The step-up raises S's cost of debt, a component of weighted average cost of capital, and cost of capital impacts are almost always reflected in an adjustment to the discount rate (Section 8.2.2).","d":"Incorrect. Interest costs sit in the financing structure; the guide treats this impact as a cost of capital effect, reflected in the discount rate (Section 8.2.2)."},"trap":{"a":"Market position, not price of debt","b":"No sales effect","c":"","d":"Cost of debt treated as operating expense"}}]},{"id":"T6M","title":"Case 13: Automobiles Industry (technology, inputs, and the five factors)","built":"Built on the guide's Questions for Analysis on business climate, inputs, and the five factors (Sections 1.2.1.2, 1.2.2.1, 3.1)","body":"<p>Companies in the Automobiles industry use significant amounts of steel, iron, aluminum, and plastics, and also rely on critical materials, whose shortages and price volatility can disrupt production. Fuel economy regulation requires a minimum sales-weighted fleet average, and both companies below sell in a region where the minimum is 18 km/L today and 20 km/L in two years. Falling battery costs, a technological advance, have caused electric vehicles to take a rising share of new vehicle sales in this region.</p>\n<p>Company V has begun producing electric vehicles, which rely on lithium and cobalt, and meets the fuel economy minimum. Company W produces only conventional vehicles using steel and aluminum and does not meet the coming minimum.</p>\n<table><thead><tr><th></th><th>Company V</th><th>Company W</th></tr></thead><tbody>\n<tr><td>Percent of revenue from electric vehicles</td><td>35%</td><td>0%</td></tr>\n<tr><td>Sales-weighted average fleet fuel economy (km/L)</td><td>24</td><td>17</td></tr>\n<tr><td>Percent of lithium and cobalt secured under long-term contracts</td><td>40%</td><td>n.a.</td></tr>\n</tbody></table>","questions":[{"id":"T6M1","lo":2,"type":"single","text":"Falling battery costs are shifting vehicle demand toward electric vehicles. Which component of the companies' external operating context does this technological advance reflect?","options":{"a":"Economic climate","b":"Regulatory climate","c":"Business climate","d":"Operating location(s)"},"answer":["c"],"expl":{"a":"Incorrect. Economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2); a technological advance is not one of these.","b":"Incorrect. Regulatory climate concerns regulation and enforcement (Section 1.2.2.3); the shift described is driven by battery costs, not by a rule.","c":"CORRECT. Business climate is defined by competitive forces and technological innovation shaping demand or supply, among other factors (Section 1.2.2.1).","d":"Incorrect. Operating location concerns physical conditions and resource access (Section 1.2.2.4)."},"trap":{"a":"Technology mistaken for macroeconomic condition","b":"Regulation present but not the driver here","c":"","d":"Physical, not technological"}},{"id":"T6M2","lo":1,"type":"single","text":"How do the companies' main inputs change which topics are most relevant to each?","options":{"a":"Product Design & Lifecycle Management is equally relevant to both, because both sell vehicles","b":"Supply Chain Management is less relevant to V, because its critical materials are mined by suppliers","c":"Materials Sourcing & Efficiency is more relevant to W, because it relies on steel and aluminum","d":"Materials Sourcing & Efficiency is more relevant to V, because it relies on lithium and cobalt"},"answer":["d"],"expl":{"a":"Incorrect. The companies differ sharply in product mix and regulatory position, so the topic is not equally relevant.","b":"Incorrect. Reliance on suppliers increases, not decreases, the relevance of how suppliers are managed (Section 2.1.4).","c":"Incorrect. Steel and aluminum are inputs for both companies; the distinguishing input is V's reliance on critical materials.","d":"CORRECT. Main inputs for value creation are an internal factor (Section 1.2.1.2). V's heavy reliance on critical materials exposes it to shortages and price volatility, the focus of Materials Sourcing & Efficiency (Section 2.1.4)."},"trap":{"a":"Industry profile applied without differences","b":"Outsourcing logic reversed","c":"Common input mistaken for distinguishing input","d":""}},{"id":"T6M3","lo":4,"type":"multi","text":"An investor is preparing a dialogue with management about Company V's electric vehicle strategy. Which two of the five factors would most inform it? (Choose two.)","options":{"a":"Opportunities for innovation","b":"Industry norms, best practices, and competitive drivers","c":"Direct financial impacts and risk","d":"Legal, regulatory, and policy drivers","e":"Stakeholder concerns and social trends"},"answer":["a","d"],"expl":{"a":"CORRECT. Falling battery costs and V's electric vehicles are a technological advance giving competitive advantage through innovation (Section 3.1).","b":"Incorrect. The case does not describe how peers manage or disclose the issue (Section 3.1).","c":"Incorrect. The case describes no cost or loss captured in an existing line item (Section 3.1).","d":"CORRECT. The fuel economy minimum rises from 18 to 20 km/L in two years, an existing and tightening regulation that creates risk for W and opportunity for V (Section 3.1).","e":"Incorrect. The case attributes the shift in demand to falling battery costs, not to non-investor stakeholder concern (Section 3.1)."},"trap":{"a":"","b":"No peer evidence","c":"No direct cost described","d":"","e":"Demand shift attributed to technology, not concern"}}]}];

</script>
<script>
const TIME_LIMIT = 120*60; // real exam: 2 hours for 13 cases / 55 questions
const TESTS = {
  t1:{name:"Test 1", cases:CASES, note:"Cases 1–9 extend the study guide's practice cases; Cases 10–13 are industries the guide uses as worked examples."},
  t2:{name:"Test 2", cases:CASES2, note:"Cases 1–4 are built on the guide's four Putting It Into Practice studies; Cases 5–12 on industries from its worked examples; Case 13 revisits a practice-case industry with a different issue."},
  t3:{name:"Test 3", cases:CASES3, note:"Thirteen industries not used in Tests 1 or 2, each built on the guide's own worked example or dataset for that industry. Heavier on multi-select and on \"what can you conclude\" questions."},
  t6:{name:"Test 6", cases:CASES6, note:"Built from the study guide's own practice questions: nine augmented practice cases (same question types as the official Test Your Understanding items, with new companies, data, and often a different correct answer) plus four cases built from the guide's Questions for Analysis and Check Your Understanding. Option wording is balanced in length and built from common errors.", fresh:true},
  t5:{name:"Test 5", cases:CASES5, note:"Rebuilt answer options: near-equal length, parallel wording, and wrong answers built from the common errors the guide warns about (adjacent issue categories, realized versus potential impacts, absolute versus normalized data, valuation tools mistaken for channels). Review the \"tempting because\" notes after you submit.", fresh:true},
  t4:{name:"Test 4", cases:CASES4, note:"Thirteen further industries from the guide's worked examples and datasets, including its investment banking, pulp & paper, oil & gas and coal valuation examples. Weighted toward the five factors and risk-versus-opportunity judgment."}
};
["t2","t3","t4"].forEach(k=>{ TESTS[k].caution="In this paper the correct option is often visibly longer than the others, which makes it easier than the real exam. Treat the score as optimistic and use Test 5 as the realistic read."; });
TESTS.t1.caution="Answer options in this paper are less carefully balanced than in Test 5, so treat the score as slightly optimistic.";
let TEST="t1", ALLQ=[];
const state = {screen:"start", caseIdx:0, answers:{}, flags:{}, remaining:TIME_LIMIT, timer:null};
function setTest(t){ TEST=t; ALLQ=TESTS[t].cases.flatMap(c=>c.questions.map(q=>({...q,caseId:c.id}))); }
setTest("t1");
function skey(){ return "fsa-mock-"+TEST; }
function loadSaved(t){ try{ const s=localStorage.getItem("fsa-mock-"+t); if(s){ const o=JSON.parse(s); if(o && o.screen==="exam") return o; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem(skey(), JSON.stringify({screen:state.screen,caseIdx:state.caseIdx,answers:state.answers,flags:state.flags,remaining:state.remaining})); }catch(e){} }
const app=document.getElementById("app");
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const CASES_CUR=()=>TESTS[TEST].cases;
const SEED_RESULTS={ t3:{date:"4 Oct 2026",pct:91,correct:50,total:55,timeUsed:"103:48",byLO:{1:{c:4,n:4},2:{c:4,n:5},3:{c:5,n:6},4:{c:2,n:4},5:{c:7,n:7},6:{c:4,n:4},7:{c:5,n:5},8:{c:6,n:7},9:{c:8,n:8},10:{c:5,n:5}},missed:[1,4,10]}, t2:{date:"3 Oct 2026",pct:84,correct:46,total:55,timeUsed:"not recorded",byLO:{1:{c:4,n:4},2:{c:5,n:6},3:{c:6,n:6},4:{c:4,n:4},5:{c:7,n:8},6:{c:3,n:4},7:{c:2,n:4},8:{c:6,n:7},9:{c:5,n:7},10:{c:4,n:5}},missed:[3,5,8,12,13,19,24,36,40]}, t1:{date:"2 Oct 2026",pct:89,correct:49,total:55,timeUsed:"118:30",byLO:{1:{c:5,n:5},2:{c:5,n:5},3:{c:2,n:4},4:{c:4,n:5},5:{c:6,n:6},6:{c:5,n:6},7:{c:6,n:6},8:{c:4,n:4},9:{c:6,n:7},10:{c:6,n:7}},missed:[13,15,19,33,40,45]} };
function loadResult(t){ try{ const s=localStorage.getItem("fsa-result-"+t); if(s) return JSON.parse(s); }catch(e){} return SEED_RESULTS[t]||null; }
function saveResult(t,r){ try{ localStorage.setItem("fsa-result-"+t, JSON.stringify(r)); }catch(e){} }
function resultCard(t){ const r=loadResult(t); if(!r) return '<p class="muted">No attempts yet.</p>';
  const los=Object.keys(r.byLO).sort((a,b)=>a-b);
  return `<details><summary>Last attempt, ${r.date}: <strong>${r.pct}%</strong> (${r.correct} of ${r.total}, ${r.timeUsed})</summary>
   <div class="tablewrap"><table class="lo-table"><thead><tr><th>LO</th><th>Score</th><th></th></tr></thead><tbody>
   ${los.map(lo=>`<tr><td>${lo}. ${LO[lo]}</td><td>${r.byLO[lo].c}/${r.byLO[lo].n}</td><td><div class="bar-mini"><i style="width:${100*r.byLO[lo].c/r.byLO[lo].n}%"></i></div></td></tr>`).join("")}
   </tbody></table></div><p class="muted" style="font-size:.9rem">Missed: ${r.missed.length?r.missed.map(n=>"Q"+n).join(", "):"none"}</p></details>`; }

function render(){ if(state.screen==="start") renderStart(); else if(state.screen==="exam") renderExam(); else if(state.screen==="review") renderReview(); else renderResults(); window.scrollTo({top:0}); }

function renderStart(){
  const cards=Object.keys(TESTS).sort().map(t=>{ const saved=loadSaved(t); const n=TESTS[t].cases.flatMap(c=>c.questions).length;
    return `<div class="q"><h2>${TESTS[t].name}</h2><p class="muted">${TESTS[t].cases.length} cases, ${n} questions. ${TESTS[t].note}</p>
    ${TESTS[t].caution?`<p class="hint" style="border-left:3px solid var(--flag);padding-left:10px">${TESTS[t].caution}</p>`:''}
    ${resultCard(t)}
    <p style="margin-top:12px"><button class="btn" onclick="startExam('${t}')">${saved?"Resume "+TESTS[t].name:"Start "+TESTS[t].name}</button> ${saved?`<button class="btn secondary" onclick="resetTest('${t}')">Start over</button>`:''}</p></div>`; }).join("");
  app.innerHTML=`<div class="wrap"><div class="start">
  <h1>FSA Credential Level II<br>Full mock exams</h1>
  <ul>
    <li>Each test is <strong>2 hours</strong>, 13 cases, 55 questions, the same as the real exam. About 9 minutes per case.</li>
    <li>Multiple-answer questions (<em>choose two</em>, <em>choose three</em>) are all-or-nothing, as in the real exam: you must select every correct option and no incorrect one. Any missing or wrong selection scores zero.</li>
    <li>Nothing is revealed until you submit. Flag anything you want to revisit.</li>
    <li>Every question can be answered from the case text alone. No formulas or outside industry knowledge are needed; simple normalization arithmetic is.</li>
    <li>Progress is saved in this browser if you accidentally close the tab.</li>
  </ul>
  ${cards}
  </div></div>`;
}
function startExam(t){ setTest(t); const saved=loadSaved(t); state.answers={}; state.flags={}; state.remaining=TIME_LIMIT; state.caseIdx=0; if(saved){ Object.assign(state,saved); } state.screen="exam"; state.timer=null; startTimer(); render(); save(); }
function resetTest(t){ if(!confirm("Clear all answers for "+TESTS[t].name+" and start over?")) return; try{localStorage.removeItem("fsa-mock-"+t);}catch(e){} render(); }
function resetAll(){ if(state.timer){clearInterval(state.timer);state.timer=null;} try{localStorage.removeItem(skey());}catch(e){} state.answers={}; state.flags={}; state.remaining=TIME_LIMIT; state.caseIdx=0; state.screen="start"; render(); }
function startTimer(){ if(state.timer) return; state.timer=setInterval(()=>{ state.remaining--; const t=document.getElementById("timer"); if(t){ t.textContent=fmt(state.remaining); t.classList.toggle("low",state.remaining<300);} if(state.remaining%15===0) save(); if(state.remaining<=0){ clearInterval(state.timer); state.timer=null; alert("Time is up. Your answers will be submitted."); submit(); } },1000); }

function qNumber(id){ return ALLQ.findIndex(q=>q.id===id)+1; }
