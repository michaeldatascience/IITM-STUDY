<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSA Level II Mock Exam — Set 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1A2431; --ink2:#4B5765; --line:#D5DBE2;
  --accent:#0E5A6E; --accent-soft:#DDEEF1; --ok:#1F6B45; --ok-soft:#DFF1E6; --bad:#A83A2A; --bad-soft:#F6E1DC; --flag:#B7791F;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A21; --panel:#1D252E; --ink:#E8ECF0; --ink2:#A7B1BC; --line:#334050;
  --accent:#5FB8CB; --accent-soft:#1B3A42; --ok:#6CCB93; --ok-soft:#1B3527; --bad:#F0907C; --bad-soft:#3E211B; --flag:#E2B25B; }}
:root[data-theme="dark"]{
  --bg:#141A21; --panel:#1D252E; --ink:#E8ECF0; --ink2:#A7B1BC; --line:#334050;
  --accent:#5FB8CB; --accent-soft:#1B3A42; --ok:#6CCB93; --ok-soft:#1B3527; --bad:#F0907C; --bad-soft:#3E211B; --flag:#E2B25B; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.5;height:100%}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:500;font-size:2rem;line-height:1.2;margin:0 0 8px}
h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:500;font-size:1.35rem;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--ink2)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-weight:500}
.btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:focus-visible,.opt:focus-within,.navdot:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
/* start */
.start{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px;max-width:760px;margin:40px auto}
.start ul{padding-left:20px}
.start li{margin-bottom:6px}
/* exam header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--ink2)}
.tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;padding:6px 12px;border-radius:6px;border:1px solid var(--line)}
.timer.low{border-color:var(--bad);color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;font-family:"IBM Plex Serif",Georgia,serif;font-size:1.02rem;line-height:1.62;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:900px){.case{position:static;max-height:none}}
.case p{margin-bottom:14px}
.tablewrap{overflow-x:auto;margin:6px 0 16px}
table{border-collapse:collapse;font-family:"IBM Plex Sans",sans-serif;font-size:.86rem;min-width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--accent-soft);font-weight:600}
.built{font-family:"IBM Plex Sans",sans-serif;font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.q-num{font-weight:600;color:var(--accent)}
.flagbtn{background:none;border:0;color:var(--ink2);padding:2px 6px;border-radius:4px}
.flagbtn.on{color:var(--flag);font-weight:600}
.q-text{font-weight:500;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;flex:none;accent-color:var(--accent)}
.opt.chosen{background:var(--accent-soft);border-color:var(--accent)}
.opt .letter{font-weight:600;width:1.4em;flex:none}
.hint{font-size:.85rem;color:var(--ink2)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
/* review */
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.navdot{width:44px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:500}
.navdot.done{background:var(--accent-soft);border-color:var(--accent)}
.navdot.flag{box-shadow:inset 0 -4px 0 var(--flag)}
/* results */
.score{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 22px}
.big{font-family:"IBM Plex Serif",Georgia,serif;font-size:3.4rem;line-height:1}
.lo-table td:first-child{white-space:normal}
.lo-table td,.lo-table th{text-align:left}
.bar-mini{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}
.bar-mini i{display:block;height:100%;background:var(--ok)}
.r-opt{padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;display:flex;gap:12px}
.r-opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.r-opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.r-opt .tag{font-size:.78rem;font-weight:600;flex:none;width:8.5em;color:var(--ink2)}
.r-opt.correct .tag{color:var(--ok)}
.r-opt.wrong .tag{color:var(--bad)}
.r-opt .body{flex:1}
.r-opt .ex{margin-top:6px;font-size:.93rem;color:var(--ink2)}
.verdict{font-weight:600;padding:3px 10px;border-radius:4px;font-size:.85rem}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.lo-line{font-size:.85rem;color:var(--ink2);margin-top:10px}
details{margin:10px 0}
summary{cursor:pointer;color:var(--accent);font-weight:500}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LO={"1":"Evaluate a company's internal operating factors to determine useful changes to the sustainability topics identified in its industry standard","2":"Evaluate a company's external operating context to determine useful changes to the sustainability topics identified in its industry standard","3":"Differentiate general sustainability issues, their typical impacts on enterprise value, and interrelated impacts","4":"Evaluate how a sustainability issue can impact a company using the five factors","5":"Differentiate options for normalizing sustainability information","6":"Assess whether information about the dispersion of industry performance influences interpretation of a company's performance","7":"Compare industry peers' sustainability performance in light of external operating context and management decisions","8":"Associate sustainability accounting metrics with the type of financial impact they illuminate","9":"Evaluate the connection between performance on a SASB metric and its channel(s) of financial impact","10":"Translate performance on SASB metric(s) to valuation model adjustments"};
const CASES=[{"id":"A","title":"Case 1: Chemicals Industry","built":"Extends Practice Case 1 (Part I)","body":"<p>Companies in the Chemicals industry transform organic and inorganic chemicals into products for industrial, pharmaceutical, agricultural, and consumer uses. The industry is typically segmented into basic, agricultural, and specialty chemicals; companies sell mainly to other manufacturers, and demand is driven by economic conditions, industrial production, construction, and consumer spending. Companies compete on efficiencies, economies of scale, and the development of innovative products.</p>\n<p>The industry is heavily and unevenly regulated. National and local rules govern the release of substances during manufacturing, the toxicity of end products, and impacts on human and environmental health, and they vary widely across jurisdictions: several countries and states have banned or restricted genetically modified (GM) crops. Regulation is becoming progressively more stringent, and public concern over lifecycle impacts of chemical products is rising. Anticipating and adapting to regulatory developments can significantly affect product demand, manufacturing costs, and brand value, and increases the importance of innovation to create products with reduced externalities.</p>\n<p>Company A and Company B are global competitors in the agricultural chemicals sub-industry. Company A has developed biopesticides derived from natural, non-synthetic materials that are effective in small quantities and less likely to produce resistance, but are less proven, more costly, and require careful application. Company B has developed GM seed products that increase crop productivity, but may accelerate weed and insect resistance and may spread genes to non-GM plants with unknown ecological effects.</p>\n<p><strong>Company C</strong> is a diversified chemicals company. About 65 percent of its revenue comes from basic chemicals sold to industrial customers; the remaining 35 percent comes from a consumer cleaning-products division that sells branded household cleaners through mass-market retailers. Natural gas is Company C's principal energy source and feedstock. Unlike Companies A and B, whose production is highly automated, Company C relies on a large plant workforce that directly handles hazardous chemical intermediates.</p>\n<p>Company C's largest plants are located in a jurisdiction that recently enacted strict limits on nitrogen oxide and sulfur dioxide emissions from industrial sources. The limits are actively enforced and carry significant per-day penalties for exceedances. In Year 1, Company C paid $4.2 million in fines for exceedances and committed $60 million in capital expenditure to install emissions-control equipment. Companies A and B do not manufacture in that jurisdiction.</p>","questions":[{"id":"A1","lo":1,"type":"single","text":"Based on Company C's major revenue streams, how should a user adjust the set of sustainability topics evaluated for Company C?","options":{"a":"Replace the Chemicals Standard with the Standard for the consumer products industry, since branded products carry greater reputational risk","b":"Reference an additional industry Standard, because a significant revenue stream falls outside the typical Chemicals industry profile","c":"Evaluate only the topics in the Chemicals Standard, since basic chemicals is Company C's primary industry","d":"Evaluate topics from additional Standards only if Company C's operating location differs from that of its peers"},"answer":["b"],"expl":{"a":"Incorrect. Basic chemicals remain 65 percent of revenue, so the Chemicals Standard is not replaced; the additional Standard supplements it. The test in Section 1.2.1.1 is the source of revenue, not the reputational risk of the products.","b":"CORRECT. Major revenue streams are the first of the two internal operating factors (Section 1.2.1.1). The study guide's integrated oil-and-gas example shows that a company whose operations span more than one SICS industry may need to reference more than one Standard. Company C's consumer cleaning-products revenue is not normally associated with the Chemicals industry.","c":"Incorrect. Section 1.2.1 states that when a company has a significant revenue stream not normally associated with its industry, it may need to refer to multiple industry Standards to fully capture its performance. A consumer division producing 35 percent of revenue is significant, so evaluating only the Chemicals Standard would miss relevant topics.","d":"Incorrect. Operating location is a component of the external operating context (Section 1.2.2.4). Whether an additional Standard applies is determined by internal factors, namely revenue streams and main inputs (Section 1.2.1), not by where the company operates."}},{"id":"A2","lo":1,"type":"multi","choose":2,"text":"Which two sustainability issues are likely more relevant to Company C than to Companies A and B as a result of Company C's main inputs for value creation? (Choose two.)","options":{"a":"Access & Affordability","b":"Data Security","c":"Energy Management","d":"Employee Health & Safety","e":"Customer Privacy"},"answer":["c","d"],"expl":{"a":"Incorrect. Access & Affordability relates to companies providing products or services that meet a universal need. Nothing in the case connects Company C's inputs to that issue.","b":"Incorrect. No information in the case links Company C's inputs to the management of data or information systems.","c":"CORRECT. Natural gas is Company C's principal energy source and feedstock, so energy is a main input for value creation (Section 1.2.1.2). Energy Management addresses the environmental impacts associated with energy consumption as a key input (Section 2.1.1). The case does not describe A or B as energy-intensive.","d":"CORRECT. Section 1.2.1.2 uses the example of a firm that relies on human capital in an industry where automation is the norm, which may make workforce-related disclosure more relevant. Company C relies on a large workforce handling hazardous intermediates, whereas A and B are highly automated. Employee Health & Safety sits under the Human Capital dimension (Section 2.1.3).","e":"Incorrect. Customer Privacy concerns the use of customer data. No information in the case makes it relevant to Company C's inputs."}},{"id":"A3","lo":2,"type":"single","text":"The information about the jurisdiction in which Company C's largest plants operate most directly brings which component of the external operating context, and which sustainability issue, into scope for Company C but not for Companies A and B?","options":{"a":"Economic climate; Energy Management","b":"Operating location(s); GHG Emissions","c":"Regulatory climate; Air Quality","d":"Business climate; Management of the Legal & Regulatory Environment"},"answer":["c"],"expl":{"a":"Incorrect. The economic climate is defined by regional conditions such as taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2). The case describes regulation and penalties, not economic conditions.","b":"Incorrect. Nitrogen oxide and sulfur dioxide are air pollutants, not greenhouse gases; GHG Emissions concerns emissions that contribute to global warming (Section 2.1.1). Although the plants' location is where the regulation applies, the information that differentiates Company C is the regulation itself and its enforcement, which is the regulatory climate.","c":"CORRECT. A company's regulatory climate is defined by the presence of current regulation and the enforceability and severity of penalties for non-compliance (Section 1.2.2.3). The case describes actively enforced emission limits with significant penalties that apply to Company C but not to A or B, exactly as the varying GM regulation in Practice Case 1 differentiated Company B. Nitrogen oxide and sulfur dioxide are airborne pollutants, so the relevant issue is Air Quality (Section 2.1.1).","d":"Incorrect. The business climate is defined by competitive forces and peer behaviors (Section 1.2.2.1). Management of the Legal & Regulatory Environment is relevant to companies that rely on favorable regulation for competitiveness (Section 2.1.5); the case describes compliance costs for pollutant emissions, not dependence on favorable policy."}},{"id":"A4","lo":4,"type":"multi","choose":2,"text":"A user applies the five factors to the issue of Air Quality for Company C. Which two factors are most clearly evidenced by the information in the case? (Choose two.)","options":{"a":"Industry norms, best practices, and competitive drivers","b":"Stakeholder concerns and social trends","c":"Direct financial impacts and risk","d":"Opportunities for innovation","e":"Legal, regulatory, and policy drivers"},"answer":["c","e"],"expl":{"a":"Incorrect. This factor concerns the current and best practices of peer firms (Section 3.1). The case provides no information about how peers manage or disclose air quality.","b":"Incorrect. This factor relates to the concerns of employees, NGOs, communities, and the public, typically affecting brand reputation or license to operate (Section 3.1). No such concern is described for Company C.","c":"CORRECT. The question for analysis for this factor is whether the impact is captured by existing line items in the financial statements (Section 3.1). Company C's $4.2 million in fines and $60 million capital commitment are directly reflected in its financial statements, as fines and settlements typically are.","d":"Incorrect. This factor relates to competitive advantage from innovation (Section 3.1). Emissions-control equipment installed to comply with regulation is compliance spending; the case gives no evidence that it creates a competitive advantage.","e":"CORRECT. This factor relates to existing, emerging, or evolving regulation that creates risks or opportunities, and topics with a history of regulation, including emissions, stand out here (Section 3.1). The case describes enacted, enforced emission limits with penalties."}}]},{"id":"B","title":"Case 2: Agricultural Products Industry","built":"Extends Practice Case 2 (Part II) with a third year of data","body":"<p>The Agricultural Products industry grows, processes, trades, and distributes vegetables and fruits, and produces and mills commodities such as grains, sugar, oils, maize, soybeans, and animal feed. Companies may source from thousands of third-party growers; vertically integrated companies operate farms, processing facilities, and distribution networks. The industry produces low-cost commodities and competes largely on price.</p>\n<p>Monoculture cultivation lowers production costs but makes crops more susceptible to insects, disease, and variations in growing conditions, and depletes soil nutrients. To manage these risks companies depend on agrochemicals such as fertilizers and pesticides, which carry regulatory risk of their own because runoff can contaminate water sources. Agrochemical use is especially intensive when crops are cultivated outside their natural ecological range. Consumer preference for organically grown crops is driving growth worldwide. Financial impacts of land-use and ecological issues can occur through contingent liabilities, operating expenses, asset impairment, market share, and access to new markets.</p>\n<p>Company A and Company B grow the same principal crop using monoculture practices, own their land, and directly control their farmer suppliers. In Year 2, Company A acquired 25,000 hectares on which it grows its principal crop outside its natural range, and began a program to calculate fertilizer loads precisely. Company B made no significant operational change in Year 2 other than adopting higher-density farming techniques to raise yields from the same land area.</p>\n<p><strong>In Year 3</strong>, Company A made no further land acquisitions and continued its precision fertilizer program across all of its land, including the acquired hectares. Company B continued its higher-density techniques and added processing capacity.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company A</th><th colspan=\"3\">Company B</th></tr><tr><th></th><th>Year 1</th><th>Year 2</th><th>Year 3</th><th>Year 1</th><th>Year 2</th><th>Year 3</th></tr></thead><tbody>\n<tr><td>Revenue ($ millions)</td><td>35,000</td><td>45,000</td><td>52,000</td><td>50,000</td><td>55,000</td><td>60,000</td></tr>\n<tr><td>Production by principal crop (metric tons)</td><td>200,000</td><td>275,000</td><td>320,000</td><td>375,000</td><td>400,000</td><td>440,000</td></tr>\n<tr><td>Total land area under active production (hectares)</td><td>35,000</td><td>60,000</td><td>60,000</td><td>50,000</td><td>50,000</td><td>50,000</td></tr>\n<tr><td>Number of processing facilities</td><td>275</td><td>375</td><td>375</td><td>400</td><td>400</td><td>420</td></tr>\n<tr><td>Total fertilizer consumption (metric tons)</td><td>7,250</td><td>10,000</td><td>10,800</td><td>8,500</td><td>8,750</td><td>8,900</td></tr>\n<tr><td>Total pesticide consumption (metric tons)</td><td>6,250</td><td>8,250</td><td>8,900</td><td>8,000</td><td>8,250</td><td>8,000</td></tr>\n</tbody></table>\n<p>Industry data for eight other Agricultural Products companies growing the same principal crop show, for Year 3 fertilizer consumption per hectare of land under active production: mean 0.160 metric tons per hectare, median 0.150, standard deviation 0.020.</p>","questions":[{"id":"B1","lo":5,"type":"single","text":"When normalized by total land area under active production, how did each company's total fertilizer consumption change from Year 2 to Year 3?","options":{"a":"Both companies' fertilizer use per hectare increased","b":"Company A's increased and Company B's decreased","c":"Both companies' fertilizer use per hectare decreased","d":"Company A's decreased and Company B's increased"},"answer":["a"],"expl":{"a":"CORRECT. Company A: 10,000 ÷ 60,000 = 0.167 mt/ha in Year 2, rising to 10,800 ÷ 60,000 = 0.180 in Year 3. Company B: 8,750 ÷ 50,000 = 0.175 in Year 2, rising to 8,900 ÷ 50,000 = 0.178 in Year 3. Normalizing by an activity metric that reflects operating scale enables comparison against past performance (Sections 4.2 and 4.3.1).","b":"Incorrect. Company B's fertilizer per hectare rose from 0.175 to 0.178; it did not decrease.","c":"Incorrect. Both ratios increased, as calculated in Option A.","d":"Incorrect. Company A's fertilizer per hectare rose from 0.167 to 0.180; it did not decrease."}},{"id":"B2","lo":5,"type":"single","text":"An analyst wants to compare how efficiently each company converts fertilizer into crop output in Year 3. Which normalization is most appropriate, and what does it show?","options":{"a":"Fertilizer per hectare of land under active production; Company A is the more efficient user","b":"Fertilizer per metric ton of principal crop produced; Company B uses less fertilizer per unit of output","c":"Fertilizer per processing facility; Company B is the more efficient user","d":"Fertilizer per dollar of revenue; Company A is the more efficient user"},"answer":["b"],"expl":{"a":"Incorrect. Land area captures operating scale, not output, so it does not answer a question about conversion of fertilizer into crop. It also gives the wrong conclusion: Company A's 0.180 mt/ha is slightly higher than Company B's 0.178.","b":"CORRECT. Production by principal crop reflects output, so fertilizer per metric ton of crop directly measures how efficiently fertilizer is converted into product (Section 4.2; Practice Case 2 answer key). Company A: 10,800 ÷ 320,000 = 0.034 mt of fertilizer per mt of crop. Company B: 8,900 ÷ 440,000 = 0.020. Company B uses less fertilizer per unit of output.","c":"Incorrect. The number of processing facilities has no direct relationship with fertilizer use (Section 4.2; Practice Case 2 answer key) and does not measure efficiency of conversion into crop.","d":"Incorrect. Revenue has a less direct relationship with fertilizer use than production or land area (Section 4.2). Even when calculated, Company A uses 10,800 ÷ 52,000 = 0.208 mt per $ million of revenue against Company B's 8,900 ÷ 60,000 = 0.148, so Company A is not the more efficient user."}},{"id":"B3","lo":7,"type":"single","text":"Which conclusion about the two companies' long-term fertilizer efficiency is best supported by the Year 1 to Year 3 data considered in context?","options":{"a":"Company B's higher-density farming is producing sustained yield gains, while Company A's efficiency remains constrained by the location of its acquired land","b":"Company A faces greater regulatory risk because its fertilizer use has increased in absolute terms","c":"Company A's larger land area gives it economies of scale that will reduce fertilizer intensity over time","d":"Company A's revenue growth demonstrates that its precision fertilizer program has succeeded"},"answer":["a"],"expl":{"a":"CORRECT. Crop yield per hectare shows the trend: Company A 5.71 (Year 1), 4.58 (Year 2), 5.33 (Year 3), still below its Year 1 level; Company B 7.5, 8.0, 8.8. The case states that crops grown outside their natural range are more agrochemical-intensive, so Company A's operating location limits its ability to reduce fertilizer use (Sections 1.2.2.4 and 6.1.4), while Company B's improvement reflects a management decision (Section 6.2). This mirrors the reasoning in Practice Case 2, Question 3.","b":"Incorrect. The case notes that agrochemicals carry regulatory risk from runoff, but gives no information that the two companies face different regulatory climates. An increase in absolute fertilizer use largely reflects Company A's growth in scale, which is why normalization is needed (Section 4.1).","c":"Incorrect. The Practice Case 2 answer key notes that scale is not a primary focal point in this analysis. The data also point the other way: Company A's fertilizer per hectare rose in Year 3 despite no change in land area.","d":"Incorrect. Revenue growth reflects output and prices, not fertilizer efficiency. On every normalized basis (per hectare, per metric ton, per dollar of revenue) Company A remains more fertilizer-intensive than Company B in Year 3."}},{"id":"B4","lo":6,"type":"single","text":"Assuming normal distribution, Company A's Year 3 fertilizer consumption per hectare is higher than approximately what percentage of the eight industry peers?","options":{"a":"16%","b":"50%","c":"84%","d":"97.5%"},"answer":["c"],"expl":{"a":"Incorrect. About 16 percent would apply if Company A were one standard deviation below the mean.","b":"Incorrect. About 50 percent would apply if Company A were at the mean.","c":"CORRECT. Company A's Year 3 value is 10,800 ÷ 60,000 = 0.180 mt/ha. (0.180 − 0.160) ÷ 0.020 = 1.0 standard deviation above the mean. In a normal distribution the share of values below one standard deviation above the mean is 2.1% + 13.6% + 34.1% + 34.1% = 83.9%, or about 84% (Section 5.2). For this metric a higher value indicates greater fertilizer intensity, so Company A is more intensive than about 84 percent of peers.","d":"Incorrect. About 97.5 percent would apply at two standard deviations above the mean, which would require a value of 0.200 mt/ha."}},{"id":"B5","lo":6,"type":"single","text":"How should the distribution of the eight-company peer dataset be described?","options":{"a":"Symmetrical","b":"Positively skewed","c":"Negatively skewed","d":"Normal"},"answer":["b"],"expl":{"a":"Incorrect. A symmetrical distribution has the attributes of a normal distribution, with mean and median the same (Section 5.3.2). They differ here.","b":"CORRECT. A positively skewed distribution occurs when the mean is greater than the median (Section 5.3.2). 0.160 is greater than 0.150, indicating that a small number of high-intensity companies pull the mean above the median. This is why the previous question had to assume normal distribution before applying standard-deviation percentages.","c":"Incorrect. A negatively skewed distribution occurs when the mean is less than the median (Section 5.3.2), as in Practice Case 7, Question 20. Here the mean is greater.","d":"Incorrect. A normal distribution is symmetrical, with the mean and median equal (Section 5.3.2). Here the mean (0.160) is greater than the median (0.150)."}}]},{"id":"C","title":"Case 3: Restaurants Industry","built":"Extends Practice Case 3 (Part III) with a peer company","body":"<p>The Restaurants industry prepares meals, snacks, and beverages for immediate on- and off-premises consumption. The industry is mature with low barriers to entry, and the franchise model allows rapid growth but can increase risk because consumers may not distinguish a franchise from a company-owned location. High competition and low margins make efficient management of energy, water, and materials important, and as a consumer-facing industry companies face significant reputational risk related to food safety, healthy options, labor practices, and sustainable sourcing.</p>\n<p>Supply chain management is crucial to protect reputation and brand value. Consumers increasingly value the social and environmental impacts of food sourcing and transparent nutritional information. Companies that ensure food safety and ethical sourcing may enhance brand image and market share, though sourcing to consistently high standards across locations is operationally challenging given global suppliers, the limited number of suppliers meeting high standards, and higher costs.</p>\n<p><strong>Company A</strong>, a multinational fast-casual chain, has aggressively pursued sustainable ingredient sourcing. Costs have risen because of higher input prices and enhanced food safety procedures for fresh, unprocessed ingredients, and the chain experienced a short-term supply disruption when a key ingredient was available only from a conventional grower. However, its brand is viewed more favorably and it has seen a slow but steady increase in sales, per-store sales, and market share.</p>\n<p><strong>Company B</strong> is a large quick-service chain, most of whose restaurants are franchised. It sources conventionally at lower cost and has made only modest progress on sustainable sourcing. In Year 3, a widely publicized foodborne-illness outbreak was traced to one of Company B's ingredient suppliers. Company B temporarily closed 200 restaurants, recorded provisions for customer litigation, and saw same-store sales fall as negative media coverage spread across its locations. In response, it introduced a mandatory supplier audit program and enhanced food-handling procedures, raising its ingredient and operating costs.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company A</th><th colspan=\"3\">Company B</th></tr><tr><th></th><th>Year 1</th><th>Year 2</th><th>Year 3</th><th>Year 1</th><th>Year 2</th><th>Year 3</th></tr></thead><tbody>\n<tr><td>Number of restaurants</td><td>1,775</td><td>1,900</td><td>2,050</td><td>8,000</td><td>8,200</td><td>8,300</td></tr>\n<tr><td>Revenue ($ billions)</td><td>3.45</td><td>3.65</td><td>4.12</td><td>6.10</td><td>6.35</td><td>5.95</td></tr>\n<tr><td>Cost of goods sold, as % of revenue</td><td>32.5%</td><td>33.4%</td><td>35.0%</td><td>30.0%</td><td>30.2%</td><td>30.8%</td></tr>\n<tr><td>Market share</td><td>3.9%</td><td>4.4%</td><td>5.4%</td><td>9.5%</td><td>9.7%</td><td>8.9%</td></tr>\n<tr><td>Percentage of food purchased that meets environmental and social sourcing standards</td><td>45.4%</td><td>62.8%</td><td>81.8%</td><td>12.4%</td><td>13.1%</td><td>15.0%</td></tr>\n<tr><td>Number of food safety incidents resulting in restaurant closures</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td></tr>\n<tr><td>Restaurants temporarily closed following food safety incidents</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>200</td></tr>\n<tr><td>Provisions recorded for food-safety litigation ($ millions)</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>45</td></tr>\n</tbody></table>","questions":[{"id":"C1","lo":8,"type":"single","text":"How should the financial impact of Company B's Year 3 foodborne-illness incident be characterized?","options":{"a":"Progressive and high magnitude","b":"Progressive and low magnitude","c":"Acute and high magnitude","d":"Acute and low magnitude"},"answer":["c"],"expl":{"a":"Incorrect. A high-magnitude progressive impact builds over years, as in the guide's example of a product line that quadruples profits over five years (Section 7.2.2). The outbreak was a discrete event.","b":"Incorrect. Progressive impacts occur gradually over time and are commonly operational costs of doing business (Section 7.2.2), such as Company A's rising ingredient costs in Practice Case 3. A single outbreak is not gradual.","c":"CORRECT. Acute impacts are one-time events that are typically high magnitude and low likelihood, with direct and immediate effects on the financial statements and market value (Section 7.2.2). The study guide's own example of a high-magnitude impact is a major recall due to food-borne illness, with highly publicized costs such as litigation and reputational damage (Section 7.2.1.3), and a foodborne-illness outbreak is its example of a near-term impact (Section 7.2.1.2). The closure of 200 restaurants, litigation provisions, and the fall in sales fit this pattern.","d":"Incorrect. The event is acute, but 200 closures, litigation provisions, a $0.4 billion revenue decline, and lost market share are not low magnitude. Low-magnitude impacts are less severe and less likely to affect reputation or stock price in the near term (Section 7.2.1.3)."}},{"id":"C2","lo":9,"type":"multi","choose":3,"text":"Which three channels of financial impact are evidenced by Company B's food safety performance in Year 3? (Choose three.)","options":{"a":"Revenues","b":"Turnover ratio","c":"Economic profit","d":"Expenses","e":"Liabilities"},"answer":["a","d","e"],"expl":{"a":"CORRECT. Revenue fell from $6.35 billion to $5.95 billion and market share from 9.7 to 8.9 percent as negative coverage reduced demand. Food safety issues can harm brand value and reputation, which influence demand and revenue (Section 8.2.1.1; Practice Case 7, Question 17).","b":"Incorrect. Turnover ratio is a component of return on invested capital used to assess sources of competitive advantage (Section 9.1.1). It is not a channel of financial impact; the channels are revenues, expenses, assets, liabilities, and cost of capital (Section 8.2).","c":"Incorrect. Economic profit is a valuation tool that can be informed by ESG information, not a core channel of financial impact (Section 9.1.2; Practice Case 3, Question 2).","d":"CORRECT. The supplier audit program and enhanced food-handling procedures raised ingredient and operating costs, visible in cost of goods sold rising to 30.8 percent of revenue. Sustainability-related expenses commonly take the form of operating expenses (Section 8.2.1.2).","e":"CORRECT. The $45 million provision for customer litigation is a future financial obligation and legal risk, which is how the guide defines a liability (Section 8.2.1.4)."}},{"id":"C3","lo":10,"type":"multi","choose":2,"text":"A user is updating a discounted cash flow valuation of Company B after the incident. Which two adjustments are best supported by the case? (Choose two.)","options":{"a":"Lower discount rate","b":"Higher discount rate","c":"Higher long-term growth rate","d":"Lower forecasted cash flows in the near term","e":"Lower expense projections"},"answer":["b","d"],"expl":{"a":"Incorrect. A lower discount rate applies when a company is perceived as less risky than peers, as with Company A's first-mover position in Practice Case 3. Company B's risk perception has worsened.","b":"CORRECT. A higher discount rate is applied when investors or lenders perceive the company to carry greater risk (Section 8.2.2; Practice Case 3, Question 3). A publicized outbreak and evidence of weak supplier oversight increase Company B's perceived risk.","c":"Incorrect. The case states that reputational damage from food safety issues tends to have a long-term impact across most locations, and Company B lost market share. Growth projections reflect a company's position to capture expanding markets (Section 8.2.3); nothing supports raising them.","d":"CORRECT. Cash flow projections are informed by metrics linked to revenues, costs, assets, and liabilities (Section 8.2.1). Company B's revenue decline, higher remediation costs, and litigation provision all reduce near-term cash flows.","e":"Incorrect. Company B's costs rose because of the audit program and enhanced procedures; expense projections would not be lowered."}},{"id":"C4","lo":3,"type":"multi","choose":2,"text":"Company B's incident was traced to an ingredient supplier. Which two general issue categories does this most directly implicate? (Choose two.)","options":{"a":"Employee Health & Safety","b":"Customer Welfare","c":"Selling Practices & Product Labeling","d":"Data Security","e":"Supply Chain Management"},"answer":["b","e"],"expl":{"a":"Incorrect. Employee Health & Safety concerns risks to a company's own workforce (Section 2.1.3). The case describes harm to customers from supplied ingredients, not workplace injury.","b":"CORRECT. Customer Welfare relates to the benefits and risks customers experience when using a company's products or services, and the guide's example is food safety risk from restaurants (Practice Case 4, Question 2 explanation; Section 2.1.2). Customers were harmed by the outbreak.","c":"Incorrect. Selling Practices & Product Labeling concerns the accuracy of product labeling and marketing (Section 2.1.2), such as the nutrition labeling regulation described for the industry. The incident was contamination, not mislabeling.","d":"Incorrect. No information in the case involves customer data or information systems.","e":"CORRECT. Supply Chain Management is a Business Model & Innovation issue (Section 2.1.4). The case states that supply chain management is crucial for restaurants to protect reputation and that sourcing from suppliers with high-quality standards positions companies to protect value. The two issues are interrelated (Section 2.2): performance on supplier standards directly drives food safety outcomes for customers."}}]},{"id":"D","title":"Case 4: Electric Utilities & Power Generators Industry","built":"New questions on Practice Case 4 data, plus an industry dataset","body":"<p>Companies in the Electric Utilities & Power Generators industry generate electricity, operate transmission and distribution networks, and sell electricity to households, businesses, and industrial plants. Electricity generation is the largest source of GHG emissions in the world, and fuel combustion produces both GHG emissions and hazardous air pollutants such as nitrogen oxides.</p>\n<p>Regulated utilities accept oversight of pricing and allowed return on equity in exchange for a license to operate as a monopoly. The cost of supplying electricity is highest during periods of high demand. Utilities may request rate increases but are affected where the approved rate falls short of the request (regulatory lag). Utilities can also encourage efficient use of energy through education and demand-response programs that reduce electricity use at peak times.</p>\n<p><strong>Companies A and B</strong> are regulated utilities that generate, distribute, and sell electricity to residential and commercial customers. Company A operates in a region with aggressive GHG reduction requirements, including a requirement that renewable sources supply at least 40 percent of electricity distributed, and participates in a cap-and-trade scheme limiting carbon emissions; it expects regulation to become more stringent. Company A's revenue is decoupled from the amount of electricity its customers consume. Company B operates in a region currently without GHG reduction requirements but anticipates new regulation in the near future. Company B's revenue is a direct product of the electricity it sells (not decoupled). Company B recently expanded into a new region to develop a generation plant. Both companies use smart grid technology to various extents.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Year 1</th><th>Year 2</th><th>Year 1</th><th>Year 2</th></tr></thead><tbody>\n<tr><td>Number of residential customers served</td><td>500,000</td><td>550,000</td><td>1,000,000</td><td>1,000,000</td></tr>\n<tr><td>Total electricity generated (MWh)</td><td>7,000,000</td><td>7,000,000</td><td>15,000,000</td><td>17,000,000</td></tr>\n<tr><td>Percentage renewable</td><td>30%</td><td>35%</td><td>50%</td><td>40%</td></tr>\n<tr><td>Gross global Scope 1 emissions (metric tons)</td><td>6,000,000</td><td>6,000,000</td><td>9,000,000</td><td>9,000,000</td></tr>\n<tr><td>Percentage covered under emissions-limiting regulation</td><td>100%</td><td>100%</td><td>0%</td><td>10%</td></tr>\n<tr><td>Percentage of electric load served by smart grid technology</td><td>30%</td><td>40%</td><td>20%</td><td>20%</td></tr>\n<tr><td>Customer electricity savings from efficiency measures</td><td>10%</td><td>12%</td><td>0%</td><td>0%</td></tr>\n</tbody></table>\n<p>Industry data for ten regulated utilities show, for Year 2 gross Scope 1 emissions per MWh of electricity generated: mean 0.62 metric tons per MWh, median 0.60, standard deviation 0.12.</p>","questions":[{"id":"D1","lo":9,"type":"single","text":"Company A's Scope 1 emissions are fully covered by an emissions-limiting cap-and-trade scheme. Through which channel of financial impact does Company A's performance on \"gross global Scope 1 emissions\" most directly affect its financial performance?","options":{"a":"Tangible assets","b":"Revenues","c":"Long-term growth rate","d":"Expenses"},"answer":["d"],"expl":{"a":"Incorrect. Assets are affected where performance impairs an asset's ability to generate cash flows or reduces its useful life (Section 8.2.1.3). The case gives no evidence of impairment of Company A's generation assets.","b":"Incorrect. Company A's revenue is decoupled from electricity sold and its pricing is set by regulators. Nothing in the case links its emissions performance to revenue.","c":"Incorrect. The long-term growth rate is a DCF model input that channels of financial impact may inform (Sections 8.2 and 8.2.3); it is not itself a channel. The channels are revenues, expenses, assets, liabilities, and cost of capital.","d":"CORRECT. In industries facing GHG emissions caps, emissions performance influences operating costs and regulatory compliance costs (Section 7.2.1). Under cap-and-trade, emissions above allowances must be covered at a cost, and sustainability-related expenses typically appear as operating expenses (Section 8.2.1.2). This is the most direct channel for Company A."}},{"id":"D2","lo":10,"type":"single","text":"Suppose Company B launches a demand-response and end-use efficiency program that reduces its customers' electricity consumption. Given Company B's rate structure, how would a user most likely reflect this in a DCF model of Company B?","options":{"a":"Lower revenue projections","b":"Neutral revenue projections and lower expense projections","c":"Higher revenue projections","d":"Higher discount rate"},"answer":["a"],"expl":{"a":"CORRECT. Company B's revenue is a direct product of the amount of electricity it sells. Reduced customer consumption therefore reduces revenue, which is the conventional-rate-structure effect described in the Practice Case 4, Question 1 explanation (Section 8.2.1.1). Efficiency measures would also lower peak-demand supply costs, but the revenue effect is not neutral for Company B.","b":"Incorrect. A neutral revenue effect applies to Company A, whose decoupled rate structure means lower consumption does not directly translate to lower sales (Practice Case 4, Question 1). Company B is explicitly not decoupled.","c":"Incorrect. Lower consumption cannot raise revenue when revenue is tied to quantity sold.","d":"Incorrect. A higher discount rate reflects greater perceived risk (Section 8.2.2). The case gives no evidence that an efficiency program changes Company B's risk profile; the effect flows through cash flow projections."}},{"id":"D3","lo":6,"type":"single","text":"Assuming normal distribution, how should Company A's Year 2 emissions intensity (Scope 1 emissions per MWh generated) be characterized relative to the ten-company industry dataset?","options":{"a":"About one standard deviation above the mean; higher intensity than roughly 84 percent of peers","b":"About two standard deviations below the mean; lower intensity than roughly 97.5 percent of peers","c":"Within one standard deviation of the mean","d":"About two standard deviations above the mean; higher intensity than roughly 97.5 percent of peers"},"answer":["d"],"expl":{"a":"Incorrect. One standard deviation above the mean would be 0.74 metric tons per MWh; Company A's 0.86 is well beyond that.","b":"Incorrect. Company A's intensity is above the mean, not below it. This description would fit a value near 0.38.","c":"Incorrect. Within one standard deviation would require a value between 0.50 and 0.74. Company B (0.53) falls in that range; Company A does not.","d":"CORRECT. Company A's Year 2 intensity is 6,000,000 ÷ 7,000,000 = 0.86 metric tons per MWh (the same normalization the Practice Case 4 answer key uses). (0.86 − 0.62) ÷ 0.12 = 2.0 standard deviations above the mean. In a normal distribution, 2.1% + 13.6% + 34.1% + 34.1% + 13.6% = 97.5% of values fall below two standard deviations above the mean (Section 5.2). For this metric a higher value is worse, so Company A is among the most emissions-intensive peers. By comparison, Company B at 9,000,000 ÷ 17,000,000 = 0.53 is 0.75 standard deviations below the mean."}}]},{"id":"E","title":"Case 5: Non-Alcoholic Beverages Industry","built":"Extends Practice Case 5 with a second year of data","body":"<p>Companies in the Non-Alcoholic Beverages industry produce juices, soft drinks, coffee and tea products, energy drinks, and other beverages. The industry is not considered highly regulated, but trends related to consumer health and environmental responsibility have become increasingly important. Widely publicized research links high-sugar beverages to obesity and heart disease, so nutritional content increasingly shapes competition as consumers demand healthier products and transparent labeling; some jurisdictions have adopted labeling regulation, particularly for products marketed to children. Companies that offer more healthful alternatives can capture market share and limit exposure to regulation and litigation.</p>\n<p>The industry is a leading global consumer of fresh water, which is the primary ingredient in substantially all products. Because water stress is increasing in many regions, companies may face supply disruptions that could significantly impact operations, add to costs, and in extreme cases threaten the business as a going concern. Local governments in water-stressed regions have instituted regulations requiring manufacturing efficiency thresholds and capping total water withdrawal.</p>\n<p><strong>In Year 2</strong>, Company C opened two production facilities in a region classified as High Baseline Water Stress, where the regulator caps total water withdrawal per facility and has announced tighter caps to take effect in Year 4. Company B launched a reformulated low-calorie product line and a water replenishment program. Companies A and D made no significant operational changes.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th><th colspan=\"2\">Company C</th><th colspan=\"2\">Company D</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total revenue ($ billions)</td><td>11.6</td><td>12.0</td><td>9.2</td><td>10.1</td><td>14.4</td><td>14.6</td><td>10.3</td><td>10.6</td></tr>\n<tr><td>Number of production facilities</td><td>22</td><td>22</td><td>17</td><td>17</td><td>13</td><td>15</td><td>14</td><td>14</td></tr>\n<tr><td>Revenue from low-calorie drinks ($ billions)</td><td>2.9</td><td>3.1</td><td>4.6</td><td>5.6</td><td>1.4</td><td>1.5</td><td>3.0</td><td>3.4</td></tr>\n<tr><td>Total water consumed (billion liters)</td><td>200</td><td>196</td><td>190</td><td>200</td><td>125</td><td>130</td><td>150</td><td>148</td></tr>\n<tr><td>Percent of water consumed in regions with High Baseline Water Stress</td><td>10%</td><td>10%</td><td>30%</td><td>28%</td><td>20%</td><td>35%</td><td>25%</td><td>24%</td></tr>\n<tr><td>Percent of water replenished</td><td>90%</td><td>92%</td><td>70%</td><td>74%</td><td>50%</td><td>50%</td><td>60%</td><td>63%</td></tr>\n</tbody></table>","questions":[{"id":"E1","lo":5,"type":"single","text":"An analyst compares the operating efficiency of the four companies' water use in Year 2. Which company consumed the least water per production facility?","options":{"a":"Company C","b":"Company A","c":"Company B","d":"Company D"},"answer":["a"],"expl":{"a":"CORRECT. Operating efficiency is assessed by normalizing total water consumed by a production-related metric (Section 4.2; Practice Case 5, Question 7). Company C consumed 130 ÷ 15 = 8.67 billion liters per facility, the lowest of the four in Year 2.","b":"Incorrect. Company A consumed 196 ÷ 22 = 8.91 billion liters per facility, second lowest. In Year 1 Company A was lowest, but Company C's facility additions changed the comparison.","c":"Incorrect. Company B consumed 200 ÷ 17 = 11.76 billion liters per facility, the highest of the four.","d":"Incorrect. Company D consumed 148 ÷ 14 = 10.57 billion liters per facility."}},{"id":"E2","lo":7,"type":"single","text":"Considering Company C's Year 2 performance in the context of its operating environment, which conclusion is best supported?","options":{"a":"Company C's improved efficiency per facility indicates that its water-related risk declined in Year 2","b":"Company C's exposure to water-related supply and regulatory risk increased in Year 2 despite improved operating efficiency","c":"Company C faces less water risk than Company B because Company B consumes more water in total","d":"Company C's risk is unchanged because its total water consumption rose only modestly"},"answer":["b"],"expl":{"a":"Incorrect. Efficiency per facility improved, but the case indicates water risk manifests as supply disruption and regulatory limits, which are captured by the percentage of water from stressed regions and the replenishment rate (Practice Case 5, Question 6). Both worsened or stagnated for Company C.","b":"CORRECT. Company C's share of water consumed in high-stress regions rose from 20 to 35 percent, its replenishment rate stayed at 50 percent (lowest of the group), and its new facilities sit under withdrawal caps that will tighten in Year 4. Comparing performance in light of regulatory climate and operating location (Sections 6.1.3 and 6.1.4) shows increased exposure even though efficiency improved.","c":"Incorrect. Absolute water consumption is not normalized for scale and does not measure risk exposure (Section 4.1). Company B's share of stressed-region water fell and its replenishment rose, so its risk profile improved.","d":"Incorrect. Total consumption is not the relevant indicator; the shift in where water is consumed and the regulatory caps are what changed Company C's risk."}},{"id":"E3","lo":4,"type":"multi","choose":2,"text":"A user applies the five factors to the issue of health and nutrition. Which two factors are most clearly evidenced by the case and Company B's Year 2 actions? (Choose two.)","options":{"a":"Management focus on brand loyalty","b":"Opportunities for innovation","c":"Classification of products by calorie content","d":"Stakeholder concerns and social trends","e":"Industry norms, best practices, and competitive drivers"},"answer":["b","d"],"expl":{"a":"Incorrect. This is not one of the five factors (Section 3.1).","b":"CORRECT. This factor relates to competitive advantage from innovation, often through new products (Section 3.1). Company B's reformulated low-calorie line, and the case statement that companies offering healthful alternatives can capture market share, evidence it.","c":"Incorrect. This is not one of the five factors (Section 3.1).","d":"CORRECT. This factor relates to the interests and concerns of the public and customers that can shift demand (Section 3.1). The case states that consumers demand healthier products and greater labeling transparency in response to publicized health research.","e":"Incorrect. This factor concerns peer practices and disclosure norms (Section 3.1). The case provides no information about how peers manage or disclose health and nutrition."}},{"id":"E4","lo":10,"type":"multi","choose":2,"text":"Given the tighter withdrawal caps announced for Year 4 in the region where Company C's new facilities operate, which two DCF adjustments for Company C are best supported by the case? (Choose two.)","options":{"a":"Lower discount rate","b":"Higher long-term growth rate","c":"Higher discount rate","d":"Higher expense projections","e":"Decrease in book value of intangible assets"},"answer":["c","d"],"expl":{"a":"Incorrect. A lower discount rate reflects reduced perceived risk. Company C's risk increased.","b":"Incorrect. Nothing in the case suggests Company C is positioned to capture an expanding market (Section 8.2.3); its constraint is on inputs.","c":"CORRECT. The case says supply disruption can significantly impact operations and, in extreme cases, threaten going-concern status. Greater perceived risk raises the return required by investors and lenders, reflected in a higher discount rate (Section 8.2.2).","d":"CORRECT. The case states that water supply constraints add to costs and that regulators require efficiency thresholds; meeting tighter caps implies higher operating and compliance costs, which flow through expense projections (Section 8.2.1.2).","e":"Incorrect. Water constraints are not linked in the case to intangible asset value (Section 8.2.1.3)."}}]},{"id":"F","title":"Case 6: Household & Personal Products Industry","built":"Extends Practice Case 6 with a second year of data","body":"<p>The Household & Personal Products industry manufactures cosmetics, cleaning supplies, sanitary paper products, batteries, and similar goods, sold globally through mass merchants, grocery and drug stores, distributors, and e-commerce. Water is a vital input, both as a coolant and as a main product ingredient (shampoo is generally 70 to 80 percent water), so water expenses are a significant part of the cost structure. Water supplies are threatened in some regions by more frequent droughts; without careful planning companies can face increased costs or lose access to water.</p>\n<p>The industry also faces growing pressure from consumers and regulators over chemicals linked to human health and environmental harm. REACH regulation in Europe has banned more than 1,000 chemicals and requires registration of each chemical in a product; North American rules require reporting of cosmetic ingredients known or suspected to cause cancer, birth defects, or reproductive harm. Companies that anticipate the changing regulatory landscape and adopt green chemistry may improve profitability by capturing changing demand and avoiding compliance burdens.</p>\n<p>Companies W, X, Y, and Z are competitors with varying geographic exposure. Assume each pays $0.83 per cubic meter of water on average. <strong>During Year 2</strong>, European regulators added two substances used in several of Company X's products to the REACH list of substances of very high concern; Company X expects to reformulate or withdraw those products within 18 months. Company Z sources 90 percent of its water from municipal supplies in low-stress regions under long-term supply contracts.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company W</th><th colspan=\"2\">Company X</th><th colspan=\"2\">Company Y</th><th colspan=\"2\">Company Z</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total sales revenue ($)</td><td>17,589,654</td><td>18,100,000</td><td>10,487,454</td><td>9,900,000</td><td>34,216,231</td><td>35,400,000</td><td>6,654,167</td><td>7,300,000</td></tr>\n<tr><td>Total weight of products sold (metric tons)</td><td>14,562,287</td><td>14,900,000</td><td>7,456,754</td><td>7,050,000</td><td>25,589,980</td><td>26,300,000</td><td>4,978,257</td><td>5,450,000</td></tr>\n<tr><td>Total water consumed (cubic meters)</td><td>31,858,975</td><td>31,200,000</td><td>22,154,687</td><td>21,900,000</td><td>64,879,555</td><td>65,100,000</td><td>9,186,349</td><td>9,700,000</td></tr>\n<tr><td>Percent of water consumed in regions with High or Extremely High Baseline Water Stress</td><td>68%</td><td>66%</td><td>51%</td><td>50%</td><td>61%</td><td>60%</td><td>35%</td><td>36%</td></tr>\n<tr><td>Revenue from products containing REACH substances of very high concern ($ thousands)</td><td>2,654,578</td><td>2,400,000</td><td>3,741,963</td><td>3,900,000</td><td>4,879,987</td><td>4,500,000</td><td>54,879</td><td>40,000</td></tr>\n<tr><td>Revenue from products designed with green chemistry principles ($)</td><td>3,258,741</td><td>3,900,000</td><td>1,112,331</td><td>1,050,000</td><td>6,852,369</td><td>8,100,000</td><td>2,654,879</td><td>3,300,000</td></tr>\n</tbody></table>","questions":[{"id":"F1","lo":5,"type":"single","text":"Which company's water consumed per metric ton of product sold worsened from Year 1 to Year 2?","options":{"a":"Company X","b":"Company W","c":"Company Y","d":"Company Z"},"answer":["a"],"expl":{"a":"CORRECT. Normalizing water by a production-focused metric enables comparison over time (Sections 4.2 and 4.3.1; Practice Case 6, Question 11). Company X went from 22,154,687 ÷ 7,456,754 = 2.97 m³/mt to 21,900,000 ÷ 7,050,000 = 3.11 m³/mt. Its total water fell slightly, but output fell faster, so intensity rose.","b":"Incorrect. Company W improved: 31,858,975 ÷ 14,562,287 = 2.19 m³/mt in Year 1 to 31,200,000 ÷ 14,900,000 = 2.09 in Year 2.","c":"Incorrect. Company Y improved from 2.54 to 65,100,000 ÷ 26,300,000 = 2.48 m³/mt.","d":"Incorrect. Company Z improved from 1.85 to 9,700,000 ÷ 5,450,000 = 1.78 m³/mt and remains the most efficient."}},{"id":"F2","lo":8,"type":"single","text":"Which metric for Company X captures a progressive risk whose likelihood increased during Year 2?","options":{"a":"Total weight of products sold","b":"Revenue from products designed with green chemistry principles","c":"Percent of water consumed in regions with High or Extremely High Baseline Water Stress","d":"Revenue from products containing REACH substances of very high concern"},"answer":["d"],"expl":{"a":"Incorrect. This is an activity metric that contextualizes scale; it is not an ESG performance metric (Section 4.2).","b":"Incorrect. This metric captures an opportunity, not a risk (Sections 7.1 and 7.2.2).","c":"Incorrect. This metric lends insight into an acute risk, the potential loss of access to water (Practice Case 6, Question 13), and Company X's exposure barely changed.","d":"CORRECT. This metric captures a risk, and revenues from products are earned gradually over time, so the impact is progressive rather than acute (Section 7.2.2; Practice Case 6, Question 13). The Year 2 listing of substances used in Company X's products converts a potential impact into a high-likelihood one (Section 7.2.1.1), since reformulation or withdrawal is now expected."}},{"id":"F3","lo":9,"type":"multi","choose":2,"text":"Through which two channels of financial impact will the REACH listing most directly affect Company X? (Choose two.)","options":{"a":"Net working capital","b":"Expenses","c":"Revenues","d":"Turnover ratio","e":"Tangible assets"},"answer":["b","c"],"expl":{"a":"Incorrect. Net working capital is a component of invested capital in the ROIC and EVA formulas (Section 9.1), not a channel of financial impact.","b":"CORRECT. Reformulation and regulatory compliance are costs; the case states companies that fail to anticipate regulation face compliance burdens (Section 8.2.1.2).","c":"CORRECT. Products containing the listed substances generate $3.9 billion of Company X's $9.9 billion in sales, about 39 percent. Withdrawing or reformulating them puts a large share of revenue at risk (Section 8.2.1.1).","d":"Incorrect. Turnover ratio is a component of ROIC used to diagnose competitive advantage (Section 9.1.1), not a channel.","e":"Incorrect. The case gives no evidence that plant or equipment would be impaired (Section 8.2.1.3)."}},{"id":"F4","lo":2,"type":"single","text":"Company Z's water sourcing arrangement is an example of which component of its operating context, and what does it imply for interpreting Company Z's low percentage of water from stressed regions?","options":{"a":"Regulatory climate; Company Z is more exposed to withdrawal limits","b":"Economic climate; Company Z pays lower water prices because of regional inflation","c":"Business climate; Company Z faces greater competition for water resources","d":"Operating location(s); Company Z's water supply is less exposed to scarcity-driven cost increases and disruption"},"answer":["d"],"expl":{"a":"Incorrect. Regulatory climate concerns regulation and enforcement (Section 1.2.2.3). The case says withdrawal limits apply in stressed regions, where Company Z sources little of its water.","b":"Incorrect. The economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2). The case assumes all four companies pay the same average water price.","c":"Incorrect. The business climate concerns competitive forces and peer behaviors (Section 1.2.2.1). Sourcing from low-stress municipal supplies reduces, not increases, competition for the input.","d":"CORRECT. Operating location captures where a company's operations are physically situated and the resource conditions there (Sections 1.2.2.4 and 6.1.4). Water from low-stress regions under long-term contracts constitutes advantageous access to a key input, which the Practice Case 6 answer key treats as evidence of a production advantage (Section 9.1.1) because water stress is associated with increased costs."}}]},{"id":"G","title":"Case 7: Restaurants Industry (food safety)","built":"Extends Practice Case 7 with a seventh company","body":"<p>Companies in the Restaurants industry prepare meals for immediate consumption using models from fast-food to full-service. Food safety is of utmost importance because of its long-term impact on brand value. Complex global supply chains and franchising, where owners do not manage daily operations, make it difficult to ensure food safety. Reputational damage from food safety issues tends to have a long-term impact and affects a company across most of its locations, so companies adhering to industry standards are better positioned to protect shareholder value. Public health concerns have also brought market and regulatory pressure for healthier options and mandatory nutrition labeling in many jurisdictions.</p>\n<p>Six companies reported the following, with summary statistics for the six.</p>\n<table><thead><tr><th></th><th>Restaurants inspected by a food safety oversight body</th><th>Percentage of restaurants inspected</th><th>Percentage of inspected restaurants receiving critical violations</th><th>Company-owned</th><th>Franchised</th></tr></thead><tbody>\n<tr><td>Company A</td><td>9,000</td><td>100%</td><td>4%</td><td>1,200</td><td>7,800</td></tr>\n<tr><td>Company B</td><td>98</td><td>65%</td><td>0%</td><td>100</td><td>50</td></tr>\n<tr><td>Company C</td><td>6,432</td><td>80%</td><td>7%</td><td>2,340</td><td>5,700</td></tr>\n<tr><td>Company D</td><td>376</td><td>40%</td><td>0%</td><td>830</td><td>211</td></tr>\n<tr><td>Company E</td><td>2,950</td><td>100%</td><td>2%</td><td>2,950</td><td>0</td></tr>\n<tr><td>Company F</td><td>27</td><td>88%</td><td>2%</td><td>31</td><td>0</td></tr>\n<tr><td>Mean</td><td>–</td><td>79%</td><td>2%</td><td>–</td><td>2,294</td></tr>\n<tr><td>Median</td><td>–</td><td>84%</td><td>2%</td><td>–</td><td>131</td></tr>\n<tr><td>Standard deviation</td><td>–</td><td>23.16</td><td>2.69</td><td>–</td><td>3,516.14</td></tr>\n</tbody></table>\n<p><strong>Company G</strong>, a seventh company not included in the statistics above, reports 1,200 restaurants inspected (60 percent of its restaurants), 9 percent of inspected restaurants receiving critical violations, and 400 company-owned and 800 franchised restaurants. Company G operates primarily in a jurisdiction whose food safety regulator publishes inspection results and can suspend operating licenses after repeated critical violations. The regulators overseeing the other six companies do not publish results.</p>","questions":[{"id":"G1","lo":6,"type":"single","text":"Using the six-company statistics and assuming normal distribution, how should Company G's critical-violation rate be characterized?","options":{"a":"Within 1 standard deviation of the mean","b":"About 1 standard deviation above the mean; Company G performs worse than about 84 percent of peers","c":"About 2.6 standard deviations above the mean; Company G performs worse than well over 97.5 percent of peers","d":"About 2.6 standard deviations below the mean; Company G performs better than most peers"},"answer":["c"],"expl":{"a":"Incorrect. Within one standard deviation would be a rate below about 4.7 percent.","b":"Incorrect. One standard deviation above the mean would be about 4.7 percent; Company G is far beyond that.","c":"CORRECT. (9% − 2%) ÷ 2.69 = 2.6 standard deviations above the mean. Under a normal distribution, 97.5 percent of values fall below two standard deviations above the mean (Section 5.2; Practice Case 7, Question 19), so Company G's rate exceeds nearly all peers. For this metric a higher value is worse.","d":"Incorrect. Company G's rate is above the mean, not below it."}},{"id":"G2","lo":7,"type":"single","text":"Considering Company G's regulatory climate, how should a user interpret its critical-violation rate relative to Company C's 7 percent?","options":{"a":"Company G's risk cannot be compared because it operates fewer restaurants than Company C","b":"Company G faces greater risk than Company C because its regulator can suspend licenses and publishes results, increasing both regulatory and reputational exposure","c":"Company G's risk is lower because its inspection rate of 60 percent is below Company C's 80 percent, so fewer violations are detected","d":"Company G and Company C face equal risk because both exceed the peer mean"},"answer":["b"],"expl":{"a":"Incorrect. The violation metric is a percentage and already normalized, so companies of different sizes can be compared (Section 4.1).","b":"CORRECT. Regulatory climate includes the enforceability and severity of penalties (Sections 1.2.2.3 and 6.1.3). License suspension is a severe penalty, and published results turn violations into the negative publicity the case says damages brand value across locations. The same violation rate carries greater financial consequence in Company G's climate.","c":"Incorrect. A lower inspection rate means less is known about the uninspected restaurants; it does not reduce the risk of violations occurring. Company G's 9 percent is measured on the restaurants that were inspected.","d":"Incorrect. Comparing to the mean alone ignores context; the guide stresses evaluating performance in light of external operating context (Section 6.1)."}},{"id":"G3","lo":3,"type":"single","text":"The metric \"percentage of inspected restaurants receiving critical violations\" captures performance on which general issue category, and what type of impact on enterprise value is typical?","options":{"a":"Labor Practices; higher staff turnover","b":"Employee Health & Safety; workers' compensation costs","c":"Customer Welfare; reputational damage affecting brand value and demand","d":"Selling Practices & Product Labeling; mislabeling penalties"},"answer":["c"],"expl":{"a":"Incorrect. Labor Practices concerns wages, working conditions, and related matters (Section 2.1.3), which the metric does not measure.","b":"Incorrect. Employee Health & Safety concerns the company's own workforce (Section 2.1.3), not customers.","c":"CORRECT. Customer Welfare relates to the benefits and risks customers experience from a company's products or services, and the guide's own example is food safety risk from restaurants (Section 2.1.2; Practice Case 4, Question 2). The case states that food safety failures produce negative publicity that harms reputation and brand value, an intangible asset, and reduces demand (Practice Case 7, Questions 16 and 17).","d":"Incorrect. Selling Practices & Product Labeling concerns accuracy of labeling and marketing (Section 2.1.2), such as nutrition labeling; it does not cover food safety violations."}},{"id":"G4","lo":5,"type":"single","text":"A user wants to compare food safety oversight across the seven companies. Which statement about normalization is correct?","options":{"a":"\"Restaurants inspected by a food safety oversight body\" should be normalized by the company's total number of restaurants, while the percentage metrics need no normalization","b":"\"Percentage of inspected restaurants receiving critical violations\" should be normalized by the number of franchised restaurants","c":"All of the metrics should be normalized by revenue to enable comparison","d":"\"Number of company-owned restaurants\" should be normalized by the percentage of restaurants inspected"},"answer":["a"],"expl":{"a":"CORRECT. Data already expressed as a percentage or ratio is normalized and should not be normalized again (Section 4.1; Practice Case 4, Question 3). An absolute count such as restaurants inspected reflects scale and becomes comparable when divided by total restaurants, which yields the inspection percentage already reported.","b":"Incorrect. A percentage is already normalized; dividing it by franchise count produces a figure with no performance meaning (Section 4.1).","c":"Incorrect. Revenue is a common normalization measure, but percentages do not need it, and the case says franchise structure, not revenue, drives food safety exposure (Section 4.2).","d":"Incorrect. Number of company-owned restaurants is an activity metric that provides context; normalizing it by a percentage produces no insight (Sections 4.1 and 4.2.2)."}}]},{"id":"H","title":"Case 8: Solar Technology & Project Developers Industry","built":"Extends Practice Case 8 with a Year 4 development","body":"<p>Companies in this industry manufacture solar energy equipment and may also develop, build, and manage solar projects. Manufacturing uses hazardous substances such as cadmium and gallium arsenide, which are costly and hazardous, alongside reusable materials with high economic value. Handling and disposal of hazardous waste increases operating costs, and spills create cleanup costs. Product take-back and recycling require upfront investment but can increase revenues and lower long-term costs by reusing recovered materials. Project development, including land rights and site permitting, depends on securing environmental permits and the permission of local governments and communities; siting in ecologically sensitive areas can make permitting more difficult and costly, slowing development and causing lost revenues or higher costs.</p>\n<p>Company A manufactures and sells equipment for residential and non-residential projects. Company B manufactures equipment and provides utility-scale project development services. Both operate where hazardous waste disposal is highly regulated.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company A</th><th colspan=\"3\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Revenue ($ millions)</td><td>3,430</td><td>3,950</td><td>3,810</td><td>9,422</td><td>9,500</td><td>9,720</td></tr>\n<tr><td>Expenses ($ millions)</td><td>462</td><td>466</td><td>467</td><td>1,403</td><td>1,500</td><td>1,876</td></tr>\n<tr><td>Hazardous waste generated (metric tons)</td><td>11,300</td><td>10,543</td><td>11,567</td><td>4,580</td><td>4,854</td><td>4,754</td></tr>\n<tr><td>Percent of hazardous waste recycled</td><td>66%</td><td>70%</td><td>75%</td><td>90%</td><td>90%</td><td>90%</td></tr>\n<tr><td>Reportable spills: number; aggregate quantity (mt); quantity recovered (mt)</td><td>1; 4,231; 603</td><td>0; 0; 0</td><td>0; 0; 0</td><td>3; 210; 50</td><td>2; 87; 22</td><td>2; 110; 44</td></tr>\n<tr><td>End-of-life material recovered (mt); percentage recycled</td><td>6,700; 7%</td><td>6,821; 8.8%</td><td>6,984; 10.5%</td><td>5,230; 0%</td><td>4,834; 0%</td><td>5,190; 10%</td></tr>\n<tr><td>Number and duration of project delays related to ecological impacts</td><td>n.a.</td><td>n.a.</td><td>n.a.</td><td>1; 32 days</td><td>0; 0 days</td><td>1; 19 days</td></tr>\n<tr><td>Total project development assets ($ millions)</td><td>0</td><td>0</td><td>0</td><td>1.56</td><td>1.68</td><td>1.99</td></tr>\n</tbody></table>\n<p><strong>In Year 4</strong>, Company A began offering utility-scale project development services, which it expects to contribute 20 percent of revenue within two years, and acquired land rights for a 400 MW project adjacent to a protected wetland.</p>","questions":[{"id":"H1","lo":1,"type":"single","text":"How does Company A's Year 4 decision change the sustainability topics a user should evaluate for Company A?","options":{"a":"Ecological Impacts of project development becomes relevant, because a significant new revenue stream depends on siting and permitting","b":"The user should evaluate Company A under the Electric Utilities & Power Generators Standard instead","c":"Waste & Hazardous Materials Management becomes less relevant, because manufacturing is now secondary","d":"No change, because Company A's primary SICS industry is unchanged"},"answer":["a"],"expl":{"a":"CORRECT. The Practice Case 8 answer key explains that ecological impacts of project development were relevant to Company B and not Company A because Company B earns significant revenue from project development. Company A's new development business, particularly a site adjacent to a protected wetland, now brings that topic into scope (Sections 1.2.1.1 and 2.1.1).","b":"Incorrect. Company A does not generate and sell electricity to end users; it develops projects. The relevant response is to add topics, not to switch Standards.","c":"Incorrect. Manufacturing remains about 80 percent of expected revenue, and Company A still generates over 11,000 metric tons of hazardous waste. Adding a revenue stream does not remove existing topics.","d":"Incorrect. A company's major revenue streams, an internal factor, influence which topics are relevant (Section 1.2.1.1). A new stream expected to reach 20 percent of revenue is a significant change."}},{"id":"H2","lo":8,"type":"multi","choose":2,"text":"Which two statements accurately characterize the financial impact captured by \"number and duration of project delays related to ecological impacts\" for Company B? (Choose two.)","options":{"a":"The metric captures a risk, since delays result in lost revenues or higher costs","b":"The impacts are high magnitude, threatening Company B as a going concern","c":"The metric captures an opportunity, since delays indicate rigorous permitting","d":"The impacts are high likelihood, since delays recurred in two of three years","e":"The impacts are low likelihood, since delays are rare events"},"answer":["a","d"],"expl":{"a":"CORRECT. The case states that difficult permitting slows development and can result in lost revenues or higher costs; higher values on this metric threaten economic performance, so it captures a risk (Section 7.1).","b":"Incorrect. Delays of 19 to 32 days on a company with $9.7 billion in revenue are low-magnitude, recurring impacts of the kind associated with everyday operations (Section 7.2.1.3).","c":"Incorrect. Delays are costs to the company, not sources of value.","d":"CORRECT. Time-series disclosure indicates likelihood (Section 7.2.1.1; Practice Case 8, Question 23). Company B experienced delays in Year 1 and Year 3, indicating a recurring, high-likelihood impact.","e":"Incorrect. Two delays in three years is not rare."}},{"id":"H3","lo":9,"type":"single","text":"Through which channel of financial impact would a failure to secure permits for Company A's wetland-adjacent project most directly affect Company A?","options":{"a":"Revenues from equipment sales to existing customers","b":"Assets, because the land rights acquired for the project could be impaired if permits are denied","c":"Liabilities from hazardous waste generated at the site","d":"Cost of capital, because lenders would reprice Company A's manufacturing debt"},"answer":["b"],"expl":{"a":"Incorrect. Equipment sales to existing customers are not affected by the permitting of a development project.","b":"CORRECT. Section 8.2.1.3 uses this industry as its example: solar companies acquire land rights to develop projects, and successful development hinges on permits, so a permitting failure impairs the asset's ability to generate cash flows. Company A now holds project development assets for the first time.","c":"Incorrect. The site has not been built; no hazardous waste is generated there, and the issue in question is ecological impacts, not waste.","d":"Incorrect. Cost of capital may be affected indirectly if the company is perceived as riskier (Section 8.2.2), but the most direct channel is the value of the project asset itself."}},{"id":"H4","lo":10,"type":"single","text":"A user is modeling Company B's cash flows. Which adjustment is best supported by Company B's three-year record of reportable spills?","options":{"a":"Write down property, plant, and equipment","b":"Increase expense projections in the forecast period to reflect recurring spill-related costs","c":"Reduce the discount rate because each spill is small","d":"Increase the long-term growth rate because recovery rates are improving"},"answer":["b"],"expl":{"a":"Incorrect. The case gives no evidence that spills have impaired Company B's fixed assets (Section 8.2.1.3).","b":"CORRECT. Company B has recorded two or three spills in every year. The Practice Case 8 answer key characterizes this as a recurring, progressive, high-likelihood impact, and Section 8.2.1.4 states that such a progressive near- or mid-term impact may call for an adjustment to expense projections during the forecast period.","c":"Incorrect. Frequent spills may prompt a user to perceive the company as riskier and raise, not lower, the discount rate (Section 8.2.1.4).","d":"Incorrect. Growth projections reflect a company's position in expanding markets (Section 8.2.3); spill recovery rates do not inform them."}}]},{"id":"I","title":"Case 9: Appliance Manufacturing Industry","built":"Extends Practice Case 9 with investment detail","body":"<p>Companies in the Appliance Manufacturing industry design and manufacture household appliances and hand tools, sold mainly through retail stores. Because appliances account for a large share of home energy and water use, consumers often buy with product efficiency and cost of ownership in mind and rely on third-party certifications such as Energy Star® and standards from the Association of Home Appliance Manufacturers. Product safety is also critical: malfunctions can cause property damage, injury, or death, exposing firms to litigation, and failure to report known hazards can bring civil penalties. Companies that dedicate resources to quality control and testing can minimize malfuncti
