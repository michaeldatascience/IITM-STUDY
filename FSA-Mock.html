ons and recalls.</p>\n<p>Company A's leadership is considering investing in heat pump technology for its tumble dryers, which could improve energy efficiency and achieve the highest efficiency rating on the market. Company A holds about 20 percent of the laundry appliance market, which is expected to grow at a 4.5 percent compound annual rate over five years, driven by smart and energy-efficient products. <strong>Leadership estimates</strong> the investment would raise Company A's Energy Star certified share to 60 percent within two years at an R&D cost of €0.9 million per year. Company C, with 100 percent certification, has the lowest revenue among the larger players but the highest operating margin in the group.</p>\n<table><thead><tr><th>Company</th><th>Percentage of eligible products by revenue certified to Energy Star®</th><th>Monetary losses from legal proceedings associated with product safety (€ millions)</th><th>Revenue (€ billions)</th></tr></thead><tbody>\n<tr><td>Company A</td><td>28%</td><td>2.80</td><td>15.99</td></tr><tr><td>Company B</td><td>40%</td><td>1.10</td><td>17.89</td></tr><tr><td>Company C</td><td>100%</td><td>–</td><td>8.20</td></tr><tr><td>Company D</td><td>0%</td><td>0.82</td><td>7.31</td></tr><tr><td>Company E</td><td>10%</td><td>2.50</td><td>11.58</td></tr><tr><td>Company F</td><td>25%</td><td>0.94</td><td>14.78</td></tr><tr><td>Company G</td><td>36%</td><td>1.60</td><td>15.60</td></tr><tr><td>Company H</td><td>85%</td><td>1.10</td><td>16.98</td></tr><tr><td>Company I</td><td>41%</td><td>2.90</td><td>21.32</td></tr><tr><td>Company J</td><td>45%</td><td>3.10</td><td>25.11</td></tr>\n<tr><td>Mean</td><td>41%</td><td>1.69</td><td>15.48</td></tr><tr><td>Median</td><td>38%</td><td>1.35</td><td>15.80</td></tr><tr><td>Standard deviation</td><td>30.7</td><td>0.93</td><td>5.48</td></tr>\n</tbody></table>","questions":[{"id":"I1","lo":6,"type":"single","text":"Assuming normal distribution, how should Company C's performance on the Energy Star® metric be described in terms of standard deviation?","options":{"a":"An outlier that should be excluded from the dataset","b":"Between 1 and 2 standard deviations above the mean","c":"Between 0 and 1 standard deviations above the mean","d":"More than 2 standard deviations above the mean"},"answer":["b"],"expl":{"a":"Incorrect. Outliers are investigated for company-specific context that explains them, not automatically excluded (Section 5.3.1). The case explains Company C's position through its product strategy.","b":"CORRECT. (100% − 41%) ÷ 30.7 = 1.92 standard deviations above the mean (Section 5.2; Practice Case 9, Question 27). Higher values are better for this metric, so Company C performs better than roughly 97 percent of peers.","c":"Incorrect. One standard deviation above the mean would be 71.7 percent; Company C is well beyond it.","d":"Incorrect. 1.92 is just under two standard deviations."}},{"id":"I2","lo":4,"type":"multi","choose":2,"text":"Which two of the five factors most inform an evaluation of Company A's heat pump investment for the issue of product design and lifecycle management? (Choose two.)","options":{"a":"Opportunities for innovation","b":"Compound annual growth rate","c":"Legal, regulatory, and policy drivers","d":"Third-party certification uptake","e":"Stakeholder concerns and social trends"},"answer":["a","e"],"expl":{"a":"CORRECT. This factor relates to competitive advantage from new technology and products (Section 3.1). The heat pump investment is exactly that, in a market the case says is growing because of energy-efficient products.","b":"Incorrect. This is not one of the five factors (Section 3.1).","c":"Incorrect. The case describes regulation and penalties only for product safety, not for product efficiency; Energy Star is a voluntary third-party certification.","d":"Incorrect. This is not one of the five factors (Section 3.1).","e":"CORRECT. This factor relates to the interests of customers and the public that shift demand (Section 3.1). The case states consumers decide with efficiency and cost of ownership in mind and rely on certifications."}},{"id":"I3","lo":10,"type":"single","text":"Which conclusion about a DCF valuation of Company A is best supported if the investment proceeds?","options":{"a":"Higher near-term cash flows, because certification immediately raises prices","b":"No change, because R&D is not a channel of financial impact","c":"Lower near-term cash flows from R&D expense, with higher growth projections once the products reach market","d":"A higher discount rate, because R&D spending increases perceived risk"},"answer":["c"],"expl":{"a":"Incorrect. The products reach market in 1.5 years; near-term cash flows fall before any revenue benefit.","b":"Incorrect. R&D is an expense, one of the core channels (Section 8.2.1.2).","c":"CORRECT. R&D of €0.9 million per year is an expense that reduces cash flow in the forecast period (Section 8.2.1.2). Raising the certified share to 60 percent, well above the 41 percent mean, positions Company A to capture share in a market growing 4.5 percent annually, which informs higher growth projections (Section 8.2.3; Practice Case 9, Question 26).","d":"Incorrect. Nothing in the case links the investment to greater volatility or risk perceived by investors (Section 8.2.2)."}},{"id":"I4","lo":9,"type":"single","text":"Company C combines 100 percent Energy Star certification with the highest operating margin in the group. Using the ROIC framework, what does this most likely indicate?","options":{"a":"No competitive advantage, since Company C has the lowest revenue among larger players","b":"A production advantage, since improved ROIC through turnover ratio signals lower input costs","c":"A production advantage, since certification reduces manufacturing costs","d":"A consumer advantage, since improved ROIC through operating margin signals customers prefer and pay for its products"},"answer":["d"],"expl":{"a":"Incorrect. Revenue scale does not determine competitive advantage; the guide's tests are whether ROIC exceeds cost of capital and peers (Section 9.1.1).","b":"Incorrect. A production advantage is signaled through turnover ratio (sales ÷ invested capital), and the case provides no invested capital data or evidence of lower input costs.","c":"Incorrect. Nothing in the case links certification to lower manufacturing costs; the case links efficiency to consumer purchase decisions.","d":"CORRECT. Section 9.1.1 states that where sustainability information improves ROIC through operating margin (NOPAT ÷ sales), it signals the company is managing sustainability to gain a consumer advantage, which exists where customers habitually use a product. Company C's fully certified line and superior margin fit that pattern."}}]},{"id":"J","title":"Case 10: Airlines Industry","built":"New case built on the study guide's airline example (Section 3.1)","body":"<p>In the Airlines industry, fuel spend accounts for more than 20 percent of industry costs, and fuel prices are very volatile, so fuel as a share of costs often directly determines whether a company is profitable. Given the industry's fuel intensity, it is subject to global regulation limiting GHG emissions. The Carbon Offsetting and Reduction Scheme for International Aviation (CORSIA), established by the International Civil Aviation Organization in 2019, requires airlines to disclose GHG emissions and to purchase offsets for emissions from international flights above a baseline.</p>\n<p>Company A operates a large international network with an older fleet; 70 percent of its revenue comes from international routes. Company B is a regional carrier with a newer, more fuel-efficient fleet; 15 percent of its revenue comes from international routes. Available seat kilometers (ASK) is the industry activity metric measuring capacity: one seat flown one kilometer.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Available seat kilometers (billions)</td><td>200</td><td>205</td><td>80</td><td>90</td></tr>\n<tr><td>Fuel consumed (million gigajoules)</td><td>250</td><td>252</td><td>88</td><td>94</td></tr>\n<tr><td>Gross global Scope 1 emissions (million metric tons)</td><td>18.0</td><td>18.1</td><td>6.3</td><td>6.7</td></tr>\n<tr><td>Fuel cost as percentage of operating expenses</td><td>24%</td><td>27%</td><td>21%</td><td>22%</td></tr>\n<tr><td>CORSIA offset purchases ($ millions)</td><td>0</td><td>60</td><td>0</td><td>4</td></tr>\n</tbody></table>","questions":[{"id":"J1","lo":4,"type":"multi","choose":2,"text":"Which two of the five factors most clearly explain how GHG emissions affect the financial performance of airlines, based on the case? (Choose two.)","options":{"a":"Legal, regulatory, and policy drivers","b":"Direct financial impacts and risk","c":"Opportunities for innovation","d":"Stakeholder concerns and social trends","e":"Industry norms, best practices, and competitive drivers"},"answer":["a","b"],"expl":{"a":"CORRECT. CORSIA is existing global regulation requiring disclosure and offset purchases (Section 3.1, Factor 2, where the guide presents this example).","b":"CORRECT. Fuel is more than 20 percent of costs and directly determines profitability; it is captured in an existing expense line item, the test for this factor (Section 3.1). The guide uses exactly this airline example under Factor 2 to illustrate an indirect financial impact of regulation.","c":"Incorrect. Although a newer fleet is more efficient, the case does not describe innovation creating competitive advantage; it describes cost and regulation.","d":"Incorrect. The case gives no information about passenger, NGO, or public concern driving airline behavior.","e":"Incorrect. No peer practices or disclosure norms are described."}},{"id":"J2","lo":2,"type":"single","text":"Company A's 70 percent international revenue share exposes it more than Company B to which component of the external operating context, and why?","options":{"a":"Economic climate, because international routes are priced in foreign currencies","b":"Operating location(s), because Company A's aircraft are based abroad","c":"Business climate, because international routes face more competitors","d":"Regulatory climate, because CORSIA offset requirements apply to international flights"},"answer":["d"],"expl":{"a":"Incorrect. The economic climate covers taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2). The case does not mention currency, and the differentiating fact is regulation.","b":"Incorrect. The case does not say where aircraft are based, and the exposure described comes from the regulation applied to international flights.","c":"Incorrect. Business climate concerns competitive forces (Section 1.2.2.1); the case gives no information about competition on international routes.","d":"CORRECT. Regulatory climate is defined by the presence of regulation and its enforcement (Section 1.2.2.3). CORSIA applies to emissions from international flights, so the share of international operations determines exposure: Company A paid $60 million in offsets in Year 2 against Company B's $4 million."}},{"id":"J3","lo":7,"type":"single","text":"Normalizing fuel consumption by available seat kilometers, which statement is accurate?","options":{"a":"Company A is more fuel-efficient because its total fuel consumption rose less","b":"Both companies' fuel efficiency worsened from Year 1 to Year 2","c":"The companies cannot be compared without revenue data","d":"Company B uses less fuel per ASK and improved more than Company A from Year 1 to Year 2"},"answer":["d"],"expl":{"a":"Incorrect. Absolute fuel consumption does not account for capacity (Section 4.1). Company A: 250 ÷ 200 = 1.25 million GJ per billion ASK in Year 1, 252 ÷ 205 = 1.23 in Year 2. Company B: 88 ÷ 80 = 1.10, then 94 ÷ 90 = 1.04.","b":"Incorrect. Both companies improved on a normalized basis.","c":"Incorrect. The activity metric provided (ASK) is the appropriate normalization measure; revenue is not needed (Section 4.2).","d":"CORRECT. As calculated above, Company B consumes less fuel per unit of capacity in both years and improved by about 5 percent versus about 2 percent for Company A, consistent with its newer fleet. ASK is the industry's activity metric for scale (Section 4.2)."}},{"id":"J4","lo":9,"type":"single","text":"Through which channel of financial impact do Company A's CORSIA offset purchases most directly affect its financial performance?","options":{"a":"Expenses","b":"Liabilities","c":"Cost of capital","d":"Assets"},"answer":["a"],"expl":{"a":"CORRECT. Offset purchases are a cost incurred to comply with regulation; sustainability-related expenses commonly take the form of operating expenses (Section 8.2.1.2). Company A recorded $60 million in Year 2.","b":"Incorrect. Liabilities are future financial obligations and legal risks (Section 8.2.1.4). Offsets already purchased are an incurred cost, not a future obligation.","c":"Incorrect. Cost of capital may change if the company's risk profile changes (Section 8.2.2), but the offset purchases themselves are a direct cost.","d":"Incorrect. Nothing in the case links offsets to the value of Company A's assets (Section 8.2.1.3)."}},{"id":"J5","lo":10,"type":"single","text":"A user builds a scenario in which the price of CORSIA-eligible offsets doubles by Year 5 and models the effect on Company A. Which type of scenario is this, and where would the effect be reflected in a DCF model?","options":{"a":"A normative scenario; in the discount rate","b":"An exploratory scenario; in cash flow projections through higher expenses","c":"An exploratory scenario; in the book value of aircraft","d":"A normative scenario; in the terminal growth rate"},"answer":["b"],"expl":{"a":"Incorrect. The scenario is exploratory, and its primary effect is on cash flows, not the required rate of return.","b":"CORRECT. Exploratory scenarios describe possible future states and test options within them, such as the guide's sea-level-rise example (Section 9.2.2). A doubling of offset prices raises Company A's compliance costs, which enter the model through expense projections (Sections 8.2.1.2 and 9.2.2.1).","c":"Incorrect. Offset prices do not change the recorded value of aircraft (Section 8.2.1.3).","d":"Incorrect. Normative scenarios plan toward a specific target, such as net-zero by a given year (Section 9.2.2). An offset price assumption is not a target; and the effect is on costs, not growth."}}]},{"id":"K","title":"Case 11: Oil & Gas – Midstream Industry","built":"New case built on the study guide's midstream example (Section 8.2.1.4)","body":"<p>The Oil & Gas – Midstream industry transports oil and gas through pipelines and other means, a mode of transport that comes with ecological risks from spills. Spills can lead to sizable litigation liabilities and cleanup costs; hydrocarbon lost to a spill cannot earn revenue; and companies may incur added operating expenses, such as pipeline maintenance, to manage operational risk. Spills are acute events that are low likelihood but may have high-magnitude impacts, and the actual magnitude can only be interpreted from performance data: a few small spills outside sensitive areas differ greatly from a large spill in an unusually sensitive area (USA).</p>\n<p>Company A operates 15,000 km of pipeline. Company B operates 9,000 km of pipeline and also runs a small refining segment that contributes 18 percent of its revenue. In Year 2, Company B experienced a major spill in a protected river basin classified as an unusually sensitive area.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company A</th><th colspan=\"3\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Number of hydrocarbon spills</td><td>12</td><td>10</td><td>11</td><td>2</td><td>1</td><td>1</td></tr>\n<tr><td>Aggregate volume of spills (barrels)</td><td>800</td><td>650</td><td>720</td><td>150</td><td>9,500</td><td>120</td></tr>\n<tr><td>Volume in unusually sensitive areas (barrels)</td><td>0</td><td>0</td><td>0</td><td>0</td><td>6,000</td><td>0</td></tr>\n<tr><td>Volume recovered</td><td>70%</td><td>72%</td><td>75%</td><td>60%</td><td>35%</td><td>58%</td></tr>\n<tr><td>Pipeline maintenance expense ($ millions)</td><td>210</td><td>230</td><td>245</td><td>95</td><td>98</td><td>100</td></tr>\n<tr><td>Provisions for spill-related litigation ($ millions)</td><td>5</td><td>4</td><td>4</td><td>1</td><td>180</td><td>60</td></tr>\n</tbody></table>","questions":[{"id":"K1","lo":8,"type":"multi","choose":2,"text":"Which two statements accurately characterize the nature of the financial impacts associated with spills for each company? (Choose two.)","options":{"a":"Company A faces progressive impacts; Company B faces acute impacts","b":"Company A faces acute impacts; Company B faces progressive impacts","c":"Company A faces high-likelihood impacts; Company B faces low-likelihood impacts","d":"Both companies face impacts of equally high magnitude","e":"Company A faces low-likelihood impacts; Company B faces high-likelihood impacts"},"answer":["a","c"],"expl":{"a":"CORRECT. Company A records ten to twelve small spills every year with rising maintenance costs, a recurring, lower-magnitude pattern that is commonly treated as an operational cost of doing business, which is progressive (Section 7.2.2). Company B's single 9,500-barrel spill in a sensitive area is a one-time, high-magnitude event, which is acute. This mirrors Practice Case 8, Question 23.","b":"Incorrect. The opposite is true, as explained in Option A.","c":"CORRECT. Time-series data indicate likelihood (Section 7.2.1.1). Company A's spills occur every year and are therefore high likelihood; Company B's large spill is a rare event, and the guide characterizes spills of this kind as low likelihood but high magnitude (Section 8.2.1.4).","d":"Incorrect. Magnitude must be read from the data (Section 7.2.1.3): Company A's spills total 650 to 800 barrels per year with no sensitive-area volume and small provisions, while Company B's Year 2 spill was 9,500 barrels, 6,000 of them in a sensitive area, with $180 million in provisions.","e":"Incorrect. The opposite is true, as explained in Option C."}},{"id":"K2","lo":9,"type":"multi","choose":3,"text":"Company B's Year 2 spill most directly affected which three channels of financial impact? (Choose three.)","options":{"a":"Economic value added","b":"Expenses","c":"Cost of capital","d":"Turnover ratio","e":"Liabilities"},"answer":["b","c","e"],"expl":{"a":"Incorrect. Economic value added is a valuation tool informed by the channels (Section 9.1.2), not a channel itself.","b":"CORRECT. Cleanup costs are incurred, and only 35 percent of the volume was recovered; the guide identifies cleanup and added maintenance as expenses associated with spills (Section 8.2.1.4).","c":"CORRECT. Section 8.2.1.4 states that the number and severity of spills may prompt a user to perceive the company as risky and increase the discount rate, meaning cost of capital is a channel affected by this issue (Section 8.2.2).","d":"Incorrect. Turnover ratio is a component of ROIC (Section 9.1.1), not a channel of financial impact.","e":"CORRECT. Provisions for spill-related litigation rose from $1 million to $180 million; the guide states that spills lead to sizable litigation liabilities (Section 8.2.1.4)."}},{"id":"K3","lo":10,"type":"multi","choose":2,"text":"A user is updating a DCF model of Company A. Which two adjustments are best supported by Company A's three-year record? (Choose two.)","options":{"a":"Higher expense projections during the forecast period","b":"Increase in the value of intangible assets","c":"Higher discount rate","d":"Lower expense projections","e":"Higher terminal growth rate"},"answer":["a","c"],"expl":{"a":"CORRECT. Company A's maintenance expense rose from $210 million to $245 million while spills continued. Section 8.2.1.4 states that a progressive near- or mid-term impact of this kind might call for an adjustment to expense projections during the forecast period.","b":"Incorrect. Recurring spills do not enhance brand or other intangible assets (Section 8.2.1.3).","c":"CORRECT. The same section states that the number of spills reported might prompt a user to perceive the company as risky and increase the discount rate. Ten or more spills every year supports that adjustment even though each is small.","d":"Incorrect. Expenses are rising, not falling.","e":"Incorrect. Nothing in the case indicates Company A is positioned to capture an expanding market (Section 8.2.3)."}},{"id":"K4","lo":3,"type":"single","text":"Under which general issue category and sustainability dimension does the spills metric fall?","options":{"a":"Critical Incident Risk Management, under Leadership & Governance","b":"Physical Impacts of Climate Change, under Business Model & Innovation","c":"Waste & Hazardous Materials Management, under Environment","d":"Ecological Impacts, under Environment"},"answer":["d"],"expl":{"a":"Incorrect. Critical Incident Risk Management concerns operational safety and workforce management where workers face physical risk (Practice Case 8, Question 24 explanation; Section 2.1.5). The metric measures environmental harm.","b":"Incorrect. Physical Impacts of Climate Change concerns exposure to climate hazards (Section 2.1.4), not spills caused by operations.","c":"Incorrect. Waste & Hazardous Materials Management addresses waste generated in operations, such as the hazardous waste in Practice Case 8; a hydrocarbon spill into the environment is an ecological impact.","d":"CORRECT. The guide presents the midstream spills metric under the general issue category Ecological Impacts (Section 8.2.1.4), which is listed in the Environment dimension in Table 1 (Section 2.1)."}},{"id":"K5","lo":1,"type":"single","text":"Company B's refining segment contributes 18 percent of its revenue. How should this influence the sustainability topics a user evaluates for Company B?","options":{"a":"Reference the Oil & Gas – Refining & Marketing Standard in addition to the Midstream Standard, because a significant revenue stream falls outside the midstream profile","b":"Make no change unless the refinery is located in a different jurisdiction","c":"Ignore the refining segment because it is a main input rather than a revenue stream","d":"Replace the Midstream Standard with the Refining & Marketing Standard because refining carries greater environmental risk"},"answer":["a"],"expl":{"a":"CORRECT. Section 1.2.1.1 lists separate SASB Standards for Oil & Gas – Exploration & Production, Midstream, and Refining & Marketing, and uses an integrated company as its example of one whose operations span several industries and therefore multiple Standards. Refining at 18 percent of revenue is a significant stream outside the midstream profile.","b":"Incorrect. Operating location is an external factor (Section 1.2.2.4) and does not determine whether an additional industry Standard applies.","c":"Incorrect. Refining generates revenue; it is not an input. Major revenue streams are the relevant internal factor (Section 1.2.1.1).","d":"Incorrect. Pipelines remain 82 percent of revenue; the primary Standard is supplemented, not replaced."}}]},{"id":"L","title":"Case 12: Semiconductors Industry","built":"New case built on the study guide's semiconductor example (Section 1.2.1.2)","body":"<p>Semiconductor manufacturing relies on a healthy labor force as a main input for value creation, because the manufacturing process exposes workers to chemicals that can pose significant health risks. The SASB Semiconductors Standard assumes companies operate their own manufacturing facilities, as many of the largest do, and because those companies control their workplaces the Standard includes a disclosure topic and metrics on employee health and safety. However, some semiconductor companies outsource manufacturing and do not directly control factory working conditions.</p>\n<p>Company A is an integrated manufacturer operating six of its own fabrication plants. Company B is a fabless company that designs chips and outsources 100 percent of production to two foundry suppliers, both located in a single country. That country has announced new occupational chemical-exposure rules, with mandatory workplace audits taking effect next year.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Fabrication plants owned</td><td>6</td><td>6</td><td>0</td><td>0</td></tr>\n<tr><td>Manufacturing employees</td><td>20,000</td><td>20,500</td><td>0</td><td>0</td></tr>\n<tr><td>Total recordable incident rate (manufacturing)</td><td>0.9</td><td>0.8</td><td>n.a.</td><td>n.a.</td></tr>\n<tr><td>Percentage of production outsourced</td><td>0%</td><td>0%</td><td>100%</td><td>100%</td></tr>\n<tr><td>Number of foundry suppliers</td><td>–</td><td>–</td><td>2</td><td>2</td></tr>\n<tr><td>Suppliers audited for working conditions</td><td>–</td><td>–</td><td>0</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"L1","lo":1,"type":"single","text":"How should the relevance of the Employee Health & Safety topic differ between Company A and Company B?","options":{"a":"It is irrelevant to both, because chemical exposure is a regulatory matter","b":"It is more relevant to Company B, because outsourcing increases its direct workplace risk","c":"It is equally relevant to both, because they are in the same SICS industry","d":"It is directly relevant to Company A, which controls its plants; for Company B the issue shifts to how it manages working conditions at its suppliers"},"answer":["d"],"expl":{"a":"Incorrect. The Standard includes the topic precisely because worker exposure affects the main input for value creation.","b":"Incorrect. Company B has no manufacturing employees and no direct workplace risk; its exposure is indirect, through suppliers.","c":"Incorrect. Section 1.2.1.2 states that a company's main inputs can make it differ from its industry profile; a fabless company does not have the manufacturing workforce the Standard assumes.","d":"CORRECT. The guide's own semiconductor example (Section 1.2.1.2) explains that the Standard's employee health and safety topic assumes companies control their workplaces, and that companies which outsource manufacturing do not directly control factory conditions. For Company B, worker exposure occurs at its foundries, so the relevant question becomes supplier management."}},{"id":"L2","lo":3,"type":"single","text":"Which general issue category best captures Company B's exposure to working conditions at its foundries, and under which sustainability dimension does it fall?","options":{"a":"Employee Health & Safety, under Human Capital","b":"Business Model Resilience, under Business Model & Innovation","c":"Labor Practices, under Human Capital","d":"Supply Chain Management, under Business Model & Innovation"},"answer":["d"],"expl":{"a":"Incorrect. Human Capital issues concern a company's own workforce (Section 2.1.3). Company B has no manufacturing employees.","b":"Incorrect. Business Model Resilience concerns a company's ability to adapt its business model to sustainability trends (Section 2.1.4), not supplier working conditions.","c":"Incorrect. Labor Practices concerns the company's own employees' wages and conditions (Section 2.1.3).","d":"CORRECT. Supply Chain Management, listed under Business Model & Innovation in Table 1 (Section 2.1), addresses the management of risks in a company's supply chain. The guide notes that for a company outsourcing manufacturing, the relevant disclosure shifts away from direct workplace metrics (Section 1.2.1.2)."}},{"id":"L3","lo":2,"type":"single","text":"The new occupational chemical-exposure rules most directly affect which component of external operating context, and which company faces greater near-term exposure?","options":{"a":"Operating location(s); Company A, because it owns its plants","b":"Business climate; both companies equally","c":"Regulatory climate; Company B, because all of its production runs through two suppliers in that jurisdiction","d":"Regulatory climate; Company A, because it employs more manufacturing workers"},"answer":["c"],"expl":{"a":"Incorrect. The differentiating fact is the regulation, not physical location alone, and Company A's locations are not given.","b":"Incorrect. Business climate concerns competitive forces (Section 1.2.2.1), and the exposure is not equal.","c":"CORRECT. The rules are new regulation with mandatory audits, defining the regulatory climate (Section 1.2.2.3). The case says nothing about where Company A's plants are located, whereas 100 percent of Company B's production is in the affected country, concentrated in two suppliers. Compliance costs or disruption at those foundries directly affect Company B's supply.","d":"Incorrect. The case does not place Company A's plants in that jurisdiction, so no exposure is established."}},{"id":"L4","lo":7,"type":"single","text":"Company A's recordable incident rate improved from 0.9 to 0.8, while Company B reports no incident data. How should a user compare the two companies' health and safety performance?","options":{"a":"Company A underperforms Company B because it records injuries","b":"Company A's incidents should be normalized by revenue before comparison","c":"Company A's improvement can be assessed against its own past performance; Company B's absence of data prevents peer comparison and is a data gap, not evidence of superior performance","d":"Company B outperforms Company A, since it reports no incidents"},"answer":["c"],"expl":{"a":"Incorrect. Recording incidents is not evidence of worse performance than a company that does not measure them.","b":"Incorrect. The incident rate is already a normalized ratio (Section 4.1), and revenue is not a meaningful denominator for injuries; workforce size is (Section 4.2).","c":"CORRECT. Comparative analysis includes evaluation against a company's own past performance (Sections 4.3 and 4.3.1), which is possible for Company A. Peer comparison requires comparable data (Section 5.4); Company B has audited none of its suppliers, so a user has no basis to compare.","d":"Incorrect. Non-disclosure is not zero performance. The Practice Case 8 answer key states that the relevance of an issue is not determined by a company's decision to disclose it."}}]},{"id":"M","title":"Case 13: Automobiles Industry","built":"New case built on the study guide's automobiles examples (Sections 4.2, 4.3 and 5.3.1)","body":"<p>Automobiles companies use significant amounts of steel, iron, aluminum, and plastics. Companies that reuse or recycle waste can achieve cost savings, generate additional revenue, and mitigate the risk of regulatory action or supply scarcity. Fuel efficiency regulation aims to reduce emissions either by mandating a minimum distance per unit of fuel (a floor, where data is reported in km/L) or by capping emissions per distance (a ceiling, where data is reported in gCO₂/km). When a company's fleet fuel efficiency is close to the regulatory standard, it is exposed to non-compliance risk if the standard becomes stricter; when performance falls in the tail of the distribution, the company has a competitive advantage that may allow pricing power and greater market share. Product safety is heavily regulated, and recalls carry direct costs and reputational consequences.</p>\n<p>Companies A and B sell most of their vehicles in a region that requires a sales-weighted fleet average of at least 18 km/L, rising to 20 km/L in two years. Ten manufacturers selling in that region report a mean fleet fuel economy of 19.6 km/L, a median of 18.9, and a standard deviation of 1.5.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Vehicles produced</td><td>2,000,000</td><td>2,100,000</td><td>800,000</td><td>900,000</td></tr>\n<tr><td>Sales-weighted average fleet fuel economy (km/L)</td><td>18.4</td><td>18.7</td><td>22.5</td><td>23.1</td></tr>\n<tr><td>Weight of end-of-life material recovered (metric tons)</td><td>120,000</td><td>130,000</td><td>40,000</td><td>50,000</td></tr>\n<tr><td>Number of vehicles recalled</td><td>600,000</td><td>450,000</td><td>6,000</td><td>5,000</td></tr>\n</tbody></table>","questions":[{"id":"M1","lo":5,"type":"single","text":"Normalized by vehicles produced, which company recovered more end-of-life material per vehicle in Year 2?","options":{"a":"Company B","b":"The two companies are equal","c":"Company A","d":"Revenue data is required to compare"},"answer":["c"],"expl":{"a":"Incorrect. Company B improved from 0.050 to 0.056 metric tons per vehicle, but remains below Company A.","b":"Incorrect. The normalized values differ, as calculated above.","c":"CORRECT. The guide's own example (Section 4.2) states that for this metric the number of vehicles produced is likely the most appropriate normalization factor, because materials efficiency provides insight into cost savings and supply risk. Company A: 130,000 ÷ 2,100,000 = 0.062 metric tons per vehicle. Company B: 50,000 ÷ 900,000 = 0.056.","d":"Incorrect. The guide identifies vehicles produced, not revenue, as the appropriate normalization measure for this metric (Section 4.2)."}},{"id":"M2","lo":6,"type":"single","text":"Assuming normal distribution, how should Company A's Year 2 fleet fuel economy be described in terms of standard deviation from the regional mean?","options":{"a":"Between 1 and 2 standard deviations below the mean","b":"Between 0 and 1 standard deviations above the mean","c":"Between 0 and 1 standard deviations below the mean","d":"Between 1 and 2 standard deviations above the mean"},"answer":["c"],"expl":{"a":"Incorrect. See Option C.","b":"Incorrect. Company A's 18.7 km/L is below the 19.6 mean.","c":"CORRECT. (18.7 − 19.6) ÷ 1.5 = −0.6 standard deviations, between 0 and 1 below the mean (Section 5.2; Practice Case 9, Question 27). Company B, at (23.1 − 19.6) ÷ 1.5 = 2.3, is more than two standard deviations above the mean.","d":"Incorrect. See Option C."}},{"id":"M3","lo":7,"type":"single","text":"Considering the regulatory standard that rises to 20 km/L in two years, which conclusion about the two companies is best supported?","options":{"a":"Company A's higher material recovery per vehicle offsets its fuel economy risk","b":"Company B faces greater risk because it produces fewer vehicles","c":"Both companies currently comply, so there is no difference in risk","d":"Company A faces risk of non-compliance as the standard tightens, while Company B's position in the upper tail is a competitive advantage"},"answer":["d"],"expl":{"a":"Incorrect. Materials efficiency and fuel economy are different sustainability issues affecting different financial channels; performance on one does not offset regulatory risk on the other.","b":"Incorrect. Production scale does not determine compliance risk; the fleet-average metric is already normalized.","c":"Incorrect. Regulatory climate includes possible future regulation (Section 1.2.2.3), and the higher standard is already announced.","d":"CORRECT. The case (from Section 4.3) states that a company clustered just above a mandated limit is exposed to non-compliance risk if the standard becomes stricter, while a company in the tail of the distribution has a competitive advantage that could allow pricing power and market share. Company A at 18.7 km/L is below the coming 20 km/L floor; Company B at 23.1 is well above it."}},{"id":"M4","lo":2,"type":"single","text":"Which component of Company A's external operating context most directly determines whether its fuel economy performance represents a near-term financial risk?","options":{"a":"Operating scale","b":"Regulatory climate","c":"Business climate","d":"Economic climate"},"answer":["b"],"expl":{"a":"Incorrect. Operating scale is not one of the four components of external operating context (business, economic, regulatory climate and operating location; Section 1.2.2).","b":"CORRECT. Whether 18.7 km/L is a risk depends entirely on the presence and stringency of the regional standard and its planned tightening, which define the regulatory climate (Section 1.2.2.3). The same performance in a region with a lower floor would carry no compliance risk.","c":"Incorrect. Business climate concerns competition and peer behavior (Section 1.2.2.1); the near-term risk described is a penalty for non-compliance, not competition.","d":"Incorrect. The economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2). Fuel prices could matter to consumer demand but the case frames the risk as regulatory."}},{"id":"M5","lo":4,"type":"multi","choose":2,"text":"For the issue of product safety, which two of the five factors most inform an analysis of Company A's recall data? (Choose two.)","options":{"a":"Legal, regulatory, and policy drivers","b":"Direct financial impacts and risk","c":"Number of vehicles produced","d":"Opportunities for innovation","e":"Dealer network density"},"answer":["a","b"],"expl":{"a":"CORRECT. Section 3.1 lists vehicle safety among topics with a history of regulation under this factor, and the case states product safety is heavily regulated.","b":"CORRECT. Recalls carry direct costs that appear in a company's financial statements, the test for this factor (Section 3.1). Company A recalled 450,000 vehicles in Year 2.","c":"Incorrect. This is an activity metric, not one of the five factors (Sections 3.1 and 4.2).","d":"Incorrect. This factor relates to competitive advantage from new technology (Section 3.1). The case gives no evidence that innovation relates to Company A's recalls.","e":"Incorrect. This is not one of the five factors (Section 3.1)."}}]}];
const CASES2=[{"id":"T2A","title":"Case 1: Waste Management Industry","built":"From the Part II Putting It Into Practice study","body":"<p>Companies in the Waste Management industry collect, store, dispose of, recycle, or treat waste for residential, municipal, and commercial clients. Major companies are vertically integrated from collection to landfilling and recycling. Landfills generate landfill gas (LFG) containing methane, and given methane's high global warming potential, federal regulations limit LFG emissions. Several years ago, regulation required landfill operators to install LFG-capture systems at any landfill exceeding 150,000 net MMBtu of LFG per year. Further caps on total methane emissions from landfills may be instituted in the future.</p>\n<p>LFG-capture systems require initial capital expenditure and ongoing maintenance, but captured gas can be refined and sold for revenue or used as energy to fuel operations. Captured methane can also be flared to reduce its toxicity and potency. Shifting customer sentiment, rising raw-material costs, and regulation have increased focus on the industry's role in the circular economy, and companies face an expanding market for services that divert waste from landfills.</p>\n<p>An analyst evaluating a single company has the following data:</p>\n<table><thead><tr><th>Metric</th><th>Year 1</th><th>Year 2</th></tr></thead><tbody>\n<tr><td>Total landfill gas generated (MMBtu)</td><td>2,600,000</td><td>2,908,000</td></tr>\n<tr><td>Percentage flared</td><td>9%</td><td>10%</td></tr>\n<tr><td>Percentage used for energy</td><td>45%</td><td>50%</td></tr>\n<tr><td>Net LFG generated, reaching the atmosphere (MMBtu)</td><td>1,404,000</td><td>1,599,400</td></tr>\n<tr><td>Revenue ($ millions)</td><td>1.8</td><td>2.1</td></tr>\n<tr><td>Number of landfills</td><td>15</td><td>15</td></tr>\n<tr><td>Vehicle fleet size</td><td>2,000</td><td>2,005</td></tr>\n<tr><td>Number of municipal clients served</td><td>750</td><td>840</td></tr>\n</tbody></table>","questions":[{"id":"T2A1","lo":5,"type":"single","text":"Which metric in the data would not serve as a useful measure for normalizing total landfill gas generated?","options":{"a":"Number of municipal clients served","b":"Vehicle fleet size","c":"Number of landfills","d":"Revenue"},"answer":["b"],"expl":{"a":"Incorrect. Clients served reflects the volume of waste handled and is a reasonable, if indirect, measure of scale.","b":"CORRECT. The case describes LFG as the product of natural decomposition in landfills. Vehicle fleet size has no influence on landfill gas generation, so normalizing by it would produce no insight (Section 4.2). The guide's own answer key for this study makes exactly this point.","c":"Incorrect. Landfills are where LFG is generated, so the number of landfills reflects the scale of the activity that produces the emissions.","d":"Incorrect. Environmental metrics are often best normalized on a revenue or production basis (Section 4.2); revenue gives insight into economic efficiency of emissions."}},{"id":"T2A2","lo":5,"type":"single","text":"Which statement accurately describes the company's year-over-year performance on total landfill gas generated when normalized?","options":{"a":"Per dollar of revenue it improved, from 1.44 to 1.38 MMBtu per dollar, while per landfill it worsened, from about 173,000 to 194,000 MMBtu","b":"It worsened on both a revenue and a per-landfill basis","c":"It improved on both a revenue and a per-landfill basis","d":"Per dollar of revenue it worsened, while per landfill it improved"},"answer":["a"],"expl":{"a":"CORRECT. Revenue basis: 2,600,000 ÷ 1,800,000 = 1.44 and 2,908,000 ÷ 2,100,000 = 1.38 MMBtu per dollar, an improvement in economic efficiency. Landfill basis: 2,600,000 ÷ 15 = 173,333 and 2,908,000 ÷ 15 = 193,867 MMBtu per landfill, a deterioration. Different normalization measures yield different insights (Section 4.2; guide answer key for this study).","b":"Incorrect. Gas per dollar of revenue fell, because revenue grew faster than gas generated.","c":"Incorrect. Gas per landfill rose because total gas rose with no change in the number of landfills.","d":"Incorrect. The directions are reversed, as calculated in Option A."}},{"id":"T2A3","lo":2,"type":"single","text":"Which statement best describes the company's regulatory exposure related to landfill gas?","options":{"a":"The company is in violation because total net LFG exceeds 150,000 MMBtu","b":"On average its landfills fall below the 150,000 net MMBtu capture threshold, but compliance cannot be confirmed without landfill-level data, and future methane caps represent potential regulation","c":"The company faces no regulatory risk because it already uses capture systems","d":"The threshold applies to total gas generated, so every landfill must have a capture system"},"answer":["b"],"expl":{"a":"Incorrect. The threshold applies per landfill, not to company totals.","b":"CORRECT. Net LFG of 1,599,400 MMBtu across 15 landfills averages about 106,600 per landfill, below the 150,000 threshold, but an average can conceal individual landfills above it. The regulatory climate includes both current regulation and possible future regulation (Section 1.2.2.3), and the case states that further caps may be instituted.","c":"Incorrect. The case says further caps may be instituted; possible future regulation is part of regulatory risk (Section 1.2.2.3).","d":"Incorrect. The regulation is defined on net LFG per landfill exceeding the threshold, not total gas generated company-wide."}},{"id":"T2A4","lo":8,"type":"single","text":"Which of the following metrics captures an opportunity?","options":{"a":"Total landfill gas generated","b":"Number of landfills","c":"Percentage of landfill gas used for energy","d":"Net LFG generated"},"answer":["c"],"expl":{"a":"Incorrect. Higher values indicate more emissions and greater regulatory exposure, so this captures a risk (Section 7.1).","b":"Incorrect. This is an activity metric used for context and normalization (Section 4.2), not an ESG performance metric.","c":"CORRECT. The case states captured gas can be refined and sold for revenue or used to fuel operations. Higher values therefore indicate improved economic performance, the guide's test for a metric that measures an opportunity (Section 7.1).","d":"Incorrect. Higher values mean more gas reaching the atmosphere, a risk."}},{"id":"T2A5","lo":10,"type":"multi","choose":2,"text":"Based on the case, which two DCF adjustments are best supported for this company? (Choose two.)","options":{"a":"Lower capital expenditure projections","b":"Decrease in the book value of intangible assets","c":"Higher growth projections, reflecting the expanding market for landfill-diversion services","d":"Higher revenue projections from the sale or use of captured gas","e":"Higher discount rate"},"answer":["c","d"],"expl":{"a":"Incorrect. The case says capture systems require initial capital expenditure and ongoing maintenance; nothing supports lowering CapEx.","b":"Incorrect. Nothing in the case relates to intangible asset value (Section 8.2.1.3).","c":"CORRECT. The case says companies face an expanding market for services that divert waste from landfills. Growth projections reflect a company's position within an expanding market (Section 8.2.3).","d":"CORRECT. Captured gas can be sold for revenue or used as energy, reducing fuel costs; the share used for energy rose from 45 to 50 percent. This informs revenue and expense projections (Section 8.2.1).","e":"Incorrect. No information in the case suggests increased risk perceived by investors (Section 8.2.2)."}}]},{"id":"T2B","title":"Case 2: Hotels & Lodging Industry","built":"From the Part III Putting It Into Practice study","body":"<p>Companies in the Hotels & Lodging industry provide overnight accommodation to business and leisure travelers. The industry is primarily large chains competing on quality and consistency of service, availability of locations, price, loyalty programs, and amenities. It relies heavily on human capital; many staff are part-time, seasonal, or immigrant workers, and the industry is often a workforce entry point for youths, women, and migrants. As such it faces significant risks related to fair labor practices: workers are commonly mistreated and discriminated against in wages and advancement, which can lead to burdensome lawsuits, low job satisfaction, high turnover, and low morale, a key component of guest experience. High turnover adds to the already large cost of wages.</p>\n<p>Voluntary and involuntary turnover rates indicate how well companies manage their workforce; involuntary turnover serves as a proxy for staff engagement. Fines and settlements from labor law violations are a lagging indicator of management of the issue. Failure to address fair compensation can lead to increased minimum-wage regulation. In the UK, the national minimum wage is adjusted each year; non-payment carries a maximum fine of £20,000 per worker, employers can be named publicly, and culpable directors can be banned for up to 15 years.</p>\n<p>Companies A and B are hotel chains serving the UK.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company A</th><th colspan=\"3\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Total revenue (£ millions)</td><td>8.22</td><td>8.31</td><td>8.29</td><td>1,620</td><td>1,440</td><td>1,010</td></tr>\n<tr><td>Labor costs as a percentage of revenue</td><td>45%</td><td>46%</td><td>48%</td><td>55%</td><td>57%</td><td>59%</td></tr>\n<tr><td>Voluntary turnover rate</td><td>45%</td><td>50%</td><td>49%</td><td>20%</td><td>33%</td><td>23%</td></tr>\n<tr><td>Involuntary turnover rate</td><td>15%</td><td>18%</td><td>18%</td><td>9%</td><td>8.8%</td><td>10.3%</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with labor law violations (£)</td><td>40,000</td><td>0</td><td>40,000</td><td>0</td><td>540,000</td><td>0</td></tr>\n<tr><td>National minimum wage (£ per hour)</td><td>7.05</td><td>7.38</td><td>7.70</td><td>7.05</td><td>7.38</td><td>7.70</td></tr>\n<tr><td>Average hourly wage (£)</td><td>7.20</td><td>7.65</td><td>7.90</td><td>10.60</td><td>11.10</td><td>11.20</td></tr>\n<tr><td>Percentage of employees earning minimum wage</td><td>25%</td><td>21%</td><td>26%</td><td>11%</td><td>15%</td><td>17%</td></tr>\n</tbody></table>","questions":[{"id":"T2B1","lo":8,"type":"single","text":"How should the financial impact of minimum-wage regulation be characterized for both companies?","options":{"a":"Potential, acute, and high magnitude","b":"Actual, acute, and high magnitude","c":"Actual, progressive, and low magnitude","d":"Potential, progressive, and high magnitude"},"answer":["c"],"expl":{"a":"Incorrect. The regulation already exists, so the impact is not merely potential, and incremental annual adjustments are not one-time high-magnitude events.","b":"Incorrect. Acute impacts are one-time events such as a spill (Section 7.2.2); annual wage adjustments are gradual.","c":"CORRECT. The minimum wage is existing regulation, so the impact is actual (Section 7.2.1.1). Rates are adjusted incrementally each year and labor is an everyday input that drives cost structure, so value is created or eroded gradually: a long-term, low-magnitude, progressive impact (Sections 7.2.1.3 and 7.2.2). This is the characterization in the guide's answer key for this study.","d":"Incorrect. The impact is actual, and incremental wage changes are low magnitude."}},{"id":"T2B2","lo":7,"type":"multi","choose":2,"text":"A user concludes that Company B is better insulated than Company A from future increases in the national minimum wage. Which two pieces of evidence support this conclusion? (Choose two.)","options":{"a":"Company B's labor costs are a higher percentage of revenue","b":"A smaller percentage of Company B's employees earn the minimum wage","c":"Company A's revenue has been stable","d":"Company B's average hourly wage is far above the minimum wage, while Company A's is only slightly above it","e":"Company B's revenue is larger"},"answer":["b","d"],"expl":{"a":"Incorrect. A higher labor-cost ratio increases, not reduces, sensitivity to wage changes; it does not support the conclusion.","b":"CORRECT. 17 percent of Company B's employees earn the minimum against 26 percent at Company A, so a smaller share of Company B's workforce is directly affected by an increase.","c":"Incorrect. Company A's revenue stability says nothing about Company B's insulation from a cost-side change.","d":"CORRECT. In Year 3 Company B's £11.20 average is 45 percent above the £7.70 minimum; Company A's £7.90 is only 3 percent above. A rise in the minimum forces Company A to raise wages. The guide's answer key draws this conclusion from the same data.","e":"Incorrect. Scale is not the relevant factor; exposure depends on how close wages sit to the regulated floor."}},{"id":"T2B3","lo":8,"type":"single","text":"Company B's Year 2 losses from labor law proceedings were £540,000, and its revenue fell nearly 30 percent in Year 3. How should the financial impact of labor law violations for Company B be characterized?","options":{"a":"Not material, because no losses were recorded in Year 3","b":"Low magnitude in isolation (about 0.03 percent of revenue), but potentially medium- to long-term and higher magnitude if the Year 3 revenue decline is attributable to reputational effects of the public litigation","c":"Low magnitude in all respects, because it occurred only once","d":"High-magnitude acute impact, based on the size of the fine"},"answer":["b"],"expl":{"a":"Incorrect. Absence of a fine in Year 3 does not negate the Year 2 event or its possible consequences.","b":"CORRECT. £540,000 is 0.03 percent of £1,440 million, so the direct cost is low magnitude. However, the case says employers in violation can be named publicly, and the guide's answer key notes that if the Year 3 revenue decline can be attributed to reputational effects of the litigation, the impact becomes medium- to long-term and higher magnitude (Sections 7.2.1.2 and 7.2.1.3). Magnitude is read from the data in context, not from the fine alone.","c":"Incorrect. This ignores the possible lasting reputational effect visible in Year 3 revenue.","d":"Incorrect. Relative to revenue the fine itself is small; the guide specifically computes this ratio."}},{"id":"T2B4","lo":9,"type":"multi","choose":3,"text":"Which three channels of financial impact does the issue of labor practices affect for Company B, based on the case? (Choose three.)","options":{"a":"Revenues","b":"Liabilities","c":"Turnover ratio","d":"Economic profit","e":"Expenses"},"answer":["a","b","e"],"expl":{"a":"CORRECT. The case links morale and turnover to guest experience and quality of service, and Company B's revenue fell sharply after public litigation; revenues are affected through demand (Section 8.2.1.1).","b":"CORRECT. Fines, settlements, and lawsuits from labor law violations are legal risks and future obligations (Section 8.2.1.4).","c":"Incorrect. Turnover ratio here would mean sales ÷ invested capital, a component of ROIC (Section 9.1.1), not a channel; it is unrelated to staff turnover.","d":"Incorrect. Economic profit is a valuation tool, not a channel of financial impact (Section 9.1.2).","e":"CORRECT. Labor costs are 59 percent of Company B's revenue and turnover adds to wage costs (Section 8.2.1.2)."}},{"id":"T2B5","lo":3,"type":"single","text":"The metrics \"average hourly wage\" and \"percentage of employees earning minimum wage\" capture performance on which general issue category, and under which sustainability dimension?","options":{"a":"Labor Practices, under Human Capital","b":"Employee Engagement, Diversity & Inclusion, under Human Capital","c":"Business Ethics, under Leadership & Governance","d":"Human Rights & Community Relations, under Social Capital"},"answer":["a"],"expl":{"a":"CORRECT. Labor Practices addresses a company's management of its workforce, including wages and fair compensation (Section 2.1.3), which the case repeatedly names as the industry's risk. The guide places it in the Human Capital dimension (Table 1, Section 2.1).","b":"Incorrect. This category concerns workforce culture, engagement, and diversity rather than wage levels. The case treats involuntary turnover as an engagement proxy, but the wage metrics are compensation data.","c":"Incorrect. Business Ethics concerns corruption, bribery, and fraud (Section 2.1.5).","d":"Incorrect. Social Capital issues concern external stakeholders such as communities and customers (Section 2.1.2), not the company's own employees."}}]},{"id":"T2C","title":"Case 3: Containers & Packaging Industry","built":"From the Part III Putting It Into Practice study","body":"<p>The Containers & Packaging industry converts metal, plastic, paper, and glass into packaging products such as corrugated packaging, food and beverage containers, aluminum cans, and steel drums. Companies are typically business-to-business and many operate globally. The industry Standard includes the topic of Product & Lifecycle Management.</p>\n<p>Stakeholder concern over packaging waste and increased regulatory scrutiny are shaping how companies manage packaging through its lifecycle. Large consumer products companies increasingly set public targets for 100 percent recyclable packaging and higher recycled content, and consumers demonstrate a higher willingness to pay for products that minimize harmful waste. Reusable and sustainable packaging is expected to grow at a 9.2 percent compound annual rate over the next five years, and packaging providers can charge a price premium for sustainable products.</p>\n<p>Company A has invested significantly in R&D for product redesign and is dedicating part of its workforce to developing recycling and take-back programs with customers, all launching this year, with a goal of 50 percent recycled content in all products within five years. The regulatory authority in Company A's jurisdiction has announced that all products must contain at least 35 percent recycled content within three years; non-compliance carries financial penalties.</p>\n<table><thead><tr><th>Company A</th><th>Year 1</th><th>Year 2</th></tr></thead><tbody>\n<tr><td>Percentage of raw materials from recycled content</td><td>28%</td><td>33%</td></tr>\n<tr><td>Percentage of raw materials from renewable resources</td><td>21%</td><td>22%</td></tr>\n<tr><td>Revenue from products that are reusable, recyclable, and/or compostable (€ millions)</td><td>1,230</td><td>1,680</td></tr>\n<tr><td>Total revenue (€ millions)</td><td>8,978</td><td>9,882</td></tr>\n</tbody></table>\n<table><thead><tr><th>Percentage of total revenue from reusable, recyclable, and/or compostable products</th><th>Year 1</th><th>Year 2</th></tr></thead><tbody>\n<tr><td>Company B</td><td>24.1%</td><td>24.8%</td></tr><tr><td>Company C</td><td>6.6%</td><td>7.9%</td></tr><tr><td>Company D</td><td>94.2%</td><td>98.1%</td></tr><tr><td>Company E</td><td>14.2%</td><td>16.1%</td></tr>\n<tr><td>Mean (B to E)</td><td>30.6%</td><td>32.8%</td></tr><tr><td>Median (B to E)</td><td>14.2%</td><td>17.0%</td></tr>\n</tbody></table>","questions":[{"id":"T2C1","lo":5,"type":"single","text":"When normalized, what is Company A's percentage of total revenue from reusable, recyclable, and/or compostable products in Year 1 and Year 2?","options":{"a":"28% and 33%","b":"36.6% and 10.0%","c":"21% and 22%","d":"13.7% and 17.0%"},"answer":["d"],"expl":{"a":"Incorrect. These are the recycled-content percentages of raw materials, a different metric.","b":"Incorrect. These figures do not follow from the data.","c":"Incorrect. These are the renewable-resource percentages of raw materials.","d":"CORRECT. 1,230 ÷ 8,978 = 13.7 percent; 1,680 ÷ 9,882 = 17.0 percent. Normalizing an absolute revenue figure by total revenue makes it comparable with peers who report the metric as a percentage (Section 4.2; guide answer key for this study)."}},{"id":"T2C2","lo":6,"type":"single","text":"How should Company A's Year 2 position relative to the peer group be described?","options":{"a":"Company A trails every peer","b":"The distribution is normal, so Company A is about one standard deviation below the mean","c":"Company A equals the peer median but sits below the mean, because Company D's 98.1 percent skews the distribution positively","d":"Company A is above average, because 17 percent exceeds the median"},"answer":["c"],"expl":{"a":"Incorrect. Company A is ahead of Company C (7.9 percent) and Company E (16.1 percent).","b":"Incorrect. A dataset whose mean and median differ this widely is not normally distributed, so standard-deviation percentages cannot be applied (Section 5.2).","c":"CORRECT. Company A's 17.0 percent equals the Year 2 median of 17.0 percent but is below the mean of 32.8 percent. A mean well above the median indicates a positively skewed distribution (Section 5.3.2), here caused by Company D's outlying 98.1 percent. The guide's answer key notes the wide dispersion evidenced by the gap between mean and median and flags Companies C and D for further analysis (Section 5.3).","d":"Incorrect. Equal to the median is not above average, and Company A is well below the mean."}},{"id":"T2C3","lo":9,"type":"multi","choose":2,"text":"Company A's investment in R&D for sustainable product redesign most directly affects which two channels of financial impact? (Choose two.)","options":{"a":"Expenses","b":"Cost of capital","c":"Liabilities","d":"Turnover ratio","e":"Assets"},"answer":["a","e"],"expl":{"a":"CORRECT. R&D spending is a cash outflow that reduces near-term cash flows (Section 8.2.1.2); the guide's answer key identifies investment expenses in R&D.","b":"Incorrect. The case gives no evidence that the investment changes investors' perception of risk (Section 8.2.2).","c":"Incorrect. Liabilities in this case arise from the recycled-content regulation, not from the R&D investment itself (Section 8.2.1.4).","d":"Incorrect. Turnover ratio is a component of ROIC (Section 9.1.1), not a channel.","e":"CORRECT. The answer key also notes that, as an investment, assets created through R&D for sustainable product design likely increase total asset value (Section 8.2.1.3)."}},{"id":"T2C4","lo":10,"type":"single","text":"Compared with a base case in which no SASB information is reported, how should Company A's performance on Product & Lifecycle Management affect its projected growth rate?","options":{"a":"No change, because Company A's share of revenue from sustainable products is average","b":"Lower growth projections, because Company A is below the peer mean","c":"Growth projections are unaffected; only the discount rate should change","d":"Higher growth projections, because the sustainable packaging market is expanding and management is investing to capture a larger share of it"},"answer":["d"],"expl":{"a":"Incorrect. The case provides forward-looking information (investment, market growth) that changes the outlook from the base case.","b":"Incorrect. Position relative to a skewed mean does not determine growth; trajectory and management decisions do.","c":"Incorrect. Growth projections are a core DCF input informed by this evidence.","d":"CORRECT. Growth rate reflects how a company is positioned within an expanding market (Section 8.2.3). The market is growing 9.2 percent annually, Company A's sustainable-product share rose from 13.7 to 17.0 percent, and management has committed resources to product redesign and take-back programs. The guide's answer key concludes the company is positioned for a greater rate of growth."}},{"id":"T2C5","lo":2,"type":"single","text":"How should a user interpret Company A's recycled-content performance in light of its regulatory climate?","options":{"a":"Company A faces no regulatory risk because 33 percent is close to 35 percent","b":"The requirement is part of the business climate, not the regulatory climate","c":"Company A currently falls short of the coming 35 percent requirement, creating regulatory risk, though its upward trajectory and stated 50 percent goal indicate management intent to comply","d":"Company A already complies because its combined recycled and renewable content exceeds 35 percent"},"answer":["c"],"expl":{"a":"Incorrect. Being below the floor is non-compliance; the case says penalties are commensurate with the extent of non-compliance.","b":"Incorrect. A government-announced content requirement with penalties defines the regulatory climate (Section 1.2.2.3).","c":"CORRECT. Regulatory climate includes announced future regulation and the penalties for non-compliance (Section 1.2.2.3). At 33 percent in Year 2, Company A is below the 35 percent floor that takes effect within three years and may face penalties; the guide's answer key notes that the investment decision with clearly defined goals is a positive indication the company is managing performance to meet the requirement.","d":"Incorrect. The requirement is for recycled content alone; renewable resources are a separate metric."}}]},{"id":"T2D","title":"Case 4: Electric Utilities & Power Generators Industry","built":"From the Part I Putting It Into Practice study","body":"<p>Society grants many utility companies a monopoly, a license to operate contingent on continuous service at reasonable rates to all customers in a service area. Competition in the industry is driven in part by investment in grid resiliency against extreme weather and cyberattacks. Weather is a major determinant of revenue for utilities without decoupled rate structures, as electricity is often used for heating, and companies commonly report average temperatures in filings to explain revenue volatility.</p>\n<p>Company A is a utility in a region that typically experiences mild winters and does not use a decoupled rate structure. A severe winter storm caused generators fueled by gas, coal, wind, and nuclear sources to go offline, leaving hundreds of thousands of residents and businesses without power for an average of 42 hours and some for several days. The public utility commission permitted grid operators to adjust the rate model to incentivize production amid skyrocketing demand and low supply, producing extremely high prices for customers who had power. Ratepayers were burdened with an estimated $38 billion in excess energy costs, while Company A estimated earnings of $54 million as a result of the storm. Investigations revealed that ten years earlier regulators had warned grid operators they were ill prepared for a major winter storm, and climate scientists had cautioned that a warming planet could bring extreme winter storms to the region. Independent experts estimate that several hundred people died as a result of the storm, many of them medically vulnerable.</p>","questions":[{"id":"T2D1","lo":3,"type":"multi","choose":2,"text":"The prolonged loss of a fundamental service to a large number of customers as distribution technology failed in extreme weather, in a region warned of increasingly severe winter storms, most directly evidences which two general issue categories? (Choose two.)","options":{"a":"Critical Incident Risk Management","b":"Data Security","c":"Systemic Risk Management","d":"Physical Impacts of Climate Change","e":"Energy Management"},"answer":["c","d"],"expl":{"a":"Incorrect. Critical Incident Risk Management concerns operational safety and workforce management where workers face physical risk (Section 2.1.5), not the collapse of a societal system.","b":"Incorrect. No data breach is described.","c":"CORRECT. Systemic Risk Management relates to managing risks from large-scale weakening of systems on which society depends, including technological systems, and the safeguards to mitigate systemic failure (Section 2.1.5). The guide's answer key assigns the prolonged loss of service to a large population to this category.","d":"CORRECT. Physical Impacts of Climate Change relates to the direct exposure of owned assets to extreme weather and changing climate conditions (Section 2.1.4). The answer key cites the damage to distribution infrastructure in a region where climate scientists had warned of severe winter storms.","e":"Incorrect. Energy Management concerns a company's own energy consumption as an input (Section 2.1.1); the guide's Practice Case 4 notes it is not relevant to a company whose product is energy."}},{"id":"T2D2","lo":3,"type":"single","text":"The rate-model adjustment that led to extremely high electricity costs for customers during the crisis evidences which general issue category?","options":{"a":"Competitive Behavior","b":"Customer Welfare","c":"Selling Practices & Product Labeling","d":"Access & Affordability"},"answer":["d"],"expl":{"a":"Incorrect. Competitive Behavior concerns anti-competitive practices such as collusion (Section 2.1.5); the pricing was permitted by the regulator.","b":"Incorrect. Customer Welfare concerns benefits and risks from using a product, such as food safety; the issue here is affordability of access.","c":"Incorrect. Selling Practices & Product Labeling concerns transparency and accuracy of marketing and labeling (Section 2.1.2), not pricing of an essential service.","d":"CORRECT. Access & Affordability relates to a company's ability to ensure broad access to its services, particularly where it provides universal needs such as electricity (Section 2.1.2). The guide's answer key cites the excessive prices during a crisis, contrary to social expectations, as evidence of this issue."}},{"id":"T2D3","lo":2,"type":"single","text":"Which statement about the interrelation of sustainability issues in this case is best supported?","options":{"a":"Business Model Resilience is irrelevant because the company earned a profit","b":"The issues are independent because each has its own metric","c":"Physical Impacts of Climate Change affected Business Model Resilience, and both, together with Systemic Risk Management, drove the Access & Affordability outcome for customers","d":"Access & Affordability caused the physical damage to infrastructure"},"answer":["c"],"expl":{"a":"Incorrect. Business Model Resilience concerns incorporating environmental transitions into long-term planning (Section 2.1.4); a one-time profit does not demonstrate resilience, and the case shows the model exposed customers and the company's license to operate.","b":"Incorrect. Section 2.2 explains that ESG issues are highly interrelated.","c":"CORRECT. The guide's answer key traces the chain: failure to account for extreme weather (Physical Impacts of Climate Change) in rate structures and resiliency planning (Business Model Resilience), combined with inadequate safeguards (Systemic Risk Management), produced the price burden on customers (Access & Affordability). Section 2.2 stresses that performance on one issue directly affects others.","d":"Incorrect. The causal direction is reversed; weather damaged infrastructure, and pricing followed."}},{"id":"T2D4","lo":9,"type":"single","text":"Because Company A does not use a decoupled rate structure, the storm affected which channel of financial impact, and in which direction?","options":{"a":"Revenues, which fell as customers lost power","b":"Revenues were neutral because of decoupling","c":"Expenses only, through storm repair costs","d":"Revenues, which increased as demand and prices spiked"},"answer":["d"],"expl":{"a":"Incorrect. Despite outages, the case reports higher earnings because prices rose sharply for customers who had power.","b":"Incorrect. The case states that the utility did not use a decoupled rate structure.","c":"Incorrect. The case explicitly reports an earnings effect, not only costs.","d":"CORRECT. Without decoupling, revenue is a direct product of volume and price (Practice Case 4, Question 1 explanation; Section 8.2.1.1). The case states the rate model was adjusted amid skyrocketing demand, and Company A estimated $54 million in earnings as a result of the storm."}}]},{"id":"T2E","title":"Case 5: Food Retailers & Distributors Industry","built":"New case built on the guide's grocery examples (Section 4.2)","body":"<p>In the grocery business, food waste represents a loss of salable merchandise and can negatively affect operational efficiency. It also represents the loss of resources used in production, including water, energy, and labor, and contributes to methane emissions in landfills. Grocers also operate extensive refrigeration, and refrigerant leakage produces Scope 1 GHG emissions. Companies operate stores of different sizes; larger stores can be assumed to have more refrigeration area.</p>\n<p>Two grocery chains report the following.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Grocer A</th><th colspan=\"2\">Grocer B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Amount of food waste generated (tons)</td><td>200,000</td><td>170,000</td><td>150,000</td><td>160,000</td></tr>\n<tr><td>Number of retail locations</td><td>500</td><td>490</td><td>300</td><td>340</td></tr>\n<tr><td>Total retail area (thousand m²)</td><td>1,500</td><td>1,480</td><td>600</td><td>700</td></tr>\n<tr><td>Gross global Scope 1 emissions from refrigerants (metric tons CO₂e)</td><td>90,000</td><td>88,000</td><td>60,000</td><td>68,000</td></tr>\n</tbody></table>","questions":[{"id":"T2E1","lo":5,"type":"single","text":"Normalized by number of retail locations, which statement about food waste is accurate?","options":{"a":"Grocer B improved and Grocer A worsened","b":"Both grocers improved per store, even though Grocer B's absolute food waste increased","c":"Both grocers worsened per store","d":"Grocer A improved and Grocer B worsened, consistent with the absolute figures"},"answer":["b"],"expl":{"a":"Incorrect. Both improved; Grocer A's absolute decline is not reversed by normalization.","b":"CORRECT. Grocer A: 200,000 ÷ 500 = 400 tons per store, then 170,000 ÷ 490 = 347. Grocer B: 150,000 ÷ 300 = 500, then 160,000 ÷ 340 = 471. Grocer B's absolute waste rose only because it opened 40 stores; per store it improved. The guide's own grocery example makes this point about relying on absolute values (Section 4.2).","c":"Incorrect. Both ratios fell.","d":"Incorrect. This reads the absolute values, which the number-of-stores activity metric is provided to correct."}},{"id":"T2E2","lo":5,"type":"single","text":"Why might total retail area be a better measure than number of locations for normalizing refrigerant emissions?","options":{"a":"Number of locations is already a normalized percentage","b":"Retail area is a financial metric drawn from the income statement","c":"Revenue is always the preferred normalization measure, and area approximates revenue","d":"Larger stores have more refrigeration area, so emissions scale with floor area rather than store count"},"answer":["d"],"expl":{"a":"Incorrect. A count of stores is an absolute activity metric, not a percentage.","b":"Incorrect. Retail area is a SASB activity metric, not a financial statement line item (Section 4.2).","c":"Incorrect. The guide states that the best normalization measure depends on how the data provide insight into financial impact; revenue is not always preferred.","d":"CORRECT. The guide notes that larger stores could be assumed to have more refrigeration area and higher per-store refrigeration emissions, so normalizing by store size may be more effective than by number of locations (Section 4.2). Per thousand m², Grocer A emits 59.5 tons and Grocer B 97.1 tons in Year 2, versus 180 and 200 per store, a wider gap once size is accounted for."}},{"id":"T2E3","lo":3,"type":"multi","choose":2,"text":"The two metrics in the case, food waste and refrigerant emissions, capture performance on which two general issue categories? (Choose two.)","options":{"a":"GHG Emissions","b":"Air Quality","c":"Materials Sourcing & Efficiency","d":"Waste & Hazardous Materials Management","e":"Energy Management"},"answer":["a","d"],"expl":{"a":"CORRECT. The guide presents refrigerant emissions under GHG Emissions (Section 4.2 example); refrigerants are a direct Scope 1 emission.","b":"Incorrect. Air Quality concerns pollutants such as NOx, SOx, and particulates, not greenhouse gases (Section 2.1.1).","c":"Incorrect. Materials Sourcing & Efficiency concerns critical input materials (Section 2.1.4), not waste or emissions.","d":"CORRECT. The guide presents the food waste metric under the general issue category Waste & Hazardous Materials Management (Section 4.2 example; Table 1, Section 2.1).","e":"Incorrect. Energy Management concerns energy consumption; refrigerant leakage is an emission, not energy use."}},{"id":"T2E4","lo":8,"type":"single","text":"What type of financial impact does the food waste metric most directly illuminate?","options":{"a":"A progressive risk affecting everyday operating efficiency","b":"None; it is an activity metric","c":"An opportunity, since higher values indicate more merchandise","d":"An acute, high-magnitude risk"},"answer":["a"],"expl":{"a":"CORRECT. The guide describes food waste as a loss of salable merchandise that negatively affects operational efficiency. Higher values threaten economic performance, so it captures a risk (Section 7.1), and because it accrues through everyday operations it is progressive and low magnitude (Section 7.2.2).","b":"Incorrect. Amount of food waste generated is a sustainability accounting metric; number of locations is the activity metric.","c":"Incorrect. Higher waste is lost merchandise, a threat to performance, not an opportunity.","d":"Incorrect. Food waste accrues gradually; it is not a one-time event."}}]},{"id":"T2F","title":"Case 6: Iron & Steel Producers Industry","built":"New case built on the guide's steel examples (Sections 4.3.1 and 8.2.2.1)","body":"<p>The steel industry is among the most energy-intensive in its sector. Coking coal and natural gas are primary energy sources, and companies purchase significant grid electricity; for some processes electricity is the primary energy input. Reducing energy consumption and dependence on grid electricity can lower energy costs and mitigate regulatory impacts in a carbon-constrained environment. Companies also use large amounts of water in production; operations in areas with high baseline water stress are more susceptible to supply disruptions and price instability, and the percentage of water recycled indicates how efficiently water is used in the face of such risks.</p>\n<p>Steelmaker B owns captive iron ore mines that supply 60 percent of its ore.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Steelmaker A</th><th colspan=\"2\">Steelmaker B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total energy consumed (thousand GJ)</td><td>1,142</td><td>997</td><td>2,300</td><td>2,350</td></tr>\n<tr><td>Percentage grid electricity</td><td>41.2%</td><td>32.3%</td><td>38.0%</td><td>37.5%</td></tr>\n<tr><td>Steel produced (thousand metric tons)</td><td>1,000</td><td>950</td><td>2,000</td><td>2,200</td></tr>\n<tr><td>Total fresh water withdrawn (million m³)</td><td>10.0</td><td>9.5</td><td>20.0</td><td>21.0</td></tr>\n<tr><td>Percentage of water recycled</td><td>80%</td><td>85%</td><td>40%</td><td>42%</td></tr>\n<tr><td>Percentage of water withdrawn in regions with high or extremely high baseline water stress</td><td>0%</td><td>0%</td><td>30%</td><td>30%</td></tr>\n</tbody></table>","questions":[{"id":"T2F1","lo":5,"type":"single","text":"Steelmaker A's absolute energy consumption fell 12.7 percent from Year 1 to Year 2. What does normalizing by steel produced reveal?","options":{"a":"No improvement, because the decline is entirely explained by lower production","b":"A larger improvement than the absolute figure suggests","c":"Normalization is not possible without revenue data","d":"A real but smaller i
