function answered(q){ const a=state.answers[q.id]||[]; return a.length>0; }

function renderExam(){
  const CASES=CASES_CUR(); const c=CASES[state.caseIdx];
  app.innerHTML=`<div class="bar"><div class="bar-in">
    <div class="tabs">${CASES.map((cc,i)=>`<button class="tab ${i===state.caseIdx?'active':''}" onclick="goCase(${i})">Case ${i+1}</button>`).join("")}</div>
    <div class="muted" style="font-size:.9rem">${Object.values(state.answers).filter(a=>a.length).length} of ${ALLQ.length} answered</div>
    <div class="timer ${state.remaining<300?'low':''}" id="timer">${fmt(state.remaining)}</div>
    <button class="tab" onclick="exitExam()" title="End this exam and return to the test menu">End exam</button>
  </div></div>
  <div class="wrap"><div class="grid">
    <div class="case"><h2>${c.title}</h2><div class="built">${c.built}</div>${c.body.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>')}</div>
    <div>
      ${c.questions.map(q=>renderQ(q)).join("")}
      <div class="navrow">
        <button class="btn secondary" ${state.caseIdx===0?'disabled':''} onclick="goCase(${state.caseIdx-1})">Previous case</button>
        ${state.caseIdx<CASES.length-1?`<button class="btn" onclick="goCase(${state.caseIdx+1})">Next case</button>`:`<button class="btn" onclick="state.screen='review';render()">Review and submit</button>`}
      </div>
    </div>
  </div></div>`;
}
function renderQ(q){
  const sel=state.answers[q.id]||[]; const multi=q.type==="multi";
  return `<div class="q" id="q-${q.id}">
    <div class="q-head"><span class="q-num">Question ${qNumber(q.id)}</span><button class="flagbtn ${state.flags[q.id]?'on':''}" onclick="toggleFlag('${q.id}')">${state.flags[q.id]?'Flagged':'Flag for review'}</button></div>
    <div class="q-text">${esc(q.text)}</div>
    ${Object.entries(q.options).map(([k,v])=>`<label class="opt ${sel.includes(k)?'chosen':''}"><input type="${multi?'checkbox':'radio'}" name="${q.id}" value="${k}" ${sel.includes(k)?'checked':''} onchange="choose('${q.id}','${k}',this.checked,${multi})"><span class="letter">${k.toUpperCase()}.</span><span>${esc(v)}</span></label>`).join("")}
    ${multi?`<div class="hint">Select exactly ${q.choose}.</div>`:''}
  </div>`;
}
function choose(qid,k,checked,multi){
  let a=state.answers[qid]||[];
  if(multi){ a=checked?[...a,k]:a.filter(x=>x!==k); } else { a=[k]; }
  state.answers[qid]=a; save();
  const box=document.getElementById("q-"+qid); box.querySelectorAll(".opt").forEach(o=>o.classList.toggle("chosen",o.querySelector("input").checked));
  const cnt=document.querySelector(".bar-in .muted"); if(cnt) cnt.textContent=`${Object.values(state.answers).filter(x=>x.length).length} of ${ALLQ.length} answered`;
}
function toggleFlag(qid){ state.flags[qid]=!state.flags[qid]; save(); const CASES=CASES_CUR(); const c=CASES[state.caseIdx]; document.getElementById("q-"+qid).outerHTML=renderQ(c.questions.find(q=>q.id===qid)); }
function goCase(i){ state.caseIdx=i; save(); render(); }
function goQ(qid){ state.caseIdx=CASES_CUR().findIndex(c=>c.id===ALLQ.find(q=>q.id===qid).caseId); state.screen="exam"; render(); setTimeout(()=>{const el=document.getElementById("q-"+qid); if(el) el.scrollIntoView({block:"start"});},50); }

function renderReview(){
  const un=ALLQ.filter(q=>!answered(q)); const inc=ALLQ.filter(q=>q.type==="multi"&&answered(q)&&(state.answers[q.id]||[]).length!==q.choose);
  app.innerHTML=`<div class="bar"><div class="bar-in"><strong>Review</strong><div class="timer ${state.remaining<300?'low':''}" id="timer">${fmt(state.remaining)}</div></div></div>
  <div class="wrap"><div class="start" style="margin-top:20px;max-width:860px">
  <h2>Ready to submit?</h2>
  <p class="muted">${un.length?`${un.length} unanswered.`:"All questions answered."} ${inc.length?`${inc.length} multi-select question${inc.length>1?'s have':' has'} the wrong number of selections.`:""} Flagged questions are underlined in gold. Tap any number to jump back.</p>
  <div class="dots">${ALLQ.map(q=>`<button class="navdot ${answered(q)?'done':''} ${state.flags[q.id]?'flag':''}" onclick="goQ('${q.id}')">${qNumber(q.id)}</button>`).join("")}</div>
  <button class="btn" onclick="submit()">Submit exam</button> <button class="btn secondary" onclick="state.screen='exam';render()">Back to questions</button> <button class="btn secondary" onclick="exitExam()">End exam</button>
  </div></div>`;
}

function grade(q){ const a=[...(state.answers[q.id]||[])].sort().join(); return a===[...q.answer].sort().join(); }
function exitExam(){ if(!confirm("End "+TESTS[TEST].name+" now? Your current answers will be scored and saved as your last attempt, and you'll return to the test menu.")) return; submit(true); }
function submit(goHome){ if(state.timer){clearInterval(state.timer);state.timer=null;} try{localStorage.removeItem(skey());}catch(e){}
  const correct=ALLQ.filter(grade).length; const byLO={}; ALLQ.forEach(q=>{ byLO[q.lo]=byLO[q.lo]||{c:0,n:0}; byLO[q.lo].n++; if(grade(q)) byLO[q.lo].c++; });
  const missed=ALLQ.map((q,i)=>grade(q)?null:i+1).filter(x=>x);
  saveResult(TEST,{date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}),pct:Math.round(100*correct/ALLQ.length),correct,total:ALLQ.length,timeUsed:fmt(TIME_LIMIT-Math.max(0,state.remaining)),byLO,missed});
  state.screen=goHome===true?"start":"results"; render(); }

function renderResults(){
  const correct=ALLQ.filter(grade).length; const pct=Math.round(100*correct/ALLQ.length);
  const byLO={}; ALLQ.forEach(q=>{ byLO[q.lo]=byLO[q.lo]||{n:0,c:0}; byLO[q.lo].n++; if(grade(q)) byLO[q.lo].c++; });
  const used=fmt(TIME_LIMIT-Math.max(0,state.remaining));
  app.innerHTML=`<div class="wrap">
  <h1>Results: ${TESTS[TEST].name}</h1>
  <div class="score"><div><div class="big">${pct}%</div><div class="muted">${correct} of ${ALLQ.length} correct</div></div><div class="muted">Time used: ${used}<br>The real exam scores 47 of 55 questions; the pass mark is not published, so treat this as a diagnostic of which objectives need work.</div></div>
  <h2>By learning objective</h2>
  <div class="tablewrap"><table class="lo-table"><thead><tr><th>LO</th><th>What it tests</th><th>Score</th><th></th></tr></thead><tbody>
  ${Object.keys(byLO).sort((a,b)=>a-b).map(lo=>`<tr><td>${lo}</td><td>${LO[lo]}</td><td>${byLO[lo].c}/${byLO[lo].n}</td><td><div class="bar-mini"><i style="width:${100*byLO[lo].c/byLO[lo].n}%"></i></div></td></tr>`).join("")}
  </tbody></table></div>
  <h2 style="margin-top:28px">Question by question</h2>
  ${CASES_CUR().map(c=>`<details open><summary>${c.title}</summary>
    <details><summary>Show the case text</summary><div class="case" style="position:static;max-height:none;margin:10px 0">${c.body.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>')}</div></details>
    ${c.questions.map(q=>renderResultQ(q)).join("")}</details>`).join("")}
  <p style="margin-top:24px"><button class="btn secondary" onclick="resetAll()">Back to tests</button></p>
  </div>`;
}
function renderResultQ(q){
  const sel=state.answers[q.id]||[]; const ok=grade(q);
  return `<div class="q"><div class="q-head"><span class="q-num">Question ${qNumber(q.id)}</span><span class="verdict ${ok?'ok':'bad'}">${ok?'Correct':(sel.length?'Incorrect':'Not answered')}</span></div>
  <div class="q-text">${esc(q.text)}</div>
  ${Object.entries(q.options).map(([k,v])=>{ const isAns=q.answer.includes(k), chose=sel.includes(k);
    const cls=isAns?'correct':(chose?'wrong':''); const tag=isAns&&chose?'Your answer ✓':isAns?'Correct answer':chose?'Your answer ✗':'';
    return `<div class="r-opt ${cls}"><span class="tag">${tag}</span><div class="body"><strong>${k.toUpperCase()}.</strong> ${esc(v)}<div class="ex">${esc(q.expl[k])}</div>${(!isAns && q.trap && q.trap[k])?`<div class="ex" style="font-style:italic">Tempting because: ${esc(q.trap[k])}.</div>`:''}</div></div>`; }).join("")}
  <div class="lo-line">This question evaluates Learning Objective ${q.lo}: ${LO[q.lo]}.</div></div>`;
}
render();
</script>
</body>
</html>
