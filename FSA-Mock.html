de specifically notes customers do not reflect the activity driving energy use.","d":"CORRECT. The guide says customers and revenue do not convey a telecom company's scale relative to its activity, transmitting data, and that data transmitted could yield a more effective rate (Section 4.2).","e":"CORRECT. The guide states the percentage measures in this metric are already normalized (Sections 4.1 and 4.2)."}},{"id":"T3E3","lo":3,"type":"single","text":"Under which general issue category does the guide discuss handset recycling and reuse for telecom companies?","options":{"a":"Product Design & Lifecycle Management","b":"Customer Welfare","c":"Materials Sourcing & Efficiency","d":"Waste & Hazardous Materials Management"},"answer":["c"],"expl":{"a":"Incorrect. Although lifecycle sounds applicable, the guide places telecom handset recovery under Materials Sourcing & Efficiency because of the value of recovered materials.","b":"Incorrect. Customer Welfare concerns benefits and risks from using products.","c":"CORRECT. The guide's \"look at the industry level\" for Materials Sourcing & Efficiency uses telecom handsets as its example, citing e-waste legislation, recycling and reuse, and cost savings from recovered materials (Section 2.1.4).","d":"Incorrect. Waste & Hazardous Materials Management concerns waste from a company's own operations, such as hazardous waste at a solar manufacturer."}},{"id":"T3E4","lo":10,"type":"single","text":"Company A's handset collection rose from 900,000 to 1.5 million in Year 2. Which DCF adjustment is best supported by the guide?","options":{"a":"Lower revenue projections, because reused handsets displace new sales","b":"Lower long-term disposal cost projections and reduced exposure to compliance costs under developing e-waste legislation","c":"A write-down of network assets","d":"A higher discount rate, because collection programs add operational risk"},"answer":["b"],"expl":{"a":"Incorrect. The guide frames recovery as cost savings; no displacement of sales is described.","b":"CORRECT. The guide states telecom companies can achieve cost savings from recovered materials and reduce long-term disposal costs (Section 2.1.4), flowing into expense projections (Section 8.2.1.2), and that providers are the target of developing e-waste legislation, so effective recycling reduces likely compliance costs (Section 3.1).","c":"Incorrect. No impairment is indicated.","d":"Incorrect. Nothing links collection programs to greater perceived risk."}}]},{"id":"T3F","title":"Case 6: Internet Media & Services Industry","built":"New case built on the guide's Internet Media examples (Sections 1.2.2.1 and 4.2.2)","body":"<p>In the Internet Media & Services industry, energy consumption is a factor of continuously operating data processing centers, and the Standard includes data processing capacity, with percentage outsourced, as an activity metric. In certain markets a company may have monopolistic or oligopolistic power and face risks related to competitive behavior; a company that is one of many players in a highly competitive market has a different sustainability profile from the dominant companies the industry standard assumes.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Total energy consumed (GJ)</td><td>10,000</td><td>14,000</td></tr>\n<tr><td>Revenue ($ millions)</td><td>500</td><td>500</td></tr>\n<tr><td>Data processing capacity (million m²)</td><td>1.0</td><td>2.0</td></tr>\n<tr><td>Percentage of capacity outsourced</td><td>0%</td><td>60%</td></tr>\n<tr><td>Share of its primary market</td><td>75% (one major competitor)</td><td>8% (twelve competitors)</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with anti-competitive behavior ($ millions)</td><td>0</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T3F1","lo":5,"type":"single","text":"Which normalization best captures the energy efficiency of the two companies' core activity, and what does it show?","options":{"a":"Energy per dollar of revenue: the two companies are identical","b":"Energy per unit of data processing capacity: Company A uses 0.010 GJ per m² and Company B 0.007, so Company B is more efficient","c":"Energy per employee, which is the activity metric for this industry","d":"Energy per dollar of revenue: Company A at 20 GJ per $ million is more efficient than Company B at 28, which is the most insightful comparison"},"answer":["b"],"expl":{"a":"Incorrect. 10,000 ÷ 500 = 20 and 14,000 ÷ 500 = 28 GJ per $ million; they are not identical.","b":"CORRECT. The guide's example (Section 4.2.2) normalizes this industry's energy by data processing capacity because energy use is a factor of continuously operating data centers: 10,000 ÷ 1,000,000 = 0.010 GJ per m² for Company A and 14,000 ÷ 2,000,000 = 0.007 for Company B.","c":"Incorrect. The Standard's activity metric is data processing capacity, not employees.","d":"Incorrect. The arithmetic is right, but the conclusion is the opposite of the activity-based one, and the guide says the activity metric offers the more insightful comparison because revenue does not reflect what drives energy use in this industry (Section 4.2.2)."}},{"id":"T3F2","lo":2,"type":"multi","choose":2,"text":"Which two statements about the relevance of the competitive behavior topic to the two companies are consistent with the guide? (Choose two.)","options":{"a":"The topic is highly relevant to Company A because of its dominant market position, consistent with the industry standard's assumptions","b":"The topic is irrelevant to both because neither has recorded losses","c":"The topic is more relevant to Company B because it has more competitors","d":"Company B, as one of many players in a competitive market, has a different sustainability profile and the topic is less relevant to it","e":"The topic is equally relevant to both because neither has recorded losses"},"answer":["a","d"],"expl":{"a":"CORRECT. The guide states that in concentrated markets a company may have monopolistic or oligopolistic power and face competitive behavior risk, and that the standard is characterized by dominant companies (Section 1.2.2.1).","b":"Incorrect. Absence of fines does not remove the risk for a dominant company (compare the guide's Auto Parts example, Section 6.1.1.1).","c":"Incorrect. More competitors means less market power and lower anti-competitive risk.","d":"CORRECT. The same passage says a company that is one of many players in a highly competitive market will have a different sustainability profile from the standard; business climate is an external factor that adjusts topic relevance (Section 1.2.2.1).","e":"Incorrect. Relevance depends on market structure, not on recorded losses."}},{"id":"T3F3","lo":7,"type":"single","text":"Company B outsources 60 percent of its data processing capacity. What does this imply for comparing the two companies' energy performance?","options":{"a":"Company B should be excluded from comparison","b":"Company B's reported energy may exclude energy used at outsourced facilities, so the comparison may understate Company B's footprint unless outsourced capacity is accounted for","c":"Outsourcing has no effect because the activity metric already includes outsourced capacity","d":"Company B's energy should be normalized by revenue instead"},"answer":["b"],"expl":{"a":"Incorrect. The guide's approach is to adjust the comparison with context, not to exclude companies.","b":"CORRECT. The guide includes \"percentage outsourced\" in the activity metric precisely because it changes what reported energy represents (Section 4.2.2), and it warns that a company which outsources operations does not control, and may not report, impacts at those facilities (Section 1.2.1.2). Comparability requires considering the complete disclosure (Section 4.2.3).","c":"Incorrect. Capacity may include outsourced facilities while energy consumed may not; that mismatch is the issue.","d":"Incorrect. Revenue does not resolve the question of what the energy figure covers."}},{"id":"T3F4","lo":9,"type":"single","text":"If Company A were found to have engaged in anti-competitive practices, through which channel would the impact most directly appear, based on the metric the Standard uses?","options":{"a":"Net working capital","b":"Long-term growth rate as a channel","c":"Expenses, through monetary losses from legal proceedings","d":"Tangible assets"},"answer":["c"],"expl":{"a":"Incorrect. A ROIC component (Section 9.1), not a channel.","b":"Incorrect. Growth rate is a DCF input, not a channel (Section 8.2).","c":"CORRECT. The Standard's metric for this topic is monetary losses from legal proceedings (Section 1.2.2.1); fines and settlements are direct expenses (Sections 3.1 and 8.2.1.2). Reputational and growth effects may follow but are indirect.","d":"Incorrect. No asset impairment is implied."}}]},{"id":"T3G","title":"Case 7: Metals & Mining Industry","built":"New case built on the guide's mining examples (Sections 2.1.1, 2.1.3 and 2.1.4)","body":"<p>Metals & Mining companies rely on water as a key input, and performance is captured by water withdrawn, the proportion that is fresh water, and the proportion in regions with high or extremely high baseline water stress; as a heavily regulated industry, incidents of non-compliance with water quality permits indicate how well a company manages regulatory risk. Work is physically demanding and hazardous, and employees often participate in collective bargaining agreements; the percentage of the workforce covered, and the number and duration of strikes and lockouts, show how well a company meets workforce needs and the extent to which labor disruptions affect profitability. The Business Model Resilience issue is particularly relevant to companies whose operations will be affected by the transition to a low-carbon economy.</p>\n<p>Company A mines copper, which is used in electrification. Company B mines thermal coal and derives 15 percent of revenue from a rail logistics subsidiary.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Incidents of non-compliance with water quality permits</td><td>2</td><td>1</td><td>6</td><td>9</td></tr>\n<tr><td>Percentage of workforce covered by collective bargaining agreements</td><td>70%</td><td>70%</td><td>85%</td><td>85%</td></tr>\n<tr><td>Number and duration of strikes and lockouts</td><td>0</td><td>0</td><td>1; 12 days</td><td>2; 45 days</td></tr>\n<tr><td>Production (thousand metric tons)</td><td>400</td><td>420</td><td>30,000</td><td>27,500</td></tr>\n</tbody></table>","questions":[{"id":"T3G1","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide place collective bargaining coverage and strike data?","options":{"a":"Critical Incident Risk Management, under Leadership & Governance","b":"Human Rights & Community Relations, under Social Capital","c":"Labor Practices, under Human Capital","d":"Employee Health & Safety, under Human Capital"},"answer":["c"],"expl":{"a":"Incorrect. Critical Incident Risk Management concerns operational safety and catastrophic incidents (Section 2.1.5).","b":"Incorrect. This category concerns communities outside the company (Section 2.1.2).","c":"CORRECT. The guide's discussion of Labor Practices (Section 2.1.3) uses collective bargaining coverage and strikes and lockouts as the measures for industries with organized labor such as Metals & Mining.","d":"Incorrect. Employee Health & Safety concerns injuries and illness, not bargaining and strikes."}},{"id":"T3G2","lo":8,"type":"single","text":"What does the trend in Company B's strike data indicate about the financial impact of labor practices?","options":{"a":"A low-likelihood risk, since only two strikes occurred","b":"An opportunity, since idle time reduces wage costs","c":"A risk whose likelihood is increasing: strikes rose from 1 of 12 days to 2 of 45 days alongside an 8 percent production decline","d":"No impact, because 85 percent coverage shows the workforce is well managed"},"answer":["c"],"expl":{"a":"Incorrect. Strikes in both years, growing in duration, indicate a recurring pattern.","b":"Incorrect. Idle production threatens profitability; it is not a saving.","c":"CORRECT. The guide says strikes and lockouts show the extent to which labor disruptions affect profitability, so higher values indicate risk (Section 7.1), and time-series data indicate likelihood (Section 7.2.1.1).","d":"Incorrect. The guide says coverage together with strike data gives insight; coverage alone does not establish good management."}},{"id":"T3G3","lo":10,"type":"multi","choose":2,"text":"Considering Business Model Resilience, which two valuation conclusions are best supported for Company B? (Choose two.)","options":{"a":"Lower long-term growth projections, because demand for its primary product declines in the transition to a low-carbon economy","b":"No adjustment, because resilience is a qualitative issue","c":"A lower discount rate, because coal mining is well established","d":"A higher discount rate, reflecting greater perceived long-term risk to the business model","e":"Higher growth projections, because coal prices are volatile"},"answer":["a","d"],"expl":{"a":"CORRECT. The guide says Business Model Resilience is particularly relevant to companies affected by the transition to a low-carbon economy (Section 2.1.4), and growth projections reflect position in expanding or contracting markets (Section 8.2.3).","b":"Incorrect. Qualitative issues still translate into DCF inputs (Section 8.2).","c":"Incorrect. Maturity of an industry does not offset transition risk.","d":"CORRECT. Where investors perceive a less resilient business model, the required return rises (Section 8.2.2).","e":"Incorrect. Volatility is not growth, and the transition points the other way."}},{"id":"T3G4","lo":1,"type":"single","text":"How should Company B's rail logistics subsidiary influence the sustainability topics a user evaluates?","options":{"a":"Ignore it, because rail serves the mines","b":"Switch to the rail Standard because transport is lower risk","c":"Evaluate rail topics only if the subsidiary unionizes","d":"Reference the relevant transportation industry Standard in addition to the Metals & Mining Standard, because a significant revenue stream falls outside the mining profile"},"answer":["d"],"expl":{"a":"Incorrect. The subsidiary earns external revenue; it is a distinct stream, not an input.","b":"Incorrect. Mining remains 85 percent of revenue.","c":"Incorrect. Labor organization is not what determines whether an additional Standard applies.","d":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1). A rail business at 15 percent of revenue brings topics such as rail safety and fuel use into scope, just as the guide's integrated energy example spans multiple Standards."}}]},{"id":"T3H","title":"Case 8: Consumer Finance Industry","built":"New case built on the guide's customer privacy example (Section 2.1.2)","body":"<p>Companies in the Consumer Finance industry have a legal and social responsibility to ensure the security of personal financial data; failure exposes customers to fraud, identity theft, and other harmful misuse. Users gain insight into this issue by looking at the number of account holders whose information is used for secondary purposes and the total monetary losses from legal proceedings associated with customer privacy, which together show how effectively a company manages privacy and the magnitude of losses. Strong management can yield benefits through user confidence and loyalty, which are important to maintaining market share.</p>\n<table><thead><tr><th></th><th colspan=\"3\">Company A</th><th colspan=\"3\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y1</th><th>Y2</th><th>Y3</th></tr></thead><tbody>\n<tr><td>Account holders (millions)</td><td>20</td><td>21</td><td>21</td><td>8</td><td>9</td><td>10</td></tr>\n<tr><td>Account holders whose information is used for secondary purposes (millions)</td><td>12</td><td>12.6</td><td>13.0</td><td>0.4</td><td>0.45</td><td>0.5</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with customer privacy ($ millions)</td><td>3</td><td>2</td><td>85</td><td>0</td><td>0</td><td>0</td></tr>\n<tr><td>Net account growth</td><td>+5%</td><td>+5%</td><td>0%</td><td>+12%</td><td>+12%</td><td>+11%</td></tr>\n</tbody></table>","questions":[{"id":"T3H1","lo":5,"type":"single","text":"Normalized by account holders, what share of each company's customers had information used for secondary purposes in Year 3?","options":{"a":"Both about 60 percent","b":"The metric cannot be normalized","c":"Company A about 13 percent; Company B about 0.5 percent","d":"Company A about 62 percent; Company B about 5 percent"},"answer":["d"],"expl":{"a":"Incorrect. Company B's share is far lower.","b":"Incorrect. An absolute count of affected customers is normalized by total customers.","c":"Incorrect. These are the raw millions, not percentages.","d":"CORRECT. 13.0 ÷ 21 = 61.9 percent for Company A; 0.5 ÷ 10 = 5 percent for Company B. Account holders is the appropriate activity measure for a customer-data metric (Section 4.2)."}},{"id":"T3H2","lo":8,"type":"single","text":"How should the financial impact shown by Company A's Year 3 legal losses be characterized?","options":{"a":"A potential impact, since the proceedings may be appealed","b":"An acute, high-magnitude impact against a background of small recurring losses","c":"A progressive impact, since losses accumulated over three years","d":"An opportunity, since the losses reflect data monetization"},"answer":["b"],"expl":{"a":"Incorrect. The loss has been recorded; it is actual (Section 7.2.1.1).","b":"CORRECT. $2 to 3 million per year is a low-magnitude recurring pattern; $85 million in one year is a discrete high-magnitude event (Section 7.2.2). The guide's example of an acute impact is a data security breach with fines, litigation, and reputational harm (Section 7.2).","c":"Incorrect. A single large loss in one year is acute; prior small losses do not make it progressive.","d":"Incorrect. Legal losses threaten performance; they are risks (Section 7.1)."}},{"id":"T3H3","lo":9,"type":"multi","choose":3,"text":"Through which three channels does customer privacy affect Company A, based on the case? (Choose three.)","options":{"a":"Turnover ratio","b":"Liabilities, through exposure to further legal proceedings","c":"Revenues, through lost user confidence and market share","d":"Economic value added","e":"Expenses, through legal losses incurred"},"answer":["b","c","e"],"expl":{"a":"Incorrect. A ROIC component (Section 9.1.1), not a channel.","b":"CORRECT. With 62 percent of customers' data used for secondary purposes, the company remains exposed to legal risk, a future obligation (Section 8.2.1.4).","c":"CORRECT. The case ties confidence and loyalty to market share; flat growth in Year 3 points to revenue effects (Section 8.2.1.1).","d":"Incorrect. A valuation tool (Section 9.1.2), not a channel.","e":"CORRECT. Monetary losses from legal proceedings are a direct cost (Section 8.2.1.2)."}},{"id":"T3H4","lo":10,"type":"single","text":"Comparing the two companies, which valuation adjustment is best supported for Company B relative to Company A?","options":{"a":"No difference, because neither company reports a breach","b":"A higher discount rate for Company B, because it is smaller","c":"A lower discount rate for Company B, reflecting lower perceived privacy risk, and higher growth projections supported by sustained account growth","d":"Lower growth projections for Company B, because it uses less customer data"},"answer":["c"],"expl":{"a":"Incorrect. The data differ sharply on both exposure and realized losses.","b":"Incorrect. Size alone is not an ESG-informed basis for a risk premium.","c":"CORRECT. Company B uses secondary data for 5 percent of customers and has no legal losses, so investors would perceive lower risk (Section 8.2.2); its 11 to 12 percent account growth supports growth projections (Section 8.2.3).","d":"Incorrect. The guide frames limited secondary use as good management, not a growth constraint."}}]},{"id":"T3I","title":"Case 9: Commercial Banks Industry","built":"New case built on the guide's systemic risk example (Section 2.1.5)","body":"<p>Commercial banks provide financial security through fixed debt and flexible assets: clients benefit from fixed terms on loans while they may withdraw deposits at any time, creating inherent liquidity and solvency risks for banks, whose assets can fluctuate in value but cannot be adjusted or sold, while their debts can be called at any time. Risk management therefore benefits society and is a significant factor in banks' profitability and long-term survival. To evaluate exposure, users can look at a bank's Global Systemically Important Bank (G-SIB) score and at how the bank incorporates stress test results into capital adequacy planning and long-term strategy; together these show the extent to which a bank may contribute to systemic risk and its ability to absorb shocks.</p>\n<table><thead><tr><th></th><th>Bank A</th><th>Bank B</th></tr></thead><tbody>\n<tr><td>G-SIB score (higher indicates greater systemic importance)</td><td>420</td><td>95</td></tr>\n<tr><td>Stress test results incorporated into capital planning</td><td>Yes; board-level review; capital buffer set above regulatory minimum</td><td>Not described</td></tr>\n<tr><td>Total assets ($ billions)</td><td>2,800</td><td>310</td></tr>\n<tr><td>Jurisdiction's regulatory regime</td><td>Annual mandatory stress tests with public results</td><td>No mandatory stress testing</td></tr>\n</tbody></table>","questions":[{"id":"T3I1","lo":3,"type":"single","text":"Under which general issue category and dimension do G-SIB scores and stress-test integration fall?","options":{"a":"Financial Inclusion, under Social Capital","b":"Business Model Resilience, under Business Model & Innovation","c":"Critical Incident Risk Management, under Leadership & Governance","d":"Systemic Risk Management, under Leadership & Governance"},"answer":["d"],"expl":{"a":"Incorrect. Financial Inclusion concerns access to banking services, an Access & Affordability matter.","b":"Incorrect. Business Model Resilience concerns adapting to environmental and social transitions (Section 2.1.4).","c":"Incorrect. Critical Incident Risk Management concerns operational safety and catastrophic physical incidents.","d":"CORRECT. The guide's \"look at the industry level\" for Systemic Risk Management uses exactly these bank metrics (Section 2.1.5), and Table 1 lists the category under Leadership & Governance."}},{"id":"T3I2","lo":7,"type":"multi","choose":2,"text":"Which two statements about comparing the two banks are best supported? (Choose two.)","options":{"a":"The two banks cannot be compared because they operate under different regimes","b":"Bank A's G-SIB score should be normalized by total assets before comparison","c":"Bank A contributes more to systemic risk, but its integration of stress tests into capital planning indicates a stronger ability to absorb shocks","d":"Bank B is safer in every respect because its G-SIB score is lower","e":"Bank B's absence of a described stress-testing process, in a jurisdiction that does not mandate it, is a gap the user should investigate rather than read as low risk"},"answer":["c","e"],"expl":{"a":"Incorrect. Different regulatory climates are context for comparison (Section 6.1.3), not a bar to it.","b":"Incorrect. The G-SIB score is a regulatory composite that already reflects size and interconnectedness; it is not an absolute quantity to be scaled.","c":"CORRECT. The guide says the two metrics together show both contribution to systemic risk (G-SIB score) and ability to absorb shocks (stress-test integration) (Section 2.1.5). Bank A scores high on the first but demonstrates the second.","d":"Incorrect. A lower contribution to systemic risk says nothing about Bank B's ability to absorb a shock.","e":"CORRECT. Non-disclosure is not evidence of good performance (Practice Case 8 answer key); where regulation does not mandate stress tests, the user needs to assess management practices directly (Section 6.2)."}},{"id":"T3I3","lo":2,"type":"single","text":"Which component of external operating context most directly differs between the two banks, and how does it affect interpretation?","options":{"a":"Economic climate; interest rates differ","b":"Regulatory climate; mandatory public stress tests give users more reliable information about Bank A's resilience than is available for Bank B","c":"Business climate; Bank A has more competitors","d":"Operating location; Bank A's branches are more numerous"},"answer":["b"],"expl":{"a":"Incorrect. No interest rate information is given.","b":"CORRECT. The presence of regulation defines regulatory climate (Section 1.2.2.3). Mandatory, public stress testing improves the quality and comparability of information (Section 5.4) and imposes a discipline that Bank B's regime does not.","c":"Incorrect. No competitive information is given.","d":"Incorrect. Branch count is not described and is not what differs in the case."}},{"id":"T3I4","lo":9,"type":"single","text":"Based on the case, through which channel does systemic risk management most directly affect a bank's own financial performance?","options":{"a":"Cost of capital, since the ability to absorb shocks affects perceived solvency risk and the return investors and depositors require","b":"Tangible assets, through branch impairment","c":"Operating margin as a channel","d":"Revenues, through loan interest"},"answer":["a"],"expl":{"a":"CORRECT. The case says risk management is a significant factor in banks' profitability and long-term survival, and that liquidity and solvency risks are inherent; perceived solvency risk is reflected in the cost of capital (Section 8.2.2). Capital buffers above the minimum also affect the capital structure directly.","b":"Incorrect. No asset impairment is described.","c":"Incorrect. A ROIC component, not a channel (Section 9.1.1).","d":"Incorrect. Loan interest is the business model, not the channel through which risk management acts."}}]},{"id":"T3J","title":"Case 10: Biofuels Industry","built":"New case built on the guide's biofuels example (Section 2.1.4)","body":"<p>In the Biofuels industry, product design and lifecycle management is characterized by a product's lifecycle emissions balance; users evaluate lifecycle GHG emissions by biofuel type, which can be factored into Scope 3 disclosure. Fuel products that achieve a reduction in net emissions can qualify as advanced biofuels, which are expected to constitute an increasing share of production, and companies may garner financial incentives from the sale of advanced fuels. Biofuels companies that cost-effectively reduce the net carbon emissions of their products may gain a competitive advantage, leading to revenue growth and increased market share.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Production (million liters)</td><td>900</td><td>950</td><td>400</td><td>520</td></tr>\n<tr><td>Lifecycle GHG reduction versus fossil baseline (production-weighted)</td><td>35%</td><td>36%</td><td>52%</td><td>58%</td></tr>\n<tr><td>Percentage of production qualifying as advanced biofuel</td><td>10%</td><td>12%</td><td>60%</td><td>75%</td></tr>\n<tr><td>Incentive revenue from advanced fuel sales ($ millions)</td><td>6</td><td>7</td><td>30</td><td>45</td></tr>\n<tr><td>Total revenue ($ millions)</td><td>720</td><td>750</td><td>340</td><td>450</td></tr>\n</tbody></table>","questions":[{"id":"T3J1","lo":8,"type":"single","text":"What type of financial impact does the percentage of production qualifying as advanced biofuel most directly illuminate?","options":{"a":"An activity metric used only for normalization","b":"A liability: advanced fuels carry warranty obligations","c":"An opportunity: higher values indicate access to incentives, revenue growth, and market share","d":"A risk: higher values indicate regulatory exposure"},"answer":["c"],"expl":{"a":"Incorrect. Production volume is the activity metric; this is a performance metric.","b":"Incorrect. No obligation is described.","c":"CORRECT. Higher values indicate improved economic performance, the guide's test for an opportunity (Section 7.1); the case links advanced fuels to incentives, competitive advantage, revenue growth, and market share (Section 2.1.4).","d":"Incorrect. The case describes advanced-fuel status as a source of value, not exposure."}},{"id":"T3J2","lo":10,"type":"multi","choose":2,"text":"Which two DCF conclusions are best supported for Company B relative to Company A? (Choose two.)","options":{"a":"Higher revenue projections for Company B, as incentive revenue has grown from 8.8 to 10 percent of total revenue","b":"A higher discount rate for Company B, because its production is smaller","c":"Higher growth projections for Company B, reflecting its position in the growing advanced-fuel segment","d":"Lower expense projections for Company A, because conventional fuel is cheaper to make","e":"A write-down of Company A's plants"},"answer":["a","c"],"expl":{"a":"CORRECT. 30 ÷ 340 = 8.8 percent and 45 ÷ 450 = 10 percent; incentive revenue is a direct revenue channel (Section 8.2.1.1).","b":"Incorrect. Scale is not an ESG-informed basis for a risk premium; the case describes Company B's position as advantaged.","c":"CORRECT. The guide says advanced biofuels are expected to form an increasing share of production and that cost-effective emissions reducers gain market share; Company B's advanced share rose from 60 to 75 percent while production grew 30 percent (Section 8.2.3).","d":"Incorrect. The case gives no cost data and describes competitive advantage from emissions reduction, not from conventional production.","e":"Incorrect. No impairment is indicated."}},{"id":"T3J3","lo":4,"type":"single","text":"Which of the five factors is most clearly evidenced by the financial incentives attached to advanced-fuel qualification?","options":{"a":"Direct financial impacts and risk","b":"Industry norms, best practices, and competitive drivers","c":"Stakeholder concerns and social trends","d":"Legal, regulatory, and policy drivers"},"answer":["d"],"expl":{"a":"Incorrect. Although incentive revenue appears in the financial statements, what creates it is policy; the guide's airline example likewise treats regulation-driven costs under the regulatory factor.","b":"Incorrect. No peer practices are described.","c":"Incorrect. The case does not describe consumer or public pressure.","d":"CORRECT. Qualification criteria and the incentives attached to them are policy mechanisms; this factor covers regulation and policy that create risks or opportunities (Section 3.1)."}},{"id":"T3J4","lo":5,"type":"single","text":"Which statement about normalizing the incentive revenue data is correct?","options":{"a":"Incentive revenue should be normalized by number of employees","b":"Incentive revenue is already normalized and needs no further treatment","c":"Normalizing incentive revenue by total revenue shows Company B's advanced-fuel economics are a larger and growing part of its business (8.8 to 10 percent) than Company A's (0.8 to 0.9 percent)","d":"Incentive revenue should be normalized by lifecycle GHG reduction"},"answer":["c"],"expl":{"a":"Incorrect. Employees have no direct relationship with incentive revenue.","b":"Incorrect. It is an absolute dollar figure and reflects scale (Section 4.1).","c":"CORRECT. Company A: 6 ÷ 720 = 0.8 percent and 7 ÷ 750 = 0.9 percent; Company B: 8.8 to 10 percent. Revenue-based normalization suits a revenue metric and reveals economic significance (Section 4.2).","d":"Incorrect. Dividing revenue by a percentage produces no interpretable rate."}}]},{"id":"T3K","title":"Case 11: Health Care Delivery Industry","built":"New case built on the guide's health care example (Section 2.1.3)","body":"<p>In the Health Care Delivery industry, staff can be exposed to illnesses or injured by patients and medical equipment. A company's ability to minimize work-related injuries and illnesses directly affects staff well-being and therefore productivity and quality of service. Hospitals can implement training and safety programs, provide personal protective equipment, and gather employee feedback to reduce incidents. Fair labor practices can enhance brand image, improve morale, increase productivity, and reduce turnover.</p>\n<p>Company A operates 40 hospitals. Company B operates 15 hospitals and also owns a health insurance plan contributing 25 percent of its revenue. Among nine hospital operators in the region, the Year 2 total recordable incident rate has a mean of 5.2 per 100 full-time employees, a median of 4.8, and a standard deviation of 1.1.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Work-related injuries and illnesses (number)</td><td>3,200</td><td>3,000</td><td>1,500</td><td>1,650</td></tr>\n<tr><td>Full-time equivalent employees</td><td>60,000</td><td>62,000</td><td>22,000</td><td>22,000</td></tr>\n<tr><td>Voluntary nurse turnover</td><td>14%</td><td>13%</td><td>18%</td><td>22%</td></tr>\n<tr><td>Agency staffing costs ($ millions)</td><td>120</td><td>110</td><td>60</td><td>85</td></tr>\n</tbody></table>","questions":[{"id":"T3K1","lo":5,"type":"single","text":"What is each company's Year 2 recordable incident rate per 100 full-time employees?","options":{"a":"Company A 5.3; Company B 6.8","b":"Company A 4.8; Company B 7.5","c":"Company A 3,000; Company B 1,650","d":"Company A 7.5; Company B 4.8"},"answer":["b"],"expl":{"a":"Incorrect. These are Year 1 rates (3,200 ÷ 60,000 = 5.3; 1,500 ÷ 22,000 = 6.8).","b":"CORRECT. Company A: 3,000 ÷ 62,000 × 100 = 4.84. Company B: 1,650 ÷ 22,000 × 100 = 7.5. Workforce size is the appropriate normalization for injury counts (Section 4.2); absolute incidents would wrongly suggest Company A is worse.","c":"Incorrect. These are absolute counts, which reflect scale (Section 4.1).","d":"Incorrect. The rates are reversed."}},{"id":"T3K2","lo":6,"type":"single","text":"Assuming normal distribution, how do the two companies' Year 2 incident rates compare with the regional dataset?","options":{"a":"Company A is more than one standard deviation below the mean","b":"Company A is slightly below the mean (about 0.3 standard deviations), performing better than average; Company B is about 2.1 standard deviations above the mean, worse than roughly 98 percent of peers","c":"Company B is about one standard deviation above the mean","d":"Both are within one standard deviation of the mean"},"answer":["b"],"expl":{"a":"Incorrect. One standard deviation below the mean would be 4.1; Company A is at 4.84.","b":"CORRECT. Company A: (4.84 − 5.2) ÷ 1.1 = −0.33. Company B: (7.5 − 5.2) ÷ 1.1 = +2.09, just over two standard deviations, so worse than about 97.5 to 98 percent of peers (Section 5.2). Lower is better for an injury rate.","c":"Incorrect. One standard deviation above the mean would be 6.3; Company B is at 7.5.","d":"Incorrect. Company B is beyond two standard deviations."}},{"id":"T3K3","lo":9,"type":"multi","choose":2,"text":"Based on the case, through which two channels does employee health and safety most directly affect Company B's financial performance? (Choose two.)","options":{"a":"Revenues, through quality of service and brand image","b":"Expenses, through turnover-driven agency staffing costs","c":"Long-term growth rate as a channel","d":"Net working capital","e":"Tangible assets, through hospital impairment"},"answer":["a","b"],"expl":{"a":"CORRECT. The guide says safety affects productivity and quality of service and that fair labor practices enhance brand image (Section 2.1.3), which influence demand (Section 8.2.1.1).","b":"CORRECT. The case links injuries to morale and turnover; Company B's nurse turnover rose to 22 percent and agency staffing costs rose 42 percent (Section 8.2.1.2).","c":"Incorrect. A DCF input, not a channel (Section 8.2).","d":"Incorrect. A ROIC component (Section 9.1), not a channel.","e":"Incorrect. No impairment is described."}},{"id":"T3K4","lo":1,"type":"single","text":"How should Company B's health insurance plan influence the topics a user evaluates?","options":{"a":"Evaluate insurance topics only if the plan's members are hospital patients","b":"Replace the Health Care Delivery Standard with an insurance Standard","c":"No change, because insurance is part of health care","d":"Reference the relevant insurance or managed care Standard in addition to the Health Care Delivery Standard, because a significant revenue stream has a different sustainability profile"},"answer":["d"],"expl":{"a":"Incorrect. The test is the significance of the revenue stream, not member overlap.","b":"Incorrect. Hospitals remain 75 percent of revenue; the primary Standard is supplemented.","c":"Incorrect. Delivering care and underwriting coverage are different industries with different Standards.","d":"CORRECT. Major revenue streams are the first internal factor (Section 1.2.1.1); an insurance business at 25 percent of revenue raises distinct issues such as customer data and access, which the hospital Standard does not assume."}}]},{"id":"T3L","title":"Case 12: Cruise Lines Industry","built":"New case built on the guide's cruise example (Section 2.1.2)","body":"<p>In the Cruise Lines industry, quality and safety information relates to the health and safety of passengers while aboard, measured through the number of crime incidents involving passengers and employees, sanitation program inspection results, and the number of serious injuries and gastrointestinal illnesses experienced by customers during voyages. The guide distinguishes Product Quality & Safety, which concerns issues directly related to the product or service itself, from Customer Welfare, which concerns the benefits a person derives from consuming a good and the externalities it creates.</p>\n<p>Among eight cruise operators, the Year 2 rate of gastrointestinal illness per 100,000 passenger-days has a mean of 6.0, a median of 5.5, and a standard deviation of 1.8.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Passenger-days (millions)</td><td>50</td><td>52</td><td>12</td><td>14</td></tr>\n<tr><td>Gastrointestinal illness cases</td><td>2,600</td><td>2,500</td><td>960</td><td>1,540</td></tr>\n<tr><td>Sanitation inspection score (out of 100, pass at 86)</td><td>95</td><td>96</td><td>90</td><td>84</td></tr>\n<tr><td>Voyages cancelled or cut short due to illness outbreaks</td><td>0</td><td>0</td><td>0</td><td>2</td></tr>\n<tr><td>Revenue ($ billions)</td><td>9.0</td><td>9.4</td><td>2.1</td><td>2.0</td></tr>\n</tbody></table>","questions":[{"id":"T3L1","lo":3,"type":"single","text":"Based on the distinction the guide draws, under which general issue category do shipboard illness and sanitation metrics fall?","options":{"a":"Product Quality & Safety, because they concern the safety of the service itself","b":"Employee Health & Safety, because crew are also affected","c":"Customer Welfare, because they concern benefits from consumption","d":"Critical Incident Risk Management, because outbreaks are incidents"},"answer":["a"],"expl":{"a":"CORRECT. The guide's Cruise Lines example sits under Product Quality & Safety, which it defines as issues directly related to the product or service, as distinct from Customer Welfare, which concerns the benefits derived from consumption and the externalities of goods such as food, controlled substances, or counterfeit-prone products (Section 2.1.2).","b":"Incorrect. The metrics describe passenger outcomes.","c":"Incorrect. The guide places shipboard safety under Product Quality & Safety and reserves Customer Welfare for consumption-related benefits and externalities.","d":"Incorrect. Critical Incident Risk Management concerns operational safety of high-hazard operations (Section 2.1.5), not service quality."}},{"id":"T3L2","lo":6,"type":"single","text":"Assuming normal distribution, how should Company B's Year 2 illness rate per 100,000 passenger-days be characterized?","options":{"a":"At 11.0, more than two standard deviations above the mean; worse than roughly 99 percent of peers","b":"At 11.0, about one standard deviation above the mean","c":"At 6.9, within one standard deviation of the mean","d":"At 11.0, between one and two standard deviations above the mean"},"answer":["a"],"expl":{"a":"CORRECT. 1,540 ÷ 14,000,000 × 100,000 = 11.0; (11.0 − 6.0) ÷ 1.8 = +2.78, beyond two standard deviations, so worse than well over 97.5 percent of peers (Section 5.2). Higher is worse. Company A, by comparison, is at 4.8, about 0.66 standard deviations below the mean.","b":"Incorrect. One standard deviation above the mean is 7.8.","c":"Incorrect. 1,540 ÷ 14 million is 11.0, not 6.9.","d":"Incorrect. Two standard deviations above the mean is 9.6; 11.0 exceeds it."}},{"id":"T3L3","lo":8,"type":"single","text":"How should the financial impact of Company B's Year 2 performance be characterized?","options":{"a":"Acute and high magnitude: outbreaks cut two voyages short, the sanitation score fell below the passing threshold, and revenue declined despite more passenger-days","b":"Progressive and low magnitude: illness rates are a cost of doing business","c":"Potential only, since no fine was recorded","d":"An opportunity, since passenger-days grew"},"answer":["a"],"expl":{"a":"CORRECT. Cancelled voyages and a failed inspection are discrete events with immediate effects on the financial statements (Section 7.2.2); revenue fell 5 percent while capacity rose 17 percent, indicating demand damage. The guide's magnitude examples include publicized health incidents (Section 7.2.1.3).","b":"Incorrect. A doubling of the illness rate with cancelled voyages is not a gradual background cost.","c":"Incorrect. The impacts have occurred; they are actual (Section 7.2.1.1).","d":"Incorrect. Passenger-days are an activity metric; the performance metrics deteriorated."}},{"id":"T3L4","lo":9,"type":"multi","choose":3,"text":"Through which three channels does shipboard safety performance affect Company B in Year 2, based on the case? (Choose three.)","options":{"a":"Invested capital","b":"Revenues, through cancelled voyages and lost bookings","c":"Liabilities, through exposure to passenger claims","d":"Expenses, through remediation and refunds","e":"Turnover ratio"},"answer":["b","c","d"],"expl":{"a":"Incorrect. A ROIC and EVA component (Section 9.1), not a channel.","b":"CORRECT. Two voyages cut short and revenue down 5 percent while passenger-days grew indicate lost revenue (Section 8.2.1.1).","c":"CORRECT. Serious illness aboard creates legal risk from passenger claims, a future obligation (Section 8.2.1.4).","d":"CORRECT. Outbreaks and failed inspections require remediation and refunds, which are costs (Section 8.2.1.2).","e":"Incorrect. A ROIC component, not a channel (Section 9.1.1)."}}]},{"id":"T3M","title":"Case 13: Alcoholic Beverages Industry","built":"New case built on the guide's alcoholic beverages normalization example (Section 4.2.2)","body":"<p>Companies in the Alcoholic Beverages industry primarily consume energy through the production and distribution of products, and the industry Standard includes volume of products sold as an activity metric. Water is a key input, so ingredient sourcing from areas with high baseline water stress affects cost management and supply continuity. As a consumer-facing industry selling a controlled product, companies also face regulation and public scrutiny of responsible drinking and marketing practices, including restrictions on advertising to young people in many jurisdictions.</p>\n<p>Company A sells beer and spirits in markets with strict advertising rules and sources 20 percent of its grain from water-stressed regions. Company B sells beer in markets with few advertising restrictions, sources 55 percent of its grain from water-stressed regions, and operates a soft-drinks bottling business contributing 35 percent of revenue.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total energy consumed (thousand GJ)</td><td>10,000</td><td>10,400</td><td>6,000</td><td>6,900</td></tr>\n<tr><td>Volume of products sold (million hectoliters)</td><td>5.0</td><td>5.4</td><td>2.5</td><td>3.0</td></tr>\n<tr><td>Revenue ($ millions)</td><td>500</td><td>530</td><td>280</td><td>320</td></tr>\n<tr><td>Monetary losses from proceedings related to marketing practices ($ millions)</td><td>0</td><td>4</td><td>0</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T3M1","lo":5,"type":"single","text":"Normalized by volume of products sold, which statement about energy performance is accurate?","options":{"a":"Both companies worsened, because total energy rose","b":"Both companies improved, Company A from 2,000 to about 1,926 GJ per million hectoliters and Company B from 2,400 to 2,300, and Company A is the more efficient in both years","c":"Company A improved while Company B worsened","d":"Company B is more efficient than Company A in both years"},"answer":["b"],"expl":{"a":"Incorrect. Absolute energy rose because volume rose; per hectoliter both improved (Section 4.1).","b":"CORRECT. Company A: 10,000 ÷ 5.0 = 2,000 and 10,400 ÷ 5.4 = 1,926. Company B: 6,000 ÷ 2.5 = 2,400 and 6,900 ÷ 3.0 = 2,300. The guide's example normalizes this industry's energy by hectoliters sold (Section 4.2.2).","c":"Incorrect. Company B improved from 2,400 to 2,300.","d":"Incorrect. Company B's 2,300 to 2,400 exceeds Company A's 1,926 to 2,000 GJ per million hectoliters."}},{"id":"T3M2","lo":7,"type":"multi","choose":2,"text":"Considering context, which two statements about the companies' water-related risk are best supported? (Choose two.)","options":{"a":"Company B's soft-drinks business increases its water exposure, since water is the primary ingredient in that industry too","b":"The companies' water risk is identical because both source grain","c":"Company A faces greater risk because its energy use is higher in absolute terms","d":"Company B faces greater supply and cost risk because 55 percent of its grain comes from water-stressed regions","e":"Water risk is irrelevant to brewers because beer is mostly water by volume"},"answer":["a","d"],"expl":{"a":"CORRECT. The guide's beverage cases describe water as the primary ingredient and a leading risk (Practice Case 5); Company B's second revenue stream compounds its exposure.","b":"Incorrect. Exposure differs sharply by sourcing location.","c":"Incorrect. Energy and water are different issues, and absolute energy reflects scale.","d":"CORRECT. The guide says ingredient sourcing from high-stress areas translates directly into cost management and supply disruption risk (Section 2.1.4); 55 percent is nearly three times Company A's exposure.","e":"Incorrect. Water being a key input is why the risk matters, not why it is irrelevant."}},{"id":"T3M3","lo":2,"type":"single","text":"Company B records no losses from marketing-practice proceedings while Company A records $4 million. How should a user interpret this in light of regulatory climate?","options":{"a":"The topic is irrelevant to Company B","b":"Company B is better managed, since it has no losses","c":"Company B's zero losses reflect lenient advertising rules in its markets rather than lower risk, and emerging regulation would change its exposure","d":"Marketing regulation is part of the economic climate, so the comparison is not meaningful"},"answer":["c"],"expl":{"a":"Incorrect. The topic remains relevant to a consumer-facing seller of a controlled product; its near-term financial consequence differs by jurisdiction.","b":"Incorrect. Zero losses under lax rules say little about management quality.","c":"CORRECT. Regulatory climate is defined by the presence and enforcement of regulation, including possible future regulation (Section 1.2.2.3). Absence of fines in a lenient regime does not indicate low risk; the guide's hardware example makes the same point about differing regulatory regimes (Section 6.1.3).","d":"Incorrect. Regulation is the regulatory climate; economic climate concerns taxes, inflation, interest and commodity prices (Section 1.2.2.2)."}},{"id":"T3M4","lo":1,"type":"single","text":"How should Company B's soft-drinks bottling business influence the sustainability topics a user evaluates?","options":{"a":"No change, because both are beverages","b":"Reference the Non-Alcoholic Beverages Standard in addition to the Alcoholic Beverages Standard, because 35 percent of revenue falls outside the alcoholic beverages profile","c":"Replace the Alcoholic Beverages Standard","d":"Evaluate non-alcoholic topics only if the bottling plants are in water-stressed regions"},"answer":["b"],"expl":{"a":"Incorrect. The Standards and material issues differ, for example responsible drinking versus health and nutrition.","b":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1); the guide maintains separate Standards and activity metrics for the two industries (Section 4.2.2).","c":"Incorrect. Beer remains 65 percent of revenue; the primary Standard is supplemented.","d":"Incorrect. Operating location is an external factor (Section 1.2.2.4) and does not determine whether an additional Standard applies."}}]}];
const CASES4=[{"id":"T4A","title":"Case 1: Investment Banking & Brokerage Industry","built":"From the guide's professional-integrity dataset (Section 5.3)","body":"<p>The Investment Banking & Brokerage Standard includes, under the general issue category Business Ethics, the metric \"total amount of monetary losses as a result of legal proceedings associated with professional integrity, including duty of care.\" Ten companies reported the following.</p>\n<table><thead><tr><th>Company</th><th>Monetary losses ($ millions)</th><th>Revenue ($ millions)</th><th>Losses as % of revenue</th></tr></thead><tbody>\n<tr><td>A</td><td>4,006</td><td>33,565</td><td>11.94%</td></tr><tr><td>B</td><td>1,337</td><td>23,220</td><td>5.76%</td></tr><tr><td>C</td><td>563</td><td>34,537</td><td>1.63%</td></tr><tr><td>D</td><td>2,455</td><td>92,342</td><td>2.66%</td></tr><tr><td>E</td><td>1,200</td><td>83,270</td><td>1.44%</td></tr><tr><td>F</td><td>1,534</td><td>76,100</td><td>2.02%</td></tr><tr><td>G</td><td>2,362</td><td>61,897</td><td>3.82%</td></tr><tr><td>H</td><td>6,705</td><td>26,787</td><td>25.03%</td></tr><tr><td>I</td><td>11</td><td>2,228</td><td>0.50%</td></tr><tr><td>J</td><td>188</td><td>1,171</td><td>16.02%</td></tr>\n<tr><td>Mean</td><td>2,036</td><td></td><td>7.08%</td></tr><tr><td>Mean absolute deviation</td><td>1,477</td><td></td><td>6.35%</td></tr>\n</tbody></table>","questions":[{"id":"T4A1","lo":5,"type":"single","text":"Why does the guide recommend normalizing the monetary-loss data in this example?","options":{"a":"Fines are always normalized by number of employees","b":"The regulator requires fines to be reported as percentages","c":"Normalization removes outliers from the dataset","d":"The un-normalized data are widely dispersed, ranging from $11 million to $6.7 billion with a mean absolute deviation of nearly $1.5 billion, and normalizing by revenue reveals the cash-flow significance of fines"},"answer":["d"],"expl":{"a":"Incorrect. The guide normalizes fines by revenue, not employees.","b":"Incorrect. No such requirement is described; this is an analytical choice.","c":"Incorrect. Normalization changed which companies are outliers; it did not remove them.","d":"CORRECT. The guide states that the spread is quite wide, that the MAD of nearly $1.5 billion indicates widely dispersed data that would benefit from normalization, and that fines can be normalized by revenue to assess cash-flow implications (Section 5.3)."}},{"id":"T4A2","lo":5,"type":"multi","choose":2,"text":"Which two statements correctly describe how normalization changed the picture? (Choose two.)","options":{"a":"Company J moved from one of the smallest absolute losses to one of the highest relative to revenue, at more than 16 percent","b":"Company D's relatively high absolute loss of $2.455 billion is modest relative to its revenue, at 2.66 percent","c":"The mean of the normalized data is higher than the mean of the absolute data","d":"Normalization made all companies cluster within one percentage point","e":"Company H became the best performer after normalization"},"answer":["a","b"],"expl":{"a":"CORRECT. The guide highlights that Company J went from one performance extreme to the other: $188 million is a comparatively high share of $1,171 million in revenue (Section 5.3).","b":"CORRECT. The guide notes Company D paid a relatively high absolute amount that is a small share of its very large revenue.","c":"Incorrect. Means in dollars and in percentages are not comparable; the point is that dispersion fell.","d":"Incorrect. The guide says most results cluster between 0.5 and 5.76 percent, with a few outliers.","e":"Incorrect. Company H is the worst performer on both bases (25 percent of revenue)."}},{"id":"T4A3","lo":6,"type":"single","text":"What does the mean absolute deviation of $1,477 million tell the user about the un-normalized data?","options":{"a":"68 percent of companies fall within $1.5 billion of the mean, assuming normal distribution","b":"Company A is the median company","c":"The data are negatively skewed","d":"On average, data points lie about $1.5 billion from the mean, indicating wide dispersion"},"answer":["d"],"expl":{"a":"Incorrect. The 68 percent rule applies to one standard deviation in a normal distribution (Section 5.2), not to MAD.","b":"Incorrect. MAD says nothing about which company sits at the median.","c":"Incorrect. MAD measures spread, not skew; skew is read from mean versus median (Section 5.3.2).","d":"CORRECT. The guide defines MAD as the average distance of data points from the mean, and reads the $1.5 billion figure as evidence of wide dispersion (Section 5.3)."}},{"id":"T4A4","lo":8,"type":"single","text":"Which statement correctly characterizes the monetary-losses metric?","options":{"a":"It is an activity metric used to normalize revenue","b":"It indicates the likelihood of future impacts better than a description of risk-management practices","c":"It captures an opportunity, since settlements resolve disputes","d":"It captures a risk and is a lagging indicator of impacts that have already occurred, so it indicates actual rather than potential impacts"},"answer":["d"],"expl":{"a":"Incorrect. Revenue is the normalization measure for this metric, not the reverse.","b":"Incorrect. Forward-looking likelihood is better indicated by descriptions of management practices (Section 7.2.1.1); realized losses are backward-looking.","c":"Incorrect. Losses are costs, not benefits.","d":"CORRECT. Higher losses threaten performance, the test for a risk metric (Section 7.1), and fines and settlements record impacts that have occurred; the guide describes such losses as lagging indicators and actual impacts (Section 7.2.1.1; Hotels Putting It Into Practice)."}},{"id":"T4A5","lo":10,"type":"single","text":"How would the normalized data for Company H most directly inform a DCF valuation?","options":{"a":"Losses have no DCF effect because they are one-time","b":"Losses reduce the book value of intangible assets only","c":"Losses increase the long-term growth rate","d":"Losses at 25 percent of revenue materially reduce projected cash flows through expenses, and a pattern of such losses would justify a higher discount rate"},"answer":["d"],"expl":{"a":"Incorrect. Even acute impacts reduce the cash flows of the period in which they occur, and they inform perceived risk.","b":"Incorrect. Reputation may be affected, but the direct effect is on cash flows.","c":"Incorrect. Nothing links losses to growth (Section 8.2.3).","d":"CORRECT. The guide frames normalizing fines by revenue as assessing cash-flow implications (Section 5.3); fines are expenses that reduce projected cash flows (Section 8.2.1.2), and a company perceived as carrying greater ethics risk warrants a higher discount rate (Section 8.2.2)."}}]},{"id":"T4B","title":"Case 2: Pulp & Paper Products Industry","built":"From the guide's GHG normalization example (Section 4.2) and supply chain passage (Section 2.1.4)","body":"<p>The manufacturing process for pulp and paper generates GHG emissions, which can expose companies to regulatory compliance costs and risks related to climate change mitigation policies: operating and capital expenditures for abatement, requirements to purchase carbon credits or pay carbon taxes, emissions monitoring, and regulatory penalties. Emissions are closely tied to energy consumption from manufacturing, and because companies range from very large to very small producers, emissions vary greatly. Manufacturers also source large quantities of wood and fiber from forestry companies, recyclers, and owned forests; they use certifications and chain-of-custody standards to verify sustainable sourcing, and companies that do not may experience lower product demand and affect the long-term productivity of supplier forests.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th><th>Industry average</th></tr></thead><tbody>\n<tr><td>Gross global Scope 1 emissions (metric tons CO₂e)</td><td>105,000</td><td>60,000</td><td>75,000</td></tr>\n<tr><td>Revenue ($ billions)</td><td>5.2</td><td>1.0</td><td></td></tr>\n<tr><td>Revenue per metric ton of emissions</td><td>$49,524</td><td>?</td><td>$22,812</td></tr>\n<tr><td>Percentage of fiber certified to a chain-of-custody standard</td><td>90%</td><td>40%</td><td>65%</td></tr>\n</tbody></table>\n<p>Company A's jurisdiction has announced a carbon tax on industrial Scope 1 emissions beginning in Year 3.</p>","questions":[{"id":"T4B1","lo":5,"type":"single","text":"What is Company B's revenue per metric ton of emissions, and what does it indicate relative to the industry average?","options":{"a":"$60,000 per metric ton; above average","b":"It cannot be calculated from the data","c":"$16,667 per metric ton; above average, because 60,000 tons is below the 75,000-ton average","d":"$16,667 per metric ton; Company B's economic efficiency of emissions is below the industry average of $22,812"},"answer":["d"],"expl":{"a":"Incorrect. The ratio is revenue divided by emissions, not the emissions figure.","b":"Incorrect. Both inputs are given.","c":"Incorrect. A lower absolute figure does not mean better efficiency; per dollar of revenue Company B emits more than average.","d":"CORRECT. $1,000,000,000 ÷ 60,000 = $16,667 of revenue per metric ton, below the $22,812 average. The guide's example computes the same ratio for Company A ($49,524) and uses revenue as a rough proxy for production output (Section 4.2)."}},{"id":"T4B2","lo":7,"type":"single","text":"A user initially concludes that Company A is the worse emitter because 105,000 tons far exceeds the 75,000-ton industry average. According to the guide, what is wrong with this conclusion?","options":{"a":"The industry average is unreliable","b":"Company A's emissions should instead be compared with Company B's","c":"Absolute emissions are tied to production scale, which varies greatly across the industry; normalized by revenue, Company A's economic efficiency of emissions is more than twice the benchmark","d":"Nothing; absolute emissions are what regulators cap"},"answer":["c"],"expl":{"a":"Incorrect. The guide treats the average as valid; the issue is normalization.","b":"Incorrect. Comparing two absolute figures has the same flaw.","c":"CORRECT. This is the guide's own example: a user may conclude Company A emits considerably more than appropriate, but once normalized by revenue ($49,524 versus $22,812 per ton) its efficiency is superior to the benchmark (Section 4.2). Context about scale is essential before comparing (Section 4.1).","d":"Incorrect. No cap is described; the question is relative efficiency."}},{"id":"T4B3","lo":3,"type":"single","text":"Under which general issue category does the guide discuss chain-of-custody certification of fiber for pulp and paper manufacturers?","options":{"a":"Product Design & Lifecycle Management","b":"Materials Sourcing & Efficiency","c":"Supply Chain Management","d":"Ecological Impacts"},"answer":["c"],"expl":{"a":"Incorrect. This category concerns the design and lifecycle of the company's products.","b":"Incorrect. The guide explicitly distinguishes Materials Sourcing & Efficiency, which concerns the availability and pricing of key resources, from supply chain management.","c":"CORRECT. The guide's \"look at the industry level\" for Supply Chain Management uses Pulp & Paper certification and chain-of-custody standards as its example (Section 2.1.4).","d":"Incorrect. Ecological Impacts concerns a company's own impacts on ecosystems; forestry companies' practices are a supplier matter here."}},{"id":"T4B4","lo":9,"type":"multi","choose":3,"text":"According to the case, GHG emissions can affect pulp and paper companies through which three channels of financial impact? (Choose three.)","options":{"a":"Liabilities, through regulatory penalties for emissions violations","b":"Economic value added","c":"Turnover ratio","d":"Expenses, through carbon taxes, credit purchases, monitoring, and operating costs of abatement","e":"Assets, through capital expenditures for abatement equipment"},"answer":["a","d","e"],"expl":{"a":"CORRECT. The passage lists regulatory penalties, a legal risk and future obligation (Section 8.2.1.4).","b":"Incorrect. A valuation tool (Section 9.1.2), not a channel.","c":"Incorrect. A ROIC component (Section 9.1.1), not a channel.","d":"CORRECT. The passage lists operating expenditures for abatement, carbon taxes and credits, and monitoring (Section 8.2.1.2).","e":"CORRECT. The passage lists capital expenditures for abatement, which create or modify assets (Section 8.2.1.3)."}},{"id":"T4B5","lo":4,"type":"multi","choose":2,"text":"For the issue of GHG emissions in this industry, which two of the five factors are most clearly evidenced? (Choose two.)","options":{"a":"Direct financial impacts and risk","b":"Stakeholder concerns and social trends","c":"Legal, regulatory, and policy drivers","d":"Opportunities for innovation","e":"Emissions intensity ratio"},"answer":["a","c"],"expl":{"a":"CORRECT. Energy consumption and a carbon tax are costs captured in existing expense line items, the test for this factor (Section 3.1).","b":"Incorrect. The case describes customer demand in relation to fiber sourcing, not emissions.","c":"CORRECT. Carbon taxes, credit requirements, penalties, and climate mitigation policy are regulation; the guide lists emissions among topics with a history of regulation (Section 3.1).","d":"Incorrect. No innovation advantage is described.","e":"Incorrect. Not one of the five factors."}}]},{"id":"T4C","title":"Case 3: Oil & Gas – Exploration & Production Industry","built":"From the guide's Corruption Perceptions Index example (Section 6.1.2)","body":"<p>Companies in the Exploration & Production industry gain and maintain access to a country's oil and gas reserves, and the enactment of anti-corruption and anti-bribery laws in jurisdictions around the world raises the risk of regulatory sanctions, particularly for companies operating in corruption-prone regions. The Standard includes the percentage of proved and probable reserves in the 20 countries with the lowest Corruption Perceptions Index (CPI) rankings, and a description of the management system for preventing corruption and bribery throughout the value chain.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Proved reserves in the 20 lowest-CPI countries: oil</td><td>23%</td><td>25%</td></tr>\n<tr><td>Proved reserves in the 20 lowest-CPI countries: gas</td><td>10%</td><td>10%</td></tr>\n<tr><td>Probable reserves in the 20 lowest-CPI countries: oil</td><td>28%</td><td>26%</td></tr>\n<tr><td>Probable reserves in the 20 lowest-CPI countries: gas</td><td>12%</td><td>14%</td></tr>\n</tbody></table>\n<p>Most of Company A's low-CPI oil reserves are located in a country ranked 173 of 180 on the CPI, which has announced plans to increase oil production. Most of Company B's are in a country ranked 160 of 180. Company B also operates midstream pipelines that contribute 20 percent of its revenue.</p>","questions":[{"id":"T4C1","lo":2,"type":"single","text":"Despite comparable disclosures, the guide concludes Company A faces heightened corruption risk. Which components of external operating context support that conclusion?","options":{"a":"Business climate, because Company A has more competitors","b":"Economic climate and operating location: increased oil production raises economic activity and the potential for corrupt practices in the country where Company A's reserves sit, which ranks lower on the CPI","c":"Regulatory climate only, because Company A's home country has stricter laws","d":"Main inputs, because oil is more corruption-prone than gas"},"answer":["b"],"expl":{"a":"Incorrect. No competitive information is given.","b":"CORRECT. The guide poses this as a question about economic conditions: increased oil prices or production raise economic activity and corruption risk (Section 6.1.2), and it points to where the reserves are located, a country ranked 173 versus 160 (operating location, Section 1.2.2.4).","c":"Incorrect. The case gives no information about home-country law differences.","d":"Incorrect. Inputs are internal, and both companies hold similar oil and gas mixes."}},{"id":"T4C2","lo":7,"type":"multi","choose":2,"text":"Which two statements describe how a user should compare the two companies, consistent with the guide? (Choose two.)","options":{"a":"The user should also evaluate each company's described management system for preventing corruption throughout the value chain","b":"Comparable percentages do not imply comparable risk; which low-CPI countries the reserves are in, and conditions there, matter","c":"Company A is less risky because the number 173 is larger than 160","d":"Company B is riskier because its probable gas share is higher","e":"The percentages should be normalized by production volume before comparison"},"answer":["a","b"],"expl":{"a":"CORRECT. The Standard pairs the exposure metric with a description of the management system; the guide repeatedly says qualitative disclosures inform likelihood of future impacts (Sections 4.2.3 and 7.2.1.1).","b":"CORRECT. The guide concludes Company A faces heightened risk relative to Company B despite comparable disclosures, because of where its reserves are and the expected increase in activity (Section 6.1.2).","c":"Incorrect. A higher CPI rank number means more perceived corruption, so 173 is worse.","d":"Incorrect. A 2-point difference in gas share is not the basis of the guide's conclusion.","e":"Incorrect. The metrics are already percentages of reserves (Section 4.1)."}},{"id":"T4C3","lo":8,"type":"single","text":"Which disclosure in this case gives insight into the likelihood of future financial impacts rather than impacts already realized?","options":{"a":"The percentage of reserves in low-CPI countries, an exposure indicator of potential impacts","b":"The CPI rank itself, which measures the company's conduct","c":"Monetary losses from past proceedings, which the case reports","d":"Revenue from midstream pipelines"},"answer":["a"],"expl":{"a":"CORRECT. Potential impacts are latent; their likelihood can be assessed from exposure (Section 7.2.1.1). Reserves in corruption-prone countries indicate exposure to future sanctions.","b":"Incorrect. The CPI ranks countries, not companies.","c":"Incorrect. The case reports no past losses, and such losses would be realized impacts.","d":"Incorrect. This is revenue information relevant to internal factors, not ethics risk."}},{"id":"T4C4","lo":10,"type":"multi","choose":2,"text":"If anti-corruption enforcement intensifies globally, which two DCF adjustments for Company A are best supported? (Choose two.)","options":{"a":"Lower projected cash flows, reflecting potential fines and the possibility that regulatory action curtails operations in certain jurisdictions","b":"A higher long-term growth rate","c":"Lower expense projections","d":"An increase in the value of intangible assets","e":"A higher discount rate, reflecting greater perceived risk of sanctions"},"answer":["a","e"],"expl":{"a":"CORRECT. Fines are expenses, and regulatory action can curtail operations in jurisdictions, reducing revenue (Section 8.2.1).","b":"Incorrect. Nothing supports higher growth; the risk is to access and operations.","c":"Incorrect. Compliance and penalty costs would rise, not fall.","d":"Incorrect. Reputational damage reduces, not increases, intangible value.","e":"CORRECT. Companies with a record or risk of non-compliance face higher costs of capital through a higher risk premium (Aerospace & Defense example, Section 3.2; Section 8.2.2)."}},{"id":"T4C5","lo":1,"type":"single","text":"How should Company B's midstream pipeline business influence the sustainability topics a user evaluates?","options":{"a":"Replace the E&P Standard with the Midstream Standard","b":"Reference the Oil & Gas – Midstream Standard in addition to the Exploration & Production Standard, because a significant revenue stream falls outside the E&P profile","c":"Evaluate midstream topics only if the pipelines cross low-CPI countries","d":"No change, because pipelines serve the company's own production"},"answer":["b"],"expl":{"a":"Incorrect. E&P remains 80 percent of revenue; the primary Standard is supplemented.","b":"CORRECT. The guide lists separate Standards for Exploration & Production, Midstream, and Refining & Marketing, and uses an integrated company as its example of operations spanning multiple Standards (Section 1.2.1.1). Twenty percent of revenue is a significant stream with different issues, such as spills.","c":"Incorrect. Operating location is external (Section 1.2.2.4) and does not determine whether an additional Standard applies.","d":"Incorrect. The pipelines earn external revenue, making them a revenue stream rather than an input."}}]},{"id":"T4D","title":"Case 4: Coal Operations Industry","built":"From the guide's coal reserves example (Section 8.2.1.3)","body":"<p>As carbon markets form and stricter GHG emission limits loom, coal companies face the risk of asset write-offs or negative impacts on asset valuation. Regulatory limits, the development of alternative energy, and policies limiting the financing of coal-fired power plants could lower global demand for coal, and reserves may be designated \"unburnable.\" A company's strategic capital expenditure plans therefore significantly influence the value of new and existing assets and the revenue projections attributed to them. The Standard calls for a discussion of how price and demand for coal and climate regulation influence capital expenditure strategy.</p>\n<p>Company A plans, over the next five years, to transition some of its coal-fired generators to accommodate less carbon-intensive fuel sources in response to tightening regulation and falling coal prices. Company B plans to continue investing exclusively in coal-fired generation and in developing new reserves; 30 percent of its reserves lie in a jurisdiction that has announced a cap on power-sector emissions from Year 4.</p>","questions":[{"id":"T4D1","lo":10,"type":"multi","choose":2,"text":"According to the guide, how should an analyst adjust forecasts for Company A relative to a strictly coal-fired peer? (Choose two.)","options":{"a":"Assume higher depreciation rates","b":"Reduce capital expenditure forecasts","c":"Raise the terminal growth rate to reflect coal demand","d":"Assume lower depreciation rates, since transitioned assets retain value longer","e":"Adjust capital expenditure forecasts upward to reflect the transition investment"},"answer":["d","e"],"expl":{"a":"Incorrect. The guide's conclusion is the opposite.","b":"Incorrect. Transition requires investment; CapEx rises.","c":"Incorrect. The case describes falling coal demand.","d":"CORRECT. The same passage says the analyst may assume lower depreciation rates than for strictly coal-fired generators, because the transitioned assets are less exposed to write-off.","e":"CORRECT. The guide's example states that where a company plans to transition generators to less carbon-intensive fuels, an analyst may adjust CapEx forecasts up (Section 8.2.1.3)."}},{"id":"T4D2","lo":10,"type":"single","text":"Which valuation conclusion is best supported for Company B?","options":{"a":"Higher asset values, because coal-only investment is cheaper","b":"A lower discount rate, because the strategy is simple","c":"No adjustment, because the cap is not yet in force","d":"Elevated risk of asset write-downs and lower revenue projections attributable to reserves that may become unburnable, particularly the 30 percent under an announced emissions cap"},"answer":["d"],"expl":{"a":"Incorrect. Lower cost does not offset the risk of stranding.","b":"Incorrect. A business model exposed to transition risk raises, not lowers, perceived risk (Section 8.2.2).","c":"Incorrect. Announced regulation is part of regulatory risk (Section 1.2.2.3), and valuation is forward-looking.","d":"CORRECT. The guide states that coal companies face asset write-offs where reserves are designated unburnable and that CapEx strategy influences asset value and the revenue projections attributed to assets (Section 8.2.1.3). Continued coal-only investment under an announced cap concentrates that risk."}},{"id":"T4D3","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide place the discussion of how climate regulation influences coal capital expenditure strategy?","options":{"a":"GHG Emissions, under Environment","b":"Physical Impacts of Climate Change, under Business Model & Innovation","c":"Business Model Resilience, under Business Model & Innovation","d":"Systemic Risk Management, under Leadership & Governance"},"answer":["c"],"expl":{"a":"Incorrect. GHG Emissions concerns the company's own emissions, not the resilience of its business model to regulation of others' emissions.","b":"Incorrect. Physical Impacts concerns exposure of assets to weather and climate hazards, not transition risk.","c":"CORRECT. The guide presents the coal reserves metric under Business Model Resilience (Section 8.2.1.3) and names Coal Operations in its industry-level discussion of that issue, which concerns a company's ability to adapt to the low-carbon transition (Section 2.1.4).","d":"Incorrect. Systemic Risk concerns large-scale weakening of systems society depends on (Section 2.1.5)."}},{"id":"T4D4","lo":8,"type":"single","text":"How should the financial impact of transition risk for Company B be characterized?","options":{"a":"Low magnitude, since it affects only 30 percent of reserves","b":"Progressive and low magnitude, like an operating cost","c":"Actual and already recorded in Company B's financial statements","d":"Potential and high magnitude: its likelihood depends on how regulation and carbon markets develop, with the announced cap raising it, and stranding of reserves can threaten the business as a going concern"},"answer":["d"],"expl":{"a":"Incorrect. Thirty percent of reserves under a cap is a large share, and the risk extends to all coal assets as demand falls.","b":"Incorrect. Asset stranding is a step change in value, not a gradual operating cost.","c":"Incorrect. No write-down has yet occurred.","d":"CORRECT. Potential impacts are latent and depend on future conditions (Section 7.2.1.1); an announced cap moves the impact toward likely. The guide says business model resilience risks can threaten operations as a going concern (Section 2.1.4), the highest-magnitude category (Section 7.2.1.3)."}}]},{"id":"T4E","title":"Case 5: Home Builders Industry","built":"From the guide's home builders example (Section 2.1.4)","body":"<p>In the Home Builders industry, physical assets (homes) may be threatened by increased incidences of flooding and other physical impacts of climate change. The industry derives its value from building stock, so the extent to which that stock is exposed to climate-related risks affecting property value, building integrity, or livability (such as flooding and fires) directly shapes future value. The guide also notes that facilities in 100-year flood zones expose a company to higher insurance premiums and lower revenue.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Homes delivered (Year 2)</td><td>12,000</td><td>9,000</td></tr>\n<tr><td>Percentage of lots under development in 100-year flood zones</td><td>40%</td><td>5%</td></tr>\n<tr><td>Number of operating regions</td><td>2 (both coastal)</td><td>9</td></tr>\n<tr><td>Insurance premiums as a percentage of revenue</td><td>1.8%</td><td>0.6%</td></tr>\n<tr><td>Discussion of climate risk in land acquisition</td><td>Not provided</td><td>Flood and wildfire screening applied to all new land purchases</td></tr>\n</tbody></table>","questions":[{"id":"T4E1","lo":7,"type":"multi","choose":2,"text":"Considering context,
