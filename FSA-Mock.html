mprovement, about 8 percent per ton, because production also fell"},"answer":["d"],"expl":{"a":"Incorrect. Production fell 5 percent but energy fell 12.7 percent, so efficiency per ton improved.","b":"Incorrect. The normalized improvement (8.1 percent) is smaller than the absolute one.","c":"Incorrect. Steel produced is a production-based activity metric, the preferred basis for environmental metrics (Section 4.2).","d":"CORRECT. 1,142 ÷ 1,000 = 1.142 GJ per ton in Year 1; 997 ÷ 950 = 1.049 in Year 2, an improvement of about 8.1 percent. Part of the 12.7 percent absolute decline reflects the 5 percent fall in output, which is why the guide stresses normalizing when comparing against past performance (Sections 4.3.1 and 4.2)."}},{"id":"T2F2","lo":10,"type":"single","text":"Based on Steelmaker A's water management disclosures, which valuation adjustment does the guide's reasoning most directly support?","options":{"a":"Adjust Steelmaker A's forward-looking asset beta down, contributing to a lower cost of equity","b":"Increase Steelmaker A's expense projections","c":"Lower Steelmaker B's discount rate","d":"Raise Steelmaker A's long-term growth rate"},"answer":["a"],"expl":{"a":"CORRECT. Section 8.2.2.1 uses this industry as its example: where a company recycles a high percentage of withdrawn water and has no operations in high-stress regions, an analyst may consider its operations stable and adjust asset beta down, lowering cost of equity. Steelmaker A recycles 85 percent and has zero exposure to stressed regions.","b":"Incorrect. Nothing in Steelmaker A's data indicates rising costs.","c":"Incorrect. Steelmaker B withdraws 30 percent of its water in stressed regions and recycles only 42 percent; its risk profile does not support a lower discount rate.","d":"Incorrect. Growth projections reflect position in an expanding market (Section 8.2.3); water efficiency does not inform them here."}},{"id":"T2F3","lo":4,"type":"multi","choose":2,"text":"Which two of the five factors most clearly explain how energy management affects the financial performance of steelmakers, based on the case? (Choose two.)","options":{"a":"Grid electricity dependence","b":"Legal, regulatory, and policy drivers","c":"Stakeholder concerns and social trends","d":"Opportunities for innovation","e":"Direct financial impacts and risk"},"answer":["b","e"],"expl":{"a":"Incorrect. This is not one of the five factors (Section 3.1).","b":"CORRECT. The case refers to mitigating regulatory impacts in a carbon-constrained environment, pointing to existing or emerging emissions regulation (Section 3.1).","c":"Incorrect. No stakeholder pressure is described.","d":"Incorrect. The case does not describe innovation creating competitive advantage.","e":"CORRECT. Energy is a primary input whose cost is captured in existing expense line items, the test for this factor (Section 3.1); the case says reducing consumption lowers energy costs."}},{"id":"T2F4","lo":1,"type":"single","text":"How should Steelmaker B's captive iron ore mines influence the sustainability topics a user evaluates for it?","options":{"a":"Evaluate mining topics only if the mines are in a high water-stress region","b":"Because mining is a main input for value creation not typical of the industry profile, the user should consider topics from the Metals & Mining Standard in addition to the Iron & Steel Standard","c":"No change, because ore is purchased by all steelmakers","d":"Replace the Iron & Steel Standard with the Metals & Mining Standard"},"answer":["b"],"expl":{"a":"Incorrect. Water stress is an external factor (Section 1.2.2.4); whether mining topics apply is determined by the internal factor of inputs.","b":"CORRECT. Main inputs for value creation are the second internal operating factor (Section 1.2.1.2). A company that relies on atypical inputs, here self-mined ore, may need to reference an additional Standard to capture issues the Iron & Steel Standard assumes are handled by suppliers, just as the guide's integrated oil and gas example spans multiple Standards (Section 1.2.1.1).","c":"Incorrect. Owning mines means Steelmaker B bears mining-related risks directly rather than through suppliers.","d":"Incorrect. Steelmaking remains the primary business; the additional Standard supplements it."}}]},{"id":"T2G","title":"Case 7: Aerospace & Defense Industry","built":"New case built on the guide's business ethics example (Section 3.2)","body":"<p>The global nature of the Aerospace & Defense industry makes it especially prone to violations of anti-corruption and anti-bribery regulations. Violations can result in substantial fines, sanctions, and civil and criminal penalties, creating extraordinary expenses and contingent liabilities. Regulatory actions can curtail operations in certain jurisdictions, and actual or alleged violations can damage reputation and the ability to do business, affecting revenue and long-term growth. Companies with a record of non-compliance may also face higher costs of capital because of a higher risk premium. A company operating only in regions characterized by low corruption is likely to face a different risk profile.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company A</th><th colspan=\"2\">Company B</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Revenue ($ billions)</td><td>24.0</td><td>25.1</td><td>9.2</td><td>9.6</td></tr>\n<tr><td>Fines and settlements associated with corruption, bribery, or illicit international trade ($ millions)</td><td>0</td><td>120</td><td>0</td><td>0</td></tr>\n<tr><td>Revenue from countries ranked in the E or F band of the Government Defense Anti-Corruption Index</td><td>38%</td><td>40%</td><td>0%</td><td>0%</td></tr>\n<tr><td>Description of processes to manage business ethics risks</td><td colspan=\"2\">Code of conduct; third-party agent due diligence introduced in Year 2</td><td colspan=\"2\">Code of conduct; annual audit of all sales agents</td></tr>\n</tbody></table>","questions":[{"id":"T2G1","lo":2,"type":"single","text":"Company B's different business-ethics risk profile arises most directly from which component of its circumstances?","options":{"a":"Main inputs for value creation","b":"Economic climate","c":"Operating location(s)","d":"Business climate"},"answer":["c"],"expl":{"a":"Incorrect. Inputs are an internal factor (Section 1.2.1.2) and are not what differentiates the two companies here.","b":"Incorrect. Economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2).","c":"CORRECT. The guide states that an Aerospace & Defense company with operations only in regions characterized by low corruption is likely to face a different risk profile. Where a company operates is the operating location component of external context (Section 1.2.2.4), and Company B earns no revenue from high-corruption-risk countries.","d":"Incorrect. Business climate concerns competitive forces and peer behavior (Section 1.2.2.1)."}},{"id":"T2G2","lo":9,"type":"multi","choose":3,"text":"According to the case, poor performance on business ethics affects which three channels of financial impact? (Choose three.)","options":{"a":"Liabilities","b":"Invested capital","c":"Expenses","d":"Operating margin","e":"Cost of capital"},"answer":["a","c","e"],"expl":{"a":"CORRECT. The case names contingent liabilities, future obligations arising from legal risk (Section 8.2.1.4).","b":"Incorrect. Invested capital is a component of the ROIC and EVA formulas (Section 9.1), not a channel.","c":"CORRECT. Fines, sanctions, and penalties create extraordinary expenses (Section 8.2.1.2); Company A recorded $120 million in Year 2.","d":"Incorrect. Operating margin is a ROIC component used to diagnose competitive advantage (Section 9.1.1), not a channel.","e":"CORRECT. The case states that companies with a record of non-compliance may face higher costs of capital due to a higher risk premium (Section 8.2.2)."}},{"id":"T2G3","lo":4,"type":"multi","choose":3,"text":"Which three of the five factors are most clearly evidenced for the issue of business ethics in this industry? (Choose three.)","options":{"a":"Stakeholder concerns and social trends","b":"Legal, regulatory, and policy drivers","c":"Direct financial impacts and risk","d":"Opportunities for innovation","e":"Industry norms, best practices, and competitive drivers"},"answer":["a","b","c"],"expl":{"a":"CORRECT. The case states that actual or alleged violations damage reputation and the ability to do business, affecting revenue; reputational effects on brand are the hallmark of this factor (Section 3.1).","b":"CORRECT. The case centers on anti-corruption and anti-bribery regulation and the penalties for violating it (Section 3.1).","c":"CORRECT. Fines and settlements appear directly in the financial statements, the test for this factor (Section 3.1).","d":"Incorrect. No competitive advantage from innovation is described.","e":"Incorrect. The case does not describe peer practices driving performance."}},{"id":"T2G4","lo":8,"type":"single","text":"Which metric lends insight into the likelihood of future financial impacts rather than impacts already realized?","options":{"a":"Revenue from countries in the E or F band of the anti-corruption index, which indicates exposure to potential impacts","b":"Description of processes, which is a quantitative measure of realized losses","c":"Fines and settlements, which capture an opportunity","d":"Fines and settlements, which indicate potential impacts"},"answer":["a"],"expl":{"a":"CORRECT. Potential impacts are latent and their likelihood can be assessed from exposure (Section 7.2.1.1). Company A's 40 percent of revenue from high-corruption-risk countries indicates a high likelihood of future violations, whereas fines record impacts that have already occurred.","b":"Incorrect. The description of processes is a qualitative metric that explains how risk is managed, not a measure of losses (Section 4.2.3).","c":"Incorrect. Higher fines threaten performance, so the metric captures a risk (Section 7.1).","d":"Incorrect. Fines already incurred are actual impacts with 100 percent likelihood (Section 7.2.1.1)."}}]},{"id":"T2H","title":"Case 8: Multiline & Specialty Retailers Industry","built":"New case built on the guide's retail energy example (Section 8.2.1.2) and sourcing example (Section 7.1)","body":"<p>Retailers operate large store networks and distribution centers whose energy use is a significant operating cost; the industry's low margins mean firms can improve financial performance through long-term energy management. The energy metric provides insight into efficiency, potential cost savings from renewables, and exposure to grid disruptions and price volatility. Retailers also increasingly sell products certified to third-party environmental or social standards; where consumer demand drives such revenues, these products can command premiums and drive growth.</p>\n<table><thead><tr><th>Retailer A</th><th>Year 1</th><th>Year 2</th><th>Year 3</th></tr></thead><tbody>\n<tr><td>Total energy consumed (MWh)</td><td>500,000,000</td><td>507,240,000</td><td>508,046,000</td></tr>\n<tr><td>Percentage grid electricity</td><td>90%</td><td>85%</td><td>80%</td></tr>\n<tr><td>Percentage renewable energy</td><td>10%</td><td>15%</td><td>20%</td></tr>\n<tr><td>Total revenue (£ millions)</td><td>10,039</td><td>11,099</td><td>12,890</td></tr>\n<tr><td>Total energy costs (£ millions)</td><td>18.2</td><td>17.2</td><td>16.8</td></tr>\n<tr><td>Revenue from products certified to third-party sustainability standards (£ millions)</td><td>800</td><td>1,100</td><td>1,600</td></tr>\n</tbody></table>","questions":[{"id":"T2H1","lo":8,"type":"single","text":"How should the financial impact of Retailer A's improving energy efficiency be characterized?","options":{"a":"An impact on contingent liabilities","b":"A progressive, high-likelihood, near- to medium-term impact that lowers operating expenses","c":"A potential impact that depends on future regulation","d":"An acute, low-likelihood, high-magnitude impact"},"answer":["b"],"expl":{"a":"Incorrect. Energy costs are operating expenses, not future obligations (Section 8.2.1.4).","b":"CORRECT. The guide states that an increasingly efficient consumer of energy is likely to incur lower operating expenses, a progressive, high-likelihood, near- or medium-term impact (Section 8.2.1.2). Energy costs fell from £18.2 million to £16.8 million while revenue grew.","c":"Incorrect. The cost savings are already occurring, so the impact is actual (Section 7.2.1.1).","d":"Incorrect. Efficiency gains accrue gradually; they are not one-time events (Section 7.2.2)."}},{"id":"T2H2","lo":10,"type":"single","text":"How would a user most likely reflect Retailer A's energy performance in a DCF model?","options":{"a":"Increase the discount rate","b":"Lower the long-term growth rate","c":"Increase projected net cash flows through lower operating expense projections","d":"Write down the value of store assets"},"answer":["c"],"expl":{"a":"Incorrect. Reduced exposure to grid disruption and price volatility lowers, not raises, perceived risk (Section 8.2.2).","b":"Incorrect. Nothing in the energy data informs the growth rate downward.","c":"CORRECT. The guide states that lower operating expenses from energy efficiency may increase estimates of projected net cash flows (Section 8.2.1.2). Rising renewable share also reduces exposure to price volatility.","d":"Incorrect. No impairment is indicated (Section 8.2.1.3)."}},{"id":"T2H3","lo":5,"type":"single","text":"Retailer A's absolute energy consumption rose over three years while energy consumed per pound of revenue fell from 0.049 to 0.039 MWh. What does this show?","options":{"a":"The two measures contradict each other, so neither can be used","b":"Efficiency worsened, because absolute consumption is what regulators cap","c":"Revenue is an inappropriate normalization measure for energy","d":"Economic efficiency improved; the absolute increase reflects business growth"},"answer":["d"],"expl":{"a":"Incorrect. They answer different questions: absolute consumption describes scale, normalized consumption describes efficiency.","b":"Incorrect. No cap is described, and absolute values alone do not account for scale (Section 4.1).","c":"Incorrect. The guide states energy can be appropriately normalized by revenue and does so in this example (Section 4.2).","d":"CORRECT. Revenue grew 28 percent while energy rose 1.6 percent, so energy per pound of revenue fell about 20 percent. Normalizing by revenue reveals economic efficiency that absolute values obscure (Sections 4.1 and 4.2); the guide's own example computes these figures."}},{"id":"T2H4","lo":9,"type":"multi","choose":2,"text":"Which two statements about Retailer A's revenue from products certified to third-party sustainability standards are accurate? (Choose two.)","options":{"a":"The metric captures a risk, since certification increases compliance costs","b":"The metric captures an opportunity, since higher values indicate improved economic performance","c":"Its share of total revenue rose from 8.0 to 12.4 percent, which informs revenue and growth projections","d":"The metric affects liabilities, since certifications create legal obligations","e":"The metric is an activity metric to be used only for normalization"},"answer":["b","c"],"expl":{"a":"Incorrect. Higher values indicate improved performance, the test for an opportunity (Section 7.1).","b":"CORRECT. The guide describes revenue from certified products as a metric that measures a sustainability opportunity, capturing innovation, revenue growth, and the ability to command premiums (Section 7.1).","c":"CORRECT. 800 ÷ 10,039 = 8.0 percent; 1,100 ÷ 11,099 = 9.9 percent; 1,600 ÷ 12,890 = 12.4 percent. A rising share informs revenue projections (Section 8.2.1.1) and position in an expanding market (Section 8.2.3).","d":"Incorrect. No legal obligation is described; the channel is revenues.","e":"Incorrect. It is a sustainability accounting metric; activity metrics describe scale, such as store count."}}]},{"id":"T2I","title":"Case 9: Hardware Industry","built":"New case built on the guide's hardware examples (Sections 6.1.3 and 8.2.3)","body":"<p>Electronics hardware manufacturers face product lifecycle issues including the recovery and recycling of products and e-waste, and materials sourcing risks related to critical materials such as rare earth minerals and lithium, which often lack reasonable substitutes. Experts forecast lithium is heading for a perpetual deficit, with prices expected to rise as demand exceeds supply. Supply chains for critical materials often lack transparency and include countries with limited worker protections, exposing companies to reputational risk. Companies that manage shortages, supply disruptions, price volatility, and reputational damage related to critical materials can reduce expense growth projections.</p>\n<p>Company A operates in the United States and Europe; Company B operates only in the United States. European law requires higher e-waste recycling rates than United States law. Company A secures lithium through multi-year supply contracts with audited suppliers; Company B purchases lithium on the spot market.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Weight of products and e-waste recovered (tons)</td><td>150,000</td><td>130,000</td></tr>\n<tr><td>Percentage recycled</td><td>40%</td><td>20%</td></tr>\n<tr><td>Units produced (millions)</td><td>50</td><td>40</td></tr>\n<tr><td>Percentage of lithium sourced under multi-year contracts</td><td>90%</td><td>0%</td></tr>\n</tbody></table>","questions":[{"id":"T2I1","lo":7,"type":"multi","choose":2,"text":"A user wants to compare the two companies' management of product recycling on a like-for-like basis. Which two steps does the guide's approach support? (Choose two.)","options":{"a":"Normalize the recycling percentage by revenue","b":"Exclude Company B because it operates in only one country","c":"Compare only the companies' United States operations, where both face the same regulatory regime","d":"Conclude that Company A performs better because 40 percent is double 20 percent","e":"Normalize recovered material for company scale, such as units produced"},"answer":["c","e"],"expl":{"a":"Incorrect. A percentage is already normalized (Section 4.1); revenue would not add insight.","b":"Incorrect. Operating in one country is not grounds for exclusion; it is the reason the comparison must be scoped.","c":"CORRECT. This is the guide's own hardware example (Section 6.1.3): because European law requires higher recycling, comparing only operations under the same regulatory regime removes the regulatory effect.","d":"Incorrect. Comparing raw percentages ignores the different regulatory climates driving them.","e":"CORRECT. The same passage says to normalize for company scale, for example units produced, and to compare how each company manages its recovery programs."}},{"id":"T2I2","lo":2,"type":"single","text":"Which component of external operating context most directly explains the difference in the two companies' recycling rates?","options":{"a":"Regulatory climate","b":"Economic climate","c":"Business climate","d":"Main inputs for value creation"},"answer":["a"],"expl":{"a":"CORRECT. European laws require higher recycling rates; differences in regulation across regions and the strength of enforcement define the regulatory climate (Sections 1.2.2.3 and 6.1.3).","b":"Incorrect. Economic climate concerns taxes, inflation, interest rates, and commodity prices (Section 1.2.2.2).","c":"Incorrect. No peer or competitive behavior is described (Section 1.2.2.1).","d":"Incorrect. This is an internal factor (Section 1.2.1.2) and does not explain a regulatory difference."}},{"id":"T2I3","lo":3,"type":"single","text":"Risks related to the availability and price of lithium fall under which general issue category?","options":{"a":"Product Design & Lifecycle Management, under Business Model & Innovation","b":"Supply Chain Management, under Business Model & Innovation","c":"Materials Sourcing & Efficiency, under Business Model & Innovation","d":"Waste & Hazardous Materials Management, under Environment"},"answer":["c"],"expl":{"a":"Incorrect. Product Design & Lifecycle Management covers the e-waste recovery metric, not input sourcing.","b":"Incorrect. Supply Chain Management addresses the environmental and social practices of suppliers; the guide notes the reputational dimension of lithium sourcing but classifies the availability and price risk under Materials Sourcing & Efficiency.","c":"CORRECT. The guide presents the critical-materials metric for the Hardware industry under the general issue category Materials Sourcing & Efficiency (Section 8.2.3), listed under Business Model & Innovation in Table 1 (Section 2.1). It addresses the availability and price of critical inputs.","d":"Incorrect. Waste management concerns disposal of waste, not sourcing of inputs."}},{"id":"T2I4","lo":10,"type":"single","text":"Given the forecast lithium deficit, which DCF adjustment is best supported for Company B relative to Company A?","options":{"a":"Lower expense projections for Company B, because spot purchases avoid contract premiums","b":"A higher long-term growth rate for Company B","c":"A write-down of Company B's inventory","d":"Higher expense growth projections for Company B, reflecting a progressive, high-likelihood increase in input costs"},"answer":["d"],"expl":{"a":"Incorrect. The case forecasts rising prices, so spot exposure raises expected costs.","b":"Incorrect. Nothing in the case positions Company B to capture an expanding market.","c":"Incorrect. No impairment of existing inventory is indicated.","d":"CORRECT. The guide states that companies unable to secure needed materials face rising long-term costs, a progressive, high-likelihood impact, and that companies which manage these risks can reduce expense growth projections (Section 8.2.3). Company B, buying 100 percent on the spot market, is exposed to the forecast price rise; Company A has 90 percent under contract."}}]},{"id":"T2J","title":"Case 10: Auto Parts Industry","built":"New case built on the guide's auto parts example (Section 6.1.1.1)","body":"<p>Auto parts companies supply components to vehicle manufacturers. Companies with significant market power are exposed to risks related to anti-competitive practices, and the industry Standard includes the metric \"total amount of monetary losses as a result of legal proceedings associated with anti-competitive behavior regulations.\"</p>\n<p>Company A is one of seven major transmission manufacturers; no single company dominates that segment. Company B dominates the auto glass market and has only a single competitor. Company B also sells replacement glass directly to consumers through its own chain of retail stores, which contributes 30 percent of its revenue.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Monetary losses from legal proceedings associated with anti-competitive behavior (¥)</td><td>1 billion</td><td>0</td></tr>\n<tr><td>Market share in primary segment</td><td>14%</td><td>70%</td></tr>\n<tr><td>Number of major competitors in primary segment</td><td>6</td><td>1</td></tr>\n</tbody></table>","questions":[{"id":"T2J1","lo":7,"type":"multi","choose":2,"text":"Which two statements accurately describe how a user should compare the two companies on competitive behavior? (Choose two.)","options":{"a":"Company A's fine proves it has weaker business ethics than Company B","b":"The user should examine each company's risk management practices and policies for preventing anti-competitive behavior before judging relative risk","c":"The fines should first be normalized by revenue to make them comparable","d":"Zero losses means Company B faces zero risk","e":"Company B still faces significant anti-competitive risk because it operates in an oligopolistic segment, despite recording no losses"},"answer":["b","e"],"expl":{"a":"Incorrect. A fine records a realized impact; it does not by itself establish relative future risk, and competitive behavior is a distinct issue from business ethics (Section 2.1.5).","b":"CORRECT. The same passage says the user needs to delve into each company's risk management practices and policies to assess relative risk; context shapes the interpretation of performance data (Section 6.1).","c":"Incorrect. Normalizing would not change the conclusion; the missing information is context and practices, not scale.","d":"Incorrect. Absence of fines is a lagging indicator; market structure drives forward-looking risk.","e":"CORRECT. This is the guide's own example (Section 6.1.1.1): because Company B dominates a market with a single competitor, it still faces significant risk of anti-competitive behavior."}},{"id":"T2J2","lo":2,"type":"single","text":"Company B's dominant position in auto glass reflects which component of its operating context relevant to the issue of competitive behavior?","options":{"a":"Operating location, because its plants are concentrated","b":"Business climate, including the company's pricing power and the concentration of its market","c":"Economic climate, because glass prices are volatile","d":"Regulatory climate, because the segment is unregulated"},"answer":["b"],"expl":{"a":"Incorrect. Plant locations are not described.","b":"CORRECT. Business climate is defined by competitive forces and peer behaviors, including pricing power and competition for resources (Section 1.2.2.1). The guide's parallel Internet Media example explains that a company's degree of market dominance changes its sustainability profile relative to the industry standard.","c":"Incorrect. No price data are given, and economic climate concerns macro conditions (Section 1.2.2.2).","d":"Incorrect. The case says anti-competitive behavior is regulated; dominance is a market, not regulatory, characteristic."}},{"id":"T2J3","lo":1,"type":"single","text":"How should Company B's consumer retail stores influence the sustainability topics a user evaluates for it?","options":{"a":"Reference the Standard for the relevant retail industry in addition to the Auto Parts Standard, because a significant revenue stream falls outside the auto parts profile","b":"No change, because the stores sell auto parts","c":"Replace the Auto Parts Standard with a retail Standard","d":"Evaluate retail topics only if the stores operate in a different jurisdiction"},"answer":["a"],"expl":{"a":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1). Consumer-facing retail at 30 percent of revenue is a significant stream not normally associated with a business-to-business parts supplier, bringing retail topics such as energy management in stores and labor practices into scope.","b":"Incorrect. The relevant test is the nature of the revenue stream; direct-to-consumer retail has a different sustainability profile from manufacturing.","c":"Incorrect. Manufacturing remains 70 percent of revenue, so the primary Standard is supplemented, not replaced.","d":"Incorrect. Operating location is an external factor (Section 1.2.2.4) and does not determine whether an additional Standard applies."}},{"id":"T2J4","lo":1,"type":"single","text":"Company A outsources all transmission casting to a foundry partner and does not operate casting facilities, unlike the typical company in its industry. What does this imply for the user's evaluation?","options":{"a":"Energy management becomes more relevant to Company A","b":"Company A's sustainability profile is identical to the industry profile","c":"Company A should be evaluated under the Metals & Mining Standard","d":"Topics related to casting operations (for example, energy and workforce safety in foundries) are less directly relevant to Company A, while supplier management becomes more relevant"},"answer":["d"],"expl":{"a":"Incorrect. Outsourcing the energy-intensive step reduces, not increases, direct energy relevance.","b":"Incorrect. The Standard assumes typical operations; atypical inputs change relevance (Section 1.2.1.2).","c":"Incorrect. Company A does not mine; the question is which auto parts topics apply, not a change of industry.","d":"CORRECT. Main inputs for value creation are an internal factor (Section 1.2.1.2). The guide's semiconductor example explains that a company which outsources manufacturing does not control factory conditions, so direct operational topics shift toward how it manages suppliers."}}]},{"id":"T2K","title":"Case 11: Building Products & Furnishings Industry","built":"New case built on the guide's VOC example (Section 6.2)","body":"<p>In many jurisdictions, building products manufacturers must ensure their products meet standards for emissions of harmful chemicals such as volatile organic compounds (VOCs); meeting these standards is often required for a product to be legally offered for sale. Consumers also increasingly base purchasing decisions on the perceived safety of products.</p>\n<p>In Year 2, Company B launched a new suite of office furniture products, substantially increasing its product offerings. It was unable to meet VOC standards for all new products in time, as testing, verification, and documentation take considerable time; it expects the remaining products to be certified in Year 3. Among ten manufacturers in the region, the mean percentage of applicable products meeting VOC standards in Year 2 is 85 percent, the median 87 percent, and the standard deviation 8.</p>\n<table><thead><tr><th>Percentage of applicable products meeting VOC emissions and content standards</th><th>Year 1</th><th>Year 2</th></tr></thead><tbody>\n<tr><td>Company A</td><td>88%</td><td>87%</td></tr>\n<tr><td>Company B</td><td>84%</td><td>65%</td></tr>\n<tr><td>Company C</td><td>95%</td><td>96%</td></tr>\n</tbody></table>","questions":[{"id":"T2K1","lo":7,"type":"single","text":"How should a user interpret Company B's decline from 84 to 65 percent?","options":{"a":"As the result of a management decision to expand product offerings faster than certification could keep pace, likely to reverse in Year 3, rather than evidence of deteriorating chemical management","b":"As a systemic failure of chemical management that makes Company B the weakest competitor","c":"As irrelevant, because the metric is a percentage","d":"As evidence that Company B's existing products lost certification"},"answer":["a"],"expl":{"a":"CORRECT. This is the guide's own example (Section 6.2): narrative disclosure reveals the decline resulted from a product launch and timing constraints, not weaker management. Management decisions explain performance within context, and the user should monitor whether certification recovers as expected.","b":"Incorrect. The data alone suggest this, but the narrative explains the cause; the guide warns against conclusions without context.","c":"Incorrect. The metric is meaningful; interpretation, not relevance, is the issue.","d":"Incorrect. The case attributes the decline to new products not yet certified, not to existing products."}},{"id":"T2K2","lo":6,"type":"single","text":"Assuming normal distribution, how should Company B's Year 2 performance be described, and what should the user do with it?","options":{"a":"About 2.5 standard deviations below the mean; the user should exclude Company B as an outlier","b":"About 2.5 standard deviations below the mean, worse than roughly 99 percent of peers; the user should seek company-specific context, which the narrative provides, rather than exclude it","c":"At the mean, because 65 percent rounds to the median","d":"About 1 standard deviation below the mean; within the normal range"},"answer":["b"],"expl":{"a":"Incorrect. The guide does not exclude outliers; it investigates them (Section 5.3.1).","b":"CORRECT. (65 − 85) ÷ 8 = −2.5 standard deviations. Beyond two standard deviations below the mean lies fewer than 2.5 percent of values (Section 5.2), so Company B performs worse than roughly 99 percent of peers. Section 5.3.1 says outliers should prompt the question whether company-specific context explains the extraordinary result, which here it does.","c":"Incorrect. 65 is far below both the mean (85) and median (87).","d":"Incorrect. One standard deviation below the mean would be 77 percent."}},{"id":"T2K3","lo":4,"type":"multi","choose":2,"text":"Which two of the five factors most clearly explain how VOC standards affect financial performance in this industry? (Choose two.)","options":{"a":"Product certification timing","b":"Legal, regulatory, and policy drivers","c":"Stakeholder concerns and social trends","d":"Opportunities for innovation","e":"Industry norms, best practices, and competitive drivers"},"answer":["b","c"],"expl":{"a":"Incorrect. This is not one of the five factors (Section 3.1).","b":"CORRECT. The case states meeting VOC standards is often required for products to be legally sold; this is existing regulation with direct consequences (Section 3.1).","c":"CORRECT. The case states consumers increasingly base purchasing decisions on perceived product safety, a customer concern that shifts demand (Section 3.1).","d":"Incorrect. No innovation-driven advantage is described.","e":"Incorrect. The case does not describe peer practices as a driver."}},{"id":"T2K4","lo":9,"type":"single","text":"Products that fail to meet VOC standards cannot be legally offered for sale. Through which channel of financial impact does this most directly affect Company B?","options":{"a":"Revenues","b":"Cost of capital","c":"Liabilities","d":"Tangible assets"},"answer":["a"],"expl":{"a":"CORRECT. The guide notes the decline potentially compromises future sales; products that cannot be sold generate no revenue (Section 8.2.1.1).","b":"Incorrect. No change in investor risk perception is described; the effect is on near-term sales.","c":"Incorrect. No fines, litigation, or future obligations are described (Section 8.2.1.4).","d":"Incorrect. No impairment of plant or equipment is indicated (Section 8.2.1.3)."}}]},{"id":"T2L","title":"Case 12: Electrical & Electronic Equipment Industry","built":"New case built on the guide's five-year energy example (Section 4.3.1)","body":"<p>Companies in the Electrical & Electronic Equipment industry manufacture components and equipment. Energy is a significant operating input; the industry Standard pairs the energy management metric with activity metrics for units produced and number of employees. A company may lag its peers in total energy consumption and then suddenly report better performance; normalized data confirms whether efficiency actually improved. Among twelve manufacturers, Year 5 energy consumed per unit produced has a mean of 17.5 GJ, a median of 17.0, and a standard deviation of 1.2.</p>\n<table><thead><tr><th></th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y4</th><th>Y5</th></tr></thead><tbody>\n<tr><td colspan=\"6\"><strong>Company A</strong></td></tr>\n<tr><td>Total energy consumed (GJ)</td><td>873,098</td><td>880,435</td><td>893,200</td><td>891,908</td><td>750,098</td></tr>\n<tr><td>Units produced</td><td>45,952</td><td>47,591</td><td>48,290</td><td>49,006</td><td>41,670</td></tr>\n<tr><td colspan=\"6\"><strong>Company B</strong></td></tr>\n<tr><td>Total energy consumed (GJ)</td><td>1,230,093</td><td>1,220,766</td><td>1,200,032</td><td>1,110,000</td><td>1,088,208</td></tr>\n<tr><td>Units produced</td><td>72,358</td><td>70,975</td><td>71,430</td><td>66,564</td><td>65,162</td></tr>\n</tbody></table>","questions":[{"id":"T2L1","lo":5,"type":"single","text":"Company A's total energy consumption fell about 16 percent in Year 5. What does the normalized data show?","options":{"a":"Energy per unit worsened, because fewer units were produced","b":"The data cannot be normalized because employees are not reported","c":"Energy per unit improved only marginally, from about 18.2 to 18.0 GJ; most of the absolute decline reflects a 15 percent drop in production","d":"Energy per unit improved by about 16 percent, matching the absolute decline"},"answer":["c"],"expl":{"a":"Incorrect. Energy per unit fell slightly; it did not rise.","b":"Incorrect. Units produced is the activity metric provided for normalization (Section 4.2).","c":"CORRECT. Year 4: 891,908 ÷ 49,006 = 18.2 GJ per unit. Year 5: 750,098 ÷ 41,670 = 18.0. The guide's own example (Section 4.3.1) uses this data to show that a sudden absolute improvement must be confirmed by normalized data; here the efficiency gain is about 1 percent, and the rest is lower output.","d":"Incorrect. Normalized improvement is far smaller than the absolute change."}},{"id":"T2L2","lo":6,"type":"single","text":"How should the twelve-company distribution of energy per unit be described?","options":{"a":"Positively skewed, because the mean (17.5) exceeds the median (17.0)","b":"Cannot be determined without the standard deviation","c":"Normal, because mean and median are close","d":"Negatively skewed, because the median exceeds the mean"},"answer":["a"],"expl":{"a":"CORRECT. A positively skewed distribution has a mean greater than the median (Section 5.3.2): a few high-intensity companies pull the mean up. For this metric, a long right tail means a few notably inefficient companies.","b":"Incorrect. Skew is read from the relationship between mean and median (Section 5.3.2).","c":"Incorrect. A normal distribution has equal mean and median; a 0.5 GJ gap on a standard deviation of 1.2 is a meaningful difference.","d":"Incorrect. The mean, 17.5, is greater than the median, 17.0."}},{"id":"T2L3","lo":6,"type":"single","text":"Assuming normal distribution, which description of Year 5 performance is accurate?","options":{"a":"Company A is within one standard deviation above the mean (less efficient than average); Company B is within one standard deviation below the mean (more efficient than average)","b":"Company A is more than one standard deviation above the mean","c":"Company B is more than two standard deviations below the mean","d":"Both companies are below the mean"},"answer":["a"],"expl":{"a":"CORRECT. Company A: (18.0 − 17.5) ÷ 1.2 = +0.42 standard deviations. Company B: 1,088,208 ÷ 65,162 = 16.7 GJ per unit; (16.7 − 17.5) ÷ 1.2 = −0.67. Both fall within one standard deviation of the mean, on opposite sides (Section 5.2). For this metric lower is better.","b":"Incorrect. One standard deviation above the mean would be 18.7 GJ per unit.","c":"Incorrect. Two standard deviations below would be 15.1 GJ per unit.","d":"Incorrect. Company A at 18.0 is above the 17.5 mean."}},{"id":"T2L4","lo":8,"type":"single","text":"Over the five years, Company B's energy per unit has drifted from about 17.0 to 16.7 GJ while Company A's has moved from 19.0 to 18.0. What type of financial impact does this trend illuminate?","options":{"a":"A potential, acute, high-magnitude impact","b":"A liability arising from energy regulation","c":"An actual, progressive, low-magnitude impact on operating expenses","d":"An opportunity captured through revenue growth"},"answer":["c"],"expl":{"a":"Incorrect. Nothing one-time or high magnitude is described.","b":"Incorrect. No regulation or obligation is described in the case.","c":"CORRECT. Gradual efficiency gains in an everyday input accrue through operating costs; they are occurring now (actual), build over time (progressive), and are low magnitude in any single period (Sections 7.2.1 and 7.2.2). SASB metrics on everyday operations nearly always capture lower-magnitude impacts (Section 7.2.1.3).","d":"Incorrect. The effect is on costs, not revenue."}}]},{"id":"T2M","title":"Case 13: Non-Alcoholic Beverages Industry","built":"Return to a practice-case industry with a different issue (labeling and marketing)","body":"<p>Companies in the Non-Alcoholic Beverages industry produce juices, soft drinks, coffee and tea products, and energy drinks. Nutritional content increasingly shapes the competitive landscape as consumers demand healthier products and greater transparency in product labeling. In some jurisdictions, concerns about the accuracy and truthfulness of labeling and marketing have prompted labeling regulation, with scrutiny targeted at products marketed to children.</p>\n<p>Company P earns a significant share of revenue from beverages marketed to children. In Year 2 the jurisdiction in which it earns most of its revenue enacted rules restricting health claims on children's beverages and requiring front-of-pack sugar labeling, with fines for violations. Company Q markets no products to children; it also owns a brewing business that contributes 30 percent of its revenue.</p>\n<table><thead><tr><th></th><th>Company P</th><th>Company Q</th></tr></thead><tbody>\n<tr><td>Percentage of revenue from products marketed to children</td><td>30%</td><td>0%</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with marketing and labeling practices, Year 2 ($ millions)</td><td>12</td><td>0</td></tr>\n<tr><td>Percentage of revenue from low-calorie products</td><td>20%</td><td>45%</td></tr>\n<tr><td>Percentage of revenue from alcoholic beverages</td><td>0%</td><td>30%</td></tr>\n</tbody></table>","questions":[{"id":"T2M1","lo":3,"type":"single","text":"Regulation addressing the accuracy and truthfulness of claims and labels on products marketed to children implicates which general issue category?","options":{"a":"Customer Welfare, under Social Capital","b":"Selling Practices & Product Labeling, under Social Capital","c":"Human Rights & Community Relations, under Social Capital","d":"Product Quality & Safety, under Social Capital"},"answer":["b"],"expl":{"a":"Incorrect. Customer Welfare concerns the benefits and risks customers experience from using the product itself, such as nutritional content or food safety, not how it is labeled or marketed.","b":"CORRECT. Selling Practices & Product Labeling addresses social issues arising from a failure to manage the transparency, accuracy, and comprehensibility of marketing and labeling (Section 2.1.2). The case frames the regulation around accuracy and truthfulness of labeling and marketing.","c":"Incorrect. Human Rights & Community Relations concerns impacts on communities and vulnerable groups' rights, not consumer marketing.","d":"Incorrect. Product Quality & Safety concerns defects and hazards in products."}},{"id":"T2M2","lo":4,"type":"multi","choose":2,"text":"Which two of the five factors are most clearly evidenced for the issue of product labeling in this case? (Choose two.)","options":{"a":"Label design standards","b":"Stakeholder concerns and social trends","c":"Marketing channel mix","d":"Legal, regulatory, and policy drivers","e":"Opportunities for innovation"},"answer":["b","d"],"expl":{"a":"Incorrect. This is not one of the five factors (Section 3.1).","b":"CORRECT. The case states consumers demand greater transparency in labeling, a social trend shifting expectations and demand (Section 3.1).","c":"Incorrect. This is not one of the five factors (Section 3.1).","d":"CORRECT. The case describes newly enacted labeling rules with fines (Section 3.1).","e":"Incorrect. No innovation-based advantage is described for labeling."}},{"id":"T2M3","lo":1,"type":"single","text":"How should Company Q's brewing business influence the sustainability topics a user evaluates for it?","options":{"a":"Evaluate alcohol-related topics only if the brewery is in a water-stressed region","b":"Replace the Non-Alcoholic Beverages Standard with the Alcoholic Beverages Standard","c":"No change, because both are beverages","d":"Reference the Alcoholic Beverages Standard in addition to the Non-Alcoholic Beverages Standard, because a significant revenue stream falls outside the industry profile"},"answer":["d"],"expl":{"a":"Incorrect. Operating location is an external factor (Section 1.2.2.4) and does not determine whether an additional Standard applies.","b":"Incorrect. Non-alcoholic beverages remain 70 percent of revenue; the primary Standard is supplemented.","c":"Incorrect. The two industries have separate Standards and different material issues.","d":"CORRECT. Major revenue streams are the first internal operating factor (Section 1.2.1.1); the guide maintains a separate Alcoholic Beverages Standard with its own activity metric (Section 4.2.2). Thirty percent of revenue is a significant stream with a different sustainability profile, including responsible drinking and marketing issues."}},{"id":"T2M4","lo":9,"type":"single","text":"Through which channel of financial impact do Company P's $12 million losses from marketing and labeling proceedings most directly affect its financial performance?","options":{"a":"Assets, because the fines reduced brand value","b":"Revenues, because the fines reduced sales","c":"Liabilities, because the fines were paid in Year 2","d":"Expenses, as fines and settlements that are a direct cost"},"answer":["d"],"expl":{"a":"Incorrect. No evidence of brand impairment is given; and intangible asset effects would be indirect.","b":"Incorrect. A fine is a cost; any effect on sales would be indirect and is not described.","c":"Incorrect. Liabilities are future obligations and legal risks (Section 8.2.1.4); a fine already paid is an incurred expense. Future exposure to further fines would be the liability.","d":"CORRECT. Section 3.1 states that direct financial impacts usually appear as a direct expense, such as fines or settlements. Losses already incurred in the period are expenses (Section 8.2.1.2)."}}]}];

</script>
<script>
const TIME_LIMIT = 120*60; // real exam: 2 hours for 13 cases / 55 questions
const TESTS = {
  t1:{name:"Test 1", cases:CASES, note:"Cases 1–9 extend the study guide's practice cases; Cases 10–13 are industries the guide uses as worked examples."},
  t2:{name:"Test 2", cases:CASES2, note:"Cases 1–4 are built on the guide's four Putting It Into Practice studies; Cases 5–12 on industries from its worked examples; Case 13 revisits a practice-case industry with a different issue."}
};
let TEST="t1", ALLQ=[];
const state = {screen:"start", caseIdx:0, answers:{}, flags:{}, remaining:TIME_LIMIT, timer:null};
function setTest(t){ TEST=t; ALLQ=TESTS[t].cases.flatMap(c=>c.questions.map(q=>({...q,caseId:c.id}))); }
setTest("t1");
function skey(){ return "fsa-mock-"+TEST; }
function loadSaved(t){ try{ const s=localStorage.getItem("fsa-mock-"+t); if(s){ const o=JSON.parse(s); if(o && o.screen==="exam") return o; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem(skey(), JSON.stringify({screen:state.screen,caseIdx:state.caseIdx,answers:state.answers,flags:state.flags,remaining:state.remaining})); }catch(e){} }
const app=document.getElementById("app");
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const CASES_CUR=()=>TESTS[TEST].cases;

function render(){ if(state.screen==="start") renderStart(); else if(state.screen==="exam") renderExam(); else if(state.screen==="review") renderReview(); else renderResults(); window.scrollTo({top:0}); }

function renderStart(){
  const cards=Object.keys(TESTS).map(t=>{ const saved=loadSaved(t); const n=TESTS[t].cases.flatMap(c=>c.questions).length;
    return `<div class="q"><h2>${TESTS[t].name}</h2><p class="muted">${TESTS[t].cases.length} cases, ${n} questions. ${TESTS[t].note}</p>
    <p><button class="btn" onclick="startExam('${t}')">${saved?"Resume "+TESTS[t].name:"Start "+TESTS[t].name}</button> ${saved?`<button class="btn secondary" onclick="resetTest('${t}')">Start over</button>`:''}</p></div>`; }).join("");
  app.innerHTML=`<div class="wrap"><div class="start">
  <h1>FSA Credential Level II<br>Full mock exams</h1>
  <ul>
    <li>Each test is <strong>2 hours</strong>, 13 cases, 55 questions, the same as the real exam. About 9 minutes per case.</li>
    <li>Questions marked <em>choose two</em> or <em>choose three</em> are scored all-or-nothing, like the exam.</li>
    <li>Nothing is revealed until you submit. Flag anything you want to revisit.</li>
    <li>Every question can be answered from the case text alone. No formulas or outside industry knowledge are needed; simple normalization arithmetic is.</li>
    <li>Progress is saved in this browser if you accidentally close the tab.</li>
  </ul>
  ${cards}
  </div></div>`;
}
function startExam(t){ setTest(t); const saved=loadSaved(t); state.answers={}; state.flags={}; state.remaining=TIME_LIMIT; state.caseIdx=0; if(saved){ Object.assign(state,saved); } state.screen="exam"; state.timer=null; startTimer(); render(); save(); }
function resetTest(t){ if(!confirm("Clear all answers for "+TESTS[t].name+" and start over?")) return; try{localStorage.removeItem("fsa-mock-"+t);}catch(e){} render(); }
function resetAll(){ if(state.timer){clearInterval(state.timer);state.timer=null;} try{localStorage.removeItem(skey());}catch(e){} state.answers={}; state.flags={}; state.remaining=TIME_LIMIT; state.caseIdx=0; state.screen="start"; render(); }
function startTimer(){ if(state.timer) return; state.timer=setInterval(()=>{ state.remaining--; const t=document.getElementById("timer"); if(t){ t.textContent=fmt(state.remaining); t.classList.toggle("low",state.remaining<300);} if(state.remaining%15===0) save(); if(state.remaining<=0){ clearInterval(state.timer); state.timer=null; alert("Time is up. Your answers will be submitted."); submit(); } },1000); }

function qNumber(id){ return ALLQ.findIndex(q=>q.id===id)+1; }
function answered(q){ const a=state.answers[q.id]||[]; return a.length>0; }

function renderExam(){
  const CASES=CASES_CUR(); const c=CASES[state.caseIdx];
  app.innerHTML=`<div class="bar"><div class="bar-in">
    <div class="tabs">${CASES.map((cc,i)=>`<button class="tab ${i===state.caseIdx?'active':''}" onclick="goCase(${i})">Case ${i+1}</button>`).join("")}</div>
    <div class="muted" style="font-size:.9rem">${Object.values(state.answers).filter(a=>a.length).length} of ${ALLQ.length} answered</div>
    <div class="timer ${state.remaining<300?'low':''}" id="timer">${fmt(state.remaining)}</div>
  </div></div>
  <div class="wrap"><div class="grid">
    <div class="case"><h2>${c.title}</h2><div class="built">${c.built}</div>${c.body.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>')}</div>
    <div>
      ${c.questions.map(q=>renderQ(q)).join("")}
      <div class="navrow">
        <button class="btn secondary" ${state.caseIdx===0?'disabled':''} onclick="goCase(${state.caseIdx-1})">Previous case</button>
        ${state.caseIdx<CASES.length-1?`<button class="btn" onclick="goCase(${state.caseIdx+1})">Next case</button>`:`<button class="btn" onclick="state.screen='review';render()">Review and submit</button>`}
      </div>
    </div>
  </div></div>`;
}
function renderQ(q){
  const sel=state.answers[q.id]||[]; const multi=q.type==="multi";
  return `<div class="q" id="q-${q.id}">
    <div class="q-head"><span class="q-num">Question ${qNumber(q.id)}</span><button class="flagbtn ${state.flags[q.id]?'on':''}" onclick="toggleFlag('${q.id}')">${state.flags[q.id]?'Flagged':'Flag for review'}</button></div>
    <div class="q-text">${esc(q.text)}</div>
    ${Object.entries(q.options).map(([k,v])=>`<label class="opt ${sel.includes(k)?'chosen':''}"><input type="${multi?'checkbox':'radio'}" name="${q.id}" value="${k}" ${sel.includes(k)?'checked':''} onchange="choose('${q.id}','${k}',this.checked,${multi})"><span class="letter">${k.toUpperCase()}.</span><span>${esc(v)}</span></label>`).join("")}
    ${multi?`<div class="hint">Select exactly ${q.choose}.</div>`:''}
  </div>`;
}
function choose(qid,k,checked,multi){
  let a=state.answers[qid]||[];
  if(multi){ a=checked?[...a,k]:a.filter(x=>x!==k); } else { a=[k]; }
  state.answers[qid]=a; save();
  const box=document.getElementById("q-"+qid); box.querySelectorAll(".opt").forEach(o=>o.classList.toggle("chosen",o.querySelector("input").checked));
  const cnt=document.querySelector(".bar-in .muted"); if(cnt) cnt.textContent=`${Object.values(state.answers).filter(x=>x.length).length} of ${ALLQ.length} answered`;
}
function toggleFlag(qid){ state.flags[qid]=!state.flags[qid]; save(); const CASES=CASES_CUR(); const c=CASES[state.caseIdx]; document.getElementById("q-"+qid).outerHTML=renderQ(c.questions.find(q=>q.id===qid)); }
function goCase(i){ state.caseIdx=i; save(); render(); }
function goQ(qid){ state.caseIdx=CASES_CUR().findIndex(c=>c.id===ALLQ.find(q=>q.id===qid).caseId); state.screen="exam"; render(); setTimeout(()=>{const el=document.getElementById("q-"+qid); if(el) el.scrollIntoView({block:"start"});},50); }

function renderReview(){
  const un=ALLQ.filter(q=>!answered(q)); const inc=ALLQ.filter(q=>q.type==="multi"&&answered(q)&&(state.answers[q.id]||[]).length!==q.choose);
  app.innerHTML=`<div class="bar"><div class="bar-in"><strong>Review</strong><div class="timer ${state.remaining<300?'low':''}" id="timer">${fmt(state.remaining)}</div></div></div>
  <div class="wrap"><div class="start" style="margin-top:20px;max-width:860px">
  <h2>Ready to submit?</h2>
  <p class="muted">${un.length?`${un.length} unanswered.`:"All questions answered."} ${inc.length?`${inc.length} multi-select question${inc.length>1?'s have':' has'} the wrong number of selections.`:""} Flagged questions are underlined in gold. Tap any number to jump back.</p>
  <div class="dots">${ALLQ.map(q=>`<button class="navdot ${answered(q)?'done':''} ${state.flags[q.id]?'flag':''}" onclick="goQ('${q.id}')">${qNumber(q.id)}</button>`).join("")}</div>
  <button class="btn" onclick="submit()">Submit exam</button> <button class="btn secondary" onclick="state.screen='exam';render()">Back to questions</button>
  </div></div>`;
}

function grade(q){ const a=[...(state.answers[q.id]||[])].sort().join(); return a===[...q.answer].sort().join(); }
function submit(){ if(state.timer){clearInterval(state.timer);state.timer=null;} state.screen="results"; try{localStorage.removeItem("fsa-mock-1");}catch(e){} render(); }

function renderResults(){
  const correct=ALLQ.filter(grade).length; const pct=Math.round(100*correct/ALLQ.length);
  const byLO={}; ALLQ.forEach(q=>{ byLO[q.lo]=byLO[q.lo]||{n:0,c:0}; byLO[q.lo].n++; if(grade(q)) byLO[q.lo].c++; });
  const used=fmt(TIME_LIMIT-Math.max(0,state.remaining));
  app.innerHTML=`<div class="wrap">
  <h1>Results: ${TESTS[TEST].name}</h1>
  <div class="score"><div><div class="big">${pct}%</div><div class="muted">${correct} of ${ALLQ.length} correct</div></div><div class="muted">Time used: ${used}<br>The real exam scores 47 of 55 questions; the pass mark is not published, so treat this as a diagnostic of which objectives need work.</div></div>
  <h2>By learning objective</h2>
  <div class="tablewrap"><table class="lo-table"><thead><tr><th>LO</th><th>What it tests</th><th>Score</th><th></th></tr></thead><tbody>
  ${Object.keys(byLO).sort((a,b)=>a-b).map(lo=>`<tr><td>${lo}</td><td>${LO[lo]}</td><td>${byLO[lo].c}/${byLO[lo].n}</td><td><div class="bar-mini"><i style="width:${100*byLO[lo].c/byLO[lo].n}%"></i></div></td></tr>`).join("")}
  </tbody></table></div>
  <h2 style="margin-top:28px">Question by question</h2>
  ${CASES_CUR().map(c=>`<details open><summary>${c.title}</summary>
    <details><summary>Show the case text</summary><div class="case" style="position:static;max-height:none;margin:10px 0">${c.body.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>')}</div></details>
    ${c.questions.map(q=>renderResultQ(q)).join("")}</details>`).join("")}
  <p style="margin-top:24px"><button class="btn secondary" onclick="resetAll()">Back to tests</button></p>
  </div>`;
}
function renderResultQ(q){
  const sel=state.answers[q.id]||[]; const ok=grade(q);
  return `<div class="q"><div class="q-head"><span class="q-num">Question ${qNumber(q.id)}</span><span class="verdict ${ok?'ok':'bad'}">${ok?'Correct':(sel.length?'Incorrect':'Not answered')}</span></div>
  <div class="q-text">${esc(q.text)}</div>
  ${Object.entries(q.options).map(([k,v])=>{ const isAns=q.answer.includes(k), chose=sel.includes(k);
    const cls=isAns?'correct':(chose?'wrong':''); const tag=isAns&&chose?'Your answer ✓':isAns?'Correct answer':chose?'Your answer ✗':'';
    return `<div class="r-opt ${cls}"><span class="tag">${tag}</span><div class="body"><strong>${k.toUpperCase()}.</strong> ${esc(v)}<div class="ex">${esc(q.expl[k])}</div></div></div>`; }).join("")}
  <div class="lo-line">This question evaluates Learning Objective ${q.lo}: ${LO[q.lo]}.</div></div>`;
}
render();
</script>
</body>
</html>
