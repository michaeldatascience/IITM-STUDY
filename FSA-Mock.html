 which two conclusions about the two companies are best supported? (Choose two.)","options":{"a":"Company B's lower insurance cost proves it has better construction quality","b":"The companies are equally exposed because both build homes","c":"Company A's concentration in two coastal regions and 40 percent flood-zone exposure make its building stock far more exposed to climate-related loss of value than Company B's","d":"Company A is better positioned because coastal homes command higher prices","e":"Company B's screening of land purchases is a management decision that reduces the likelihood of future exposure"},"answer":["c","e"],"expl":{"a":"Incorrect. The premium difference reflects location risk, not construction quality.","b":"Incorrect. Exposure differs by a factor of eight.","c":"CORRECT. The guide says value derives from building stock and that exposure to flooding directly shapes future value (Section 2.1.4); geographic concentration (operating location, Section 1.2.2.4) compounds the exposure.","d":"Incorrect. Price does not offset the risk to integrity, livability, and insurability the guide describes.","e":"CORRECT. Management decisions are context for interpreting performance (Section 6.2); screening acquisitions limits future exposure."}},{"id":"T4E2","lo":8,"type":"single","text":"What type of financial impact does the flood-zone exposure metric most directly illuminate?","options":{"a":"An actual, progressive, low-magnitude impact","b":"A potential, high-magnitude, long-term impact whose likelihood is indicated by the share of lots exposed","c":"A realized expense recorded each year","d":"An opportunity, since flood zones are cheaper land"},"answer":["b"],"expl":{"a":"Incorrect. Insurance premiums are an actual progressive cost, but the flood-zone share measures exposure to future loss, not a cost already incurred.","b":"CORRECT. Exposure metrics indicate the likelihood of latent impacts (Section 7.2.1.1); climate-related damage to building stock affects value over the long term and can be severe (Section 7.2.1.3).","c":"Incorrect. Lots in a flood zone are not themselves an expense.","d":"Incorrect. The guide treats flood exposure as a threat to value."}},{"id":"T4E3","lo":9,"type":"multi","choose":3,"text":"Through which three channels of financial impact does climate exposure affect Company A, based on the case? (Choose three.)","options":{"a":"Invested capital","b":"Expenses, through higher insurance premiums","c":"Assets, through reduced property value and building integrity","d":"Revenues, through lower demand for homes with impaired livability or insurability","e":"Turnover ratio"},"answer":["b","c","d"],"expl":{"a":"Incorrect. A ROIC and EVA component, not a channel.","b":"CORRECT. The guide's flood-zone example cites higher insurance premiums (Section 8.2.1.2); Company A's premiums are three times Company B's as a share of revenue.","c":"CORRECT. The guide says exposure impacts property value and building integrity, affecting asset value (Section 8.2.1.3).","d":"CORRECT. The same example cites lower revenue; livability affects demand (Section 8.2.1.1).","e":"Incorrect. A ROIC component (Section 9.1.1), not a channel."}},{"id":"T4E4","lo":2,"type":"single","text":"Which component of external operating context most directly drives the difference in the two companies' exposure?","options":{"a":"Operating location(s), because physical climate hazards depend on where the building stock is","b":"Regulatory climate, because flood zones are a legal designation","c":"Business climate, because coastal markets are more competitive","d":"Economic climate, because interest rates affect home prices"},"answer":["a"],"expl":{"a":"CORRECT. Operating location captures the physical and geographic conditions of a company's operations (Section 1.2.2.4; Section 6.1.4). Company A's two coastal regions versus Company B's nine diversified regions determine exposure.","b":"Incorrect. The flood zone is a description of physical hazard, and no regulation is described.","c":"Incorrect. No competitive information is given.","d":"Incorrect. Interest rates are not what differs between the companies."}}]},{"id":"T4F","title":"Case 6: Forestry Management Industry","built":"From the guide's forestry example (Section 2.1.1)","body":"<p>Forestry Management companies own or manage forestry lands and timber tracts. Forests provide ecosystem services such as carbon sequestration and wildlife habitat. In many regions, a company's ability to obtain and maintain harvesting rights depends on meeting environmental preservation requirements. Companies increasingly use third-party certification to demonstrate sustainable management, which enhances the value and productivity of forest assets and meets rising customer demand for sustainably produced forest products. Users evaluate performance through total forestland certified to a third-party standard, land with protected conservation status or home to endangered species, and the company's strategy to optimize opportunities from ecosystem services.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Forestland managed (thousand hectares)</td><td>800</td><td>500</td></tr>\n<tr><td>Percentage certified to a third-party forest management standard</td><td>95%</td><td>50%</td></tr>\n<tr><td>Percentage with protected conservation status or endangered-species habitat</td><td>12%</td><td>4%</td></tr>\n<tr><td>Harvesting-rights regime</td><td>Rights conditional on preservation requirements</td><td>No preservation conditions on harvesting rights</td></tr>\n<tr><td>Revenue from carbon credits ($ millions)</td><td>18</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T4F1","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide discuss forest certification and conservation-status land?","options":{"a":"Ecological Impacts, under Environment","b":"Business Model Resilience, under Business Model & Innovation","c":"Supply Chain Management, under Business Model & Innovation","d":"Materials Sourcing & Efficiency, under Business Model & Innovation"},"answer":["a"],"expl":{"a":"CORRECT. The guide's \"look at the industry level\" for Ecological Impacts uses Forestry Management as one of its two examples (Section 2.1.1); Table 1 lists the category under Environment.","b":"Incorrect. Business Model Resilience concerns adaptation to transitions, not ecosystem management.","c":"Incorrect. Supply Chain Management concerns suppliers' practices; here the company manages the land itself.","d":"Incorrect. Materials Sourcing concerns availability and price of inputs the company buys."}},{"id":"T4F2","lo":9,"type":"multi","choose":2,"text":"According to the case, through which two channels does certification most directly affect a forestry company's financial performance? (Choose two.)","options":{"a":"Assets, through enhanced value and productivity of forest assets","b":"Liabilities, through certification penalties","c":"Revenues, through customer demand for sustainably produced products and maintained harvesting rights","d":"Turnover ratio","e":"Economic value added"},"answer":["a","c"],"expl":{"a":"CORRECT. The guide says certification enhances the value and productivity of forest assets (Section 8.2.1.3).","b":"Incorrect. No penalties for lacking certification are described; it is voluntary.","c":"CORRECT. The guide says certification meets rising customer demand and that harvesting rights, the license to earn revenue, depend on meeting preservation requirements (Section 8.2.1.1).","d":"Incorrect. A ROIC component, not a channel (Section 9.1.1).","e":"Incorrect. A valuation tool, not a channel (Section 9.1.2)."}},{"id":"T4F3","lo":4,"type":"multi","choose":2,"text":"For Company A, which two of the five factors most clearly explain why ecosystem management affects financial performance? (Choose two.)","options":{"a":"Direct financial impacts and risk","b":"Stakeholder concerns and social trends, since customer demand for sustainably produced products is rising","c":"Certified hectare ratio","d":"Industry norms, best practices, and competitive drivers","e":"Legal, regulatory, and policy drivers, since harvesting rights depend on preservation requirements"},"answer":["b","e"],"expl":{"a":"Incorrect. The case does not describe costs captured in existing line items; the effects run through access and demand. (Carbon credit revenue is an opportunity for innovation in ecosystem services rather than a direct cost.)","b":"CORRECT. The guide cites rising customer demand for sustainably produced forest products, a social trend shifting demand (Section 3.1).","c":"Incorrect. Not one of the five factors.","d":"Incorrect. No peer practices are described.","e":"CORRECT. In Company A's regime, the right to harvest, and therefore to earn revenue, is conditional on regulatory requirements (Section 3.1)."}},{"id":"T4F4","lo":7,"type":"single","text":"Company B operates where harvesting rights carry no preservation conditions. How should a user interpret its 50 percent certification rate in that context?","options":{"a":"The regulatory driver is weaker for Company B, but the customer-demand driver still applies and emerging preservation requirements would raise its exposure, so the lower rate is a risk to monitor rather than evidence of adequate management","b":"Company B's rate is meaningless without normalization","c":"Company B is adequately managed, because certification is unnecessary where not required","d":"Company B outperforms because it has fewer protected hectares to manage"},"answer":["a"],"expl":{"a":"CORRECT. Regulatory climate changes the near-term consequence of performance (Section 6.1.3), but the guide also ties certification to customer demand and asset productivity, which apply regardless, and possible future regulation is part of regulatory risk (Section 1.2.2.3).","b":"Incorrect. A percentage of forestland is already normalized (Section 4.1).","c":"Incorrect. The guide links certification to demand and asset value, not only compliance.","d":"Incorrect. Protected land reflects ecosystem value the guide treats as an asset, not a burden."}}]},{"id":"T4G","title":"Case 7: Air Freight & Logistics Industry","built":"From the guide's air freight example (Section 2.1.5) and non-normalized metrics passage (Section 4.1)","body":"<p>Transportation activities involve inherent dangers related to mechanical failure and human error. In the Air Freight & Logistics industry, performance on critical incident risk is assessed through the number of aviation and road accidents and a description of safety management systems. Failure to maintain satisfactory safety ratings and records can reduce demand for services and impair a company's ability to continue to conduct shipments, reducing revenues and market share. The guide notes that for acute, low-frequency events not directly related to everyday operations, fewer incidents indicate better performance regardless of company size, though a user may still choose to normalize to better understand financial impacts.</p>\n<p>Among eight carriers, Year 2 road accidents per million shipments have a mean of 4.0 and a standard deviation of 1.2.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Shipments (millions)</td><td>10</td><td>2</td></tr>\n<tr><td>Aviation accidents</td><td>1</td><td>0</td></tr>\n<tr><td>Road accidents</td><td>40</td><td>12</td></tr>\n<tr><td>Safety management system</td><td>Certified; annual third-party audit</td><td>Internal program; no audit</td></tr>\n</tbody></table>","questions":[{"id":"T4G1","lo":5,"type":"multi","choose":2,"text":"Which two statements about normalizing the accident data are consistent with the guide? (Choose two.)","options":{"a":"Aviation accidents are acute, low-frequency events where fewer is better regardless of size, so the count is informative without normalization","b":"All accident data must be normalized by revenue before use","c":"Accident counts are percentages and are already normalized","d":"A user may nonetheless normalize road accidents by shipments to understand financial impact: Company A has 4.0 per million shipments and Company B 6.0","e":"Company B is safer because it has fewer total accidents"},"answer":["a","d"],"expl":{"a":"CORRECT. The guide states that for acute, low-frequency events such as spills or recalls, fewer indicate better performance regardless of company size or output (Section 4.1).","b":"Incorrect. The guide treats normalization of such metrics as optional and revenue is not the natural basis.","c":"Incorrect. Counts are absolute data (Section 4.1).","d":"CORRECT. The same passage says a user may still choose to normalize to better understand financial impacts. 40 ÷ 10 = 4.0 and 12 ÷ 2 = 6.0 per million shipments.","e":"Incorrect. Fewer total road accidents here reflect one-fifth the shipments; per shipment Company B is worse."}},{"id":"T4G2","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide discuss accident data for this industry?","options":{"a":"Systemic Risk Management, under Leadership & Governance","b":"Critical Incident Risk Management, under Leadership & Governance","c":"Employee Health & Safety, under Human Capital","d":"Product Quality & Safety, under Social Capital"},"answer":["b"],"expl":{"a":"Incorrect. Systemic Risk concerns society-wide systems such as banking or power grids.","b":"CORRECT. The guide's \"look at the industry level\" for Critical Incident Risk Management uses Air Freight & Logistics accidents as its example (Section 2.1.5).","c":"Incorrect. Employee Health & Safety concerns workforce injury rates; accidents here concern operational safety of high-hazard activities.","d":"Incorrect. Product Quality & Safety concerns the safety of products or services to customers, such as cruise passengers."}},{"id":"T4G3","lo":6,"type":"single","text":"Assuming normal distribution, how should the two companies' Year 2 road accident rates be characterized relative to the eight-carrier dataset?","options":{"a":"Company A is at the mean; Company B is about 1.7 standard deviations above the mean, worse than roughly 95 percent of peers","b":"Company A is one standard deviation below the mean","c":"Both are within one standard deviation of the mean","d":"Company B is more than two standard deviations above the mean"},"answer":["a"],"expl":{"a":"CORRECT. Company A: 4.0, exactly the mean. Company B: (6.0 − 4.0) ÷ 1.2 = 1.67, between one and two standard deviations above, so worse than about 95 percent of peers (Section 5.2). Higher is worse.","b":"Incorrect. Company A is at the mean, not below it.","c":"Incorrect. Company B exceeds one standard deviation (5.2).","d":"Incorrect. Two standard deviations above the mean is 6.4; Company B is at 6.0."}},{"id":"T4G4","lo":9,"type":"single","text":"According to the case, through which channel does poor safety performance most directly affect an air freight company?","options":{"a":"Cost of capital only","b":"Net working capital","c":"Tangible assets, through aircraft depreciation","d":"Revenues, through reduced demand and impaired ability to continue conducting shipments"},"answer":["d"],"expl":{"a":"Incorrect. Cost of capital may be affected indirectly, but the guide's stated channel is revenue.","b":"Incorrect. A ROIC component, not a channel.","c":"Incorrect. Depreciation schedules are not affected by accident rates in the case.","d":"CORRECT. The guide states that failure to maintain satisfactory safety records could reduce demand for services and impair the ability to conduct shipments, reducing revenues and market share (Section 2.1.5; Section 8.2.1.1)."}}]},{"id":"T4H","title":"Case 8: Software & IT Services Industry","built":"From the guide's IP-based competitive behavior example (Section 2.1.5)","body":"<p>In the Software & IT Services industry, anti-competitive behavior centers on intellectual property (IP) protection. IP protection is an inherent business model component, but IP practices can conflict with the interests of society: acquisition of patents can be used to restrict competition, which restricts access to the benefits of innovation. Larger companies may have more resources to accumulate patents, presenting potentially unfair competition and making them the subject of IP infringement litigation and regulatory scrutiny. Monetary losses from legal proceedings are used to assess this risk.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Revenue ($ billions)</td><td>60</td><td>3</td></tr>\n<tr><td>Active patents held</td><td>45,000</td><td>600</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with anti-competitive behavior ($ millions, Year 2)</td><td>300</td><td>0</td></tr>\n<tr><td>Open regulatory investigations into licensing practices</td><td>2</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T4H1","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide place IP-related litigation losses in this industry?","options":{"a":"Data Security, under Social Capital","b":"Business Ethics, under Leadership & Governance","c":"Competitive Behavior, under Leadership & Governance","d":"Product Design & Lifecycle Management, under Business Model & Innovation"},"answer":["c"],"expl":{"a":"Incorrect. Data Security concerns protection of information systems.","b":"Incorrect. Business Ethics concerns bribery, corruption, fraud, and money laundering, not market power.","c":"CORRECT. The guide's \"look at the industry level\" for Competitive Behavior uses Software & IT Services and IP practices as its example (Section 2.1.5).","d":"Incorrect. This category concerns the environmental and social characteristics of products."}},{"id":"T4H2","lo":2,"type":"single","text":"Why is the competitive behavior topic more relevant to Company A than to Company B?","options":{"a":"Competitive behavior is equally relevant to all software companies","b":"Company B has a higher ratio of patents to revenue","c":"Company A's scale and patent accumulation give it market power, a feature of its business climate, which draws litigation and regulatory scrutiny","d":"Company A operates in a jurisdiction with weaker IP law"},"answer":["c"],"expl":{"a":"Incorrect. The guide's Internet Media example makes the same point: a small player in a competitive market has a different profile (Section 1.2.2.1).","b":"Incorrect. Company B holds 200 patents per $ billion against Company A's 750, and the issue is absolute market power in any case.","c":"CORRECT. The guide says larger companies with more resources to accumulate patents present potentially unfair competition and become subjects of litigation and scrutiny (Section 2.1.5). Market power and pricing power are elements of business climate (Section 1.2.2.1), which adjusts topic relevance.","d":"Incorrect. No jurisdictional difference is described."}},{"id":"T4H3","lo":4,"type":"single","text":"The guide says IP protection is an inherent business model component that can conflict with society's interests. Which of the five factors most directly captures the resulting regulatory scrutiny and litigation?","options":{"a":"Industry norms, best practices, and competitive drivers","b":"Opportunities for innovation","c":"Legal, regulatory, and policy drivers","d":"Stakeholder concerns and social trends"},"answer":["c"],"expl":{"a":"Incorrect. The question asks about the scrutiny and litigation, which are legal, not peer practice.","b":"Incorrect. That factor concerns competitive advantage gained from innovation; the issue here is the restriction of competition through IP, which is what draws scrutiny.","c":"CORRECT. Regulatory scrutiny and infringement litigation are legal and regulatory consequences; this factor covers regulation that creates risk for a company's practices (Section 3.1).","d":"Incorrect. Society's interest in access to innovation motivates the regulation, but the mechanism acting on the company is legal."}},{"id":"T4H4","lo":9,"type":"single","text":"Through which channel do Company A's $300 million in losses from legal proceedings most directly affect its financial performance?","options":{"a":"Revenues, because licensing fees fell","b":"Intangible assets, because patents were written down","c":"Expenses, as fines and settlements that are a direct cost","d":"Liabilities, because the losses relate to future obligations"},"answer":["c"],"expl":{"a":"Incorrect. No change in licensing revenue is described.","b":"Incorrect. No write-down is described.","c":"CORRECT. Fines and settlements usually appear as a direct expense (Section 3.1; Section 8.2.1.2). The open investigations represent the forward-looking contingent liability; the recorded losses are the expense.","d":"Incorrect. Losses already recorded are incurred costs; liabilities are future obligations (Section 8.2.1.4)."}}]},{"id":"T4I","title":"Case 9: Casinos & Gaming and Hotels & Lodging","built":"From the guide's multiple-Standards passage (Section 1.2.1.1) and business ethics example (Section 2.1.5)","body":"<p>The guide notes that there are separate Standards for Casinos & Gaming and for Hotels & Lodging, and that hotel casinos providing both services will likely find topics from both Standards capture financially material impacts. For casinos, the greatest business ethics risk centers on internal controls against money laundering: casinos handle large amounts of cash and are subject to anti-money-laundering (AML) regulation, so disclosure of AML policies and practices and monetary losses from related proceedings helps investors assess risk. Hotels face labor practice risks (wages, turnover) and consume significant water.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Revenue mix</td><td>55% gaming, 45% lodging</td><td>100% gaming</td></tr>\n<tr><td>Monetary losses from AML-related legal proceedings ($ millions)</td><td>0</td><td>75</td></tr>\n<tr><td>AML program disclosure</td><td>Policies, transaction monitoring thresholds, independent testing described</td><td>States that it complies with applicable law</td></tr>\n<tr><td>Hotel voluntary turnover</td><td>38%</td><td>n.a.</td></tr>\n</tbody></table>","questions":[{"id":"T4I1","lo":1,"type":"single","text":"How should a user determine the sustainability topics to evaluate for Company A?","options":{"a":"Use only the Casinos & Gaming Standard, since gaming is the larger stream","b":"Reference both the Casinos & Gaming and the Hotels & Lodging Standards, because Company A has significant revenue streams in each","c":"Use only the Hotels & Lodging Standard, since lodging has more employees","d":"Average the two Standards' topics"},"answer":["b"],"expl":{"a":"Incorrect. Forty-five percent of revenue from lodging is a significant stream with its own material issues.","b":"CORRECT. The guide states that hotel casinos providing both services will likely find disclosure topics from both industry Standards capture financially material impacts (Section 1.2.1.1); major revenue streams determine which Standards apply.","c":"Incorrect. Revenue streams, not headcount, determine the applicable Standards.","d":"Incorrect. Standards are referenced in addition, not averaged."}},{"id":"T4I2","lo":1,"type":"multi","choose":2,"text":"Which two topics would a user add for Company A from the Hotels & Lodging Standard that the Casinos & Gaming Standard would not capture? (Choose two.)","options":{"a":"Anti-money-laundering controls","b":"Nuclear safety","c":"G-SIB score","d":"Labor practices, including wages and turnover","e":"Water management in hotel operations"},"answer":["d","e"],"expl":{"a":"Incorrect. AML is a Casinos & Gaming topic already captured.","b":"Incorrect. Relevant to electric utilities, not hotels.","c":"Incorrect. A banking metric (Section 2.1.5).","d":"CORRECT. The guide's Hotels & Lodging study centers on labor practices, wages, and turnover (Part III Putting It Into Practice); Company A's 38 percent turnover is a hotel-side metric.","e":"CORRECT. The guide uses a hotel company's water consumption as a normalization example and identifies water as a hotel issue (Section 4.2)."}},{"id":"T4I3","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide place casinos' anti-money-laundering controls?","options":{"a":"Systemic Risk Management, under Leadership & Governance","b":"Customer Welfare, under Social Capital","c":"Business Ethics, under Leadership & Governance","d":"Data Security, under Social Capital"},"answer":["c"],"expl":{"a":"Incorrect. Systemic Risk concerns financial-system stability, a banking issue.","b":"Incorrect. Customer Welfare concerns benefits and harms from consumption, such as problem gambling, not money laundering.","c":"CORRECT. The guide's \"look at the industry level\" for Business Ethics names money-laundering controls as the greatest ethics risk for Casinos & Gaming (Section 2.1.5).","d":"Incorrect. Data Security concerns information systems."}},{"id":"T4I4","lo":8,"type":"single","text":"Which disclosure in this case best helps a user assess the likelihood of future AML-related financial impacts, and what does it show?","options":{"a":"Revenue mix, since lodging revenue cannot be laundered","b":"Monetary losses, which show Company B's future risk is now lower because it has been fined","c":"The description of AML policies and practices: Company A's specific controls indicate lower likelihood than Company B's generic compliance statement, despite Company B's loss being the only realized impact","d":"Turnover, since staff turnover drives money laundering"},"answer":["c"],"expl":{"a":"Incorrect. The guide's casino AML discussion concerns cash handling in gaming; revenue mix affects which Standards apply, not likelihood.","b":"Incorrect. A past fine does not reduce future likelihood; absent described controls, exposure persists.","c":"CORRECT. Descriptions of risk-management practices inform the likelihood of potential impacts (Section 7.2.1.1), whereas fines record impacts already realized. Company A's detailed controls (monitoring thresholds, independent testing) versus Company B's bare compliance statement is the qualitative difference the guide tells users to evaluate (Section 4.2.3).","d":"Incorrect. No link between turnover and AML is described."}}]},{"id":"T4J","title":"Case 10: Mortgage Finance Industry","built":"From the guide's mortgage finance example (Section 2.1.4)","body":"<p>In Mortgage Finance, physical climate risk manifests in direct economic terms. Failure to include climate risks in mortgage origination and underwriting can result in direct financial impacts to lenders and harm the solvency of borrowers. In regions experiencing prolonged extreme heat, for example, evaluating a home's cooling capacity gives underwriters pertinent information. Where climate impacts are not systematically considered, mortgage finance institutions may experience lower asset valuations and increased default rates.</p>\n<table><thead><tr><th></th><th>Lender A</th><th>Lender B</th></tr></thead><tbody>\n<tr><td>Climate risk integrated into underwriting</td><td>Flood and heat assessments required on all originations</td><td>Not integrated</td></tr>\n<tr><td>Percentage of loan book secured on properties in 100-year flood zones</td><td>8%</td><td>25%</td></tr>\n<tr><td>Default rate on loans in heat-exposed regions</td><td>1.1%</td><td>2.4%</td></tr>\n<tr><td>Overall default rate</td><td>0.9%</td><td>1.6%</td></tr>\n</tbody></table>","questions":[{"id":"T4J1","lo":9,"type":"multi","choose":2,"text":"According to the case, through which two channels does unmanaged climate risk most directly affect a mortgage lender? (Choose two.)","options":{"a":"Expenses, through credit losses from increased default rates","b":"Assets, through lower valuations of the loan portfolio and its collateral","c":"Long-term growth rate as a channel","d":"Economic value added","e":"Turnover ratio"},"answer":["a","b"],"expl":{"a":"CORRECT. The guide states lenders may experience increased default rates; loan losses are a cost (Section 8.2.1.2).","b":"CORRECT. The guide states lenders may experience lower asset valuations (Section 8.2.1.3).","c":"Incorrect. A DCF input, not a channel (Section 8.2).","d":"Incorrect. A valuation tool, not a channel (Section 9.1.2).","e":"Incorrect. A ROIC component (Section 9.1.1), not a channel."}},{"id":"T4J2","lo":10,"type":"single","text":"Which valuation adjustment for Lender B relative to Lender A is best supported by the case?","options":{"a":"No adjustment, because default rates are both below 2 percent","b":"A higher growth rate, because Lender B lends in more markets","c":"Lower projected cash flows, reflecting higher expected credit losses and lower collateral values on a loan book more exposed to flood and heat","d":"Lower expense projections, because Lender B does not pay for climate assessments"},"answer":["c"],"expl":{"a":"Incorrect. Lender B's overall default rate is 78 percent higher than Lender A's.","b":"Incorrect. No market breadth information is given, and exposure is a risk, not a growth driver.","c":"CORRECT. Lender B's flood exposure is three times Lender A's and its defaults in heat-exposed regions more than double; the guide links these to lower asset values and higher defaults, which reduce projected cash flows (Section 8.2.1).","d":"Incorrect. Assessment costs are small relative to the credit losses they prevent, and the case describes rising defaults for Lender B."}},{"id":"T4J3","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide place climate-informed underwriting?","options":{"a":"Access & Affordability, under Social Capital","b":"Physical Impacts of Climate Change, under Business Model & Innovation","c":"Systemic Risk Management, under Leadership & Governance","d":"Business Model Resilience, under Business Model & Innovation"},"answer":["b"],"expl":{"a":"Incorrect. Access & Affordability concerns provision of essential services.","b":"CORRECT. The guide's \"look at the industry level\" for Physical Impacts of Climate Change presents Mortgage Finance as its second example (Section 2.1.4).","c":"Incorrect. Systemic Risk concerns financial-system stability.","d":"Incorrect. Business Model Resilience concerns adaptation to transitions such as decarbonization; the issue here is physical hazard to collateral and borrowers."}},{"id":"T4J4","lo":8,"type":"single","text":"Which metric in the case indicates forward-looking exposure, and which indicates realized impact?","options":{"a":"Default rates indicate exposure; flood-zone share indicates realized impact","b":"Flood-zone share of the loan book indicates exposure to potential impacts; default rates indicate impacts already occurring","c":"Both metrics indicate realized impacts","d":"Both metrics indicate potential impacts"},"answer":["b"],"expl":{"a":"Incorrect. The roles are reversed.","b":"CORRECT. The share of collateral in flood zones measures latent exposure whose likelihood is high but whose impact has not yet materialized (Section 7.2.1.1); default rates record losses occurring now, an actual impact.","c":"Incorrect. Flood-zone share is exposure, not loss.","d":"Incorrect. Defaults are realized."}}]},{"id":"T4K","title":"Case 11: Water Utilities & Services Industry","built":"From the guide's water utilities passage (Section 2.1.1)","body":"<p>Unlike extractive companies that rely on water as a key input, water utilities are responsible for water treatment and delivery. For such companies, water-main replacement rates, which relate to operating efficiency and quality of service, and the volume of non-revenue real water losses (water not reflected in customer billings), also a measure of operating efficiency, provide useful insight into performance and value. Regulators set allowed rates and may penalize service failures.</p>\n<table><thead><tr><th></th><th>Utility A</th><th>Utility B</th></tr></thead><tbody>\n<tr><td>Water delivered (billion liters)</td><td>400</td><td>150</td></tr>\n<tr><td>Network length (km)</td><td>20,000</td><td>9,000</td></tr>\n<tr><td>Water mains replaced (km, Year 2)</td><td>240</td><td>36</td></tr>\n<tr><td>Non-revenue real water losses (billion liters)</td><td>48</td><td>42</td></tr>\n<tr><td>Regulatory penalties for service interruptions ($ millions)</td><td>0.5</td><td>6.0</td></tr>\n</tbody></table>","questions":[{"id":"T4K1","lo":5,"type":"single","text":"Which statement about normalizing the two efficiency metrics is correct?","options":{"a":"Water losses need no normalization because fewer is always better","b":"Mains replaced should be normalized by number of customers","c":"Mains replaced should be normalized by network length (A 1.2 percent, B 0.4 percent) and water losses by water delivered (A 12 percent, B 28 percent); both absolute figures reflect scale","d":"Both metrics should be normalized by revenue"},"answer":["c"],"expl":{"a":"Incorrect. Losses are tied to everyday operations and scale, unlike acute events such as spills (Section 4.1).","b":"Incorrect. Network length is what mains replacement relates to.","c":"CORRECT. The guide describes the metric as a replacement rate, which implies normalizing kilometers replaced by network length: 240 ÷ 20,000 = 1.2 percent and 36 ÷ 9,000 = 0.4 percent. Losses are meaningful relative to volume delivered: 48 ÷ 400 = 12 percent and 42 ÷ 150 = 28 percent (Section 4.2).","d":"Incorrect. Revenue has a less direct relationship with network and volume than the activity measures given."}},{"id":"T4K2","lo":7,"type":"multi","choose":2,"text":"Which two conclusions about Utility B are best supported? (Choose two.)","options":{"a":"Its low replacement rate and high losses indicate weaker operating efficiency and service quality than Utility A","b":"Its position carries regulatory risk, evidenced by penalties twelve times Utility A's","c":"Its losses are acceptable because the absolute volume is lower than Utility A's","d":"It is more efficient because it spends less on mains","e":"Its performance cannot be assessed without normalizing by revenue"},"answer":["a","b"],"expl":{"a":"CORRECT. The guide ties both metrics to operating efficiency and quality of service (Section 2.1.1); at 0.4 percent, Utility B replaces its network on a 250-year cycle against Utility A's 83 years, and loses more than twice the share of water.","b":"CORRECT. Regulatory climate includes penalties for service failures (Section 1.2.2.3), and Utility B's $6 million in penalties links its performance to realized regulatory impact.","c":"Incorrect. Absolute losses reflect scale; Utility B's loss rate is higher (Section 4.1).","d":"Incorrect. Lower spending is producing higher losses and penalties; it is deferred cost, not efficiency.","e":"Incorrect. The activity measures provided are the appropriate bases."}},{"id":"T4K3","lo":9,"type":"single","text":"Through which channel do non-revenue water losses most directly affect a utility?","options":{"a":"Cost of capital","b":"Intangible assets","c":"Liabilities","d":"Revenues, since treated and delivered water that is not billed generates no sales"},"answer":["d"],"expl":{"a":"Incorrect. Any cost-of-capital effect is indirect.","b":"Incorrect. No brand or intangible effect is described.","c":"Incorrect. Losses are not future obligations; penalties for service failures would be.","d":"CORRECT. The guide defines non-revenue water as volume not reflected in customer billings (Section 2.1.1): the cost of treating it is incurred but no revenue is earned, so the direct effect is on revenue (and, secondarily, wasted operating expense)."}},{"id":"T4K4","lo":4,"type":"multi","choose":2,"text":"For water utilities, which two of the five factors most clearly explain why these efficiency metrics affect financial performance? (Choose two.)","options":{"a":"Direct financial impacts and risk, since lost water and replacement spending appear in existing line items","b":"Network age index","c":"Industry norms, best practices, and competitive drivers","d":"Legal, regulatory, and policy drivers, since regulators set rates and penalize service failures","e":"Opportunities for innovation"},"answer":["a","d"],"expl":{"a":"CORRECT. Treatment costs of lost water and capital spending on mains are captured in the financial statements, the test for this factor (Section 3.1).","b":"Incorrect. Not one of the five factors.","c":"Incorrect. Utilities are typically monopolies; no peer competitive driver is described.","d":"CORRECT. Allowed rates and penalties are regulatory mechanisms (Section 3.1).","e":"Incorrect. No innovation advantage is described."}}]},{"id":"T4L","title":"Case 12: Fuel Cells & Industrial Batteries Industry","built":"From the guide's risk-versus-opportunity example (Section 7.1)","body":"<p>The guide uses this industry to show that whether a metric captures a risk or an opportunity depends on performance and context. The metric \"percentage of products sold that are recyclable or reusable\" normally captures an opportunity: innovations to improve recyclability can drive competitiveness and revenue growth and help manufacturers achieve significant cost savings. However, if a company reports a very low percentage and operates in a jurisdiction subject to increasingly strict end-of-life regulation, the metric captures a risk, because regulation can affect demand and increase compliance costs.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Percentage of products sold that are recyclable or reusable</td><td>85%</td><td>15%</td></tr>\n<tr><td>Jurisdiction</td><td>Strict end-of-life regulation, tightening annually</td><td>Same jurisdiction</td></tr>\n<tr><td>Revenue from take-back and recovered materials ($ millions)</td><td>40</td><td>1</td></tr>\n</tbody></table>","questions":[{"id":"T4L1","lo":8,"type":"single","text":"For Company B, does the recyclability metric capture a risk or an opportunity, and why?","options":{"a":"A risk: a very low percentage in a jurisdiction with increasingly strict end-of-life regulation exposes Company B to reduced demand and higher compliance costs","b":"An opportunity, because Company B has room to improve","c":"Neither, because the percentage is below 50 percent","d":"An opportunity, because the metric always measures opportunity"},"answer":["a"],"expl":{"a":"CORRECT. This is the guide's own example (Section 7.1): the metric normally captures an opportunity, but with very low performance under strict and tightening regulation it captures a risk, because regulation can affect demand and raise compliance costs.","b":"Incorrect. Room to improve does not make current exposure an opportunity.","c":"Incorrect. The level is not what decides; context and direction of effect do.","d":"Incorrect. The guide's point is that the classification depends on performance and context."}},{"id":"T4L2","lo":8,"type":"single","text":"For Company A, what does the same metric capture?","options":{"a":"A liability, because take-back creates obligations","b":"An opportunity: high recyclability drives competitiveness and revenue growth, evidenced by $40 million from take-back and recovered materials, and positions it well under tightening regulation","c":"An activity metric","d":"A risk, because regulation is tightening"},"answer":["b"],"expl":{"a":"Incorrect. Take-back here generates revenue; no obligation is described.","b":"CORRECT. The guide says innovations in recyclability drive competitiveness, revenue growth, and cost savings (Section 7.1); Company A's performance and revenue show the opportunity realized, and strict regulation becomes a competitive advantage rather than a threat.","c":"Incorrect. It is a sustainability accounting metric.","d":"Incorrect. Tightening regulation threatens low performers; it favors Company A."}},{"id":"T4L3","lo":2,"type":"single","text":"Which component of external operating context determines whether this metric captures a risk or an opportunity in the guide's example?","options":{"a":"Business climate","b":"Main inputs for value creation","c":"Regulatory climate","d":"Economic climate"},"answer":["c"],"expl":{"a":"Incorrect. Competitive dynamics are a consequence, not the stated condition.","b":"Incorrect. Inputs are an internal factor.","c":"CORRECT. The guide's condition is operating in a jurisdiction subject to increasingly strict end-of-life regulation (Section 7.1); the presence and stringency of regulation define regulatory climate (Section 1.2.2.3).","d":"Incorrect. No macroeconomic condition is involved."}},{"id":"T4L4","lo":10,"type":"multi","choose":2,"text":"Which two DCF adjustments for Company B are best supported? (Choose two.)","options":{"a":"Higher expense projections, reflecting compliance costs under tightening end-of-life regulation","b":"Lower revenue projections, since regulation can affect demand for non-recyclable products","c":"An increase in intangible asset value","d":"A lower discount rate","e":"A higher long-term growth rate"},"answer":["a","b"],"expl":{"a":"CORRECT. The guide names increased compliance costs as the risk mechanism (Section 7.1; Section 8.2.1.2).","b":"CORRECT. The guide names effects on demand (Section 8.2.1.1).","c":"Incorrect. No intangible benefit is described.","d":"Incorrect. Greater regulatory exposure raises, not lowers, perceived risk.","e":"Incorrect. Nothing supports faster growth for the laggard."}}]},{"id":"T4M","title":"Case 13: Biotechnology & Pharmaceuticals Industry","built":"From the guide's clinical trials example (Section 2.1.2)","body":"<p>The Biotechnology & Pharmaceuticals industry relies on safe and effective clinical trials to bring products to market. The impact of community relations on financial position is evaluated through a company's management processes for ensuring patient safety during trials, the number of inspections by the local health regulator that resulted in voluntary or official actions, and total monetary losses from legal proceedings associated with clinical trials in developing countries. The value of social capital is directly linked to the treatment of trial participants, particularly where participants may be more vulnerable because of relatively lax regulatory enforcement.</p>\n<p>Among twelve companies, Year 2 regulator inspections resulting in official action have a mean of 1.5, a median of 1, and a standard deviation of 1.0.</p>\n<table><thead><tr><th></th><th>Company A</th><th>Company B</th></tr></thead><tbody>\n<tr><td>Percentage of trial participants enrolled in developing countries</td><td>60%</td><td>20%</td></tr>\n<tr><td>Inspections resulting in official action</td><td>3</td><td>0</td></tr>\n<tr><td>Monetary losses from proceedings associated with trials in developing countries ($ millions)</td><td>40</td><td>0</td></tr>\n<tr><td>Patient safety management process</td><td>Local ethics boards only</td><td>Independent data safety monitoring board for every trial</td></tr>\n</tbody></table>","questions":[{"id":"T4M1","lo":3,"type":"single","text":"Under which general issue category and dimension does the guide discuss clinical trial conduct in developing countries?","options":{"a":"Business Ethics, under Leadership & Governance","b":"Product Quality & Safety, under Social Capital","c":"Human Rights & Community Relations, under Social Capital","d":"Customer Welfare, under Social Capital"},"answer":["c"],"expl":{"a":"Incorrect. Business Ethics concerns corruption and fraud.","b":"Incorrect. Product Quality & Safety concerns the marketed product; trial participants are a community, not customers of a product.","c":"CORRECT. The guide's \"look at the industry level\" for Human Rights & Community Relations contrasts extractives' community impacts with the pharmaceutical industry's treatment of clinical trial participants (Section 2.1.2).","d":"Incorrect. Customer Welfare concerns benefits from consuming a product."}},{"id":"T4M2","lo":4,"type":"multi","choose":2,"text":"Which two of the five factors are most clearly evidenced for this issue? (Choose two.)","options":{"a":"Trial enrollment rate","b":"Stakeholder concerns and social trends, since the value of social capital depends on how participants are treated","c":"Direct financial impacts and risk","d":"Opportunities for innovation","e":"Legal, regulatory, and policy drivers, since health regulators inspect trials and enforcement varies by jurisdiction"},"answer":["b","e"],"expl":{"a":"Incorrect. Not one of the five factors.","b":"CORRECT. The guide frames the issue as social capital and license to operate, the hallmark of this factor (Section 3.1).","c":"Incorrect. Although legal losses occur, the guide frames the mechanism through social capital and regulation; losses are the consequence, and the question asks which factors most clearly explain the issue.","d":"Incorrect. No innovation advantage is described.","e":"CORRECT. Regulator inspections and official actions are regulatory mechanisms, and the guide stresses the role of lax enforcement (Section 3.1)."}},{"id":"T4M3","lo":6,"type":"single","text":"Assuming normal distribution for the inspection dataset, how should Company A's three official actions be characterized, and how is the dataset distributed?","options":{"a":"More than two standard deviations above the mean; positively skewed","b":"1.5 standard deviations above the mean; negatively skewed","c":"Within one standard deviation of the mean; normal","d":"1.5 standard deviations above the mean, between one and two; the dataset is positively skewed because the mean exceeds the median"},"answer":["d"],"expl":{"a":"Incorrect. Two standard deviations above the mean would be 3.5 actions.","b":"Incorrect. Negative skew requires the mean to be below the median.","c":"Incorrect. One standard deviation above the mean is 2.5 actions; Company A exceeds it, and the mean-median gap rules out a normal distribution.","d":"CORRECT. (3 − 1.5) ÷ 1.0 = 1.5 standard deviations above the mean (Section 5.2); higher is worse. A mean (1.5) greater than the median (1) indicates positive skew (Section 5.3.2): a few companies with many actions pull the mean up."}},{"id":"T4M4","lo":9,"type":"multi","choose":3,"text":"Through which three channels does poor conduct of clinical trials affect Company A, based on the case? (Choose three.)","options":{"a":"Invested capital","b":"Revenues, since the industry relies on safe trials to bring products to market, and official actions can delay approvals","c":"Expenses, through monetary losses from legal proceedings","d":"Liabilities, through continuing legal exposure given 60 percent enrollment in developing countries and weaker safety processes","e":"Turnover ratio"},"answer":["b","c","d"],"expl":{"a":"Incorrect. A ROIC and EVA component, not a channel (Section 9.1).","b":"CORRECT. The guide says the industry relies on safe and effective trials to bring products to market; regulatory action against trials threatens that pipeline and the revenue it generates (Section 8.2.1.1).","c":"CORRECT. $40 million in legal losses is a direct cost (Section 8.2.1.2).","d":"CORRECT. High exposure and limited safety oversight indicate ongoing legal risk, a future obligation (Section 8.2.1.4).","e":"Incorrect. A ROIC component, not a channel (Section 9.1.1)."}}]}];

const CASES5=[{"id":"T5A","title":"Case 1: Chemicals Industry","built":"Revisits Practice Case 1's industry with a new issue and new companies","body":"<p>Companies in the Chemicals industry transform organic and inorganic chemicals into products for industrial, pharmaceutical, agricultural, and consumer uses. The industry is heavily and unevenly regulated: rules govern the release of substances during manufacturing, the toxicity of end products, and impacts on human and environmental health, and they vary widely across jurisdictions. Regulation is becoming progressively more stringent and public concern over the lifecycle impacts of chemical products is rising. Anticipating and adapting to regulatory developments can significantly affect product demand, manufacturing costs, and brand value, and increases the importance of innovation to create products with reduced externalities.</p>\n<p>Company P and Company Q produce industrial coatings and sell to manufacturers in the same jurisdiction. That jurisdiction has announced that solvent-based coatings containing specified hazardous substances will be restricted from Year 4. Company P has invested in water-based alternatives. Company Q's portfolio remains mostly solvent-based.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company P</th><th colspan=\"2\">Company Q</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Total revenue ($ millions)</td><td>2,000</td><td>2,200</td><td>1,600</td><td>1,520</td></tr>\n<tr><td>Revenue from reduced-hazard products ($ millions)</td><td>900</td><td>1,300</td><td>160</td><td>180</td></tr>\n<tr><td>R&D spending ($ millions)</td><td>120</td><td>150</td><td>20</td><td>22</td></tr>\n<tr><td>Monetary losses from legal proceedings associated with environmental and health regulation ($ millions)</td><td>0.3</td><td>0.2</td><td>2.0</td><td>2.6</td></tr>\n</tbody></table>\n<p>Eight other coatings producers report Year 2 revenue from reduced-hazard products as a percentage of total revenue: mean 24%, median 20%, standard deviation 10.</p>","questions":[{"id":"T5A1","lo":6,"type":"single","text":"Assuming normal distribution, how should Company P's Year 2 reduced-hazard share of revenue be characterized, and how should a user treat it?","options":{"a":"More than 3 standard deviations above the mean; seek company-specific context that explains the extreme value","b":"About 2 standard deviations above the mean; exclude it, because an extreme value distorts the comparison","c":"About 2 standard deviations above the mean; seek company-specific context that explains the extreme value","d":"More than 3 standard deviations above the mean; exclude it, because an extreme value distorts the comparison"},"answer":["a"],"expl":{"a":"CORRECT. P's share is 1,300 ÷ 2,200 = 59.1 percent, and (59.1 − 24) ÷ 10 = 3.5 standard deviations above the mean (Section 5.2). The guide says an extreme value should prompt the question whether company-specific context explains it, not automatic exclusion (Section 5.3.1); here the context is P's multi-year investment in water-based alternatives.","b":"Incorrect. Both the distance and the treatment are wrong.","c":"Incorrect. Two standard deviations above the mean would be 44 percent; P is well beyond that.","d":"Incorrect. The distance is right, but the guide treats outliers as a prompt for investigation rather than a reason to remove them (Section 5.3.1)."},"trap":{"a":"","b":"Both errors","c":"Understated the distance","d":"Right distance, wrong treatment of the outlier"}},{"id":"T5A2","lo":5,"type":"single","text":"Which measure is the most appropriate for normalizing \"monetary losses from legal proceedings associated with environmental and health regulation\"?","options":{"a":"Reduced-hazard share of revenue","b":"Total revenue","c":"R&D spending","d":"Revenue from reduced-hazard products"},"answer":["b"],"expl":{"a":"Incorrect. This ratio is already normalized and relates to product mix; dividing losses by it would produce no interpretable rate (Section 4.1).","b":"CORRECT. The guide normalizes fines and settlements by revenue to show their cash-flow significance (Sections 4.2 and 5.3). On that basis Q's Year 2 losses are about 0.17 percent of revenue, against under 0.01 percent for P.","c":"Incorrect. R&D spending is a management response to the issue, not a measure of the company's size or activity.","d":"Incorrect. This is another performance metric from the same case; it describes the product mix, not the scale of the business that bore the losses."},"trap":{"a":"Already-normalized ratio used again","b":"","c":"Management response used as a denominator","d":"Performance metric used as a denominator"}},{"id":"T5A3","lo":7,"type":"multi","text":"Which two conclusions are best supported by the data and the announced restriction? (Choose two.)","options":{"a":"Company P's shift to reduced-hazard products reflects a decision that lowers its exposure to the restriction","b":"Company P and Company Q face the same exposure because both sell in the same jurisdiction","c":"Company Q is more exposed because solvent-based products still generate most of its revenue","d":"Company Q's larger legal losses show that the restriction has already reduced its revenue this year","e":"Company P's higher R&D spending shows its water-based products will earn a price premium over Company Q's"},"answer":["a","c"],"expl":{"a":"CORRECT. P raised its reduced-hazard share from 45 to 59 percent. Management decisions are context for interpreting performance (Section 6.2).","b":"Incorrect. The same regulatory climate produces different exposure depending on product mix (Sections 1.2.2.3 and 6.1.3).","c":"CORRECT. About 88 percent of Q's Year 2 revenue is not from reduced-hazard products, so the restricted category dominates its sales (Section 6.1.3).","d":"Incorrect. The restriction applies from Year 4, so it cannot yet explain Q's Year 2 results; Q's revenue decline has no stated cause.","e":"Incorrect. R&D spending shows effort, not a realized price premium; nothing in the case reports prices."},"trap":{"a":"","b":"Context applied too coarsely","c":"","d":"Treats a future restriction as already realized","e":"Over-reads R&D as a realized premium"}},{"id":"T5A4","lo":4,"type":"multi","text":"A user applies the five factors to the issue of hazardous substances in coatings. Which three factors are most clearly evidenced? (Choose three.)","options":{"a":"Stakeholder concerns and social trends","b":"Industry norms, best practices, and competitive drivers","c":"Legal, regulatory, and policy drivers","d":"Direct financial impacts and risk","e":"Opportunities for innovation"},"answer":["a","c","e"],"expl":{"a":"CORRECT. The case cites rising public concern over lifecycle impacts of chemical products (Section 3.1).","b":"Incorrect. The case does not describe how peers manage or disclose the issue (Section 3.1).","c":"CORRECT. The case describes an announced restriction on specified substances and rising regulatory stringency (Section 3.1).","d":"Incorrect. Q's legal losses of $2.6 million are about 0.17 percent of revenue, an immaterial direct cost; the guide's own analyses set this factor aside in such cases (Section 3.2).","e":"CORRECT. The case says regulation increases the importance of innovation for products with reduced externalities, and P's R&D and water-based line reflect it (Section 3.1)."},"trap":{"a":"","b":"No peer evidence in the case","c":"","d":"Immaterial cost treated as evidence","e":""}},{"id":"T5A5","lo":10,"type":"single","text":"Which pair of adjustments is best supported for a DCF valuation of Company Q?","options":{"a":"Higher revenue projections from the restricted products and a higher long-term growth rate for Q","b":"Lower revenue projections and higher expense projections for reformulation and compliance","c":"Unchanged cash flows and a higher discount rate reflecting its limited R&D spending","d":"Lower revenue projections and a lower discount rate reflecting its small legal losses in Year 2"},"answer":["b"],"expl":{"a":"Incorrect. Restricted products cannot be expected to raise revenue or growth.","b":"CORRECT. The announced restriction threatens the revenue of Q's solvent-based products (Section 8.2.1.1), and reformulation and compliance are costs (Section 8.2.1.2).","c":"Incorrect. Cash flows are not unchanged, because the restriction affects both revenue and costs.","d":"Incorrect. The revenue half is right, but an exposed company would not receive a lower discount rate; perceived risk rises (Section 8.2.2)."},"trap":{"a":"Opposite revenue and growth direction","b":"","c":"Ignores cash-flow effects","d":"Right revenue effect, wrong risk direction"}}]},{"id":"T5B","title":"Case 2: Agricultural Products Industry","built":"Revisits Practice Case 2's industry with new companies and a peer dataset","body":"<p>The Agricultural Products industry grows, processes, trades, and distributes vegetables and fruits, and produces and mills commodities such as grains, sugar, oils, maize, soybeans, and animal feed. Companies may source from thousands of third-party growers, while vertically integrated companies operate farms, processing facilities, and distribution networks. The industry produces low-cost commodities and competes largely on price.</p>\n<p>Monoculture cultivation lowers production costs but makes crops more susceptible to insects, disease, and variations in growing conditions, and depletes soil nutrients. To manage these risks companies depend on agrochemicals such as fertilizers and pesticides, which carry regulatory risk because runoff can contaminate water sources. Consumer preference for organically grown crops is driving growth worldwide. Financial impacts of land-use and ecological issues can occur through contingent liabilities, operating expenses, asset impairment, market share, and access to new markets.</p>\n<p>Company C and Company D grow the same principal crop using monoculture practices. Company C farms only land it owns and began converting part of its land to certified organic production in Year 1. Company D owns about half of its land and buys the remaining crop from third-party growers under annual contracts.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company C</th><th colspan=\"2\">Company D</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Revenue ($ millions)</td><td>28,000</td><td>30,000</td><td>40,000</td><td>41,500</td></tr>\n<tr><td>Production of principal crop (metric tons)</td><td>300,000</td><td>310,000</td><td>500,000</td><td>505,000</td></tr>\n<tr><td>Land under active production (hectares)</td><td>40,000</td><td>42,000</td><td>55,000</td><td>55,000</td></tr>\n<tr><td>Total fertilizer consumption (metric tons)</td><td>6,000</td><td>5,600</td><td>11,000</td><td>11,500</td></tr>\n<tr><td>Percentage of land certified organic</td><td>10%</td><td>25%</td><td>2%</td><td>2%</td></tr>\n<tr><td>Number of processing facilities</td><td>200</td><td>210</td><td>350</td><td>350</td></tr>\n</tbody></table>\n<p>Eight other companies growing the same crop report Year 2 fertilizer consumption per hectare of land under active production: mean 0.190 metric tons, median 0.180, standard deviation 0.025.</p>","questions":[{"id":"T5B1","lo":5,"type":"single","text":"Normalized by land under active production, how did each company's fertilizer consumption change from Year 1 to Year 2?","options":{"a":"Company C's decreased and Company D's increased","b":"Company C's increased and Company D's increased","c":"Company C's decreased and Company D's decreased","d":"Company C's increased and Company D's decreased"},"answer":["a"],"expl":{"a":"CORRECT. Company C: 6,000 ÷ 40,000 = 0.150 fell to 5,600 ÷ 42,000 = 0.133 metric tons per hectare. Company D: 11,000 ÷ 55,000 = 0.200 rose to 11,500 ÷ 55,000 = 0.209 (Sections 4.2 and 4.3.1).","b":"Incorrect. Company C's total fell even while its land grew, so its per-hectare figure fell.","c":"Incorrect. Company D's total and per-hectare fertilizer both rose on unchanged land.","d":"Incorrect. This reverses both results."},"trap":{"a":"","b":"C's total fell, so its ratio cannot rise","c":"D's land did not change, so its ratio cannot fall","d":"Roles reversed"}},{"id":"T5B2","lo":1,"type":"single","text":"How does Company D's reliance on third-party growers for about half of its crop change the topics a user evaluates for D relative to C?","options":{"a":"Supply chain management becomes less relevant, because annual contracts pass sourcing risk to growers","b":"Land-use topics become less relevant, because D does not own all of the land its crop comes from","c":"Topics are unchanged, because both companies grow the same crop using the same monoculture practices","d":"Supply chain management becomes more relevant, because grower practices shape D's agrochemical risk"},"answer":["d"],"expl":{"a":"Incorrect. Contracts do not transfer reputational or regulatory exposure; the buyer remains exposed.","b":"Incorrect. D still depends on the land its growers farm, and runoff and ecological risk still reach its supply.","c":"Incorrect. The same crop does not make the input profile the same; sourcing model is an internal factor (Section 1.2.1.2).","d":"CORRECT. Main inputs for value creation are an internal factor (Section 1.2.1.2). The crop D buys comes from growers whose agrochemical and land practices D does not control, so supplier management matters more, as the guide's example of outsourced operations shows."},"trap":{"a":"Risk wrongly assumed to transfer","b":"Ownership mistaken for relevance","c":"Industry profile applied without internal factors","d":""}},{"id":"T5B3","lo":6,"type":"single","text":"Assuming normal distribution, how should Company C's Year 2 fertilizer consumption per hectare be characterized relative to the eight peers?","options":{"a":"Between 2 and 3 standard deviations below the mean","b":"Between 1 and 2 standard deviations below the mean","c":"More than 3 standard deviations below the mean of the peer group","d":"Within 1 standard deviation below the mean"},"answer":["a"],"expl":{"a":"CORRECT. Company C's value is 5,600 ÷ 42,000 = 0.133 metric tons per hectare, and (0.133 − 0.190) ÷ 0.025 = −2.3 standard deviations (Section 5.2). Lower is better for this metric.","b":"Incorrect. One standard deviation below the mean would be 0.165, and two would be 0.140; C is below both.","c":"Incorrect. Three standard deviations below the mean would be 0.115.","d":"Incorrect. Within one standard deviation would require a value above 0.165."},"trap":{"a":"","b":"Understated the distance","c":"Overstated the distance","d":"Understated the distance badly"}},{"id":"T5B4","lo":8,"type":"single","text":"How should the financial impact associated with Company C's \"percentage of land certified organic\" be characterized?","options":{"a":"An opportunity whose revenue benefit builds gradually through market share and new markets worldwide","b":"A risk whose cost arrives as a one-time, high-magnitude event when the land is first converted","c":"An opportunity whose revenue benefit arrives as a one-time, high-magnitude event for the company","d":"A risk whose cost builds gradually through the higher operating expenses of organic conversion"},"answer":["a"],"expl":{"a":"CORRECT. Higher values indicate improved economic performance, so the metric captures an opportunity (Section 7.1). The case links organic preference to growth worldwide, and gains in market share accrue over time, which is progressive (Section 7.2.2).","b":"Incorrect. Both the direction and the timing are wrong.","c":"Incorrect. Opportunity is right, but a conversion that has taken years and builds share gradually is not a one-time event.","d":"Incorrect. Conversion costs exist, but the metric's higher values indicate improved performance, so it measures an opportunity."},"trap":{"a":"","b":"Both errors","c":"Right direction, wrong timing","d":"Opportunity misread as risk"}},{"id":"T5B5","lo":9,"type":"multi","text":"Which two channels of financial impact are most directly affected by Company C's increase in organic-certified land from 10 to 25 percent? (Choose two.)","options":{"a":"Tangible assets","b":"Expenses","c":"Revenues","d":"Liabilities","e":"Cost of capital"},"answer":["b","c"],"expl":{"a":"Incorrect. The case describes no impairment or revaluation of C's land.","b":"CORRECT. Fertilizer use per hectare fell, lowering input costs, though conversion adds operating costs; both run through operating expenses (Section 8.2.1.2).","c":"CORRECT. The case cites market share and access to new markets as ways land-use issues affect finances; organic preference drives demand (Section 8.2.1.1).","d":"Incorrect. Contingent liabilities from runoff are a risk of conventional practice and are only indirectly reduced; no obligation is described for C.","e":"Incorrect. No change in investors' perception of C's risk is described (Section 8.2.2)."},"trap":{"a":"No asset effect described","b":"","c":"","d":"Indirect effect treated as direct","e":"Not evidenced"}}]},{"id":"T5C","title":"Case 3: Electric Utilities & Power Generators Industry","built":"Revisits Practice Case 4's industry with new companies and a different decoupling structure","body":"<p>Companies in the Electric Utilities & Power Generators industry generate electricity, operate transmission and distribution networks, and sell electricity to households, businesses, and industrial plants. Electricity generation is the largest source of GHG emissions in the world, and fuel combustion produces both GHG emissions and hazardous air pollutants.</p>\n<p>Regulated utilities accept oversight of pricing and allowed return on equity in exchange for a license to operate as a monopoly. The cost of supplying electricity is highest during periods of high demand. Utilities can encourage efficient use of energy through education and demand-response programs that reduce electricity use at peak times.</p>\n<p>Company E and Company F are regulated utilities serving residential and commercial customers. Company E's revenue is decoupled from the amount of electricity its customers consume. Company F's revenue is a direct product of the electricity it sells. In Year 2 the regulator extended an emissions-limiting rule to part of Company F's region, which previously had no such rule.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company E</th><th colspan=\"2\">Company F</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Residential customers served</td><td>800,000</td><td>820,000</td><td>600,000</td><td>600,000</td></tr>\n<tr><td>Total electricity generated (MWh)</td><td>12,000,000</td><td>12,500,000</td><td>9,000,000</td><td>9,800,000</td></tr>\n<tr><td>Percentage renewable</td><td>38%</td><td>44%</td><td>20%</td><td>18%</td></tr>\n<tr><td>Gross global Scope 1 emissions (metric tons)</td><td>8,400,000</td><td>8,300,000</td><td>7,200,000</td><td>8,300,000</td></tr>\n<tr><td>Percentage covered under emissions-limiting regulation</td><td>100%</td><td>100%</td><td>0%</td><td>40%</td></tr>\n<tr><td>Percentage of electric load served by smart grid technology</td><td>35%</td><td>55%</td><td>10%</td><td>10%</td></tr>\n<tr><td>Customer electricity savings from efficiency measures</td><td>8%</td><td>11%</td><td>0%</td><td>3%</td></tr>\n</tbody></table>","questions":[{"id":"T5C1","lo":5,"type":"single","text":"Normalized by total electricity generated, whose Scope 1 emissions intensity worsened from Year 1 to Year 2?","options":{"a":"Both companies'","b":"Only Company F's","c":"Only Company E's","d":"Neither company's"},"answer":["b"],"expl":{"a":"Incorrect. Only F's ratio rose.","b":"CORRECT. Company F: 7,200,000 ÷ 9,000,000 = 0.80 rose to 8,300,000 ÷ 9,800,000 = 0.85 metric tons per MWh. Company E: 8,400,000 ÷ 12,000,000 = 0.70 fell to 8,300,000 ÷ 12,500,000 = 0.66 (Sections 4.2 and 4.3.1).","c":"Incorrect. Company E's absolute emissions fell and its output rose, so its intensity improved.","d":"Incorrect. F's emissions rose by about 15 percent while its generation rose by about 9 percent."},"trap":{"a":"Assumes a shared direction","b":"","c":"Roles reversed","d":"Ignores F's higher absolute emissions"}},{"id":"T5C2","lo":2,"type":"single","text":"In the context of each company's regulatory climate, which observation best indicates that Company F faces rising near-term emissions risk?","options":{"a":"F's customer electricity savings rose from 0 to 3 percent, while E's rose from 8 to 11 percent","b":"F's absolute Scope 1 emissions rose from 7.2 million to 8.3 million metric tons while E's fell","c":"F's regulated emissions share rose from 0 to 40 percent in Year 2, while E's was already 100 percent","d":"F's percentage renewable fell from 20 to 18 percent, while E's rose from 38 to 44 percent over the year"},"answer":["c"],"expl":{"a":"Incorrect. Efficiency savings relate to demand and revenue, not to emissions regulation.","b":"Incorrect. This is true, but it describes F's performance, not its regulatory climate; the question asks what changed in the regulatory context.","c":"CORRECT. The regulatory climate is defined by the presence of regulation and its enforcement (Section 1.2.2.3). A rule that now reaches 40 percent of F's emissions creates a new financial consequence for the same emissions.","d":"Incorrect. This is true, but it describes performance on a different metric and is not evidence about regulation."},"trap":{"a":"Unrelated metric","b":"True but describes performance, not regulatory context","c":"","d":"True but a different metric"}},{"id":"T5C3","lo":9,"type":"multi","text":"What two types of financial impact does an increase in customer electricity savings from efficiency measures have on Company F? (Choose two.)","options":{"a":"Decrease in revenue","b":"Increase in revenue","c":"Increase in expenses","d":"Decrease in expenses","e":"Neutral effect on revenue","f":"Neutral effect on expenses"},"answer":["a","d"],"expl":{"a":"CORRECT. F's revenue is tied to the quantity of electricity sold, so customers using less reduces revenue (Section 8.2.1.1).","b":"Incorrect. Lower consumption cannot raise revenue that is a direct product of electricity sold.","c":"Incorrect. The cost of supplying electricity is highest at peak demand, so reducing use lowers, not raises, expenses.","d":"CORRECT. Reduced peak demand lowers the cost of supplying electricity, an operating expense (Section 8.2.1.2).","e":"Incorrect. A neutral revenue effect applies to Company E, whose revenue is decoupled from consumption.","f":"Incorrect. Lower peak demand has a real effect on supply cost."},"trap":{"a":"","b":"Wrong direction","c":"Wrong direction","d":"","e":"Decoupled company's answer applied to F","f":"Ignores peak-demand costs"}},{"id":"T5C4","lo":4,"type":"multi","text":"A user applies the five factors to F's GHG emissions. Which two factors are most clearly evidenced by the case? (Choose two.)","options":{"a":"Direct financial impacts and risk","b":"Opportunities for innovation","c":"Legal, regulatory, and policy drivers","d":"Stakeholder concerns and social trends","e":"Industry norms, best practices, and competitive drivers"},"answer":["a","c"],"expl":{"a":"CORRECT. Emissions costs under the new rule would appear in existing expense line items, the test for this factor (Section 3.1).","b":"Incorrect. F's smart grid share is flat at 10 percent; no innovation advantage is evidenced.","c":"CORRECT. The regulator extended an emissions-limiting rule to part of F's region (Section 3.1).","d":"Incorrect. No community, customer, or investor concern is described.","e":"Incorrect. The case does not describe how peers manage or disclose emissions."},"trap":{"a":"","b":"Innovation evidenced for E, not F","c":"","d":"No stakeholder evidence","e":"No peer evidence"}},{"id":"T5C5","lo":10,"type":"single","text":"Which pair of DCF adjustments is best supported for Company F?","options":{"a":"Higher revenue projections from cost recovery through rates; a lower discount rate for regulation","b":"Higher expense projections for emissions compliance; a higher discount rate if more regulation is expected","c":"Lower revenue projections for emissions compliance costs; no change to the discount rate for risk","d":"Unchanged expense projections; a higher long-term growth rate from the expanded emissions rule"},"answer":["b"],"expl":{"a":"Incorrect. Added regulation does not lower perceived risk, and recovery of costs through rates is not described.","b":"CORRECT. Compliance with an extended emissions rule is a cost (Section 8.2.1.2), and uncertainty about further regulation raises perceived risk and the discount rate (Section 8.2.2).","c":"Incorrect. Emissions compliance is a cost item; it does not directly reduce revenue that is tied to electricity sold.","d":"Incorrect. Expenses would not be unchanged, and an emissions rule does not raise growth."},"trap":{"a":"Risk direction reversed","b":"","c":"Cost misfiled as revenue","d":"Ignores the cost effect"}}]},{"id":"T5D","title":"Case 4: Restaurants Industry","built":"Revisits Practice Cases 3 and 7's industry with a new issue (nutrition labeling)","body":"<p>Companies in the Restaurants industry prepare meals, snacks, and beverages for immediate on- and off-premises consumption. The industry is mature with low barriers to entry, and the franchise model allows rapid growth but can increase risk because consumers may not distinguish a franchise from a company-owned location. High competition and low margins make efficient management of resources important, and as a consumer-facing industry companies face significant reputational risk. Public health concerns have brought market and regulatory pressure for healthier options and mandatory nutrition labeling in many jurisdictions. Reputational damage tends to have a long-term impact and affects a company across most of its locations.</p>\n<p>Company H is a quick-service chain whose restaurants are about 90 percent franchised. Company I is a fast-casual chain whose restaurants are all company-owned. Both operate in a jurisdiction that mandates nutrition labeling on menu boards.</p>\n<table><thead><tr><th></th><th colspan=\"2\">Company H</th><th colspan=\"2\">Company I</th></tr><tr><th></th><th>Y1</th><th>Y2</th><th>Y1</th><th>Y2</th></tr></thead><tbody>\n<tr><td>Number of restaurants</td><td>6,000</td><td>6,100</td><td>900</td><td>980</td></tr>\n<tr><td>Revenue ($ millions)</td><td>7,800</td><td>7,700</td><td>2,400</td><td>2,700</td></tr>\n<tr><td>Percentage of menu items meeting nutrition criteria</td><td>18%</td><td>19%</td><td>35%</td><td>48%</td></tr>\n<tr><td>Nutrition-labeling citations issued by regulators</td><td>140</td><td>260</td><td>5</td><td>3</td></tr>\n<tr><td>Fines for labeling violations ($ millions)</td><td>1.1</td><td>2.9</td><td>0</td><td>0</td></tr>\n<tr><td>Provisions for customer litigation over menu-board accuracy ($ millions)</td><td>0</td><td>15</td><td>0</td><td>0</td></tr>\n</tbody></table>","questions":[{"id":"T5D1","lo":3,"type":"single","text":"The metric \"number of nutrition-labeling citations issued by regulators\" captures performance on which general issue category?","options":{"a":"Selling Practices & Product Labeling","b":"Product Quality & Safety","c":"Management of the Legal & Regulatory Environment","d":"Customer Welfare"},"answer":["a"],"expl":{"a":"CORRECT. Selling Practices & Product Labeling (Social Capital) addresses the transparency, accuracy, and comprehensibility of labeling (Section 2.1.2), which is what a labeling citation records.","b":"Incorrect. Product Quality & Safety concerns defects and hazards in the product or service itself, not labeling compliance.","c":"Incorrect. This category concerns companies that rely on favorable regulation for competitiveness (Section 2.1.5), not compliance with a labeling rule.","d":"Incorrect. Customer Welfare concerns the benefits and risks of consuming the product, such as nutritional quality (the menu-criteria metric); a citation measures labeling compliance."},"trap":{"a":"","b":"Adjacent category in the same dimension","c":"Regulation-related name, different issue","d":"Adjacent category: the nutrition metric, not the labeling metric"}},{"id":"T5D2","lo":4,"type":"multi","text":"Which two of the five factors are most clearly evidenced for the issue of nutrition labeling in this case? (Choose two.)","options":{"a":"Stakeholder concerns and social trends","b":"Industry norms, best practices, and competitive drivers","c":"Opportunities for innovation","d":"Legal, regulatory, and policy drivers","e":"Direct financial impacts and risk"},"answer":["a","d"],"expl":{"a":"CORRECT. The case cites public health concerns and market pressure for healthier options, which shift consumer demand (Section 3.1).","b":"Incorrect. The case does not describe peer practices driving performance.","c":"Incorrect. Company I's menu changes are described only as a metric, not as an innovation advantage.","d":"CORRECT. The case describes mandatory labeling rules and regulator citations (Section 3.1).","e":"Incorrect. H's fines and litigation provision total about $18 million, roughly 0.2 percent of its revenue, too small to be the clearest evidence of a direct cost."},"trap":{"a":"","b":"No peer evidence","c":"Menu data mistaken for innovation evidence","d":"","e":"Immaterial cost treated as evidence"}},{"id":"T5D3","lo":7,"type":"single","text":"Which interpretation of the citation data is best supported once the two companies' operating structures are considered?","options":{"a":"H's citations show that its food is less nutritious than I's, because citations measure menu healthfulness","b":"H's franchise model limits control over menu boards, which helps explain its citations and compliance risk","c":"H's citations are unrelated to its franchise model, because regulators cite only company-owned restaurants","d":"I's lack of citations shows that labeling regulation is not relevant to company-owned restaurants"},"answer":["b"],"expl":{"a":"Incorrect. A citation measures labeling compliance, not nutritional quality; the menu-criteria metric measures nutrition.","b":"CORRECT. The case says franchising can increase risk because operators do not manage daily operations, and management structure is context for interpreting performance (Section 6.2).","c":"Incorrect. Nothing in the case says regulators cite only company-owned restaurants.","d":"Incorrect. Absence of citations is not absence of relevance; the rule applies to both companies (the case says both operate where labeling is mandatory)."},"trap":{"a":"Misreads what the metric measures","b":"","c":"Unsupported claim","d":"Disclosure treated as relevance"}},{"id":"T5D4","lo":9,"type":"multi","text":"Which three channels of financial impact are most directly affected by H's rising citations and the related litigation provision? (Choose three.)","options":{"a":"Revenues","b":"Expenses","c":"Tangible assets","d":"Cost of capital","e":"Liabilities"},"answer":["a","b","e"],"expl":{"a":"CORRECT. The case says reputational damage affects a company across most of its locations because consumers may not distinguish franchises, which influences demand (Section 8.2.1.1).","b":"CORRECT. Fines for labeling violations rose from $1.1 million to $2.9 million, a direct cost (Section 8.2.1.2).","c":"Incorrect. No impairment of restaurant assets is described.","d":"Incorrect. No change in investors' perception of risk is described.","e":"CORRECT. The $15 million provision for customer litigation is a future financial obligation and legal risk (Section 8.2.1.4)."},"trap":{"a":"","b":"","c":"No asset effect described","d":"Not evidenced","e":""}}]},{"id":"T5E","title":"Case 5: Solar Technology & Project Developers Industry","built":"Revisits Practice Case 8's indu
